system: ContentAudit
version: 0.0.1
architecture: hexagonal
packagePrefix: com.learney.contentaudit
modules:
- name: audit-domain
  description: Core business logic
  dependsOn:
  - course-domain
  - evaluation-ledger-domain
  models:
  - name: AuditReport
    type: record
    fields:
    - name: root
      type: AuditNode
      description: Root node of the audit tree (target=COURSE). Children are milestones.
        Course-level scores live in root.scores.
  - name: AuditableCourse
    type: record
    fields:
    - name: milestones
      type: List<AuditableMilestone>
  - name: AuditableKnowledge
    type: record
    fields:
    - name: quizzes
      type: List<AuditableQuiz>
    - name: title
      type: String
    - name: instructions
      type: String
    - name: isSentence
      type: boolean
      description: Flag indicating whether this knowledge contains sentence-type quizzes
        eligible for length analysis
    - name: id
      type: String
      description: Knowledge identifier
    - name: label
      type: String
      description: Human-readable knowledge label (same as title)
    - name: code
      type: String
      description: Knowledge short code
    - name: sentenceMode
      type: SentenceMode
      description: "Modo de frase del knowledge (F-SMODE-R001), copiado verbatim desde\
        \ KnowledgeEntity.sentenceMode por CourseToAuditableMapper. Lo lee LemmaAbsenceContextResolver\
        \ del knowledge ancestro para estampar LemmaAbsenceCorrectionContext.sentenceMode.\
        \ Nullable cuando el knowledge no declara modo (no-oracion / no sembrado)."
    - name: topicName
      type: String
      description: "Etiqueta del topic al que pertenece, copiada del quiz template.\
        \ Evita que el analizador de consigna tenga que navegar dos niveles de ancestros\
        \ para armar una de las cinco entradas del juez."
    extends: AuditableEntity
  - name: AuditableTopic
    type: record
    fields:
    - name: knowledge
      type: List<AuditableKnowledge>
    - name: id
      type: String
      description: Topic identifier
    - name: label
      type: String
      description: Human-readable topic label
    - name: code
      type: String
      description: Topic short code
    extends: AuditableEntity
  - name: AuditableMilestone
    type: record
    fields:
    - name: topics
      type: List<AuditableTopic>
    - name: id
      type: String
      description: Milestone identifier
    - name: label
      type: String
      description: Human-readable milestone label
    - name: code
      type: String
      description: Milestone short code
    extends: AuditableEntity
  - name: AuditableQuiz
    type: record
    fields:
    - name: tokens
      type: List<NlpToken>
      description: Pre-computed enriched NLP tokens for the quiz sentence
    - name: id
      type: String
      description: Quiz identifier
    - name: label
      type: String
      description: Human-readable quiz label
    - name: code
      type: String
      description: Quiz short code
    - name: translation
      type: String
      description: Spanish translation of the quiz sentence
    - name: sentences
      type: List<String>
      description: "Ordered list of plain sentences derived from the quiz sentenceParts\
        \ (FEAT-QSENT R017). Index 0 is the canonical variant (R018), which is the\
        \ single source consumed by current analyzers. Extra variants are materialized\
        \ eagerly for future multi-variant analysis."
    - name: quizSentence
      type: String
      description: "FEAT-QSENT DSL serialization of the original quiz FormEntity (R001/R002).\
        \ Stamped eagerly by CourseToAuditableMapper in the same pass that fills `sentences`\
        \ (FEAT-QSENT R027), guaranteeing quizSentence and sentences[0] are derived\
        \ from the same FormEntity in the same derivation step (R003). Null only if\
        \ the course predates FEAT-QSENT — never null for quizzes that pass the mapper."
    - name: instructions
      type: String
      description: "Consigna propia del quiz template, copiada verbatim por CourseToAuditableMapper.\
        \ 11.467 de 11.487 quizzes del curso la declaran. Entra en el contenido juzgado\
        \ por el juez de consigna (F-QINST-R009)."
    - name: sentenceParts
      type: List<SentencePartEntity>
      description: |
        Partes del ejercicio en orden, con todas las opciones aceptadas de cada hueco. Resuelve DOUBT-QUIZ-COMPLETO por la Opcion A. Se copia VERBATIM desde QuizTemplateEntity.form.sentenceParts en el mismo paso del mapper: nunca se re-deriva parseando el DSL de quizSentence, porque QuizSentenceParser.buildForm() fabrica un FormEntity vacio y la huella se calcularia sobre contenido mutilado. Sin este campo el juez no puede verificar la restriccion mas frecuente de una consigna (la forma de la respuesta) y, peor, cambiar una opcion aceptada no invalidaria el veredicto guardado (F-QINST-R009).
    extends: AuditableEntity
  - name: CefrLevel
    type: enum
    fields:
    - name: A1
    - name: A2
    - name: B1
    - name: B2
    - name: C1
      description: "Nivel C1 del MCER. Retenido del catalogo solo para la deteccion\
        \ de mal-ubicacion por oracion (F-LABS-R033); excluido de cobertura, umbrales,\
        \ pesos, alertas y recomendaciones (F-LABS-R037). Orden numerico 5 para el\
        \ calculo de distancia (F-LABS-R018)."
    - name: C2
      description: "Nivel C2 del MCER. Retenido del catalogo solo para la deteccion\
        \ de mal-ubicacion por oracion (F-LABS-R033); excluido de cobertura, umbrales,\
        \ pesos, alertas y recomendaciones (F-LABS-R037). Orden numerico 6 para el\
        \ calculo de distancia (F-LABS-R018)."
  - name: TargetRange
    type: record
    fields:
    - name: level
      type: CefrLevel
      description: The CEFR level this range applies to
    - name: minTokens
      type: int
      description: Minimum expected token count for sentences at this level
    - name: maxTokens
      type: int
      description: Maximum expected token count for sentences at this level
  - name: AuditTarget
    type: enum
    fields:
    - name: QUIZ
    - name: KNOWLEDGE
    - name: TOPIC
    - name: MILESTONE
    - name: COURSE
  - name: NlpToken
    type: record
    fields:
    - name: text
      type: String
      description: Original text of the token
    - name: lemma
      type: String
      description: Lemmatized form of the token
    - name: posTag
      type: String
      description: "Universal Dependencies POS tag (NOUN, VERB, ADJ, etc.)"
    - name: frequencyRank
      type: Integer
      description: COCA frequency ranking (nullable if not found)
    - name: isStop
      type: boolean
      description: Whether this token is a stop word
    - name: isPunct
      type: boolean
      description: Whether this token is punctuation
  - name: AnalyzerDescriptor
    type: record
    fields:
    - name: name
      type: String
      description: Analyzer unique name (e.g. sentence-length)
    - name: description
      type: String
      description: Human-readable description of what the analyzer checks
    - name: target
      type: AuditTarget
      description: The audit target level this analyzer operates at
  - name: AuditNode
    type: record
    fields:
    - name: entity
      type: AuditableEntity
      description: "Reference to the auditable entity at this node (AuditableCourse,\
        \ AuditableMilestone, etc.)"
    - name: target
      type: AuditTarget
      description: "The hierarchy level: COURSE, MILESTONE, TOPIC, KNOWLEDGE, or QUIZ"
    - name: parent
      type: AuditNode
      description: "Parent node in the tree, null for the root (COURSE) node"
    - name: children
      type: List<AuditNode>
      description: Child nodes; empty for leaf (QUIZ) nodes
    - name: scores
      type: "Map<String,Double>"
      description: Per-analyzer scores at this node level (analyzerName -> score)
    - name: metadata
      type: "Map<String,Object>"
      description: "Analyzer-specific data attached to this node (e.g., misplaced\
        \ lemmas, sub-scores)"
    - name: diagnoses
      type: NodeDiagnoses
      description: "Per-level typed diagnoses container. The concrete type matches\
        \ the node's AuditTarget level (CourseDiagnoses, LevelDiagnoses, TopicDiagnoses,\
        \ KnowledgeDiagnoses, or QuizDiagnoses)."
  - name: SentenceLengthDiagnosis
    type: record
    fields:
    - name: tokenCount
      type: int
      description: Actual token count of the quiz sentence
    - name: targetMin
      type: int
      description: Minimum expected tokens for this CEFR level
    - name: targetMax
      type: int
      description: Maximum expected tokens for this CEFR level
    - name: cefrLevel
      type: CefrLevel
      description: The CEFR level derived from the ancestor milestone
    - name: delta
      type: int
      description: "Tokens over/under range (0 if within, positive if over, negative\
        \ if under)"
    - name: toleranceMargin
      type: int
      description: Configured tolerance margin used for scoring
  - name: AuditReportSummary
    type: record
    fields:
    - name: id
      type: String
      description: Unique audit report identifier (timestamp-based)
    - name: timestamp
      type: Instant
      description: When the audit was executed
    - name: courseName
      type: String
      description: Name of the audited course
    - name: overallScore
      type: double
      description: Aggregate score from the audit
  - name: ActiveAnalysisSelection
    type: record
    fields:
    - name: auditId
      type: String
      description: Identificador del AuditReport activo (referencia a AuditReportSummary.id).
    - name: planId
      type: String
      description: Identificador del RefinementPlan activo dentro del analisis (referencia
        a RefinementPlan.id).
    visibility: public
  - name: EvaluationRunPolicy
    type: record
    fields:
    - name: maxNewEvaluations
      type: int
      description: Tope de consultas nuevas al evaluador en esta corrida (F-QINST-R006).
        El analizador lo traduce a EvaluationBudget al abrir la sesion.
    - name: reevaluate
      type: boolean
      description: "Pedido explicito de volver a evaluar (F-EVCOST-R008). Lo interpreta\
        \ el analizador, nunca la sesion: la sesion solo re-evalua el sujeto puntual\
        \ que se le pide con resolveForced."
    - name: reevaluationScope
      type: String
      description: "Parte acotada alcanzada por el pedido, expresada en el vocabulario\
        \ del consumidor (id de knowledge, F-QINST-R012). Vive en audit-domain porque\
        \ solo aca hay con que resolverlo: de un sujeto la sesion solo conoce su subjectRef\
        \ y su contenido."
  interfaces:
  - name: AuditEngine
    stereotype: port
    sealed: false
    exposes:
    - signature: "runAudit(AuditableCourse course): AuditReport"
  - name: ContentAnalyzer
    stereotype: port
    sealed: false
    exposes:
    - signature: "onKnowledge(AuditNode node): Void"
    - signature: "onQuiz(AuditNode node): Void"
    - signature: "onMilestone(AuditNode node): Void"
    - signature: "onTopic(AuditNode node): Void"
    - signature: "onCourseComplete(AuditNode rootNode): Void"
    - signature: "getName(): String"
    - signature: "getTarget(): AuditTarget"
    - signature: "getDescription(): String"
  - name: AnalysisResult
    stereotype: port
    sealed: false
    exposes:
    - signature: "getName(): String"
    - signature: "getScore(): double"
    - signature: "getTarget(): AuditTarget"
  - name: NlpTokenizer
    stereotype: port
    sealed: false
    exposes:
    - signature: "tokenize(String text): List<String>"
    - signature: "countTokens(String text): int"
    - signature: "analyzeTokens(String text): List<NlpToken>"
    - signature: "analyzeTokensBatch(List<String> sentences): Map<String,List<NlpToken>>"
  - name: SentenceLengthConfig
    stereotype: port
    sealed: false
    exposes:
    - signature: "getTargetRange(CefrLevel level): Optional<TargetRange>"
    - signature: "getToleranceMargin(): int"
    extends:
    - SelfDescribingConfig
  - name: ScoreAggregator
    stereotype: port
    sealed: false
    exposes:
    - signature: "aggregate(AuditNode rootNode): void"
  - name: CocaBucketsConfig
    stereotype: port
    sealed: false
    exposes:
    - signature: "getBandConfiguration(): BandConfiguration"
    - signature: "getTargetsForLevel(String levelName): List<BucketTarget>"
    - signature: "getQuarterTargetsForLevel(String levelName): List<QuarterBucketTargets>"
    - signature: "getToleranceMargin(): double"
    - signature: "getAnalysisStrategy(): AnalysisStrategy"
    - signature: "getProgressionExpectations(): List<ProgressionExpectation>"
    extends:
    - SelfDescribingConfig
  - name: ContentWordFilter
    stereotype: port
    sealed: false
    exposes:
    - signature: "isContentWord(NlpToken token): boolean"
  - name: LemmaRecurrenceConfig
    stereotype: port
    sealed: false
    exposes:
    - signature: "getTop(): int"
    - signature: "getSubExposedThreshold(): double"
    - signature: "getOverExposedThreshold(): double"
    extends:
    - SelfDescribingConfig
  - name: LemmaAbsenceConfig
    stereotype: port
    sealed: false
    exposes:
    - signature: "getAbsoluteThreshold(CefrLevel level): int"
    - signature: "getPercentageThreshold(CefrLevel level): double"
    - signature: "getLevelWeight(CefrLevel level): double"
    - signature: "getHighPriorityBound(): int"
    - signature: "getMediumPriorityBound(): int"
    - signature: "getLowPriorityBound(): int"
    - signature: "getHighPriorityAlertThreshold(): int"
    - signature: "getMediumPriorityAlertThreshold(): int"
    - signature: "getLowPriorityAlertThreshold(): int"
    - signature: "getCriticalAbsenceThreshold(): int"
    - signature: "getAcceptableAbsenceThreshold(): int"
    - signature: "getHighReportLimit(): int"
    - signature: "getMediumReportLimit(): int"
    - signature: "getLowReportLimit(): int"
    - signature: "getDiscountPerLevel(): double"
    - signature: "getCoverageTarget(CefrLevel level): double"
    - signature: "getOutOfCatalogNoPenaltyRankBound(CefrLevel level): int"
    - signature: "getOutOfCatalogMildDiscountRankBound(CefrLevel level): int"
    - signature: "getOutOfCatalogMildDiscount(): double"
    - signature: "getOutOfCatalogStrongDiscount(): double"
    extends:
    - SelfDescribingConfig
  - name: EvpCatalogPort
    stereotype: port
    sealed: false
    exposes:
    - signature: "getExpectedLemmas(CefrLevel level): Set<LemmaAndPos>"
    - signature: "isPhrase(String lemma): boolean"
    - signature: "getCocaRank(LemmaAndPos lemmaAndPos): Optional<Integer>"
    - signature: "getSemanticCategory(LemmaAndPos lemmaAndPos): Optional<String>"
    - signature: "lookupLevel(LemmaAndPos lemmaAndPos): Optional<CefrLevel>"
    - signature: "lookupLevelByLemma(String lemma): Optional<CefrLevel>"
  - name: AuditableEntity
    stereotype: port
    sealed: false
    exposes:
    - signature: "getId(): String"
    - signature: "getLabel(): String"
    - signature: "getCode(): String"
  - name: SelfDescribingConfig
    stereotype: port
    sealed: false
    exposes:
    - signature: "describe(): Map<String,Object>"
  - name: NodeDiagnoses
    stereotype: port
    sealed: true
  - name: CourseDiagnoses
    stereotype: port
    sealed: false
    exposes:
    - signature: "getLemmaAbsenceDiagnosis(): Optional<LemmaAbsenceCourseDiagnosis>"
    - signature: "getCocaBucketsDiagnosis(): Optional<CocaProgressionDiagnosis>"
    - signature: "getLemmaCountDiagnosis(): Optional<LemmaCountCourseDiagnosis>"
    - signature: "getQuizInstructionCoverage(): Optional<QuizInstructionCoverageDiagnosis>"
  - name: LevelDiagnoses
    stereotype: port
    sealed: false
    exposes:
    - signature: "getLemmaAbsenceDiagnosis(): Optional<LemmaAbsenceLevelDiagnosis>"
    - signature: "getCocaBucketsDiagnosis(): Optional<CocaBucketsLevelDiagnosis>"
    - signature: "getLemmaCountDiagnosis(): Optional<LemmaCountLevelDiagnosis>"
  - name: TopicDiagnoses
    stereotype: port
    sealed: false
    exposes:
    - signature: "getLemmaAbsenceDiagnosis(): Optional<LemmaPlacementDiagnosis>"
    - signature: "getCocaBucketsDiagnosis(): Optional<CocaBucketsTopicDiagnosis>"
  - name: KnowledgeDiagnoses
    stereotype: port
    sealed: false
    exposes:
    - signature: "getLemmaAbsenceDiagnosis(): Optional<LemmaPlacementDiagnosis>"
  - name: QuizDiagnoses
    stereotype: port
    sealed: false
    exposes:
    - signature: "getLemmaAbsenceDiagnosis(): Optional<LemmaPlacementDiagnosis>"
    - signature: "getSentenceLengthDiagnosis(): Optional<SentenceLengthDiagnosis>"
    - signature: "getQuizInstructionDiagnosis(): Optional<QuizInstructionDiagnosis>"
  - name: AuditReportStore
    stereotype: port
    sealed: false
    exposes:
    - signature: "save(AuditReport report): String"
    - signature: "load(String id): Optional<AuditReport>"
    - signature: "loadLatest(): Optional<AuditReport>"
    - signature: "list(): List<AuditReportSummary>"
  - name: CourseMapper
    stereotype: port
    sealed: false
    exposes:
    - signature: "map(CourseEntity course): AuditableCourse"
  - name: ActiveAnalysisSelectionStore
    stereotype: port
    sealed: false
    exposes:
    - signature: "read(): Optional<ActiveAnalysisSelection>"
    - signature: "write(ActiveAnalysisSelection selection): void"
    - signature: "clear(): void"
    visibility: public
  - name: AuditNodeIndex
    stereotype: port
    sealed: false
    exposes:
    - signature: "find(String nodeId, AuditTarget nodeTarget): Optional<AuditNode>"
    visibility: public
  - name: AuditNodeIndexFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "build(AuditReport report): AuditNodeIndex"
    visibility: public
  - name: LemmaCountConfig
    stereotype: port
    sealed: true
    exposes:
    - signature: "getThreshold(): int"
    extends:
    - SelfDescribingConfig
  - name: EvaluationAnalyzerFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "create(EvaluationRunPolicy policy): ContentAnalyzer"
    - signature: "analyzerName(): String"
  - name: QuizInstructionVerdictReader
    stereotype: port
    sealed: false
    exposes:
    - signature: "read(String payload): QuizInstructionVerdict"
  - name: QuizInstructionConfig
    stereotype: port
    sealed: false
    exposes:
    - signature: "getDefaultMaxNewEvaluations(): int"
    - signature: "getScoreFor(InstructionSeverity severity): double"
    extends:
    - SelfDescribingConfig
  implementations:
  - name: IAuditEngine
    requiresInject:
    - name: contentAnalyzers
      type: List<ContentAnalyzer>
    - name: scoreAggregator
      type: ScoreAggregator
    visibility: public
    handwrittenTests:
    - name: "Given a course with milestones, topics and knowledges, when AuditEngine.runAudit\
        \ is invoked with both KTLEN analyzers, then the report root contains aggregated\
        \ knowledge-title-length and knowledge-instructions-length scores at every\
        \ hierarchy level"
      traceability:
        feature: FEAT-KTLEN
        journey: F-KTLEN-J001
    - name: "Given a course with knowledges whose title weighted length exceeds 28,\
        \ when AuditEngine.runAudit is invoked, then the affected knowledge nodes\
        \ carry knowledge-title-length scores below 1.0 enabling identification of\
        \ overlong titles"
      traceability:
        feature: FEAT-KTLEN
        journey: F-KTLEN-J002
    - name: "Given a course with mixed title and instruction lengths, when AuditEngine.runAudit\
        \ is invoked, then per-level scores for knowledge-title-length and knowledge-instructions-length\
        \ are reported independently per AuditNode allowing the user to compare both\
        \ dimensions"
      traceability:
        feature: FEAT-KTLEN
        journey: F-KTLEN-J004
    - name: "Given two AuditableCourses with identical content but milestones declared\
        \ in different orders, when AuditEngine.runAudit is invoked on each with the\
        \ LemmaRecurrenceAnalyzer registered, then both AuditReports produce the same\
        \ lemma-recurrence score confirming a deterministic CEFR-ordered traversal\
        \ independent of input declaration order"
      traceability:
        feature: FEAT-LREC
        rule: F-LREC-R002
    - name: should aggregate quiz-level sentence-length scores into each KNOWLEDGE
        node as the simple average of the scoring quizzes under it omitting from the
        average any quiz excluded by F-SLEN-R001 and leaving the knowledge score unavailable
        when no quiz under it has a score
      traceability:
        feature: FEAT-SLEN
        rule: F-SLEN-R003
    - name: should aggregate knowledge-level sentence-length scores into each TOPIC
        node as the simple average of the scoring knowledges under it omitting from
        the average any knowledge without a score and leaving the topic score unavailable
        when no knowledge under it has a score
      traceability:
        feature: FEAT-SLEN
        rule: F-SLEN-R004
    - name: should aggregate topic-level sentence-length scores into each MILESTONE
        node as the simple average of the scoring topics under it omitting from the
        average any topic without a score and leaving the level score unavailable
        when no topic under it has a score
      traceability:
        feature: FEAT-SLEN
        rule: F-SLEN-R005
    - name: should aggregate milestone-level sentence-length scores into the COURSE
        root node as the simple average of the scoring milestones omitting from the
        average any milestone without a score and returning zero as the course overall
        score when no milestone has a score
      traceability:
        feature: FEAT-SLEN
        rule: F-SLEN-R008
    - name: should publish the sentence-length score on every AuditNode of the hierarchy
        (quiz knowledge topic milestone course) so consumers can read it at any level
        via node.getScores().get('sentence-length')
      traceability:
        feature: FEAT-SLEN
        rule: F-SLEN-R016
        journey: F-SLEN-J004
    implements:
    - AuditEngine
  - name: KnowledgeTitleLengthAnalyzer
    tests:
    - name: should score 0.5 for title of weighted length 28.5
      target: KnowledgeTitleLengthAnalyzer
      type: unit
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
      _change: add
    - name: should score 0.0 for title of weighted length 29
      target: KnowledgeTitleLengthAnalyzer
      type: unit
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
      _change: add
    - name: should score 0.0 for title of weighted length 35
      target: KnowledgeTitleLengthAnalyzer
      type: unit
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
      _change: add
    - name: should score 0.0 for title well beyond limit at weighted length 70
      target: KnowledgeTitleLengthAnalyzer
      type: unit
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
      _change: add
    visibility: public
    handwrittenTests:
    - name: should return knowledge-title-length as analyzer name
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R008
    - name: should return KNOWLEDGE as audit target
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R008
    - name: should score 0.0 for knowledge with null title
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
    - name: should score 0.0 for knowledge with empty title
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
    - name: should score 1.0 for knowledge with title within limit
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
    - name: should score 1.0 for knowledge with title at exactly 28 weighted chars
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R001
    - name: should score 1.0 for title fitting with weighted length 5.1
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R002
    - name: should score 1.0 for zero-weight special chars title
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R002
    - name: should score 1.0 for mixed-weight title with weighted length 2.7
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R002
    - name: should score 0.75 for title of weighted length 35
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
    - name: should score 0.5 for title of weighted length 42
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
    - name: should score 0.0 for title of weighted length 56
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
    - name: should score 0.0 for title of weighted length 70
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
    - name: should complete without error when onQuiz is called
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R008
    - name: should complete without error when onMilestone is called
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R008
    - name: should complete without error when onTopic is called
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R008
    - name: should complete without error when onCourseComplete is called
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R008
    - name: should return two correctly scored items for two knowledges with different
        title lengths
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
    - name: should return empty list when no knowledges have been processed
      traceability:
        feature: FEAT-KTLEN
        rule: F-KTLEN-R003
    implements:
    - ContentAnalyzer
  - name: KnowledgeInstructionsLengthAnalyzer
    tests:
    - name: should score 1.0 for instructions exactly at soft limit of 70 weighted
        chars
      target: KnowledgeInstructionsLengthAnalyzer
      type: unit
