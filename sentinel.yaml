    - signature: "nextTask(RefinementPlan plan): Optional<RefinementTask>"
  - name: RefinementPlanStore
    stereotype: port
    sealed: false
    exposes:
    - signature: "save(RefinementPlan plan): String"
    - signature: "load(String id): Optional<RefinementPlan>"
    - signature: "loadLatest(): Optional<RefinementPlan>"
  - name: CorrectionContextResolver
    stereotype: port
    sealed: false
    exposes:
    - signature: "resolve(AuditReport report, RefinementTask task): Optional<T>"
    - signature: "resolveWithIndex(AuditNodeIndex nodeIndex, AuditReport report, RefinementTask\
        \ task): Optional<T>"
    - signature: "supports(DiagnosisKind kind): boolean"
    typeParameters:
    - T extends CorrectionContext
  - name: CorrectionContext
    stereotype: port
    sealed: false
  - name: SuggestedLemmaQueryPort
    stereotype: port
    sealed: false
    exposes:
    - signature: "query(AuditReport report, RefinementTask task, SuggestedLemmaQueryCriteria\
        \ criteria): SuggestedLemmaQueryResult"
    visibility: public
  - name: SuggestedLemmaQuerySession
    stereotype: port
    sealed: false
    exposes:
    - signature: "requestMore(SuggestedLemmaQueryCriteria criteria): SuggestedLemmaQueryResult"
    visibility: public
  - name: SuggestedLemmaQuerySessionFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "bindForTask(String sourceAuditId, RefinementTask task): SuggestedLemmaQuerySession"
    visibility: public
