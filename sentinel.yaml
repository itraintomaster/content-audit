    package: dev.langchain4j.model.chat
language:
  name: java
  version: 17
quality:
  enabled: true
  enforcement: warn
  tools:
    coverage:
      enabled: true
    crap:
      enabled: true
      hotspotThreshold: 30
    mutation:
      enabled: true
      history:
        enabled: true
        path: .sentinel/pit-history
      operators: DEFAULTS
      timeoutMinutes: 10
  thresholds:
    global:
      lineCoverage: 70
      branchCoverage: 60
      mutationScore: 60
      crapHotspotsMax: 5
