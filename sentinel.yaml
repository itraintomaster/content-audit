  - name: lemmacount
    description: "Conteo de repeticiones de lemas content-word por oraciones distintas\
      \ en todo el curso. Asigna un nivel CEFR a cada lema con la cadena EVP -> NLP\
      \ -> 'no asignado', calcula score por lema (min(count/N, 1.0)), agrega por nivel\
      \ CEFR (promedio simple) y por curso (promedio simple de niveles)."
    visibility: internal
    models:
    - name: LemmaCountStats
      type: record
      fields:
      - name: lemmaAndPos
        type: LemmaAndPos
        description: Lema content-word con su POS (par identificador segun R002)
      - name: count
        type: int
        description: "Numero de oraciones distintas del curso que contienen el lema\
          \ (R004, R005)"
      - name: score
        type: double
        description: "Score del lema: min(count/N, 1.0) (R006)"
      - name: assignedLevel
        type: Optional<CefrLevel>
        description: Nivel CEFR asignado por la cadena R009 -> R010; vacio si el lema
          cae al grupo 'no asignado' (R011)
    - name: LevelLemmaCountResult
      type: record
      fields:
      - name: level
        type: CefrLevel
        description: Nivel CEFR cuyo score se reporta
      - name: score
        type: double
        description: "Score del nivel: promedio simple de los scores de sus lemas\
          \ (R012)"
      - name: totalLemmas
        type: int
        description: Total de lemas evaluados asignados a este nivel (R017)
      - name: subExposedLemmas
        type: List<LemmaCountStats>
        description: Lemas del nivel con score < 1.0 (R017); ordenados por count ascendente
          para priorizar
    - name: UnassignedLemmaEntry
      type: record
      fields:
      - name: lemmaAndPos
        type: LemmaAndPos
        description: Lema sin nivel CEFR asignado por ninguna fuente (R011)
      - name: count
        type: int
        description: Conteo de oraciones distintas con el lema (R018); no se calcula
          score
    - name: LemmaCountResult
      type: record
      fields:
      - name: thresholdN
        type: int
        description: Umbral N usado para calcular los scores (R016)
      - name: courseScore
        type: Optional<Double>
        description: "Score global del curso: promedio simple de los scores de los\
          \ niveles CEFR (R013, R015). Vacio si ningun nivel tiene score asignable."
      - name: levels
        type: List<LevelLemmaCountResult>
        description: Detalle por nivel CEFR con score (R017). Niveles sin lemas asignados
          no aparecen (R012).
      - name: unassigned
        type: List<UnassignedLemmaEntry>
        description: "Lemas que no pudieron clasificarse en ningun nivel CEFR (R011,\
          \ R018). Informativos: no entran al score del curso (R014)."
    - name: LemmaCountCourseDiagnosis
      type: record
      fields:
      - name: result
        type: LemmaCountResult
        description: "Resultado consolidado del analisis: score global, N usado, detalle\
          \ por nivel y lemas no asignados."
    - name: LemmaCountLevelDiagnosis
      type: record
      fields:
      - name: levelResult
        type: LevelLemmaCountResult
        description: "Resultado de este nivel CEFR concreto (score, total de lemas,\
          \ sub-expuestos)."
    interfaces:
    - name: LemmaCefrLevelResolver
      stereotype: port
      sealed: false
      exposes:
      - signature: "resolve(LemmaAndPos lemmaAndPos, Optional<CefrLevel> nlpCefr):\
          \ Optional<CefrLevel>"
    implementations:
    - name: EvpThenNlpLemmaCefrLevelResolver
      requiresInject:
      - name: evpCatalogPort
        type: EvpCatalogPort
        description: Fuente primaria de nivel CEFR (R009).
      visibility: public
      handwrittenTests:
      - name: should return EVP level when EVP catalog contains the lemma
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R009
      - name: should query EVP catalog by the lemma-and-POS pair as composite identity
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R009
      - name: should return empty when EVP catalog has no entry and no other source
          provides CEFR
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R011
      - name: should return NLP CEFR hint when EVP catalog has no entry for the lemma
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R010
      - name: should prefer EVP level over NLP CEFR hint when EVP catalog also contains
          the lemma
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R010
      implements:
      - LemmaCefrLevelResolver
    - name: LemmaCountAnalyzer
      requiresInject:
      - name: contentWordFilter
        type: ContentWordFilter
        description: Aplica el filtro POS content-word del universo (R001).
      - name: lemmaCefrLevelResolver
        type: LemmaCefrLevelResolver
        description: Asigna CEFR al lema con la cadena R009 -> R010 -> R011.
      - name: lemmaCountConfig
        type: LemmaCountConfig
        description: "Provee el umbral N usado en el score (R006, R007, R008, R016)."
      visibility: public
      handwrittenTests:
      - name: should count VERB lemma when content-word filter accepts it
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R001
      - name: should exclude DET token from lemma count when content-word filter rejects
          it
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R001
      - name: should exclude PROPN token from lemma count when content-word filter
          rejects it
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R001
      - name: should count run-as-VERB and run-as-NOUN as two distinct lemmas with
          independent counts
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R002
      - name: should count ran-running-runs as three appearances of the same VERB
          lemma run after lemmatization
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R002
      - name: should not report lemmas absent from the course in the analysis result
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R003
      - name: should count a lemma once when it appears multiple times in the same
          quiz sentence
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R004
      - name: should count a lemma N times when it appears in N distinct quiz sentences
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R004
      - name: should accumulate count of an A1 lemma across quizzes from A1 A2 and
          B1 milestones
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R005
      - name: should compute lemma score as count divided by N when count is below
          N
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R006
      - name: should cap lemma score at 1.0 when count equals or exceeds N
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R006
      - name: should compute level score as simple average of its lemma scores
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R012
      - name: should omit a CEFR level from results when no assigned lemma falls into
          it
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R012
      - name: should compute course score as simple average of level scores regardless
          of lemma count per level
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R013
      - name: should compute course score using only canonical CEFR levels and ignoring
          the unassigned group
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R014
      - name: should expose course score in the lemma-count diagnosis attached to
          the course node
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R015
      - name: should expose empty course score when no canonical CEFR level has assignable
          score
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R015
      - name: should expose the threshold N used in the lemma-count result
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R016
      - name: should list per-level total of evaluated lemmas in the lemma-count result
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R017
      - name: should list sub-exposed lemmas with score below 1.0 sorted by ascending
          count for each CEFR level
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R017
      - name: should not list fully exposed lemmas with score 1.0 individually in
          the per-level detail
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R017
      - name: should list unassigned lemmas with their count in the lemma-count result
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R018
      - name: should return lemma-count as analyzer name
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R019
      implements:
      - ContentAnalyzer
  - name: lexicalflags
    description: "Contrato y carrier publicos de la evaluacion lexica por-oracion\
      \ reutilizada del audit: lista de palabras flaggeadas (mal ubicadas + fuera\
      \ de catalogo penalizantes). Superficie minima para consumidores externos (audit-cli);\
      \ no expone score, discount ni internals del scoring."
    visibility: public
    models:
    - name: SentenceLexicalFlags
      type: record
      fields:
      - name: misplacedWords
        type: List<MisplacedWordFlag>
        description: Palabras mal ubicadas para el nivel (F-CLEX-R003). Vacia + outOfCatalogWords
          vacia => oracion limpia (F-CLEX-R005).
      - name: outOfCatalogWords
        type: List<OutOfCatalogFlag>
        description: Palabras fuera de catalogo penalizantes en el nivel (F-CLEX-R004).
    - name: MisplacedWordFlag
      type: record
      fields:
      - name: lemma
        type: String
        description: Lema de la palabra mal ubicada (F-CLEX-R003).
      - name: pos
        type: String
        description: Categoria gramatical observada en la oracion (F-CLEX-R003).
      - name: expectedLevel
        type: CefrLevel
        description: Nivel esperado del lema segun el catalogo (F-CLEX-R003).
      - name: sentenceLevel
        type: CefrLevel
        description: Nivel de la oracion consultada (F-CLEX-R003).
    - name: OutOfCatalogFlag
      type: record
      fields:
      - name: lemma
        type: String
        description: Lema de la palabra fuera de catalogo (F-CLEX-R004).
      - name: pos
        type: String
        description: Categoria gramatical observada (F-CLEX-R004).
      - name: frequencyRank
        type: Integer
        description: Rango de frecuencia como evidencia del flag; null cuando la palabra
          no tiene ranking (F-CLEX-R004).
    interfaces:
    - name: SentenceLexicalEvaluator
      stereotype: port
      sealed: false
      exposes:
      - signature: "evaluate(List<NlpToken> tokens, CefrLevel sentenceLevel): SentenceLexicalFlags"
      visibility: public
    implementations:
    - name: DefaultSentenceLexicalEvaluator
      requiresInject:
      - name: sentenceLexicalScorer
        type: SentenceLexicalScorer
      visibility: public
      handwrittenTests:
      - name: "should report each misplaced word with its lemma, POS, expected level\
          \ and sentence level"
        traceability:
          feature: FEAT-CLEX
          rule: F-CLEX-R003
      - name: "should report each penalizing out-of-catalog word with its lemma, POS\
          \ and frequency rank"
        traceability:
          feature: FEAT-CLEX
          rule: F-CLEX-R004
      - name: should report a null frequency rank for an out-of-catalog word without
          ranking
        traceability:
          feature: FEAT-CLEX
          rule: F-CLEX-R004
      - name: should omit words justified for the level from the flags list
        traceability:
          feature: FEAT-CLEX
          rule: F-CLEX-R005
      - name: should return an empty flags list when the sentence is clean for the
          level
        traceability:
          feature: FEAT-CLEX
          rule: F-CLEX-R005
      implements:
      - SentenceLexicalEvaluator
  - name: quizinstruction
    description: |
      FEAT-QINST. Contrato publico del analisis de cumplimiento de consigna: el veredicto tipado del juez, el diagnostico por ejercicio y la cobertura declarada. Publico porque el CLI lo formatea y porque una feature posterior de correccion va a partir de estas violaciones con su evidencia.
    visibility: public
    models:
    - name: InstructionSeverity
      type: enum
      fields:
      - name: NONE
      - name: MINOR
      - name: MAJOR
      - name: CRITICAL
    - name: InstructionCheckStatus
      type: enum
      fields:
      - name: PASSED
      - name: FAILED
      - name: NOT_APPLICABLE
    - name: InstructionViolation
      type: record
      fields:
      - name: code
        type: String
      - name: constraint
        type: String
      - name: evidence
        type: String
      - name: explanation
        type: String
    - name: InstructionCheck
      type: record
      fields:
      - name: category
        type: String
      - name: constraint
        type: String
      - name: status
        type: InstructionCheckStatus
      - name: evidence
        type: String
    - name: QuizInstructionVerdict
      type: record
      fields:
      - name: followsInstructions
        type: boolean
      - name: confidence
        type: double
        description: "Se registra en el diagnostico pero NO modifica el puntaje (F-QINST-R002,\
          \ DOUBT-CONFIANZA opcion A)."
      - name: severity
        type: InstructionSeverity
      - name: reason
        type: String
      - name: violations
        type: List<InstructionViolation>
      - name: checkedConstraints
        type: List<InstructionCheck>
    - name: QuizInstructionDiagnosis
      type: record
      fields:
      - name: verdict
        type: QuizInstructionVerdict
      - name: score
        type: double
      - name: reusedFromPreviousRun
        type: boolean
        description: Si el veredicto se reutilizo de una corrida anterior en vez de
          consultarse ahora.
    - name: QuizInstructionCoverageDiagnosis
      type: record
      fields:
      - name: coverage
        type: EvaluationCoverage
      - name: consultedJudgeVersion
        type: String
        description: "Version del juez con la que ESTA CORRIDA consulto (F-QINST-R005).\
          \ Null cuando la corrida no consulto ni una vez: todo reutilizado, sin presupuesto,\
          \ o juez no disponible (F-QINST-R010). Null es un valor que el informe debe\
          \ declarar, no un dato faltante."
      - name: verdictsByJudgeVersion
        type: List<JudgeVersionVerdictCount>
        description: "Recuento de veredictos por version de procedencia entre los\
          \ que el informe PUNTUA (F-QINST-R005). Una fila por version presente, ordenadas\
          \ por version para que el informe y los tests sean reproducibles. Su suma\
          \ debe cerrar contra coverage.withResult: es la segunda suma que exige F-QINST-R005."
    - name: JudgeVersionVerdictCount
      type: record
      fields:
      - name: judgeVersion
        type: String
        description: Version del juez que emitio los veredictos contados.
      - name: verdictCount
        type: int
        description: Cuantos de los veredictos que el informe puntua provienen de
          esa version.
  - name: quizinstructionengine
    description: |
      Motor del analizador de consigna. Solo la factory es publica; el analizador, el armado del contenido juzgado y la traduccion de veredicto a puntaje son package-private.
    visibility: public
    interfaces:
    - name: QuizInstructionSubjectBuilder
      sealed: false
      exposes:
      - signature: "build(AuditNode quizNode): EvaluationSubject"
      visibility: internal
    - name: QuizInstructionScorer
      sealed: false
      exposes:
      - signature: "score(QuizInstructionVerdict verdict): double"
      visibility: internal
    - name: QuizInstructionScopeMatcher
      sealed: false
      exposes:
      - signature: "matches(AuditNode quizNode,String reevaluationScope): boolean"
      visibility: internal
    implementations:
    - name: DefaultQuizInstructionAnalyzerFactory
      requiresInject:
      - name: sessionFactory
        type: EvaluationSessionFactory
      - name: evaluator
        type: Evaluator
      - name: verdictReader
        type: QuizInstructionVerdictReader
      - name: config
        type: QuizInstructionConfig
      visibility: public
      handwrittenTests:
      - name: should build the analyzer with the configured default budget when the
          run declares no policy for the judge
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R006
      - name: should publish for selection exactly the name under which the analyzer
          it builds reports its score
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R015
      implements:
      - EvaluationAnalyzerFactory
    - name: QuizInstructionAnalyzer
      requiresInject:
      - name: session
        type: EvaluationSession
      - name: subjectBuilder
        type: QuizInstructionSubjectBuilder
      - name: scorer
        type: QuizInstructionScorer
      - name: scopeMatcher
        type: QuizInstructionScopeMatcher
      - name: verdictReader
        type: QuizInstructionVerdictReader
      - name: policy
        type: EvaluationRunPolicy
      handwrittenTests:
      - name: "should record for a breaching quiz a diagnosis with every violation\
          \ carrying its code, its breached constraint, its evidence and its explanation"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R003
      - name: should record for a compliant quiz a diagnosis with the checks the judge
          performed and no violations
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R003
      - name: "should record in the quiz diagnosis the reason, the severity and the\
          \ confidence the judge reported"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R003
      - name: should leave a quiz pending for budget without score and without diagnosis
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R004
      - name: should leave a failed quiz without score and without diagnosis
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R004
      - name: "should declare on the course node how many quizzes were reached, resolved,\
          \ evaluated in this run, reused, pending and failed"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R005
      - name: "should declare a coverage whose resolved, pending and failed counts\
          \ add up to the reached total"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R005
      - name: should mark a verdict taken from a previous run as reused both in the
          quiz diagnosis and in the declared coverage
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R005
      - name: should stop querying the judge once the run budget is exhausted and
          finish without error leaving the rest pending
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R006
      - name: should audit a fully evaluated course without a single judge query whatever
          the budget is
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R006
      - name: "should finish the run when the judge stops responding, counting the\
          \ quizzes it could not judge as failed"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R007
      - name: should keep the score and the diagnosis of the quizzes judged before
          the judge failure
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R007
      - name: should score a quiz from its recorded verdict without querying the judge
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R008
      - name: should spend the run budget only on quizzes without a current verdict
          so consecutive runs advance over different quizzes
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R008
      - name: should not reuse the verdicts recorded by a previous judge version and
          report those quizzes as pending
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R010
      - name: should query the judge again for quizzes that already had a current
          verdict when re evaluation is requested
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R012
      - name: should keep an explicit re evaluation within the run budget
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R012
      - name: should leave without score and without diagnosis and count as failed
          a quiz whose judge output was unusable
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R013
      - name: should query the judge again in a later run for a quiz whose previous
          output was unusable
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R013
      - name: "should reach every quiz of the course, including those whose knowledge\
          \ declares no instructions"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R014
      - name: "should declare a reached count equal to the number of quizzes of the\
          \ course, with no exclusions"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R014
      - name: should declare in the coverage the judge version the run evaluated with
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R005
      - name: "should declare a single judge version, the one in effect, for a run\
          \ that both reuses verdicts from earlier runs and evaluates new ones"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R005
      implements:
      - ContentAnalyzer
    - name: DefaultQuizInstructionSubjectBuilder
      handwrittenTests:
      - name: "should hand the judge the cefr level, the topic, the knowledge label,\
          \ the knowledge instructions and the whole quiz with all its parts and accepted\
          \ options"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R009
      - name: should leave the quiz identifier out of the judged content
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R009
      - name: should produce different judged content when a single accepted option
          of the quiz changes
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R009
      - name: should produce different judged content for every quiz of a knowledge
          when the knowledge instructions change
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R009
      - name: should produce identical judged content when the same course is reprocessed
          without content changes
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R009
      - name: should take the label and the instructions from the knowledge when the
          quiz carries diverging copies
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R009
      - name: should build judged content for a quiz whose knowledge declares no instructions
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R014
      implements:
      - QuizInstructionSubjectBuilder
    - name: DefaultQuizInstructionScorer
      requiresInject:
      - name: config
        type: QuizInstructionConfig
      handwrittenTests:
      - name: should score the quiz at the maximum when the verdict says it follows
          the instructions with severity none
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R002
      - name: should score the quiz at 0.6 when the verdict reports a minor breach
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R002
      - name: should score the quiz at 0.3 when the verdict reports a major breach
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R002
      - name: should score the quiz at 0.0 when the verdict reports a critical breach
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R002
      - name: should let the declared severity prevail when the verdict says the quiz
          complies but declares a severity other than none
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R002
      - name: should score as a minor breach when the verdict says the quiz does not
          comply but declares severity none
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R002
      - name: should score the same verdict identically whatever confidence the judge
          reported
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R002
      implements:
      - QuizInstructionScorer
    - name: DefaultQuizInstructionScopeMatcher
      handwrittenTests:
      - name: should match only the quizzes selected by the requested re evaluation
          scope
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R012
      - name: should match every reached quiz when the re evaluation request declares
          no scope
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R012
      implements:
      - QuizInstructionScopeMatcher
- name: course-domain
  description: "Domain module for course structure. Contains entity models representing\
    \ the 5-level hierarchy (Course > ROOT > Milestone > Topic > Knowledge > QuizTemplate),\
    \ ports for persistence and validation, and domain exceptions. All models are\
    \ Java records with defensive copying. This module has no infrastructure dependencies."
  models:
  - name: NodeKind
    type: enum
    fields:
    - name: ROOT
    - name: MILESTONE
    - name: TOPIC
    - name: KNOWLEDGE
  - name: SentencePartKind
    type: enum
    fields:
    - name: TEXT
    - name: CLOZE
  - name: CourseEntity
    type: record
    fields:
    - name: id
      type: String
      description: MongoDB ObjectId as 24-char hex string
    - name: title
      type: String
      description: "Course name, e.g. english-course"
    - name: knowledgeIds
      type: List<String>
      description: Ordered list of all knowledge IDs in the course (R002)
    - name: root
      type: RootNodeEntity
      description: Explicit ROOT node (R001)
    - name: slug
      type: String
      description: "Directory name on disk, preserved for idempotency (R003/R016)"
  - name: RootNodeEntity
    type: record
    fields:
    - name: id
      type: String
      description: MongoDB ObjectId as 24-char hex string
    - name: code
      type: String
      description: Always root
    - name: kind
      type: NodeKind
      description: Always ROOT
    - name: label
      type: String
      description: Always empty string
    - name: children
      type: List<String>
      description: Ordered milestone IDs defining milestone order (R002/R013)
    - name: milestones
      type: List<MilestoneEntity>
      description: Resolved milestone entities in order
  - name: MilestoneEntity
    type: record
    fields:
    - name: id
      type: String
      description: MongoDB ObjectId as 24-char hex string
    - name: code
      type: String
      description: "Entity code, currently matches id"
    - name: kind
      type: NodeKind
      description: Always MILESTONE
    - name: label
      type: String
      description: "Visible name, e.g. A1, B2"
    - name: oldId
      type: String
      description: Legacy UUID identifier
    - name: parentId
      type: String
      description: References the ROOT node id (R008)
    - name: children
      type: List<String>
      description: Ordered topic IDs defining topic order (R002/R013)
    - name: order
      type: int
      description: "Ordinal position within course, 1-based, derived from ROOT children\
        \ (R013)"
    - name: slug
      type: String
      description: "Directory name on disk, preserved for idempotency (R003/R016)"
    - name: topics
      type: List<TopicEntity>
      description: Resolved topic entities in order
  - name: TopicEntity
    type: record
    fields:
    - name: id
      type: String
      description: MongoDB ObjectId as 24-char hex string
    - name: code
      type: String
      description: "Entity code, currently matches id"
    - name: kind
      type: NodeKind
      description: Always TOPIC
    - name: label
      type: String
      description: "Visible name, e.g. Present Simple"
    - name: oldId
      type: String
      description: Legacy UUID identifier
    - name: parentId
      type: String
      description: References the parent milestone id (R008)
    - name: children
      type: List<String>
      description: "Always null in current data, preserved for idempotency (R010)"
    - name: ruleIds
      type: List<String>
      description: Ordered knowledge IDs defining knowledge order (R002/R013)
    - name: order
      type: int
      description: "Ordinal position within milestone, 1-based, derived from milestone\
        \ children (R013)"
    - name: slug
      type: String
      description: "Directory name on disk, preserved for idempotency (R003/R016)"
    - name: knowledges
      type: List<KnowledgeEntity>
      description: Resolved knowledge entities in order
  - name: KnowledgeEntity
    type: record
    fields:
    - name: id
      type: String
      description: MongoDB ObjectId as 24-char hex string
    - name: code
      type: String
      description: "Entity code, currently matches id"
    - name: kind
      type: NodeKind
      description: Always KNOWLEDGE
    - name: label
      type: String
      description: "Visible name, e.g. Affirmative sentences in the present simple"
    - name: oldId
      type: String
      description: Legacy UUID identifier
    - name: parentId
      type: String
      description: References the parent topic id (R008)
    - name: isRule
      type: boolean
      description: Always true in current data
    - name: instructions
      type: String
      description: "Exercise instructions in Spanish, may be null in exceptional cases\
        \ (R009)"
    - name: order
      type: int
      description: "Ordinal position within topic, 1-based, derived from topic ruleIds\
        \ (R013)"
    - name: slug
      type: String
      description: "Directory name on disk, preserved for idempotency (R003/R016)"
    - name: quizTemplates
      type: List<QuizTemplateEntity>
      description: "Associated quiz templates, at least 1 required (R004)"
    - name: sentenceMode
      type: SentenceMode
      description: "Modo de frase declarado del knowledge basado en sentencias (F-SMODE-R001,\
        \ R002): REWRITE o FILL. Propiedad del knowledge, uniforme para todos sus\
        \ quizzes; nunca por quiz. Nullable: ausente para knowledges no-oracion (excluidos\
        \ del analisis por F-SLEN-R001) y para cursos previos a la siembra. En datos\
        \ reales TODOS los knowledges basados en sentencias se siembran (~211 REWRITE\
        \ / ~397 FILL), por lo que F-SMODE-R001 se cumple; el nullable es solo red\
        \ de seguridad para datos no sembrados. Cargado/persistido desde _knowledge.json\
        \ por FileSystemCourseRepository."
  - name: QuizTemplateEntity
    type: record
    fields:
    - name: id
      type: String
      description: Plain string ObjectId (R011)
    - name: oidId
      type: String
      description: "Same value as id, serialized as $oid wrapper in JSON (R011)"
    - name: kind
      type: String
      description: "Quiz type, currently always CLOZE"
    - name: knowledgeId
      type: String
      description: References parent knowledge id (R008)
    - name: title
      type: String
      description: "Quiz title, usually matches knowledge label"
    - name: instructions
      type: String
      description: "Instructions in Spanish, may be empty"
    - name: translation
      type: String
      description: Spanish translation of the sentence
    - name: theoryId
      type: String
      description: Theory reference in format milestone.number.theory_name
    - name: topicName
      type: String
      description: Redundant topic label
    - name: form
      type: FormEntity
      description: Exercise form structure
    - name: difficulty
      type: double
      description: "Difficulty level, currently always 0.0 (R012: stored as $numberDouble)"
    - name: retries
      type: double
      description: "Allowed retries, currently always 0.0 (R012: stored as $numberDouble)"
    - name: noScoreRetries
      type: double
      description: "No-score retries, currently always 0.0 (R012: stored as $numberDouble)"
    - name: code
      type: String
      description: "Auxiliary code, currently always empty"
    - name: audioUrl
      type: String
      description: "Exercise audio URL, currently always empty"
    - name: imageUrl
      type: String
      description: "Exercise image URL, currently always empty"
    - name: answerAudioUrl
      type: String
      description: Answer audio reference in format Milestone.section.subsection.number
    - name: answerImageUrl
      type: String
      description: "Answer image URL, currently always empty"
    - name: miniTheory
      type: String
      description: "Inline brief theory, currently always empty"
    - name: successMessage
      type: String
      description: "Success message, currently always empty"
    - name: sentences
      type: List<String>
      description: "Lista de oraciones planas asociadas al template, pre-computada\
        \ y persistida en la fuente de datos (F-DBSENT-R001). Se propaga sin modificacion\
        \ a AuditableQuiz.sentences durante el mapping del audit (F-DBSENT-R002).\
        \ El indice 0 es la oracion canonica consumida por los analyzers actuales;\
        \ mas elementos quedan disponibles para analisis multi-variante futuro."
  - name: FormEntity
    type: record
    fields:
    - name: kind
      type: String
      description: "Form type, currently always CLOZE"
    - name: incidence
      type: double
      description: "Weight/frequency, currently always 1.0 (R012: stored as $numberDouble)"
    - name: label
      type: String
      description: "Form label, currently always empty"
    - name: name
      type: String
      description: "Form name, currently always empty"
    - name: sentenceParts
      type: List<SentencePartEntity>
      description: Ordered sentence parts composing the exercise (R002)
  - name: SentencePartEntity
    type: record
    fields:
    - name: kind
      type: SentencePartKind
      description: "TEXT for fixed text, CLOZE for fill-in-the-blank"
    - name: text
      type: String
      description: "Visible text for TEXT parts, empty for CLOZE"
    - name: options
      type: List<String>
      description: "Answer options for CLOZE parts, null for TEXT parts"
  - name: CourseValidationException
    type: exception
    fields:
    - name: path
      type: String
    - name: detail
      type: String
    message: "Error al cargar el curso desde '%s': %s. La carga fue abortada."
    extends: RuntimeException
  - name: SentenceMode
    type: enum
    fields:
    - name: REWRITE
      description: "Ejercicio de reescritura/transformacion: la frase canonica puntuable\
        \ es SOLO la oracion respuesta (segmento(s) con CLOZE), excluyendo la oracion\
        \ fuente/prompt de TEXT-andamio (F-SMODE-R003, R004)."
    - name: FILL
      description: "Ejercicio de relleno/gap-fill: la frase canonica puntuable es\
        \ la oracion completa con el hueco relleno (todas las partes), comportamiento\
        \ historico (F-SMODE-R003)."
  interfaces:
  - name: CourseRepository
    stereotype: port
    sealed: false
    exposes:
    - signature: "load(Path path): CourseEntity"
    - signature: "save(CourseEntity course, Path path): void"
  - name: CourseValidator
    stereotype: service
    sealed: false
    exposes:
    - signature: "validate(CourseEntity course): void"
  scope: internal
  packages:
  - name: quizsentence
    description: "Public contract of the quizSentence DSL. Exposes the converter service\
      \ and the domain exceptions raised when the DSL grammar or the sentenceParts\
      \ convention is violated. The conversion engine itself is hidden in the sibling\
      \ 'quizsentenceengine' internal package (Public Port, Hidden Adapter)."
    visibility: public
    models:
    - name: QuizSentenceSerializationException
      type: exception
      fields:
      - name: reason
        type: String
        description: "Human-readable cause (R013, R024)."
      - name: position
        type: String
        description: Index of the offending sentencePart or 'n/a'.
      message: "No es posible serializar a quizSentence: %s (posicion %s)"
      extends: RuntimeException
    - name: QuizSentenceParseException
      type: exception
      fields:
      - name: reason
        type: String
        description: "Human-readable cause (R016, R024)."
      - name: position
        type: int
        description: Character offset in the input where the grammar violation was
          detected.
      message: "No es posible parsear el quizSentence: %s (posicion %d)"
      extends: RuntimeException
    interfaces:
    - name: QuizSentenceConverter
      stereotype: service
      sealed: false
      exposes:
      - signature: "serialize(FormEntity form): String"
      - signature: "parse(String quizSentence): FormEntity"
      - signature: "toPlainSentences(FormEntity form): List<String>"
      - signature: "toPlainSentences(FormEntity form, SentenceMode mode): List<String>"
      - signature: "parseOnto(String quizSentence, FormEntity base): FormEntity"
      visibility: public
  - name: quizsentenceengine
    description: "Internal engine implementing the quizSentence DSL conversions. The\
      \ public class DefaultQuizSentenceConverter is instantiated once by the composition\
      \ root (audit-cli bootstrap); all collaborators (QuizSentenceSerializer, QuizSentenceParser,\
      \ PlainSentenceDeriver, WhitespaceNormalizer) stay package-private so external\
      \ modules cannot bypass the port."
    visibility: internal
    implementations:
    - name: DefaultQuizSentenceConverter
      requiresInject:
      - name: serializer
        type: QuizSentenceSerializer
      - name: parser
        type: QuizSentenceParser
      - name: plainDeriver
        type: PlainSentenceDeriver
      visibility: public
      handwrittenTests:
      - name: should treat multi-entry options and pipe-splits as equivalent variants
          of the same answer
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R001
      - name: should treat the pipe character as separator of equivalent variants
          inside an options entry
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R002
      - name: should fail atomically when a TEXT part has options populated
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R003
      - name: should fail atomically when a CLOZE part has null or empty options
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R004
      - name: should reject an underscore run of length other than four as a blank
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R005
      - name: should reject a blank that is not followed by an answer block in brackets
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R006
      - name: should recognize parenthesized segments as pedagogical hints inside
          plain-text positions
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R007
      - name: should reject a quizSentence that does not alternate text and blank+block
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R008
      - name: should fail explicitly when reserved characters appear unescaped in
          TEXT content
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R009
      - name: should emit a single canonical space between text and DSL markers on
          serialize
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R010
      - name: should tolerate runs of whitespace on parse and normalize them
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R010
      - name: should serialize each TEXT preserving its hints with canonical whitespace
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R011
      - name: should serialize each CLOZE as four underscores followed by bracketed
          pipe-joined variants
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R012
      - name: should fail atomically when serializing an invalid FormEntity without
          producing partial output
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R013
      - name: should reconstruct alternating TEXT and CLOZE parts by scanning blank+block
          occurrences
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R014
      - name: should preserve hints inside the reconstructed TEXT text field and not
          extract them to the model
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R015
      - name: should fail atomically when parsing a malformed quizSentence without
          producing partial output
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R016
      - name: should return a list with one plain sentence per equivalent variant
          of the answer
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R017
      - name: should place the first sub-variant of the first options entry at index
          0 as the canonical variant
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R018
      - name: should strip pedagogical hints from every emitted plain sentence
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R019
      - name: should normalize whitespace in every emitted plain sentence after hint
          stripping
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R019
      - name: should produce the same plain sentences list whether derived directly
          from sentenceParts or via quizSentence
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R020
      - name: should fail atomically when toPlainSentences is called on an invalid
          FormEntity
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R024
      - name: should preserve semantics on round-trip sentenceParts to quizSentence
          to sentenceParts under whitespace-normalized equivalence
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R021
      - name: should preserve the quizSentence string on round-trip through sentenceParts
          under whitespace-normalized equivalence
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R022
      - name: should expose only the three forward conversions and no inverse reconstruction
          from a plain sentence
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R023
      - name: should round-trip every real CLOZE in db english-course quizzes json
          fixtures without error
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R028
      - name: should be consumable as a public course-domain service from another
          module
        traceability:
          feature: FEAT-QSENT
          rule: F-QSENT-R025
      - name: should keep toPlainSentences exposed as a public converter operation
          that derives the same canonical list from a FormEntity
        traceability:
          feature: FEAT-DBSENT
          rule: F-DBSENT-R003
      - name: should build the canonical phrase as the complete sentence with the
          blank filled when the knowledge mode is FILL
        traceability:
          feature: FEAT-SMODE
          rule: F-SMODE-R003
      - name: should build the canonical phrase as only the answer sentence excluding
          the source sentence when the knowledge mode is REWRITE
        traceability:
          feature: FEAT-SMODE
          rule: F-SMODE-R003
      - name: should fall back to FILL behavior building the complete sentence when
          the mode is null
        traceability:
          feature: FEAT-SMODE
          rule: F-SMODE-R003
      - name: should exclude the source TEXT scaffold so the REWRITE canonical phrase
          is You should watch the DVD reduced to Watch the DVD only
        traceability:
          feature: FEAT-SMODE
          rule: F-SMODE-R004
      - name: should never carry any token of the source sentence into the REWRITE
          canonical phrase token count
        traceability:
          feature: FEAT-SMODE
          rule: F-SMODE-R004
      - name: "should keep the form kind, incidence, label and name of the base form\
          \ when parsing a quizSentence onto it"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R014
      - name: should keep the empty text of each blank part present and empty instead
          of leaving it absent
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R014
      - name: should take the non-encoded attributes of each part from the base part
          at the same position when the quizSentence yields the same structure
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R014
      - name: "should replace the sequence of parts, the correct answer of each blank\
          \ and its accepted variants with what the quizSentence encodes"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R013
      - name: should give each blank part that the correction adds the same text as
          the blank parts the exercise already had
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R006
      - name: should give each fixed-text part that the correction adds its options
          in the same state as the fixed-text parts the exercise already had
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R006
      - name: "should never leave a blank part that the correction adds with its text\
          \ absent or at the default value of its type, even when the exercise had\
          \ no other blank part"
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R006
      - name: "should give a fixed-text part that the correction adds its own text\
          \ and no accepted answers, even when the exercise had no other fixed-text\
          \ part"
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R006
      implements:
      - QuizSentenceConverter
    - name: QuizSentenceSerializer
    - name: QuizSentenceParser
    - name: PlainSentenceDeriver
      requiresInject:
      - name: whitespaceNormalizer
        type: WhitespaceNormalizer
        description: "Helper de normalizacion de whitespace (collapse runs, trim)\
          \ usado al final de buildSentenceFromParts para cumplir R019 sobre la oracion\
          \ derivada."
    - name: WhitespaceNormalizer
- name: refiner-domain
  description: Refinement engine
  dependsOn:
  - audit-domain
  - course-domain
  models:
  - name: DiagnosisKind
    type: enum
    fields:
    - name: SENTENCE_LENGTH
    - name: LEMMA_ABSENCE
    - name: COCA_BUCKETS
    - name: LEMMA_RECURRENCE
    - name: KNOWLEDGE_TITLE_LENGTH
    - name: KNOWLEDGE_INSTRUCTIONS_LENGTH
  - name: RefinementTaskStatus
    type: enum
    fields:
    - name: PENDING
    - name: COMPLETED
    - name: SKIPPED
  - name: RefinementTask
    type: record
    fields:
    - name: id
      type: String
      description: Unique task identifier
    - name: nodeTarget
      type: AuditTarget
      description: "The hierarchy level of the node (QUIZ, KNOWLEDGE, TOPIC, MILESTONE,\
        \ COURSE)"
    - name: nodeId
      type: String
      description: Identifier of the target entity
    - name: nodeLabel
      type: String
      description: Human-readable label for display
    - name: diagnosisKind
      type: DiagnosisKind
      description: Which analyzer flagged the problem
    - name: priority
      type: int
      description: Priority rank (1 = highest)
    - name: status
      type: RefinementTaskStatus
      description: Current status
  - name: RefinementPlan
    type: record
    fields:
    - name: id
      type: String
      description: Unique plan identifier
    - name: sourceAuditId
      type: String
      description: ID of the AuditReport this plan was derived from
    - name: createdAt
      type: Instant
      description: When this plan was created
    - name: tasks
      type: List<RefinementTask>
      description: Prioritized list of refinement tasks
  - name: SuggestedLemma
    type: record
    fields:
    - name: lemma
      type: String
    - name: pos
      type: String
    - name: reason
      type: String
    - name: cocaRank
      type: Integer
    - name: lemmaCount
      type: Integer
      description: Observed lemma-count signal for the target level when available;
        null means unavailable.
    - name: lemmaCountThreshold
      type: Integer
      description: Minimum lemma-count threshold used to decide underexposure when
        available; null means unavailable.
    - name: isUnderexposed
      type: Boolean
      description: Whether lemmaCount is below lemmaCountThreshold when lemma-count
        data is available; null means unavailable.
  - name: SentenceLengthCorrectionContext
    type: record
    fields:
    - name: taskId
      type: String
    - name: sentence
      type: String
    - name: translation
      type: String
    - name: knowledgeTitle
      type: String
    - name: knowledgeInstructions
      type: String
    - name: topicLabel
      type: String
    - name: cefrLevel
      type: CefrLevel
    - name: tokenCount
      type: int
    - name: targetMin
      type: int
    - name: targetMax
      type: int
    - name: delta
      type: int
    - name: suggestedLemmas
      type: List<SuggestedLemma>
    implements:
    - CorrectionContext
  - name: MisplacedLemmaContext
    type: record
    fields:
    - name: lemma
      type: String
      description: Base form of the misplaced word
    - name: pos
      type: String
      description: "Part of speech (e.g., VERB, NOUN)"
    - name: expectedLevel
      type: CefrLevel
      description: CEFR level where this word belongs per EVP (always higher than
        quizLevel)
    - name: quizLevel
      type: CefrLevel
      description: CEFR level of the quiz where the word was found
    - name: cocaRank
      type: Integer
      description: COCA frequency ranking (nullable)
    - name: discount
      type: Double
      description: "Descuento aplicado por distancia de nivel que compitio en el maximo\
        \ de F-LABS-R019, propagado desde MisplacedLemma.discount (F-LABS-R038). Nullable\
        \ cuando el reporte fuente es previo a F-LABS-R038. El expectedLevel puede\
        \ ser ahora C1/C2 (F-LABS-R033)."
  - name: LemmaAbsenceCorrectionContext
    type: record
    fields:
    - name: taskId
      type: String
      description: Identifier of the refinement task
    - name: sentence
      type: String
      description: Current quiz sentence as plain text
    - name: translation
      type: String
      description: Spanish translation of the sentence
    - name: knowledgeTitle
      type: String
      description: Title of the parent knowledge
    - name: knowledgeInstructions
      type: String
      description: Instructions of the exercise
    - name: topicLabel
      type: String
      description: Label of the parent topic
    - name: cefrLevel
      type: CefrLevel
      description: CEFR level determined by milestone ancestor
    - name: misplacedLemmas
      type: List<MisplacedLemmaContext>
      description: Words in the quiz whose expected CEFR level is higher than the
        quiz level
    - name: suggestedLemmas
      type: List<SuggestedLemma>
      description: Absent lemmas from the level that could serve as replacements (reuses
        existing SuggestedLemma model)
    - name: quizSentence
      type: String
      description: FEAT-QSENT DSL of the original quiz (R001). Copied verbatim from
        AuditableQuiz.quizSentence by LemmaAbsenceContextResolver; never recomputed
        in this module. Coexists with `sentence` (plain) per R001 — both correspond
        to the same quiz and the same derivation step (R003). Null when the upstream
        AuditableQuiz was built before FEAT-QSENT was shipped.
    - name: tokenCount
      type: Integer
      description: |
        Cantidad actual de tokens en la oracion del quiz, copiada de SentenceLengthDiagnosis.tokenCount sobre el mismo nodo quiz (F-RCLALEN-R001, F-RCLALEN-R003). Nullable cuando no hay diagnostico de longitud disponible (F-RCLALEN-R004); reusa nombre y semantica de F-RCSL-R001.
    - name: targetMin
      type: Integer
      description: |
        Minimo de tokens esperados para el nivel CEFR del quiz, copiado de SentenceLengthDiagnosis.targetMin (F-RCLALEN-R001). Nullable cuando no hay diagnostico (F-RCLALEN-R004).
    - name: targetMax
      type: Integer
      description: |
        Maximo de tokens esperados para el nivel CEFR del quiz, copiado de SentenceLengthDiagnosis.targetMax (F-RCLALEN-R001). Nullable cuando no hay diagnostico (F-RCLALEN-R004).
    - name: delta
      type: Integer
      description: |
        Desviacion respecto al rango: 0 si esta dentro, positivo si excede el maximo, negativo si esta por debajo del minimo (F-RCLALEN-R001). Nullable cuando no hay diagnostico (F-RCLALEN-R004). Misma convencion de signo que F-RCSL-R001.
    - name: lengthDirection
      type: LengthDirection
      description: |
        Direccion accionable derivada del signo de delta por el resolver (F-RCLALEN-R002). Cuando no hay SentenceLengthDiagnosis se establece a UNKNOWN (F-RCLALEN-R004), nunca null. Pre-calculado del lado del sistema para que el prompt LLM sea deterministico y la salida CLI tenga una etiqueta legible para humanos.
    - name: sourceAuditId
      type: String
      description: "Identificador del AuditReport del que se derivo este contexto\
        \ de correccion (igual a RefinementPlan.sourceAuditId del plan que el operador\
        \ selecciono para la revision, incluido el seleccionado con --audit). Lo estampa\
        \ LemmaAbsenceContextResolver al construir el contexto. Lo consume el camino\
        \ revise (LemmaAbsenceAgentGenerator) para bindear la consulta dinamica de\
        \ suggested-lemmas al MISMO analisis fuente de la task, en lugar de resolver\
        \ el mas reciente por su cuenta (F-CSLATDC-R015). Liviano (String): identifica\
        \ el analisis sin transportar el AuditReport entero por el carrier que cruza\
        \ a JSON en revise --correction-context."
    - name: sentenceMode
      type: SentenceMode
      description: "Modo de frase del knowledge del quiz (F-SMODE-R003, R006). Estampado\
        \ por LemmaAbsenceContextResolver desde AuditableKnowledge.sentenceMode del\
        \ knowledge ancestro, igual que knowledgeTitle/knowledgeInstructions. Lo consume\
        \ DispatchingReviser para pasarselo al deriver y construir la frase canonica\
        \ del quiz revisado con el mismo modo del original (F-SMODE-R006). Nullable:\
        \ el deriver/converter aplica fallback a FILL (comportamiento historico) cuando\
        \ es null."
    - name: exerciseQuizzes
      type: List<String>
      description: |
        Lista de los quizSentence (forma DSL) de los OTROS quizzes del mismo ejercicio (los quizzes hermanos bajo el mismo knowledge), recolectados por LemmaAbsenceContextResolver al recorrer el arbol de auditoria. La consume el agente lemma-absence para evitar proponer un quiz demasiado parecido a uno que ya existe en el ejercicio. Lista vacia cuando el ejercicio no tiene otros quizzes.
    - name: nodeId
      type: String
      description: |
        Identificador del nodo quiz auditado al que corresponde este contexto (igual a RefinementTask.nodeId). Lo estampa LemmaAbsenceContextResolver desde la task. Lo consume el camino revise (LemmaAbsenceAgentGenerator) para re-bindear la SuggestedLemmaQuerySession con el nodo real: sin el, la sesion se ata con un task de nodeId null y la tool get_suggested_lemmas devuelve siempre lista vacia (el query port no encuentra el nodo). El nodeTarget asociado es siempre QUIZ para LEMMA_ABSENCE. Nullable cuando el contexto se construye sin task asociada.
    - name: scarceContentWords
      type: List<ScarceContentWord>
      description: "Palabras de contenido de la oracion actual (NOUN/VERB/ADJ/ADV)\
        \ con exposicion global baja (count < umbral de lemma-count) que el corrector\
        \ NO debe quitar al reescribir para reemplazar vocabulario fuera de nivel\
        \ (F-RCLA-R003b). Estampada por LemmaAbsenceContextResolver desde la señal\
        \ de lemma-count del curso sobre la misma `sentence`. Lista vacia (nunca null)\
        \ cuando la auditoria no incluyo lemma-count, ninguna palabra esta por debajo\
        \ del umbral, o la oracion no tiene palabras de contenido (F-RCLA-R003c).\
        \ Analoga a misplacedLemmas/suggestedLemmas: se serializa a JSON en `get task`."
    - name: outOfCatalogWords
      type: List<OutOfCatalogWordContext>
      description: "Palabras de contenido fuera de catalogo que penalizaron la oracion\
        \ del quiz (F-LABS-R034), con su detalle observable (F-LABS-R038): lema, POS\
        \ observada, ranking nullable y descuento. Estampada por LemmaAbsenceContextResolver\
        \ desde LemmaPlacementDiagnosis.outOfCatalogWords del nodo, analoga a misplacedLemmas.\
        \ Lista vacia (nunca null) cuando no hay penalizadas o el reporte es previo.\
        \ Alimenta el pipeline existente de planes y revisiones para que estas penalizaciones\
        \ produzcan tareas corregibles."
    implements:
    - CorrectionContext
  - name: LengthDirection
    type: enum
    fields:
    - name: SHORTEN
      description: La oracion excede el rango (delta > 0); el LLM debe acortarla mientras
        reemplaza vocabulario.
    - name: LENGTHEN
      description: La oracion esta por debajo del rango (delta < 0); el LLM tiene
        margen para incorporar mas vocabulario sugerido.
    - name: KEEP_SAME
      description: La oracion esta dentro del rango (delta == 0); el LLM debe mantener
        una longitud similar al reemplazar.
    - name: UNKNOWN
      description: No hay SentenceLengthDiagnosis disponible para el nodo quiz (F-RCLALEN-R004);
        el LLM solo se gua por las reglas existentes de FEAT-RCLA.
    visibility: public
    glossarySuggestions:
    - name: Length Direction
      technicalName: LengthDirection
      kind: value-object-candidate
      basedOn: refiner-domain/LengthDirection
      rationale: |
        Etiqueta accionable y enumerable que el contexto de correccion expone al LLM. Si surge la necesidad de razonarla en otros contextos (revision, refinement, reportes), promover a termino canonico del glosario.
  - name: SuggestedLemmaQueryResult
    type: record
    fields:
    - name: taskId
      type: String
      description: Identificador de la RefinementTask consultada.
    - name: cefrLevel
      type: CefrLevel
      description: "Nivel CEFR efectivamente aplicado al filtrar (F-CSLATDC-R003,\
        \ F-CSLATDC-R004, F-CSLATDC-R006). Trazabilidad obligatoria para el agente\
        \ revisor."
    - name: suggestedLemmas
      type: List<SuggestedLemma>
      description: "Lemmas ya filtrados por nivel + partOfSpeech y ordenados por prioridad\
        \ (F-CSLATDC-R010, F-CSLATDC-R014). Lista vacía es resultado válido cuando\
        \ no hay coincidencias (F-CSLATDC-R009, F-CSLATDC-R012)."
    visibility: public
  - name: SuggestedLemmaQueryRejectedException
    type: exception
    fields:
    - name: taskId
      type: String
      description: Task que originó la consulta rechazada.
    - name: reason
      type: String
      description: Motivo funcional legible (texto exacto pendiente — DOUBT-EXACT-ERROR-COPY
        del requirement).
    message: "Suggested lemma query rejected for task %s: %s"
    visibility: public
    extends: RuntimeException
  - name: SuggestedLemmaQueryCriteria
    type: record
    fields:
    - name: limit
      type: Optional<Integer>
      description: "Cantidad maxima de SuggestedLemma a devolver tras ampliar y ordenar\
        \ el universo (F-INCEXP-R007). Vacio = el adaptador decide su default historico,\
        \ identico a FEAT-CSLATDC; el recorte se aplica como ultimo paso (F-INCEXP-R007,\
        \ F-INCEXP-R010)."
    - name: partOfSpeech
      type: Optional<String>
      description: "Filtro opcional por part-of-speech, aplicado tambien sobre los\
        \ lemas ya expuestos cuando includeExposed esta activo (F-INCEXP-R006). Vacio\
        \ = sin filtro de POS."
    - name: explicitLevel
      type: Optional<CefrLevel>
      description: "CefrLevel explicito. Vacio = el adaptador infiere el nivel desde\
        \ la task; la inferencia y el rechazo por falta de nivel no dependen de includeExposed\
        \ (F-INCEXP-R005, F-INCEXP-R008)."
    - name: includeExposed
      type: boolean
      description: "Opcion de la consulta. false (default) = la senal de prioridad\
        \ EXCLUYE los lemas ya suficientemente expuestos, comportamiento identico\
        \ a FEAT-CSLATDC (F-INCEXP-R001). true = la senal de prioridad solo ORDENA:\
        \ el universo se amplia a todos los lemas del level+POS incluyendo los ya\
        \ expuestos (F-INCEXP-R002), que quedan al final como un unico grado de prioridad\
        \ ordenado por COCA ascendente (F-INCEXP-R003, F-INCEXP-R004)."
    - name: regex
      type: Optional<String>
      description: "Patron de texto opcional, evaluado unicamente contra el texto\
        \ del SuggestedLemma (F-SLREGEX-R002). Vacio (default) = sin filtrado textual\
        \ (F-SLREGEX-R001). Coincidencia parcial estilo grep, no anclada, insensible\
        \ a mayusculas/minusculas (F-SLREGEX-R003, F-SLREGEX-R004). Filtro aditivo:\
        \ se aplica sobre los candidatos que ya pasaron Level/PoS/condicion de exposicion,\
        \ sin relajarlos, preservando el orden por prioridad; el limit recorta despues\
        \ (F-SLREGEX-R005, F-SLREGEX-R006, F-SLREGEX-R007). Espeja la optionality\
        \ de partOfSpeech."
    visibility: public
  - name: ScarceContentWord
    type: record
    fields:
    - name: lemma
      type: String
      description: Forma base de la palabra de contenido de la oracion actual (e.g.
        'butter'). F-RCLA-R003b.
    - name: pos
      type: String
      description: "Parte de la oracion: NOUN, VERB, ADJ o ADV (solo palabras de contenido).\
        \ F-RCLA-R003b."
    - name: count
      type: Integer
      description: "Exposicion global del lema segun la señal de lemma-count: numero\
        \ de oraciones distintas del curso donde aparece. Siempre estrictamente menor\
        \ que threshold (F-RCLA-R003b). Reusa la semantica de SuggestedLemma.lemmaCount\
        \ (F-SLEM)."
    - name: threshold
      type: Integer
      description: Umbral de exposicion de lemma-count usado para decidir baja exposicion;
        el mismo para todas las entradas de la lista (F-RCLA-R003b). Reusa la semantica
        de SuggestedLemma.lemmaCountThreshold (F-SLEM).
  - name: KnowledgeTitleCorrectionContext
    type: record
    fields:
    - name: taskId
      type: String
      description: Id de la RefinementTask (F-KTLR-R002).
    - name: knowledgeId
      type: String
      description: "Id del knowledge senalado por la tarea; lo consume el adapter\
        \ agente como input knowledgeId (F-KTLR-R002, R011)."
    - name: currentTitle
      type: String
      description: Titulo actual del knowledge (label). Punto de partida a mejorar
        (F-KTLR-R002).
    - name: currentInstructions
      type: String
      description: "Instructions actuales del knowledge; se comprimen sin perder la\
        \ consigna (F-KTLR-R002). Nullable: KnowledgeEntity.instructions puede ser\
        \ null."
    - name: topicLabel
      type: String
      description: Label del topic contenedor; el titulo no debe repetir lo que ya
        dice el topic (F-KTLR-R002).
    - name: titleTargetMax
      type: Integer
      description: Techo ponderado del titulo que aplica el audit (knowledge-title-length).
        Limite objetivo de longitud (F-KTLR-R002). Nullable si no hay diagnostico
        disponible.
    - name: instructionsTargetMax
      type: Integer
      description: Techo ponderado de las instructions que aplica el audit. Limite
        objetivo de longitud (F-KTLR-R002). Nullable.
    - name: expectedTitleLanguage
      type: String
      description: Idioma esperado del titulo (ingles) segun convencion del contenido
        (F-KTLR-R002).
    - name: expectedInstructionsLanguage
      type: String
      description: Idioma esperado de las instructions (espanol) segun convencion
        del contenido (F-KTLR-R002).
    implements:
    - CorrectionContext
  - name: OutOfCatalogWordContext
    type: record
    fields:
    - name: lemma
      type: String
      description: Forma base de la palabra fuera de catalogo penalizada en la oracion
        del quiz (F-LABS-R038). Copiada por LemmaAbsenceContextResolver desde OutOfCatalogWord
        del diagnostico del nodo.
    - name: observedPos
      type: String
      description: Etiqueta POS observada del token en la oracion (F-LABS-R038).
    - name: frequencyRank
      type: Integer
      description: "Ranking de frecuencia evaluado contra las bandas por nivel de\
        \ F-LABS-R034. Nullable: sin ranking equivale a banda de descuento fuerte.\
        \ El motivo se expresa como 'fuera de catalogo' con este ranking; nunca como\
        \ un nivel CEFR (F-LABS-R038)."
    - name: discount
      type: double
      description: Descuento que compitio en el maximo de F-LABS-R019. Permite al
        agente priorizar que palabra reemplazar (F-LABS-R038).
  interfaces:
  - name: RefinerEngine
    stereotype: port
    sealed: false
