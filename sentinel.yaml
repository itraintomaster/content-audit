  patterns:
  - type: Factory
    implementations:
    - DefaultAuditNodeIndexFactory
    suppressed: false
    interface: AuditNodeIndexFactory
  scope: internal
  packages:
  - name: coca
    description: "COCA frequency bucket distribution analysis. Classifies NLP tokens\
      \ into frequency bands (K1-K5+), evaluates distribution against configurable\
      \ targets per CEFR level, assesses progression across levels, and generates\
      \ improvement directives."
    visibility: internal
    models:
    - name: FrequencyBand
      type: record
      fields:
      - name: name
        type: String
        description: "Band identifier (e.g. K1, K2, K3, K4, K5_PLUS)"
      - name: lowerBound
        type: int
        description: Inclusive lower frequency rank bound
      - name: upperBound
        type: int
        description: Inclusive upper frequency rank bound (Integer.MAX_VALUE for open-ended)
    - name: BandConfiguration
      type: record
      fields:
      - name: bands
        type: List<FrequencyBand>
        description: Ordered list of frequency bands from most common to least common
      - name: openEnded
        type: boolean
        description: "If true, the last band captures all ranks above its lower bound"
    - name: AssessmentState
      type: enum
      fields:
      - name: OPTIMAL
      - name: ADEQUATE
      - name: DEFICIENT
      - name: EXCESSIVE
    - name: TargetKind
      type: enum
      fields:
      - name: AT_LEAST
      - name: AT_MOST
    - name: BucketTarget
      type: record
      fields:
      - name: bandName
        type: String
        description: Name of the frequency band this target applies to
      - name: targetPercentage
        type: double
        description: Expected percentage of tokens in this band (0.0-1.0)
      - name: kind
        type: TargetKind
        description: Whether the target is a minimum or maximum threshold
    - name: BucketResult
      type: record
      fields:
      - name: bandName
        type: String
        description: Name of the frequency band
      - name: count
        type: int
        description: Number of tokens classified into this band
      - name: percentage
        type: double
        description: Actual percentage of tokens in this band (0.0-1.0)
      - name: targetPercentage
        type: double
        description: Expected percentage for this band (0.0-1.0)
      - name: score
        type: double
        description: Score for this bucket (0.0-1.0) based on proximity to target
      - name: assessment
        type: AssessmentState
        description: Qualitative assessment of this bucket result
    - name: QuarterBucketTargets
      type: record
      fields:
      - name: targets
        type: List<BucketTarget>
        description: Bucket targets for a specific quarter of a level
    - name: QuarterResult
      type: record
      fields:
      - name: index
        type: int
        description: Quarter index (0-based) within the level
      - name: bucketResults
        type: List<BucketResult>
        description: Distribution results per band for this quarter
      - name: score
        type: double
        description: Aggregated score for this quarter (0.0-1.0)
    - name: LevelBucketDistribution
      type: record
      fields:
      - name: levelName
        type: String
        description: "CEFR level name (e.g. A1, A2, B1, B2)"
      - name: score
        type: double
        description: Aggregated score for this level (0.0-1.0)
      - name: bucketResults
        type: List<BucketResult>
        description: Overall distribution results per band for this level
      - name: quarterResults
        type: List<QuarterResult>
        description: Quarter-by-quarter breakdown within this level
      - name: topicDistributions
        type: List<TopicBucketDistribution>
        description: Per-topic breakdown within this level
    - name: TopicBucketDistribution
      type: record
      fields:
      - name: topicId
        type: String
        description: Topic identifier
      - name: score
        type: double
        description: Aggregated score for this topic (0.0-1.0)
      - name: bucketResults
        type: List<BucketResult>
        description: Distribution results per band for this topic
      - name: topicLabel
        type: String
        description: Human-readable topic name for COCA distribution reports
    - name: ProgressionState
      type: enum
      fields:
      - name: ASCENDING
      - name: DESCENDING
      - name: STATIC
      - name: IRREGULAR
    - name: ProgressionExpectation
      type: record
      fields:
      - name: bandName
        type: String
        description: The frequency band whose progression is being specified
      - name: expectedProgression
        type: ProgressionState
        description: Expected progression pattern across levels for this band
    - name: ProgressionAssessment
      type: record
      fields:
      - name: bandName
        type: String
        description: The frequency band assessed
      - name: actualProgression
        type: ProgressionState
        description: Observed progression pattern across levels
      - name: expectedProgression
        type: ProgressionState
        description: Expected progression pattern from configuration
      - name: matches
        type: boolean
        description: Whether actual matches expected progression
    - name: ImprovementDirectiveType
      type: enum
      fields:
      - name: ENRICH
      - name: REDUCE
    - name: ImprovementDirective
      type: record
      fields:
      - name: type
        type: ImprovementDirectiveType
        description: Whether to enrich or reduce tokens in the target range
      - name: bandName
        type: String
        description: The frequency band this directive targets
      - name: levelName
        type: String
        description: The CEFR level this directive applies to
      - name: frequencyRangeFrom
        type: int
        description: Lower bound of the COCA frequency range
      - name: frequencyRangeTo
        type: int
        description: Upper bound of the COCA frequency range
      - name: actualPercentage
        type: double
        description: Current percentage of tokens in this band (0.0-1.0)
      - name: targetPercentage
        type: double
        description: Desired percentage of tokens in this band (0.0-1.0)
    - name: CocaBucketsDistributionResult
      type: record
      fields:
      - name: levels
        type: List<LevelBucketDistribution>
        description: Per-level distribution results
      - name: progressionAssessments
        type: List<ProgressionAssessment>
        description: Progression assessments across levels for each band
      - name: overallScore
        type: double
        description: Weighted overall score across all levels (0.0-1.0)
      - name: improvementDirectives
        type: List<ImprovementDirective>
        description: Actionable improvement directives for levels not meeting targets
    - name: AnalysisStrategy
      type: enum
      fields:
      - name: LEVELS
      - name: QUARTERS
    - name: CocaProgressionDiagnosis
      type: record
      fields:
      - name: overallScore
        type: double
        description: Global COCA distribution analysis score (0.0-1.0)
      - name: progressionAssessments
        type: List<ProgressionAssessment>
        description: Progression evaluation per frequency band across levels
      - name: improvementDirectives
        type: List<ImprovementDirective>
        description: Directives indicating which bands need adjustments in which levels
    - name: CocaBucketsLevelDiagnosis
      type: record
      fields:
      - name: totalTokens
        type: int
        description: Total number of classified tokens in this level
      - name: buckets
        type: List<BucketResult>
        description: "Distribution results per frequency band with count, percentage,\
          \ target, score and assessment"
      - name: quarters
        type: List<QuarterResult>
        description: "Distribution results per quarter with index, score and internal\
          \ buckets"
    - name: CocaBucketsTopicDiagnosis
      type: record
      fields:
      - name: totalTokens
        type: int
        description: Total number of classified tokens in this topic
      - name: buckets
        type: List<BucketSummary>
        description: Informational distribution summary per band without evaluation
          against targets
    - name: BucketSummary
      type: record
      fields:
      - name: bandName
        type: String
        description: "Name of the frequency band (e.g., top1k, top2k)"
      - name: count
        type: int
        description: Number of tokens classified into this band
      - name: percentage
        type: double
        description: Percentage of tokens in this band relative to topic total (0.0-1.0)
    interfaces:
    - name: TokenClassifier
      stereotype: port
      sealed: false
      exposes:
      - signature: "classify(int frequencyRank,BandConfiguration bandConfig): FrequencyBand"
    - name: ProgressionEvaluator
      stereotype: port
      sealed: false
      exposes:
      - signature: "evaluate(List<LevelBucketDistribution> levels,List<ProgressionExpectation>\
          \ expectations): List<ProgressionAssessment>"
    - name: ImprovementPlanner
      stereotype: port
      sealed: false
      exposes:
      - signature: "plan(List<LevelBucketDistribution> levels,BandConfiguration bandConfig,CocaBucketsConfig\
          \ config): List<ImprovementDirective>"
    implementations:
    - name: CocaBucketsAnalyzer
      requiresInject:
      - name: nlpTokenizer
        type: NlpTokenizer
      - name: cocaBucketsConfig
        type: CocaBucketsConfig
      - name: tokenClassifier
        type: TokenClassifier
      - name: progressionEvaluator
        type: ProgressionEvaluator
      - name: improvementPlanner
        type: ImprovementPlanner
      visibility: public
      handwrittenTests:
      - name: should emit on the COURSE AuditNode a CocaProgressionDiagnosis populated
          with overallScore progressionAssessments and improvementDirectives reflecting
          the analyzer outputs at the course level
        traceability:
          feature: FEAT-DCOCA
          rule: F-DCOCA-R001
      - name: should emit on every MILESTONE AuditNode a CocaBucketsLevelDiagnosis
          populated with totalTokens buckets and quarters reflecting the per-level
          analyzer outputs
        traceability:
          feature: FEAT-DCOCA
          rule: F-DCOCA-R002
      - name: should emit on every TOPIC AuditNode a CocaBucketsTopicDiagnosis populated
          with totalTokens and BucketSummary entries reflecting the informational
          per-topic distribution
        traceability:
          feature: FEAT-DCOCA
          rule: F-DCOCA-R003
      - name: should NOT emit a coca-buckets diagnosis on any KNOWLEDGE or QUIZ AuditNode
          confirming the analyzer operates only at course milestone and topic granularity
        traceability:
          feature: FEAT-DCOCA
          rule: F-DCOCA-R004
      - name: should make the emitted CocaProgressionDiagnosis CocaBucketsLevelDiagnosis
          and CocaBucketsTopicDiagnosis retrievable via the typed CourseDiagnoses.getCocaBucketsDiagnosis
          LevelDiagnoses.getCocaBucketsDiagnosis and TopicDiagnoses.getCocaBucketsDiagnosis
          getters on the matching nodes
        traceability:
          feature: FEAT-DCOCA
          rule: F-DCOCA-R005
      - name: should not write any coca-buckets-distribution entry to the untyped
          metadata map on any AuditNode after the migration to typed diagnoses is
          complete
        traceability:
          feature: FEAT-DCOCA
          rule: F-DCOCA-R007
      - name: should compute the percentage of tokens in each band as (count-in-band
          / total-classified) times 100 for every level (and quarter when the strategy
          is quarters) accumulating across all quizzes knowledges and topics in that
          node
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R005
      - name: should classify every token using the frequencyRank already attached
          by the upstream NLP tokenization step and never call a frequency lookup
          service from inside the analyzer
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R006
      - name: should produce one of OPTIMO ADEQUATE DEFICIENTE or EXCESIVO for every
          band-level pair by comparing the band's actual percentage against the configured
          target taking optimalRange and adequateRange tolerances into account
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R007
      - name: should interpret target directionality as atLeast (OPTIMO when actual
          >= target - optimalRange ADEQUATE within adequateRange below DEFICIENTE
          further below no EXCESIVO state) or atMost (mirror semantics above the target
          with no DEFICIENTE state) according to the kind configured for each band
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R008
      - name: "should score each band as 1.0 when OPTIMO 0.8 when ADEQUATE and max(0,\
          \ 0.8 - (|actual-target| - adequateRange) * 0.04) when DEFICIENTE or EXCESIVO\
          \ using the same distance-from-target formula in both directions"
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R010
      - name: should compute the score of a quarter as the simple average of the scores
          of the bands that have a target defined in that quarter ignoring bands without
          target in that quarter
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R011
      - name: should compute the score of a level under strategy LEVELS as the simple
          average of the scores of the bands with level-level targets and under strategy
          QUARTERS as a weighted combination of band-level scores quarter-level scores
          and topic-level scores
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R012
      - name: should compute the overall course-level coca-buckets-distribution score
          as the simple average of the scores of the CEFR levels that have classified
          tokens omitting from the average any level without data
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R013
          journey: F-COCA-J001
      - name: should interpolate quarter targets Q2 and Q3 linearly per band using
          Q1 + (Q4 - Q1) * (1/3) and Q1 + (Q4 - Q1) * (2/3) respectively when running
          under the QUARTERS strategy
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R015
      - name: should propagate the directionality kind of Q1 to the interpolated quarters
          Q2 and Q3 ignoring any kind declared on Q4 when the two would disagree
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R016
      - name: should evaluate every band against the configured level-level targets
          directly without subdividing the level into quarters when running under
          the LEVELS strategy
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R019
      - name: should compute band scores only at the level and quarter nodes that
          have configured targets and never publish a band score for KNOWLEDGE or
          TOPIC nodes regardless of their accumulated counts
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R027
      - name: should publish on every AuditNode for every band the band name accumulated
          count and percentage and additionally on nodes with configured targets the
          target percentage kind band score and evaluation state
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R028
          journey: F-COCA-J002
        _change: modify
      - name: should assign every topic of a CEFR level to exactly one quarter when
          running under the QUARTERS strategy producing a quarter-to-topic partition
          that covers all topics of the level with no duplicates and no gaps regardless
          of the precise rounding algorithm used to balance counts
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R017
      implements:
      - ContentAnalyzer
    - name: CocaTokenAccumulationAggregator
      handwrittenTests:
      - name: should accumulate token counts per band by summing the band counts of
          each child node when rolling up the audit tree (quiz to knowledge to topic
          to level) so a parent's band count equals the sum of its children's band
          counts and never a simple average of scores
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R025
      - name: should publish on every AuditNode of the hierarchy (knowledge topic
          level) a percentage distribution per band computed as (accumulated-count
          / total-classified) times 100 from the counts rolled up at that node
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R026
          journey: F-COCA-J005
      - name: should be selected by the audit engine as the aggregator for the coca-buckets-distribution
          analyzer demonstrating that the platform supports per-analyzer aggregation
          strategies and that the default simple-score-average is not used for this
          analyzer
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R029
      implements:
      - ScoreAggregator
    - name: DefaultTokenClassifier
      visibility: public
      handwrittenTests:
      - name: should place a token with frequencyRank between 1 and 1000 in the top1k
          band a token between 1001 and 2000 in the top2k band a token between 2001
          and 3000 in the top3k band and a token with rank 3001 or above in the top4k
          band
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R001
      - name: should treat the top4k band as open so tokens with arbitrarily large
          frequencyRank (e.g. 3500 and 15000) are classified into the same top4k band
          when the band carries the open flag
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R002
      - name: should exclude tokens whose frequencyRank is null from every BucketResult.count
          and from the totalTokens of the produced CocaBucketsLevelDiagnosis and CocaBucketsTopicDiagnosis
          so percentages are computed only over effectively classified tokens
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R004
      implements:
      - TokenClassifier
    - name: DefaultProgressionEvaluator
      visibility: public
      handwrittenTests:
      - name: should classify the real progression of each band with configured expected
          progression as ASCENDENTE when only increases between consecutive levels
          DESCENDENTE when only decreases ESTATICA when no significant changes and
          IRREGULAR when both increases and decreases occur
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R021
          journey: F-COCA-J003
      - name: should evaluate progression only across CEFR levels that have classified
          tokens skipping levels without data and falling back to ESTATICA when fewer
          than two levels have data
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R022
      - name: should produce per-band a progression-assessment record with band name
          expected progression real progression and a boolean indicating whether real
          matches expected
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R024
      - name: should ignore band percentage changes smaller than the configured significance
          margin when classifying a band's real progression so two consecutive levels
          whose percentages differ only by a sub-margin amount contribute neither
          an increase nor a decrease to the progression evaluation
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R023
      implements:
      - ProgressionEvaluator
    - name: DefaultImprovementPlanner
      visibility: public
      handwrittenTests:
      - name: should emit improvement directives in two categories bucketsToEnrich
          for bands with DEFICIENTE state (need more tokens of that frequency) and
          bucketsToReduce for bands with EXCESIVO state (need fewer tokens of that
          frequency) for every level (and quarter under strategy QUARTERS) where targets
          are not met
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R030
          journey: F-COCA-J004
      - name: should include in every improvement directive the frequency rank range
          (from/to) of the affected band so the content creator can look up replacement
          words within that range and for the open band (top4k) the upper bound is
          expressed as open-ended
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R031
      - name: should emit improvement directives only for bands whose state is DEFICIENTE
          or EXCESIVO and never for OPTIMO or ADEQUATE so the content creator is not
          flooded with unactionable advice
        traceability:
          feature: FEAT-COCA
          rule: F-COCA-R032
      implements:
      - ImprovementPlanner
  - name: lrec
    description: "Lemma recurrence analysis by spaced repetition. Tracks global word\
      \ positions across the course, calculates mean intervals between consecutive\
      \ lemma occurrences, classifies exposure status (normal, sub-exposed, over-exposed),\
      \ and produces a course-level recurrence score."
    visibility: internal
    models:
    - name: ExposureStatus
      type: enum
      fields:
      - name: NORMAL
        type: String
      - name: SUB_EXPOSED
        type: String
      - name: OVER_EXPOSED
        type: String
    - name: LemmaStats
      type: record
      fields:
      - name: lemma
        type: String
        description: Lemmatized form of the word
      - name: pos
        type: String
        description: "Predominant POS tag (NOUN, VERB, ADJ, ADV)"
      - name: count
        type: int
        description: Total number of occurrences in the course
      - name: meanInterval
        type: double
        description: Mean interval between consecutive occurrences (in global positions)
      - name: stdDevInterval
        type: double
        description: Population standard deviation of intervals
      - name: exposureStatus
        type: ExposureStatus
        description: "Exposure classification: NORMAL, SUB_EXPOSED, or OVER_EXPOSED"
      - name: occurrencePositions
        type: List<Integer>
        description: All global positions where this lemma appears
    - name: ExposureSummary
      type: record
      fields:
      - name: normalCount
        type: int
        description: Count of lemmas with NORMAL exposure
      - name: subExposedCount
        type: int
        description: Count of lemmas with SUB_EXPOSED exposure
      - name: overExposedCount
        type: int
        description: Count of lemmas with OVER_EXPOSED exposure
    - name: LemmaRecurrenceResult
      type: record
      fields:
      - name: lemmaStats
        type: List<LemmaStats>
        description: "Per-lemma statistics, ordered by count descending"
      - name: exposureSummary
        type: ExposureSummary
        description: Aggregate counts by exposure status
      - name: overallScore
        type: double
        description: Proportion of lemmas with NORMAL exposure (0.0 to 1.0)
    interfaces:
    - name: IntervalCalculator
      stereotype: port
      sealed: false
      exposes:
      - signature: "calculateMeanInterval(List<Integer> positions): double"
      - signature: "calculateStdDevInterval(List<Integer> positions,double meanInterval):\
          \ double"
    - name: ExposureClassifier
      stereotype: port
      sealed: false
      exposes:
      - signature: "classify(double meanInterval,LemmaRecurrenceConfig config): ExposureStatus"
    implementations:
    - name: LemmaRecurrenceAnalyzer
      requiresInject:
      - name: contentWordFilter
        type: ContentWordFilter
      - name: lemmaRecurrenceConfig
        type: LemmaRecurrenceConfig
      - name: intervalCalculator
        type: IntervalCalculator
      - name: exposureClassifier
        type: ExposureClassifier
      visibility: public
      handwrittenTests:
      - name: "Given a LemmaRecurrenceAnalyzer, when getName is called, then returns\
          \ lemma-recurrence"
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R015
      - name: "Given a LemmaRecurrenceAnalyzer, when getTarget is called, then returns\
          \ COURSE"
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R013
      - name: should assign a globally sequential position counter incremented by
          one per token traversed across every quiz in the course
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R001
      - name: should register each content-word token under its lemma key in the lemma-positions
          map preserving the global position and grouping inflected forms by their
          lemmatized form
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R004
      - name: should restrict the analysed lemmas to the top N most frequent ones
          according to the configured top parameter discarding the least frequent
          lemmas beyond that limit
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R005
      - name: should skip from the per-lemma interval calculation any lemma whose
          registered position list has fewer than two entries
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R006
      - name: should classify each analysed lemma as NORMAL when overExposed < meanInterval
          <= subExposed as OVER_EXPOSED when meanInterval <= overExposed and as SUB_EXPOSED
          when meanInterval > subExposed using the configured thresholds
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R008
      - name: should produce an ExposureSummary whose normalCount plus subExposedCount
          plus overExposedCount equals the total count of lemmas analysed
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R009
      - name: should compute the overall lemma-recurrence score as normalCount divided
          by totalCount rounded to two decimals and return 0.0 when totalCount is
          zero
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R010
      - name: should produce identical overall score and exposure classification when
          two analysed lemmas share the same meanInterval but differ in stdDevInterval
          confirming stdDev is informative only
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R011
      - name: should populate every LemmaStats entry with lemma pos count meanInterval
          stdDevInterval exposureStatus and occurrencePositions matching the data
          captured for that lemma
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R012
      implements:
      - ContentAnalyzer
    - name: DefaultContentWordFilter
      tests:
      - name: "Given a NOUN token, when isContentWord is called, then returns true"
        target: DefaultContentWordFilter
        invoke:
          method: isContentWord
          args:
          - ref:nounToken
        fixtures:
        - id: nounToken
          type: NlpToken
          construct:
            text: cat
            lemma: cat
            posTag: NOUN
            frequencyRank: 100
            isStop: false
            isPunct: false
        type: unit
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R003
        assert:
          returns: true
      - name: "Given a VERB token, when isContentWord is called, then returns true"
        target: DefaultContentWordFilter
        invoke:
          method: isContentWord
          args:
          - ref:verbToken
        fixtures:
        - id: verbToken
          type: NlpToken
          construct:
            text: running
            lemma: run
            posTag: VERB
            frequencyRank: 50
            isStop: false
            isPunct: false
        type: unit
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R003
        assert:
          returns: true
      - name: "Given an ADJ token, when isContentWord is called, then returns true"
        target: DefaultContentWordFilter
        invoke:
          method: isContentWord
          args:
          - ref:adjToken
        fixtures:
        - id: adjToken
          type: NlpToken
          construct:
            text: big
            lemma: big
            posTag: ADJ
            frequencyRank: 200
            isStop: false
            isPunct: false
        type: unit
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R003
        assert:
          returns: true
      - name: "Given an ADV token, when isContentWord is called, then returns true"
        target: DefaultContentWordFilter
        invoke:
          method: isContentWord
          args:
          - ref:advToken
        fixtures:
        - id: advToken
          type: NlpToken
          construct:
            text: quickly
            lemma: quickly
            posTag: ADV
            frequencyRank: 300
            isStop: false
            isPunct: false
        type: unit
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R003
        assert:
          returns: true
      - name: "Given a DET token, when isContentWord is called, then returns false"
        target: DefaultContentWordFilter
        invoke:
          method: isContentWord
          args:
          - ref:detToken
        fixtures:
        - id: detToken
          type: NlpToken
          construct:
            text: the
            lemma: the
            posTag: DET
            frequencyRank: 1
            isStop: true
            isPunct: false
        type: unit
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R003
        assert:
          returns: false
      - name: "Given a PUNCT token, when isContentWord is called, then returns false"
        target: DefaultContentWordFilter
        invoke:
          method: isContentWord
          args:
          - ref:punctToken
        fixtures:
        - id: punctToken
          type: NlpToken
          construct:
            text: .
            lemma: .
            posTag: PUNCT
            frequencyRank: 0
            isStop: false
            isPunct: true
        type: unit
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R003
        assert:
          returns: false
      visibility: public
      implements:
      - ContentWordFilter
    - name: DefaultIntervalCalculator
      tests:
      - name: "Given positions [10, 110], when calculateMeanInterval is called, then\
          \ returns 100.0"
        target: DefaultIntervalCalculator
        invoke:
          method: calculateMeanInterval
          args:
          - "[10, 110]"
        type: unit
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R007
        assert:
          returns: 100
      - name: "Given positions [0, 100, 200, 300], when calculateMeanInterval is called,\
          \ then returns 100.0"
        target: DefaultIntervalCalculator
        invoke:
          method: calculateMeanInterval
          args:
          - "[0, 100, 200, 300]"
        type: unit
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R007
        assert:
          returns: 100
      - name: "Given positions [10, 110] and mean 100.0, when calculateStdDevInterval\
          \ is called, then returns 0.0"
        target: DefaultIntervalCalculator
        invoke:
          method: calculateStdDevInterval
          args:
          - "[10, 110]"
          - 100
        type: unit
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R007
        assert:
          returns: 0
      - name: "Given positions [0, 100, 200, 300] and mean 100.0, when calculateStdDevInterval\
          \ is called, then returns 0.0"
        target: DefaultIntervalCalculator
        invoke:
          method: calculateStdDevInterval
          args:
          - "[0, 100, 200, 300]"
          - 100
        type: unit
        traceability:
          feature: FEAT-LREC
          rule: F-LREC-R007
        assert:
          returns: 0
      visibility: public
      implements:
      - IntervalCalculator
    - name: DefaultExposureClassifier
      visibility: public
      implements:
      - ExposureClassifier
  - name: labs
    description: "Lemma absence analysis by CEFR level. Compares course vocabulary\
      \ against the EVP catalog to detect absent, misplaced, or scattered lemmas.\
      \ Classifies absence type, assigns priority by COCA frequency, computes per-level\
      \ metrics, and generates actionable recommendations."
    visibility: internal
    models:
    - name: AbsenceType
      type: enum
      fields:
      - name: COMPLETELY_ABSENT
        type: double
        description: Lemma not found in any level — impact 1.0
      - name: APPEARS_TOO_LATE
        type: double
        description: Lemma only in levels after expected — impact 0.8
      - name: APPEARS_TOO_EARLY
        type: double
        description: Lemma found in at least one level before expected — impact 0.6
    - name: PriorityLevel
      type: enum
      fields:
      - name: HIGH
      - name: MEDIUM
      - name: LOW
    - name: LemmaAndPos
      type: record
      fields:
      - name: lemma
        type: String
        description: Base form of the word
      - name: pos
        type: String
        description: Part-of-speech tag
    - name: AbsentLemma
      type: record
      fields:
      - name: lemmaAndPos
        type: LemmaAndPos
        description: The absent lemma-POS pair
      - name: expectedLevel
        type: CefrLevel
        description: CEFR level where the lemma is expected per EVP
      - name: absenceType
        type: AbsenceType
        description: Classification of the absence
      - name: presentInLevels
        type: List<CefrLevel>
        description: Levels where the lemma does appear (may be empty)
      - name: priorityLevel
        type: PriorityLevel
        description: Priority based on COCA frequency rank
      - name: cocaRank
        type: Integer
        description: COCA frequency ranking (null if unavailable)
      - name: semanticCategory
        type: String
        description: Semantic topic from EVP catalog (nullable)
    - name: AbsenceAssessment
      type: enum
      fields:
      - name: OPTIMAL
        description: All levels within tolerance thresholds
      - name: ACCEPTABLE
        description: Some levels exceed thresholds but no critical level (A1/A2) exceeds
      - name: NEEDS_IMPROVEMENT
        description: At least one critical level (A1/A2) exceeds its threshold
    - name: LevelAbsenceMetrics
      type: record
      fields:
      - name: level
        type: CefrLevel
        description: CEFR level being measured
      - name: totalExpected
        type: int
        description: Number of EVP lemmas expected for this level
      - name: totalAbsent
        type: int
        description: Number of expected lemmas not found in this level
      - name: absencePercentage
        type: double
        description: "Percentage of absence: (absent/expected)*100"
      - name: absentLemmas
        type: List<AbsentLemma>
        description: Detailed list of absent lemmas with enrichment
      - name: score
        type: double
        description: "Level score: 1.0 - (absencePercentage/100) weighted by impact"
    - name: RecommendationAction
      type: enum
      fields:
      - name: ADD_VOCABULARY
        description: Add sentences containing completely absent lemmas
      - name: INTRODUCE_EARLIER
        description: Introduce lemmas in earlier levels where they are expected
      - name: REMOVE_FROM_LEVEL
        description: Remove or replace lemmas from levels where they appear too early
    - name: EffortLevel
      type: enum
      fields:
      - name: LOW
        description: 1-5 affected lemmas
      - name: MEDIUM
        description: 6-15 affected lemmas
      - name: HIGH
        description: 16+ affected lemmas
    - name: AbsenceRecommendation
      type: record
      fields:
      - name: action
        type: RecommendationAction
        description: Type of corrective action
      - name: description
        type: String
        description: Human-readable explanation of the problem and proposed fix
      - name: priority
        type: PriorityLevel
        description: "Recommendation priority (HIGH for A1/A2, varies for B1/B2)"
      - name: affectedLemmas
        type: List<AbsentLemma>
        description: Lemmas this recommendation addresses
      - name: effortLevel
        type: EffortLevel
        description: Estimated effort to implement
      - name: expectedImpact
        type: double
        description: Estimated score improvement if implemented
      - name: targetLevel
        type: CefrLevel
        description: CEFR level this recommendation targets
    - name: LemmaAbsenceCourseDiagnosis
      type: record
      fields:
      - name: assessment
        type: AbsenceAssessment
        description: "Global absence assessment for the course: OPTIMAL, ACCEPTABLE,\
          \ or NEEDS_IMPROVEMENT"
    - name: LemmaAbsenceLevelDiagnosis
      type: record
      fields:
      - name: level
        type: CefrLevel
        description: The CEFR level this diagnosis describes
      - name: totalExpected
        type: int
        description: Total lemmas expected at this CEFR level per EVP catalog
      - name: totalAbsent
        type: int
        description: Total lemmas absent from this level
      - name: absencePercentage
        type: double
        description: Percentage of expected lemmas that are absent
      - name: coverageTarget
        type: double
        description: Configured coverage target threshold for this level
      - name: completelyAbsentScore
        type: double
        description: Weighted score contribution from completely absent lemmas
      - name: tooLateScore
        type: double
        description: Weighted score contribution from lemmas appearing too late
      - name: tooEarlyScore
        type: double
        description: Weighted score contribution from lemmas appearing too early
      - name: assessment
        type: AbsenceAssessment
        description: Absence assessment for this specific level
      - name: absentLemmas
        type: List<AbsentLemma>
        description: Detailed list of each absent lemma with classification and priority
      - name: misplacedLemmas
        type: List<MisplacedLemma>
        description: Lemmas found at wrong levels relative to this level
      - name: highPriorityCount
        type: int
        description: Count of HIGH priority absent lemmas
      - name: mediumPriorityCount
        type: int
        description: Count of MEDIUM priority absent lemmas
      - name: lowPriorityCount
        type: int
        description: Count of LOW priority absent lemmas
    - name: LemmaPlacementDiagnosis
      type: record
      fields:
      - name: misplacedLemmaCount
        type: int
        description: Number of misplaced lemmas at this node
      - name: misplacedLemmas
        type: List<MisplacedLemma>
        description: Detailed list of each misplaced lemma
      - name: outOfCatalogWordCount
        type: int
        description: "Cantidad de palabras fuera de catalogo penalizadas en este nodo\
          \ (F-LABS-R034, R038). Simetrico a misplacedLemmaCount; 0 en reportes previos."
      - name: outOfCatalogWords
        type: List<OutOfCatalogWord>
        description: "Detalle de cada palabra fuera de catalogo que genero descuento,\
          \ con motivo expresado como ranking de frecuencia y sin nivel CEFR inventado\
          \ (F-LABS-R034, R038). Lista vacia cuando no hay penalizadas o en reportes\
          \ previos."
    - name: MisplacedLemma
      type: record
      fields:
      - name: lemmaAndPos
        type: LemmaAndPos
        description: The misplaced lemma-POS pair
      - name: expectedLevel
        type: CefrLevel
        description: CEFR level where the lemma should appear per EVP
      - name: foundInLevel
        type: CefrLevel
        description: CEFR level where the lemma was actually found
      - name: absenceType
        type: AbsenceType
        description: Classification of the misplacement (TOO_LATE or TOO_EARLY)
      - name: cocaRank
        type: Integer
        description: "COCA frequency ranking (nullable, null if unavailable)"
      - name: semanticCategory
        type: String
        description: Semantic topic from EVP catalog (nullable)
      - name: observedPos
        type: String
        description: Etiqueta POS del token observada en la oracion (F-LABS-R038).
          Puede diferir de lemmaAndPos.pos cuando el emparejamiento uso el fallback
          por lema de F-LABS-R036 (la entrada de catalogo elegida es la de menor nivel
          entre otras categorias). Nullable en reportes previos a F-LABS-R038.
      - name: discount
        type: Double
        description: "Descuento aplicado por distancia de nivel (0.1 por nivel, F-LABS-R018/R033)\
          \ que compitio en el maximo de F-LABS-R019 (F-LABS-R038). Nullable en reportes\
          \ serializados previos a F-LABS-R038."
    - name: OutOfCatalogWord
      type: record
      fields:
      - name: lemma
        type: String
        description: "Forma base de la palabra de contenido que no figura en el catalogo\
          \ bajo ninguna categoria gramatical, tras agotar el fallback por lema de\
          \ F-LABS-R036 (F-LABS-R034, R038)."
      - name: observedPos
        type: String
        description: "Etiqueta POS del token en la oracion (Universal Dependencies,\
          \ de NlpToken.posTag). Es la categoria observada, no una del catalogo: la\
          \ palabra no tiene entrada de catalogo (F-LABS-R038)."
      - name: frequencyRank
        type: Integer
        description: "Ranking de frecuencia del token (NlpToken.frequencyRank) evaluado\
          \ contra las bandas por nivel de F-LABS-R034. Nullable: sin ranking la palabra\
          \ cae siempre en la banda de descuento fuerte. NO se le inventa nivel CEFR\
          \ (F-LABS-R038)."
      - name: discount
        type: double
        description: "Descuento aplicado segun la banda de frecuencia del nivel de\
          \ la oracion (0.0 no ocurre: solo se registran palabras que generaron descuento).\
          \ Compite en el maximo de F-LABS-R019 (F-LABS-R038)."
    - name: SentenceLexicalScore
      type: record
      fields:
      - name: score
        type: double
        description: "Score de oracion (1.0 - max descuento, F-LABS-R019). Lo consume\
          \ el analyzer; la consulta CLI lo descarta."
      - name: misplacedLemmas
        type: List<MisplacedLemma>
        description: "Lemas mal ubicados para el nivel, con enriquecimiento completo\
          \ (discount/cocaRank/semanticCategory) para diagnoses del audit."
      - name: outOfCatalogWords
        type: List<OutOfCatalogWord>
        description: Palabras fuera de catalogo que penalizan en la banda del nivel
          (F-LABS-R034).
    interfaces:
    - name: SentenceLexicalScorer
      stereotype: port
      sealed: false
      exposes:
      - signature: "score(List<NlpToken> tokens, CefrLevel sentenceLevel): SentenceLexicalScore"
      visibility: public
    implementations:
    - name: LemmaByLevelAbsenceAnalyzer
      requiresInject:
      - name: evpCatalogPort
        type: EvpCatalogPort
      - name: contentWordFilter
        type: ContentWordFilter
      - name: lemmaAbsenceConfig
        type: LemmaAbsenceConfig
      - name: sentenceLexicalScorer
        type: SentenceLexicalScorer
      visibility: public
      handwrittenTests:
      - name: should return lemma-absence as analyzer name
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R031
      - name: should return COURSE as audit target
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R031
      - name: should return description text
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R031
      - name: should return empty results when no data processed
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R031
      - name: should obtain expected lemmas for each CEFR level from EVP catalog
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R001
      - name: should exclude multi-word phrases from expected lemmas
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R005
      - name: should exclude non-content words from expected lemmas
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R001
      - name: should include critical functional pronoun I in A1 expected lemmas despite
          filter rejection
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R016
      - name: should include critical functional auxiliary be in A2 expected lemmas
          despite filter rejection
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R016
      - name: should not apply critical functional override for B1 level
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R016
      - name: should not apply critical functional override for B2 level
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R016
      - name: should include all critical pronouns auxiliaries prepositions and connectors
          in A1
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R016
      - name: should collect present lemmas from quiz tokens per level
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R002
      - name: should collect present lemmas separately for each CEFR level
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R002
      - name: should count a lemma as present only once per level even if it appears
          multiple times
        traceability:
