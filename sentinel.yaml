  packages:
  - name: lemmasuggestion
    description: "Adaptador interno del puerto de consulta de SuggestedLemmas. Encapsula\
      \ la generación, filtrado y ranking de candidatos sin pasar por el cap fijo\
      \ del LemmaAbsenceContextResolver, para que el limit solicitado por el agente\
      \ sea respetado (F-CSLATDC-R011)."
    visibility: internal
    interfaces:
    - name: LeveledLemmaInventory
      stereotype: port
      sealed: false
      exposes:
