    - name: "Given nlpTokenizer throws exception during batch processing, when map\
        \ is called, then exception propagates"
      traceability:
        feature: FEAT-NLP
        rule: F-NLP-R008
    - name: should stamp quizSentence on AuditableQuiz by invoking QuizSentenceConverter.serialize
        on the same FormEntity used for sentences
