          \ reflects those new answers and variants parsed from the candidate's DSL"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R013
      - name: "Given the same elementBefore and the same candidate, when derive is\
          \ called twice, then both invocations return equal elementAfter snapshots\
          \ (determinism)"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R012
      - name: "Given a candidate whose quizSentence is malformed according to the\
          \ FEAT-QSENT grammar, when derive is called, then it throws ProposalDerivationException\
          \ and does not return a partial elementAfter"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R012
      - name: "Given a candidate that carries only quizSentence and translation, when\
          \ derive is called, then the deriver never asks the candidate for plain\
          \ sentence text or quizForm fields (the strategy emits only those two pieces)"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R019
      - name: should derive the revised quiz canonical phrase using the REWRITE mode
          it received so the revised phrase is the new answer only without the source
          sentence
        traceability:
          feature: FEAT-SMODE
          rule: F-SMODE-R006
      - name: should keep the length score of a REWRITE revision identical to the
          original when the revised answer conserves its token count
        traceability:
          feature: FEAT-SMODE
          rule: F-SMODE-R007
      - name: should keep the quiz title identical to the original instead of replacing
          it with the corrected sentence
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R014
      - name: "should keep the form kind, incidence, label and name and the empty\
          \ text of each blank identical to the original"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R014
      - name: "should keep on elementAfter the very same quiz title that elementBefore\
          \ carried, even when the derived plain sentence differs, because the title\
          \ is not in scope of a lexical correction"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R014
      implements:
      - LemmaAbsenceProposalDeriver
    - name: DefaultImpactPreviewComputer
      requiresInject:
      - name: courseMapper
        type: CourseMapper
        description: "Pure transformation CourseEntity -> AuditableCourse. The mapper\
          \ relies on NlpTokenizer (CPU-only via the spaCy adapter) and QuizSentenceConverter\
          \ (pure); it does NOT touch disk, which is what makes it valid for the in-memory\
          \ simulation."
      - name: auditEngine
        type: AuditEngine
        description: Pure function AuditableCourse -> AuditReport. Re-running it on
          the simulated course produces the 'after' tree without writing any official
          AuditReport (F-PIPRE-R002).
      - name: elementLocator
        type: CourseElementLocator
        description: "Used to apply the proposal in memory: replace(currentCourse,\
          \ proposal.elementAfter) and snapshot(simulatedCourse, ...) for the absence\
          \ check (F-PIPRE-R009 case 1)."
      - name: auditReportStore
        type: AuditReportStore
        description: Loads the latest AuditReport of the current course as the 'before'
          baseline. Failure to retrieve it maps to BASE_AUDIT_UNAVAILABLE (F-PIPRE-R009
          case 2).
      handwrittenTests:
      - name: "Dado un currentCourse y una RevisionProposal, cuando compute corre,\
          \ entonces no se invoca AuditReportStore.save y no se persiste ningun AuditReport\
          \ nuevo"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R002
      - name: "Dado un currentCourse y una RevisionProposal, cuando compute corre,\
          \ entonces el ScoreDelta.before de cada LevelImpact se calcula contra el\
          \ AuditReport baseline del curso recibido y no contra una version posterior"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R003
      - name: "Dada una RevisionProposal sobre un quiz contenido en knowledge, milestone,\
          \ topic y curso, cuando compute corre, entonces el ImpactPreview.levelImpacts\
          \ cubre la cadena jerarquica QUIZ -> KNOWLEDGE -> TOPIC -> MILESTONE ->\
          \ COURSE en orden de hoja a raiz"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R004
      - name: "Dada una RevisionProposal sobre un nodo cuyo arbol no contiene algun\
          \ nivel intermedio, cuando compute corre, entonces los niveles ausentes\
          \ se omiten en lugar de reportarse como cero en levelImpacts"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R004
      - name: "Dada una RevisionProposal cuyo elementAfter afecta multiples analyzers,\
          \ cuando compute corre, entonces el LevelImpact correspondiente expone un\
          \ DimensionDelta por cada analyzer evaluado en ese nivel"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R005
      - name: "Dado un nivel donde un analyzer no aporta diagnosticos, cuando compute\
          \ corre, entonces ese analyzer se omite de dimensionDeltas en lugar de reportarse\
          \ con delta cero"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R005
      - name: "Dado un ScoreDelta producido por compute para cualquier (nivel, dimension),\
          \ entonces los tres campos before, after y difference estan presentes y\
          \ difference es exactamente after menos before"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R006
      - name: "Dada una RevisionProposal cuyo nodeId no se localiza en el currentCourse\
          \ al simular, cuando compute corre, entonces retorna un ImpactPreview con\
          \ availability UNAVAILABLE, reason TARGET_NODE_ABSENT y detail no vacio\
          \ identificando el nodeId ausente"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R009
      - name: "Dado que AuditReportStore no puede recuperar la auditoria base del\
          \ curso actual, cuando compute corre, entonces retorna un ImpactPreview\
          \ con availability UNAVAILABLE, reason BASE_AUDIT_UNAVAILABLE y detail no\
          \ vacio explicando la causa"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R009
      - name: "Dado que AuditEngine falla al recomputar scores sobre el curso simulado,\
          \ cuando compute corre, entonces retorna un ImpactPreview con availability\
          \ UNAVAILABLE, reason SIMULATION_FAILED y detail no vacio explicando la\
          \ causa"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R009
      - name: "Dadas dos RevisionProposal distintas con el mismo currentCourse, cuando\
          \ compute corre dos veces, entonces produce dos ImpactPreview independientes\
          \ con proposalId distinto y sin compartir levelImpacts entre ambos"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R011
      - name: "Dada una RevisionProposal cuyo elementBefore y elementAfter referencian\
          \ el mismo nodeId estable, cuando compute corre, entonces el LevelImpact\
          \ del nodo objetivo conserva ese nodeId en before y after sin modelar renombres\
          \ ni reubicaciones"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R012
      implements:
      - ImpactPreviewComputer
    - name: DefaultConsolidatedViewBuilderFactory
      types:
      - Component
      visibility: public
      implements:
      - ConsolidatedViewBuilderFactory
    - name: DefaultConsolidatedViewBuilder
      requiresInject:
      - name: revisionArtifactStore
        type: RevisionArtifactStore
        description: "listByPlan(activePlanId) y particionado por verdict: APPROVED\
          \ se aplica como aceptada (contribuye a consolidated y a NodeImpact.acceptedProposalIds);\
          \ PENDING_APPROVAL se aplica como pendiente sobre el consolidated (contribuye\
          \ a pendingProjection y a NodeImpact.pendingProposalId, o cae en NonApplicablePending\
          \ si choca); REJECTED se descarta y no contribuye a ningun campo de la salida\
          \ (F-CDIFF-R005)."
      - name: activeAnalysisSelectionStore
        type: ActiveAnalysisSelectionStore
        description: "Lee el par activo (auditId, planId). Si retorna Optional.empty,\
          \ el builder produce ConsolidatedView con availability=UNAVAILABLE/reason=NO_ACTIVE_ANALYSIS\
          \ y nodeImpacts/statisticImpacts vacios (F-CDIFF-R013)."
      - name: auditReportStore
        type: AuditReportStore
        description: "Carga el AuditReport baseline correspondiente al activeAuditId.\
          \ NUNCA se invoca .save sobre este store; el builder solo lee (F-CDIFF-R015).\
          \ Si la carga falla por inconsistencia, contribuye a availability=UNAVAILABLE/reason=INCONSISTENT_PROPOSAL\
          \ o REAGGREGATION_FAILED segun la causa."
      - name: refinementPlanStore
        type: RefinementPlanStore
        description: "Resuelve activePlanId dentro del activeAuditId. Si no se ubica,\
          \ availability=UNAVAILABLE/reason=ACTIVE_PLAN_UNAVAILABLE (F-CDIFF-R013).\
          \ NUNCA se invoca .save sobre este store (F-CDIFF-R015)."
      - name: courseRepository
        type: CourseRepository
        description: Carga CourseEntity desde coursePath para que courseElementLocator
          pueda resolver snapshots y replaces sobre el subarbol vigente.
      - name: courseElementLocator
        type: CourseElementLocator
        description: "snapshot(courseEntity, nodeId) y replace(courseEntity, elementAfter)\
          \ para aplicar aceptadas y simular pendientes en memoria. Si snapshot retorna\
          \ empty para un nodeId referenciado por una pendiente, esa pendiente cae\
          \ en NonApplicablePending con reason=NODE_ABSENT (F-CDIFF-R012)."
      - name: courseMapper
        type: CourseMapper
        description: "Pure transformation CourseEntity -> AuditableCourse, requerido\
          \ como input al re-correr AuditEngine sobre el subarbol modificado para\
          \ re-agregar metricas de padres con la estrategia del analizador (F-CDIFF-R008)."
      - name: auditEngine
        type: AuditEngine
        description: "Re-corre runAudit sobre AuditableCourse derivado del curso post-aceptadas\
          \ (consolidated) y post-pendientes (pendingProjection). Si la re-agregacion\
          \ falla, availability=UNAVAILABLE/reason=REAGGREGATION_FAILED (F-CDIFF-R013)."
      - name: nodeFieldDiffer
        type: NodeFieldDiffer
        description: "F-CDIFF-R019/R020/R022/R023: el motor de descubrimiento dinamico\
          \ que reemplaza la logica v2 de snapshots crudos + collectStatisticImpacts.\
          \ El builder le pasa los tres AuditNode (baseline / consolidated / pendingProjection)\
          \ por cada nodeTarget+nodeId tocado, y obtiene el mapa { fieldPath → FieldChange\
          \ } que copia tal cual a NodeImpact.fieldChanges. El builder NO interpreta\
          \ el contenido del mapa; es la frontera entre 'que campos cambiaron' (R019)\
          \ y 'que decisiones del plan los provocaron' (R011)."
      types:
      - Component
      handwrittenTests:
      - name: "Dada una seleccion activa con auditId y planId resolubles, cuando build\
          \ corre, entonces ConsolidatedView.activeAuditId y activePlanId coinciden\
          \ con los identificadores leidos del ActiveAnalysisSelectionStore"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R001
      - name: "Dado un par activo cuyo planId no se puede ubicar dentro del analisis\
          \ (RefinementPlanStore retorna empty), cuando build corre, entonces ConsolidatedView.availability\
          \ es UNAVAILABLE con reason ACTIVE_PLAN_UNAVAILABLE"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R013
      - name: "Dada una propuesta aceptada que referencia un nodeId no encontrado\
          \ por CourseElementLocator al re-agregar, cuando build corre, entonces ConsolidatedView.availability\
          \ es UNAVAILABLE con reason INCONSISTENT_PROPOSAL"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R013
      - name: "Dado que AuditEngine falla al recomputar agregaciones sobre el subarbol\
          \ modificado, cuando build corre, entonces ConsolidatedView.availability\
          \ es UNAVAILABLE con reason REAGGREGATION_FAILED"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R013
      - name: "Dada cualquier invocacion de build (exitosa, UNAVAILABLE o con pendientes\
          \ no aplicables), entonces no se invoca AuditReportStore.save, RefinementPlanStore.save\
          \ ni RevisionArtifactStore.save sobre los stores inyectados"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R015
      - name: "Dado un AuditReport cuyo plan activo no tiene propuestas aceptadas\
          \ ni pendientes, cuando build corre, entonces nodeImpacts queda vacio (no\
          \ hay nodos afectados que reportar) — R003"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R003
      - name: "Dado un plan activo de un analisis viejo con propuestas pendientes\
          \ y un analisis mas nuevo cuyo plan no las contiene, cuando build corre\
          \ apuntando al analisis viejo, entonces sus pendientes dormidas aparecen\
          \ como pendingProposalIds y como contribuciones a la foto pendingProjection\
          \ de los fields tocados en nodeImpacts — R004"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R004
      - name: "Dado un RevisionArtifact con verdict REJECTED en el plan activo, cuando\
          \ build corre, entonces ese proposalId no aparece en nodeImpacts (ni en\
          \ acceptedProposalIds ni en pendingProposalIds de ningun nodo) ni en nonApplicablePendings,\
          \ y no contribuye a las fotos original/consolidated/pendingProjection de\
          \ ningun field — R005"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R005
      - name: "Dado que el ActiveAnalysisSelectionStore retorna Optional.empty, cuando\
          \ build corre, entonces ConsolidatedView.availability es UNAVAILABLE con\
          \ reason NO_ACTIVE_ANALYSIS y nodeImpacts queda vacio — R013"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R013
      - name: "Dado un plan activo asociado a un AuditReport y un plan ajeno con propuestas\
          \ distintas asociadas a otro analisis, cuando build corre, entonces solo\
          \ se consultan los RevisionArtifact via listByPlan(activePlanId) y las propuestas\
          \ del plan ajeno no aparecen en nodeImpacts (ni como acceptedProposalIds,\
          \ pendingProposalIds, ni como contribuciones a las fotos de fields) — R017"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R017
      - name: "Dado un nodo hoja con un field cuyas tres fotos son identicas y otro\
          \ field cuya foto consolidated difiere de original, cuando build corre,\
          \ entonces el mapa fieldChanges del NodeImpact contiene SOLO la entrada\
          \ del segundo field — R006 invariante 1: solo fields con cambio"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R006
      - name: "Dado un NodeImpact con varios fields cambiados de origenes distintos\
          \ (componente de diagnostico tipado, contenido del nodo, score escalar),\
          \ cuando build corre, entonces todas las entradas del mapa fieldChanges\
          \ siguen la misma forma clave-valor con FieldChange(original, consolidated,\
          \ pendingProjection) sin ramas separadas por origen del field — R006 invariante\
          \ 2: forma uniforme"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R006
      - name: "Dado un nodo cuyo subarbol no produce ningun field cambiado entre las\
          \ tres fotos, cuando build corre, entonces ese nodo NO aparece en ConsolidatedView.nodeImpacts\
          \ — R006 invariante 3: nodo sin cambios no aparece"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R006
      - name: "Dado un field cambiado de un nodo hoja, cuando build corre, entonces\
          \ FieldChange.original es identico al valor que el AuditReport baseline\
          \ expone para ese field y ese nodo (sin recomputar, sin redondear, sin derivar)\
          \ — R007 invariante 1: fidelidad de original"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R007
      - name: "Dado un escenario donde el AuditEngine es invocado dos veces (una sobre\
          \ el arbol con-aceptadas y otra sobre el arbol con-aceptadas-y-pendientes),\
          \ cuando build corre, entonces FieldChange.consolidated coincide identicamente\
          \ con el valor que el AuditReport del primer runAudit dejo en el AuditNode\
          \ correspondiente, sin que el builder lo recompute o transforme — R007 invariante\
          \ 2: determinacion de consolidated"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R007
      - name: "Dado un escenario donde el AuditEngine es invocado dos veces (una sobre\
          \ el arbol con-aceptadas y otra sobre el arbol con-aceptadas-y-pendientes),\
          \ cuando build corre, entonces FieldChange.pendingProjection coincide identicamente\
          \ con el valor que el AuditReport del segundo runAudit dejo en el AuditNode\
          \ correspondiente, sin que el builder lo recompute o derive desde consolidated\
          \ — R007 invariante 3: determinacion de pendingProjection"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R007
      - name: "Dado un nodo hoja con una aceptada (que cambia el field) y una pendiente\
          \ sobre el mismo nodeId (que lo cambia de nuevo), cuando build corre, entonces\
          \ el AuditEngine es invocado para pendingProjection sobre el arbol que YA\
          \ tiene la aceptada aplicada (no sobre el original) — R007 invariante 4:\
          \ orden de stacking, pendientes sobre consolidated, no sobre original"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R007
      - name: "Dado un nodo padre cuyo subarbol contiene cambios y para el cual el\
          \ AuditEngine produjo un valor agregado en el AuditReport del arbol con-aceptadas,\
          \ cuando build corre, entonces FieldChange.consolidated del field del padre\
          \ es identico a ese valor leido del AuditReport y NO el resultado de re-agregar\
          \ deltas de hijos en el builder — R007 invariante 5: las tres fotos provienen\
          \ del motor"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R007
      - name: "Dado un escenario donde varias dimensiones de score cambian por aceptadas\
          \ o pendientes, cuando build corre, entonces ConsolidatedView devuelto NO\
          \ expone ningun campo statisticImpacts ni ninguna lista paralela de estadisticas\
          \ afectadas; los scores cambiados solo aparecen como entradas del mapa fieldChanges\
          \ del nodo correspondiente — R009"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R009
      - name: "Dado cualquier ConsolidatedView producido por build, entonces ningun\
          \ NodeImpact expone campos acceptedDelta o pendingDelta precomputados; el\
          \ contrato emitido contiene exclusivamente las tripletas (original, consolidated,\
          \ pendingProjection) por field — R010"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R010
      - name: "Dada una propuesta APPROVED del plan activo que cambia el contenido\
          \ de un nodo y otra APPROVED del plan activo que NO afecta a ese nodo, cuando\
          \ build corre, entonces NodeImpact.acceptedProposalIds del nodo afectado\
          \ contiene SOLO el proposalId de la primera (R011 invariante 1: cobertura\
          \ accepted, recíproca incluida)"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R011
      - name: "Dada una propuesta PENDING_APPROVAL aplicable del plan activo que cambia\
          \ un nodo y otra PENDING_APPROVAL aplicable que NO afecta a ese nodo, cuando\
          \ build corre, entonces NodeImpact.pendingProposalIds del nodo afectado\
          \ contiene SOLO el proposalId de la primera (R011 invariante 2: cobertura\
          \ pending, recíproca incluida)"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R011
      - name: "Dado un nodo hoja con dos propuestas aceptadas que lo afectaron en\
          \ orden createdAt ascendente, cuando build corre, entonces NodeImpact.acceptedProposalIds\
          \ contiene ambos proposalId en orden createdAt ascendente — R011 invariante\
          \ 3: orden estable"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R011
      - name: "Dado un nodo afectado con varias aceptadas y varias pendientes que\
          \ tocan distintos fields, cuando build corre, entonces NodeImpact expone\
          \ acceptedProposalIds y pendingProposalIds a nivel del NODO (no asocia un\
          \ proposalId a un field especifico dentro de fieldChanges) — R011 invariante\
          \ 4: trazabilidad por nodo, no por field"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R011
      - name: "Dado un plan activo con multiples propuestas (varias APPROVED y varias\
          \ PENDING_APPROVAL) que tocan distintos nodos, cuando build corre una sola\
          \ vez, entonces ConsolidatedView retornado expone los efectos de TODAS esas\
          \ propuestas en una unica salida (acceptadas en las fotos consolidated y\
          \ pendientes aplicables en las fotos pendingProjection) sin requerir invocaciones\
          \ adicionales del builder — R016 invariante 1: combinacion en un documento"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R016
      - name: "Given an APPROVED quiz proposal whose KNOWLEDGE ancestor has an aggregate\
          \ score that differs across the baseline, consolidated and pending AuditReports,\
          \ when build runs, then nodeImpacts contains a NodeImpact with nodeTarget=KNOWLEDGE\
          \ whose fieldChanges carries the tripleta (original, consolidated, pendingProjection)\
          \ read verbatim from the KNOWLEDGE AuditNode of each AuditReport — R007\
          \ invariante 5: la foto del padre proviene del motor, FEAT-CDIFF la copia\
          \ del AuditNode correspondiente sin recomputar"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R007
      implements:
      - ConsolidatedViewBuilder
    - name: KnowledgeTitleReviser
      requiresInject:
      - name: strategyRegistry
        type: KnowledgeTitleProposalStrategyRegistry
        description: Resuelve la KnowledgeTitleProposalStrategy activa; las tareas
          KNOWLEDGE_TITLE_LENGTH se enrutan aca en vez de caer al IdentityReviser
          bypass (F-KTLR-R003).
      - name: deriver
        type: KnowledgeTitleProposalDeriver
        description: "Deriva elementAfter de forma determinista desde un KnowledgeTitleCandidate\
          \ mapeando title->label + instructions sobre una copia del knowledge before\
          \ (F-KTLR-R005, R006, R007)."
      handwrittenTests:
      - name: "Given a KNOWLEDGE_TITLE_LENGTH task and an active title strategy, when\
          \ propose runs, then the title agent is invoked with the knowledge context\
          \ and its output feeds the proposal, not the identity behavior"
        traceability:
          feature: FEAT-KTLR
          rule: F-KTLR-R003
      - name: "Given a candidate produced by the strategy, when propose builds the\
          \ proposal, then the before state carries the knowledge current title and\
          \ instructions and the after state carries the candidate title and instructions"
        traceability:
          feature: FEAT-KTLR
          rule: F-KTLR-R005
      - name: "Given a KNOWLEDGE_TITLE_LENGTH task and a strategy that fails to produce\
          \ a valid candidate, when propose runs, then no proposal is built and the\
          \ failure is surfaced without touching the course"
        traceability:
          feature: FEAT-KTLR
          rule: F-KTLR-R010
      implements:
      - Reviser
    - name: DefaultKnowledgeTitleProposalStrategyRegistry
      requiresInject:
      - name: config
        type: KnowledgeTitleProposalStrategyRegistryConfig
      visibility: public
      implements:
      - KnowledgeTitleProposalStrategyRegistry
    - name: DefaultKnowledgeTitleProposalDeriver
      visibility: public
      handwrittenTests:
      - name: "Given a before snapshot of a knowledge and a candidate, when derive\
          \ runs, then the resulting knowledge changes only label and instructions\
          \ and preserves id, quizzes, order and the rest of the hierarchy"
        traceability:
          feature: FEAT-KTLR
          rule: F-KTLR-R007
      implements:
      - KnowledgeTitleProposalDeriver
  - name: lemmaabsence
    description: "Proposal-strategy SPI for LEMMA_ABSENCE. Public so the composition\
      \ root and revision-infrastructure can both instantiate strategies and the canned\
      \ generator and pass them into the registry builder. Houses: the candidate-generator\
      \ port (LemmaAbsenceQuizCandidateGenerator) plus its raw response carrier (LemmaAbsenceGeneratorResponse),\
      \ the MVP strategy that delegates to the port (LemmaAbsenceMvpStrategy) and\
      \ stamps the providerId injected at construction onto every StrategyId it emits\
      \ (F-LAGEN-R009), and the canned generator kept as an offline fallback for CONTENT_AUDIT_LAGEN_MODE=canned\
      \ (DOUBT-CANNED-MODE-AVAILABILITY -> Option B, CannedLemmaAbsenceQuizCandidateGenerator).\
      \ Renamed from 'strategy' to 'lemmaabsence' so the package name describes the\
      \ sub-domain it encapsulates instead of a GoF pattern label. The LlmGenerationFailureCategory\
      \ enum lives in revision-infrastructure.lagen because revision-domain has zero\
      \ consumers of it (no port mentions it; ProposalStrategyFailedException.reason\
      \ is a free String that the adapter prefixes with the enum name)."
    visibility: public
    models:
    - name: LemmaAbsenceGeneratorResponse
      type: record
      fields:
      - name: quizSentence
        type: String
        description: Candidate expressed in the FEAT-QSENT quizSentence DSL; raw generator
          output before wrapping.
      - name: translation
        type: String
        description: Spanish translation of the candidate.
      visibility: public
    interfaces:
    - name: LemmaAbsenceQuizCandidateGenerator
      stereotype: port
      sealed: false
      exposes:
      - signature: "generate(LemmaAbsenceCorrectionContext context): LemmaAbsenceGeneratorResponse"
      visibility: public
    implementations:
    - name: LemmaAbsenceMvpStrategy
      requiresInject:
      - name: generator
        type: LemmaAbsenceQuizCandidateGenerator
        description: "Candidate generator the strategy delegates to. The composition\
          \ root supplies either the canned generator (CONTENT_AUDIT_LAGEN_MODE=canned)\
          \ or an LLM-backed generator built by LemmaAbsenceLlmGeneratorFactory (default\
          \ mode, F-LAGEN-R013)."
      - name: providerId
        type: String
        description: "Provider identifier stamped onto every StrategyId this strategy\
          \ emits (F-LAGEN-R009). Supplied by the composition root: in LLM mode it\
          \ is LemmaAbsenceLlmGeneratorFactory.providerIdFor(LagenConfig) (format\
          \ 'providerName:modelId' per DOUBT-PROVIDER-ID-FORMAT Option B); in canned\
          \ mode the operator picks a stable string. Required (the strategy never\
          \ invents a default) so the provenance recorded on every persisted RevisionProposal\
          \ matches what the operator configured."
      types:
      - Component
      visibility: public
      handwrittenTests:
      - name: should stamp StrategyId.name = 'lemma-absence-llm' on every produced
          proposal
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R001
      - name: should stamp StrategyId.providerId from the injected generator's provider
          on every proposal
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R009
      - name: should produce a LemmaAbsenceQuizCandidate by consuming exclusively
          the CorrectionContext fields (quizSentence translation knowledgeTitle knowledgeInstructions
          topicLabel cefrLevel misplacedLemmas suggestedLemmas) and never reading
          directly from AuditReport or the diagnoses tree
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R007
      - name: should return exactly one LemmaAbsenceQuizCandidate per single propose
          invocation without ever surfacing multiple alternatives for the operator
          to choose from
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R008
      - name: "should produce a LemmaAbsenceQuizCandidate that carries exactly two\
          \ fields: a quizSentence string and a translation string with both populated\
          \ and no other element-level field present on the candidate"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R009
      - name: should not require successive invocations on the same RefinementTask
          to return equal candidates documenting that the strategy is non-deterministic
          by contract
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R010
      - name: should emit only a candidate whose quizSentence is a string in the FEAT-QSENT
          DSL grammar plus a translation string so that the strategy never returns
          plain sentence text quizForm parts or a fully built elementAfter
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R011
      - name: should not invoke any CEFR-level validator on the produced candidate's
          quizSentence so that even when the generator returns vocabulary above cefrLevel
          the strategy returns the candidate as-is without filtering
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R017
      - name: should not apply any length limit to the produced candidate's quizSentence
          so that even an unusually short or unusually long candidate is returned
          as-is without rejection
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R018
      implements:
      - LemmaAbsenceProposalStrategy
    - name: CannedLemmaAbsenceQuizCandidateGenerator
      requiresInject:
      - name: cannedQuizSentence
        type: String
        description: "Fixed quizSentence in the FEAT-QSENT DSL returned for every\
          \ invocation. Used in offline/test mode (CONTENT_AUDIT_LAGEN_MODE=canned)\
          \ where no LLM provider is available. DOUBT-CANNED-MODE-AVAILABILITY ->\
          \ Option B (kept as opt-in, never default)."
      - name: cannedTranslation
        type: String
        description: Fixed Spanish translation paired with cannedQuizSentence.
      types:
      - Component
      visibility: public
      handwrittenTests:
      - name: "generate returns the same (cannedQuizSentence, cannedTranslation) pair\
          \ on every invocation"
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R012
      - name: generate returns the injected cannedQuizSentence and cannedTranslation
          verbatim with no transformation
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R012
      - name: "generate returns the same response regardless of differences in the\
          \ LemmaAbsenceCorrectionContext (quizSentence, cefrLevel, misplacedLemmas,\
          \ suggestedLemmas)"
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R012
      - name: generate performs no I/O and never contacts an external provider
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R012
      implements:
      - LemmaAbsenceQuizCandidateGenerator
  - name: impactpreview
    description: "Public SPI for the impact preview of a RevisionProposal (FEAT-PIPRE).\
      \ Houses the eager what-if contract (ImpactPreviewComputer port) and every carrier\
      \ the operator-facing rendering needs to read: the diff tree (ImpactPreview,\
      \ LevelImpact, DimensionDelta, ScoreDelta), the availability tagging (ImpactPreviewAvailability,\
      \ ImpactPreviewUnavailability) and the closed taxonomy of unavailability causes\
      \ (ImpactPreviewUnavailabilityReason). The persistence port (ImpactPreviewStore)\
      \ lives at the module root next to RevisionArtifactStore so the audit-infrastructure\
      \ adapter can target it with the same Public Port + Hidden Adapter shape it\
      \ already uses for revision artifacts. Public so audit-cli can render the preview\
      \ alongside each proposal. Kept inside revision-domain because every carrier\
      \ is pure data over revision-domain types (AuditTarget, RevisionProposal) and\
      \ the computer only needs the audit engine that revision-domain already accepts\
      \ via dependsOn."
    visibility: public
    models:
    - name: ImpactPreviewAvailability
      type: enum
      fields:
      - name: AVAILABLE
        description: "The computer succeeded; deltas at every reported (level,dimension)\
          \ pair are populated (F-PIPRE-R004, F-PIPRE-R005, F-PIPRE-R006)."
      - name: UNAVAILABLE
        description: "The computer could not produce deltas; ImpactPreview.unavailability\
          \ carries the explicit cause (F-PIPRE-R009). NOT the same as 'no change\
          \ detected', which is AVAILABLE with all-zero differences (F-PIPRE-R009\
          \ detail 2)."
      visibility: public
    - name: ImpactPreviewUnavailabilityReason
      type: enum
      fields:
      - name: TARGET_NODE_ABSENT
        description: "The proposal's nodeId could not be located in the course at\
          \ preview time (F-PIPRE-R009 case 1, F-PIPRE-J003)."
      - name: BASE_AUDIT_UNAVAILABLE
        description: The AuditReport corresponding to the current course state could
          not be obtained as the 'before' baseline (F-PIPRE-R009 case 2).
      - name: SIMULATION_FAILED
        description: "Producing the simulated course (replace + map + audit) failed\
          \ for any reason other than the two above: AuditEngine threw, the mapper\
          \ rejected the simulated entity, or the simulated tree is structurally inconsistent\
          \ (F-PIPRE-R009 case 3)."
      - name: OTHER
        description: Any other unanticipated failure during preview computation. Detail
          string carries the human-readable cause.
      visibility: public
    - name: ImpactPreviewUnavailability
      type: record
      fields:
      - name: reason
        type: ImpactPreviewUnavailabilityReason
        description: "Closed-set category, mirroring how F-LAGEN-R006 / LlmGenerationFailureCategory\
          \ carry filterable taxonomies."
      - name: detail
        type: String
        description: "Free-text human-readable explanation suitable for stderr / archived\
          \ logs (F-PIPRE-R009 detail 4: 'la causa registrada es texto legible para\
          \ el operador')."
      visibility: public
    - name: ScoreDelta
      type: record
      fields:
      - name: before
        type: double
        description: Score on the current course (domain scale 0..1 per F-PIPRE-R006
          detail 2).
      - name: after
        type: double
        description: Score on the simulated course with elementAfter applied (domain
          scale 0..1).
      - name: difference
        type: double
        description: "after minus before. Carried explicitly so consumers do not re-derive\
          \ the sign (F-PIPRE-R006 detail 1). Operator-facing percentage rendering\
          \ (F-PIPRE-R013) is the formatter's responsibility, not the model's."
      visibility: public
    - name: DimensionDelta
      type: record
      fields:
      - name: dimension
        type: String
        description: "Analyzer name (the same key used in AuditNode.scores, e.g. 'lemma-absence',\
          \ 'sentence-length', 'coca-buckets-distribution'). F-PIPRE-R005 'discrimina\
          \ por dimension'. Open-ended String rather than enum because dimensions\
          \ are analyzer-defined and grow with each FEAT-D* / new analyzer."
      - name: delta
        type: ScoreDelta
        description: "before/after/difference for this analyzer at the enclosing level\
          \ (F-PIPRE-R005, F-PIPRE-R006)."
      visibility: public
    - name: LevelImpact
      type: record
      fields:
      - name: nodeTarget
        type: AuditTarget
        description: "Hierarchy level: COURSE/MILESTONE/TOPIC/KNOWLEDGE/QUIZ (F-PIPRE-R004)."
      - name: nodeId
        type: String
        description: Identifier of the reported node. For COURSE level the AuditReport's
          root id is used.
      - name: aggregateDelta
        type: ScoreDelta
        description: "before/after/difference of the level's aggregate score (the\
          \ same aggregate the auditor reports at this node, e.g. AuditReportSummary.overallScore\
          \ for the course root)."
      - name: dimensionDeltas
        type: List<DimensionDelta>
        description: "One entry per analyzer that produces a score at this level.\
          \ F-PIPRE-R005 detail 3: levels where a dimension is not evaluated must\
          \ omit it, not fabricate a zero delta."
      visibility: public
    - name: ImpactPreview
      type: record
      fields:
      - name: proposalId
        type: String
        description: 1:1 association with the originating RevisionProposal.proposalId
          (F-PIPRE-R001 detail 2). Stable across reads; never reused across proposals
          (DOUBT-PROPOSAL-LIFECYCLE -> Option A).
      - name: computedAt
        type: Instant
        description: Timestamp when the preview was computed. Mirrors the eager 'one
          shot at proposal time' contract of F-PIPRE-R001 detail 1.
      - name: availability
        type: ImpactPreviewAvailability
        description: "AVAILABLE -> levelImpacts populated, unavailability null. UNAVAILABLE\
          \ -> levelImpacts empty, unavailability populated (F-PIPRE-R009)."
      - name: unavailability
        type: ImpactPreviewUnavailability
        description: Populated when availability=UNAVAILABLE; null when AVAILABLE.
          Carries the closed-set reason plus a human-readable detail (F-PIPRE-R009).
      - name: levelImpacts
        type: List<LevelImpact>
        description: "Ordered chain from leaf (proposal's nodeTarget) up to COURSE\
          \ root (F-PIPRE-R004). Intermediate levels that do not exist for the targeted\
          \ node are omitted, not zero-padded (F-PIPRE-R004 detail). Empty list when\
          \ availability=UNAVAILABLE."
      visibility: public
    interfaces:
    - name: ImpactPreviewComputer
      stereotype: port
      sealed: false
      exposes:
      - signature: "compute(CourseEntity currentCourse, RevisionProposal proposal):\
          \ ImpactPreview"
      visibility: public
      glossarySuggestions:
      - name: Impact Preview
        technicalName: ImpactPreview
        kind: domain-service-candidate
        basedOn: revision-domain/impactpreview/ImpactPreviewComputer
        derivedFrom:
        - Revision Proposal
        - Audit Report
        rationale: |
          FEAT-PIPRE introduces the simulated 'what-if' projection of a proposal as a first-class capability of the revision domain. Worth adopting as a canonical term once the analyst has reviewed the language.
  - name: consolidatedview
    description: "FEAT-CDIFF v3. Public SPI for the consolidated structure that combines\
      \ the baseline of an AuditReport with the effects of accepted and pending proposals\
      \ of its active plan. Houses the builder port (ConsolidatedViewBuilder) plus\
      \ its factory (ConsolidatedViewBuilderFactory) and every carrier the CLI rendering\
      \ needs to read: the root document (ConsolidatedView), the per-node impact (NodeImpact\
      \ carrying a uniform map of field-level changes), the field-change carrier (FieldChange\
      \ triple), the field path (FieldPath), the non-applicable pending list (NonApplicablePending),\
      \ the availability tagging (ConsolidatedViewAvailability + ConsolidatedViewUnavailability)\
      \ and the closed taxonomies (ConsolidatedViewUnavailabilityReason, NonApplicablePendingReason).\
      \ The previous StatisticImpact carrier disappeared in v3 (R009: scores are just\
      \ fields of the map)."
    visibility: public
    models:
    - name: ConsolidatedViewAvailability
      type: enum
      fields:
      - name: AVAILABLE
        description: Construccion exitosa; nodeImpacts/statisticImpacts pueden estar
          vacios si ninguna propuesta afecta nada.
      - name: UNAVAILABLE
        description: "Construccion fallida; unavailability carga (categoria, detalle)\
          \ explicita. F-CDIFF-R013."
      visibility: public
    - name: ConsolidatedViewUnavailabilityReason
      type: enum
      fields:
      - name: NO_ACTIVE_ANALYSIS
        description: El curso no tiene par activo seleccionado o el auditId activo
          no existe.
      - name: ACTIVE_PLAN_UNAVAILABLE
        description: "El planId activo no se puede ubicar dentro del analisis (referencia\
          \ rota, archivo ausente)."
      - name: INCONSISTENT_PROPOSAL
        description: Una propuesta aceptada referencia un nodeId que no se encuentra
          en el subarbol al momento de re-agregar.
      - name: REAGGREGATION_FAILED
        description: El motor no puede recomputar el agregado sobre el subarbol modificado
          por las propuestas.
      - name: OTHER
        description: "Cualquier otra causa, con detalle textual obligatorio en ConsolidatedViewUnavailability.detail."
      visibility: public
    - name: ConsolidatedViewUnavailability
      type: record
      fields:
      - name: reason
        type: ConsolidatedViewUnavailabilityReason
        description: Categoria cerrada de la causa.
      - name: detail
        type: String
        description: "Texto legible para el operador. F-CDIFF-R013 message: 'Estructura\
          \ consolidada no disponible para el analisis <auditId>: <categoria> - <detalle>'."
      visibility: public
    - name: NonApplicablePendingReason
      type: enum
      fields:
      - name: NODE_ABSENT
        description: El nodeId de la pendiente no se encuentra en el subarbol vigente
          al momento de aplicar.
      - name: ELEMENT_BEFORE_MISMATCH
        description: El elementBefore de la pendiente ya no coincide con el consolidated
          del nodo (otra aceptada lo desplazo).
      - name: OTHER
        description: "Cualquier otra causa de no-aplicabilidad, con detalle textual."
      visibility: public
    - name: NonApplicablePending
      type: record
      fields:
      - name: proposalId
        type: String
        description: Id de la propuesta pendiente.
      - name: reason
        type: NonApplicablePendingReason
        description: Categoria cerrada de la causa.
      - name: detail
        type: String
        description: Texto legible explicativo.
      visibility: public
    - name: NodeImpact
      type: record
      fields:
      - name: nodeTarget
        type: AuditTarget
        description: "Nivel jerarquico del nodo: QUIZ (hoja), KNOWLEDGE/TOPIC/MILESTONE/COURSE\
          \ (padre)."
      - name: nodeId
        type: String
        description: Identificador del nodo afectado.
      - name: acceptedProposalIds
        type: List<String>
        description: "F-CDIFF-R007 detail 1. Lista de proposalId aceptados que afectaron\
          \ al nodo, ordenados por createdAt ascendente. Vacia si no hay aceptadas\
          \ sobre el nodo."
      - name: fieldChanges
        type: "Map<String,FieldChange>"
        description: "F-CDIFF-R006/R019/R023. Mapa de hojas escalares con cambio.\
          \ Clave: path estable producido por FieldPath (R023). Valor: tripleta (original,\
          \ consolidated, pendingProjection) producida por NodeFieldDiffer recorriendo\
          \ los tres AuditNode (R007 invariantes 1-3). Vacio si el nodo no tiene fields\
          \ que difieran entre al menos dos fotos modulo R020 — en ese caso el nodo\
          \ no se incluye en ConsolidatedView.nodeImpacts (R006 invariante 3)."
      - name: pendingProposalIds
        type: List<String>
        description: F-CDIFF-R011 invariante 2. Lista de proposalId con veredicto
          PENDING_APPROVAL aplicable del plan activo que afectaron al nodo (al contenido
          propio o al subarbol que contribuye a sus fotos). Vacia o nula si no hay
          pendientes aplicables que toquen este nodo. Reemplaza al campo singular
          pendingProposalId de v2 porque ahora un mismo nodo puede acumular varias
          pendientes aplicables sobre fields distintos.
      visibility: public
    - name: ConsolidatedView
      type: record
      fields:
      - name: activeAuditId
        type: String
        description: F-CDIFF-R001 detail 2. Id del AuditReport resuelto por ActiveAnalysisSelectionStore.read().
          null cuando availability=UNAVAILABLE con reason=NO_ACTIVE_ANALYSIS.
      - name: activePlanId
        type: String
        description: "F-CDIFF-R001 detail 2. Id del RefinementPlan activo. null cuando\
          \ availability=UNAVAILABLE con reason in {NO_ACTIVE_ANALYSIS, ACTIVE_PLAN_UNAVAILABLE}."
      - name: availability
        type: ConsolidatedViewAvailability
        description: AVAILABLE / UNAVAILABLE.
      - name: unavailability
        type: ConsolidatedViewUnavailability
        description: F-CDIFF-R013. Poblado cuando availability=UNAVAILABLE; null cuando
          AVAILABLE.
      - name: computedAt
        type: Instant
        description: "Timestamp de construccion (auditoria del documento, no afecta\
          \ semantica). Util para que el consumidor distinga lecturas sucesivas."
      - name: nodeImpacts
        type: List<NodeImpact>
        description: F-CDIFF-R006/R008. Un entry por nodo del curso afectado por al
          menos una aceptada o pendiente del plan activo. Vacio cuando availability=UNAVAILABLE;
          vacio tambien (pero AVAILABLE) cuando hay par activo pero ninguna propuesta
          afecta nodos.
      - name: nonApplicablePendings
        type: List<NonApplicablePending>
        description: "F-CDIFF-R012. Lista de pendientes que no se pudieron aplicar;\
          \ cada una con (proposalId, reason, detail). Se entrega aunque availability=AVAILABLE:\
          \ la presencia de pendientes no aplicables NO degrada la salida a UNAVAILABLE."
      visibility: public
    - name: FieldChange
      type: record
      fields:
      - name: original
        type: Object
        description: "F-CDIFF-R007.1. Valor de la hoja en el baseline del AuditReport,\
          \ copiado sin transformacion. null si la hoja no existe en el baseline."
      - name: consolidated
        type: Object
        description: "F-CDIFF-R007.2. Valor de la hoja en el AuditReport del subarbol\
          \ con-aceptadas, copiado sin transformacion. null si la hoja no existe en\
          \ el consolidated."
      - name: pendingProjection
        type: Object
        description: "F-CDIFF-R007.3. Valor de la hoja en el AuditReport del subarbol\
          \ con aceptadas+pendientes aplicables, copiado sin transformacion. null\
          \ si la hoja no existe en pendingProjection."
      visibility: public
    - name: FieldPath
      type: record
      fields:
      - name: raw
        type: String
        description: Representacion textual canonica de la clave del field. Es el
          valor que aparece como llave en NodeImpact.fieldChanges.
      visibility: public
    - name: FieldExclusionRole
      type: enum
      fields:
      - name: OPAQUE_PERSISTENCE_ID
        description: "F-CDIFF-R020.1. Identificadores opacos generados por la persistencia\
          \ (_id, $oid, formas equivalentes)."
      - name: STRUCTURAL_REFERENCE
        description: "F-CDIFF-R020.2. Referencias estructurales que el dominio mantiene\
          \ para navegacion (parentId, courseId, milestoneId, topicId, knowledgeId,\
          \ quizId cuando aparecen como referencia dentro de otro nodo, no como identidad\
          \ propia)."
      - name: TIMESTAMP
        description: "F-CDIFF-R020.3. Timestamps de creacion / actualizacion de cualquier\
          \ nivel del modelo (Instant, LocalDateTime sobre campos createdAt/updatedAt\
          \ y similares)."
      - name: INTERNAL_ORDER
        description: "F-CDIFF-R020.4. Ordenes derivados de la posicion en disco /\
          \ serializacion (indices de array de JSON, claves de orden, contadores que\
          \ el almacenamiento gestiona)."
      - name: NON_SEMANTIC
        description: "F-CDIFF-R020.5. Categoria escape: cualquier valor cuya diferencia\
          \ entre versiones no represente un cambio semantico observable y que no\
          \ caiga en las cuatro anteriores."
      visibility: public
    interfaces:
    - name: ConsolidatedViewBuilder
      stereotype: port
      sealed: false
      exposes:
      - signature: "build(Path coursePath): ConsolidatedView"
      visibility: public
    - name: ConsolidatedViewBuilderFactory
      stereotype: factory
      sealed: false
      exposes:
      - signature: "create(ConsolidatedViewBuilderConfig config): ConsolidatedViewBuilder"
      visibility: public
    - name: NodeFieldDiffer
      stereotype: port
      sealed: false
      exposes:
      - signature: "diff(AuditNode original, AuditNode consolidated, AuditNode pendingProjection):\
          \ Map<String,FieldChange>"
      visibility: public
  - name: fielddiff
    description: "F-CDIFF v3. Motor interno del descubrimiento dinamico de fields\
      \ cambiados que NodeFieldDiffer expone en su contrato publico. Aloja la implementacion\
      \ recursiva (RecursiveNodeFieldDiffer), los dos registros centrales que materializan\
      \ R020 y R022 sin contaminar los records de audit-domain / course-domain (FieldExclusionRegistry,\
      \ ListIdentityRegistry) y los carriers internos del recorrido (FieldExclusionRule,\
      \ ListIdentityRule, ListIdentityKeySpec). Solo la factory publica del motor\
      \ cruza la frontera; el resto es package-private. Empaquetado aparte de consolidatedview\
      \ porque la mecanica de diff es reutilizable: un futuro consumidor (p.ej. un\
      \ validador estructural de cursos, otro analizador) puede pedir el mismo NodeFieldDiffer\
      \ sin arrastrar la maquinaria del consolidado entero. El nombre fielddiff describe\
      \ el concepto (diferenciacion a nivel de field) y no un patron GoF."
    visibility: internal
    models:
    - name: FieldExclusionRule
      type: record
      fields:
      - name: declaringTypeName
        type: String
        description: "Nombre simple del tipo Java que declara el campo (p.ej. 'AuditableQuiz',\
          \ 'AuditNode', 'MisplacedLemma'). El motor matchea por nombre simple para\
          \ no acoplar el registry al package layout."
      - name: fieldName
        type: String
        description: "Nombre del campo a excluir (p.ej. 'id', 'parentId', 'createdAt')."
      - name: role
        type: FieldExclusionRole
        description: Rol funcional asignado. Sirve a tooling de auditoria del registry
          para revisar la coherencia de las exclusiones; el motor solo pregunta 'esta
          excluido?'.
      visibility: internal
    - name: ListIdentityKeySpec
      type: record
      fields:
      - name: fieldNames
        type: List<String>
        description: "Nombres de los campos que conforman la identidad natural del\
          \ elemento. Si la lista es vacia, el match no aplica y el motor cae en diff\
          \ posicional (R022 caso 2)."
      visibility: internal
    - name: ListIdentityRule
      type: record
      fields:
      - name: declaringTypeName
        type: String
        description: "Nombre simple del tipo Java que declara el campo lista (p.ej.\
          \ 'LemmaAbsenceLevelDiagnosis', 'CocaBucketsLevelDiagnosis')."
      - name: fieldName
        type: String
        description: "Nombre del campo lista (p.ej. 'absentLemmas', 'buckets', 'progressionAssessments')."
      - name: keySpec
        type: ListIdentityKeySpec
        description: Definicion de la clave natural a usar para diff por elemento.
      visibility: internal
    interfaces:
    - name: FieldExclusionRegistry
      stereotype: port
      sealed: false
      exposes:
      - signature: "isExcluded(String declaringTypeName, String fieldName): boolean"
      - signature: "getRole(String declaringTypeName, String fieldName): Optional<FieldExclusionRole>"
      visibility: internal
    - name: ListIdentityRegistry
      stereotype: port
      sealed: false
      exposes:
      - signature: "getKeySpec(String declaringTypeName, String fieldName): Optional<ListIdentityKeySpec>"
      visibility: internal
    - name: NodeFieldDifferFactory
      stereotype: factory
      sealed: false
      exposes:
      - signature: "create(): NodeFieldDiffer"
      visibility: public
    implementations:
    - name: RecursiveNodeFieldDiffer
      requiresInject:
      - name: exclusionRegistry
        type: FieldExclusionRegistry
        description: Consultado para cada hoja antes de emitirla. R020.
      - name: identityRegistry
        type: ListIdentityRegistry
        description: Consultado al alcanzar cada lista para decidir entre diff por
          elemento o posicional. R022.
      visibility: internal
      handwrittenTests:
      - name: "Dados tres AuditNode donde una hoja escalar accesible por el recorrido\
          \ recursivo tiene valores distintos entre la foto original y la foto consolidated,\
          \ cuando diff corre, entonces el mapa retornado contiene una entrada cuya\
          \ clave codifica el path a esa hoja y cuyo FieldChange lleva los tres valores\
          \ — R019 invariante 1: cobertura por construccion, sin enumeracion previa"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R019
      - name: "Dados tres AuditNode donde una de las hojas escalares pertenece a un\
          \ tipo de diagnostico no enumerado en seed alguna del exclusionRegistry,\
          \ cuando diff corre y los valores de esa hoja difieren entre fotos, entonces\
          \ la hoja aparece como field del mapa SIN requerir registro previo en ningun\
          \ catalogo — R019 invariante 2: aparicion automatica de cosas nuevas"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R019
      - name: "Dados tres AuditNode donde la unica diferencia entre fotos es un campo\
          \ cuyo nombre el exclusionRegistry clasifica como OPAQUE_PERSISTENCE_ID,\
          \ cuando diff corre, entonces el mapa retornado esta vacio: la hoja no se\
          \ emite aunque difiera — R020 categoria 1"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R020
      - name: "Dados tres AuditNode donde la unica diferencia entre fotos es un campo\
          \ cuyo nombre el exclusionRegistry clasifica como STRUCTURAL_REFERENCE,\
          \ cuando diff corre, entonces el mapa retornado esta vacio: la referencia\
          \ estructural no se emite aunque difiera — R020 categoria 2"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R020
      - name: "Dados tres AuditNode donde la unica diferencia entre fotos es un campo\
          \ cuyo nombre el exclusionRegistry clasifica como TIMESTAMP, cuando diff\
          \ corre, entonces el mapa retornado esta vacio: el timestamp no se emite\
          \ aunque difiera — R020 categoria 3"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R020
      - name: "Dados tres AuditNode donde la unica diferencia entre fotos es un campo\
          \ cuyo nombre el exclusionRegistry clasifica como INTERNAL_ORDER, cuando\
          \ diff corre, entonces el mapa retornado esta vacio: el orden interno no\
          \ se emite aunque difiera — R020 categoria 4"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R020
      - name: "Dados tres AuditNode donde la unica diferencia entre fotos es un campo\
          \ cuyo nombre el exclusionRegistry clasifica como NON_SEMANTIC, cuando diff\
          \ corre, entonces el mapa retornado esta vacio: el campo no semantico no\
          \ se emite aunque difiera — R020 categoria 5"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R020
      - name: "Dados tres AuditNode con una lista cuyo tipo de elemento tiene identidad\
          \ declarada en identityRegistry (p.ej. List<AbsentLemma> con clave (lemma,pos)),\
          \ donde un elemento existe en la foto original con propiedades no-clave\
          \ distintas a las de la foto consolidated, cuando diff corre, entonces el\
          \ mapa retornado contiene fields derivados con clave estable basada en la\
          \ identidad del elemento (no en su indice posicional) — R022 invariante\
          \ 1: lista con identidad"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R022
      - name: "Dados tres AuditNode con una lista cuyo tipo de elemento NO tiene identidad\
          \ declarada en identityRegistry y donde el elemento en el indice i de la\
          \ foto original tiene una hoja escalar distinta al elemento en el indice\
          \ i de la foto consolidated, cuando diff corre, entonces el mapa retornado\
          \ contiene fields con clave de path posicional ([i]) — R022 invariante 2:\
          \ diff posicional sin identidad"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R022
      - name: "Dados tres AuditNode donde la misma hoja escalar profunda es alcanzable\
          \ por la misma secuencia de campos anidados en las tres fotos con valores\
          \ distintos, cuando diff corre, entonces el mapa retornado contiene UNA\
          \ SOLA entrada cuya clave codifica esa secuencia y cuyo FieldChange agrupa\
          \ los tres valores (no tres entradas separadas, una por foto) — R023 invariante\
          \ 1: estabilidad entre fotos"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R023
      - name: "Dadas dos invocaciones independientes de diff sobre dos pares de AuditNode\
          \ del mismo tipo donde la misma hoja anidada cambia bajo el mismo path,\
          \ cuando diff corre en cada par, entonces ambos mapas retornados contienen\
          \ la MISMA clave para identificar el field correspondiente (sin variantes\
          \ del path por nodo) — R023 invariante 2: estabilidad entre nodos del mismo\
          \ tipo"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R023
      implements:
      - NodeFieldDiffer
    - name: DefaultFieldExclusionRegistry
      visibility: internal
      handwrittenTests:
      - name: "Dada una invocacion de isExcluded sobre un campo seed del registry\
          \ cuyo rol funcional es OPAQUE_PERSISTENCE_ID, entonces retorna true y getRole\
          \ retorna OPAQUE_PERSISTENCE_ID — R020 categoria 1: seed de identificadores\
          \ opacos de persistencia"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R020
      - name: "Dada una invocacion de isExcluded sobre un campo seed del registry\
          \ cuyo rol funcional es STRUCTURAL_REFERENCE (parentId, courseId, milestoneId,\
          \ topicId, knowledgeId o quizId como referencia dentro de otro nodo), entonces\
          \ retorna true y getRole retorna STRUCTURAL_REFERENCE — R020 categoria 2:\
          \ seed de referencias estructurales"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R020
      - name: "Dada una invocacion de isExcluded sobre un campo seed del registry\
          \ cuyo rol funcional es TIMESTAMP (createdAt, updatedAt sobre cualquier\
          \ nivel del modelo), entonces retorna true y getRole retorna TIMESTAMP —\
          \ R020 categoria 3: seed de timestamps"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R020
      - name: "Dada una invocacion de isExcluded sobre un campo seed del registry\
          \ cuyo rol funcional es INTERNAL_ORDER (indice de orden de insercion gestionado\
          \ por el almacenamiento), entonces retorna true y getRole retorna INTERNAL_ORDER\
          \ — R020 categoria 4: seed de ordenes internos"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R020
      - name: "Dada una invocacion de isExcluded sobre un campo seed del registry\
          \ cuyo rol funcional cae en la categoria escape NON_SEMANTIC, entonces retorna\
          \ true y getRole retorna NON_SEMANTIC — R020 categoria 5: seed de la categoria\
          \ escape"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R020
      implements:
      - FieldExclusionRegistry
    - name: DefaultListIdentityRegistry
      visibility: internal
      handwrittenTests:
      - name: "Dada una invocacion de getKeySpec sobre el campo lista de tipo List<AbsentLemma>\
          \ dentro de LemmaAbsenceLevelDiagnosis (declaringTypeName='LemmaAbsenceLevelDiagnosis',\
          \ fieldName='absentLemmas'), entonces retorna un Optional poblado con un\
          \ ListIdentityKeySpec cuyos fieldNames son ['lemma','pos'] — R022 seed AbsentLemma"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R022
      - name: "Dada una invocacion de getKeySpec sobre el campo lista de tipo List<MisplacedLemma>\
          \ dentro de su record contenedor, entonces retorna un Optional poblado con\
          \ un ListIdentityKeySpec cuyos fieldNames son ['lemma','pos'] — R022 seed\
          \ MisplacedLemma"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R022
      - name: "Dada una invocacion de getKeySpec sobre el campo lista de tipo List<BucketResult>\
          \ (p.ej. dentro de CocaBucketsLevelDiagnosis), entonces retorna un Optional\
          \ poblado con un ListIdentityKeySpec cuyos fieldNames son ['bandName'] —\
          \ R022 seed BucketResult"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R022
      - name: "Dada una invocacion de getKeySpec sobre el campo lista de tipo List<QuarterResult>,\
          \ entonces retorna un Optional poblado con un ListIdentityKeySpec cuyos\
          \ fieldNames son ['index'] — R022 seed QuarterResult"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R022
      - name: "Dada una invocacion de getKeySpec sobre el campo lista de tipo List<ImprovementDirective>,\
          \ entonces retorna un Optional poblado con un ListIdentityKeySpec cuyos\
          \ fieldNames son ['type','bandName','levelName'] — R022 seed ImprovementDirective"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R022
      implements:
      - ListIdentityRegistry
    - name: DefaultNodeFieldDifferFactory
      visibility: public
      handwrittenTests:
      - name: "Dada una invocacion de create() sobre la factory, entonces retorna\
          \ un NodeFieldDiffer cuya implementacion es RecursiveNodeFieldDiffer compuesta\
          \ con DefaultFieldExclusionRegistry (para R020) y DefaultListIdentityRegistry\
          \ (para R022); el motor producido honra ambas politicas en una invocacion\
          \ de diff sobre AuditNode con cambios en hojas excluibles y en listas con\
          \ identidad — composicion del motor"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R019
      implements:
      - NodeFieldDifferFactory
  - name: contextoverride
    description: "Encapsulamiento del parsing y validacion del correctionContext provisto\
      \ externamente por el cliente (FEAT-REVCTX). Aloja la implementacion del CorrectionContextOverrideParser,\
      \ un mapper Jackson dedicado y los validadores estructurales por DiagnosisKind."
    visibility: internal
    interfaces:
    - name: CorrectionContextStructuralValidator
      stereotype: port
      sealed: false
      exposes:
      - signature: "validateAndBuild(JsonNode payload, String expectedNodeId): CorrectionContext"
    implementations:
    - name: DefaultCorrectionContextOverrideParser
      requiresInject:
      - name: objectMapper
        type: ObjectMapper
      - name: validators
        type: "Map<DiagnosisKind,CorrectionContextStructuralValidator>"
      visibility: public
      handwrittenTests:
      - name: should accept payload when nodeId and diagnosisKind match the expected
          task identity
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R003
      - name: should reject payload with OverrideRejectedException when nodeId does
          not match the expected task identity
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R003
      - name: should reject payload with OverrideRejectedException when diagnosisKind
          does not match the expected task identity
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R003
      - name: should parse payload mirroring the get task output for a LEMMA_ABSENCE
          context and return a CorrectionContextOverride whose rawPayload is the literal
          JSON received
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R008
      - name: should reject payload whose JSON shape does not mirror the get task
          output even when its core structural fields are individually valid
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R008
      - name: should expose a static withDefaultValidators factory that wires both
          LEMMA_ABSENCE and SENTENCE_LENGTH validators so the audit-cli composition
          root can construct the parser without breaking the package-private encapsulation
          of the per-kind validators
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R002
      implements:
      - CorrectionContextOverrideParser
    - name: LemmaAbsenceContextStructuralValidator
      requiresInject:
      - name: objectMapper
        type: ObjectMapper
      handwrittenTests:
      - name: should throw OverrideRejectedException when the LEMMA_ABSENCE payload
          misses a required structural field or has an invalid value
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R003
      - name: should accept a LEMMA_ABSENCE override payload whose suggestedLemmas
          carry valid lemmaCount lemmaCountThreshold and isUnderexposed fields in
          the same observable shape GetCommand returns
        traceability:
          feature: FEAT-LEMMA-SUGGESTIONS
          rule: F-SLEM-R010
      - name: should throw OverrideRejectedException when a LEMMA_ABSENCE override
          payload contains a negative lemmaCount inside any suggestedLemmas entry
        traceability:
          feature: FEAT-LEMMA-SUGGESTIONS
          rule: F-SLEM-R011
      - name: should throw OverrideRejectedException when a LEMMA_ABSENCE override
          payload contains an isUnderexposed flag inconsistent with the reported lemmaCount
          and lemmaCountThreshold inside any suggestedLemmas entry
        traceability:
          feature: FEAT-LEMMA-SUGGESTIONS
          rule: F-SLEM-R011
      - name: should throw OverrideRejectedException when a LEMMA_ABSENCE override
          payload contains a suggestedLemmas element with a partially informed lemma-count
          triple such as lemmaCount present but lemmaCountThreshold or isUnderexposed
          missing
        traceability:
          feature: FEAT-LEMMA-SUGGESTIONS
          rule: F-SLEM-R013
      - name: should reconstruct a LEMMA_ABSENCE correction context whose sentenceMode
          is REWRITE when the override payload declares sentenceMode REWRITE instead
          of falling back to null
        traceability:
          feature: FEAT-SMODE
          rule: F-SMODE-R006
      implements:
      - CorrectionContextStructuralValidator
    - name: SentenceLengthContextStructuralValidator
      requiresInject:
      - name: objectMapper
        type: ObjectMapper
      handwrittenTests:
      - name: should throw OverrideRejectedException when the SENTENCE_LENGTH payload
          misses a required structural field or has an out-of-domain value
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R003
      implements:
      - CorrectionContextStructuralValidator
  - name: knowledgetitle
    description: "SPI de propuesta para KNOWLEDGE_TITLE_LENGTH. Publica para que el\
      \ composition root y revision-infrastructure instancien la estrategia y el generador\
      \ y los pasen al builder del registry. Aloja el puerto del generador de candidatos\
      \ (KnowledgeTitleCandidateGenerator) mas su carrier de respuesta cruda (KnowledgeTitleGeneratorResponse),\
      \ el carrier del candidato ({title, instructions}) y la estrategia que delega\
      \ en el puerto (KnowledgeTitleAgentStrategy) estampando el providerId inyectado\
      \ sobre cada StrategyId (analoga a LemmaAbsenceMvpStrategy). Espejo del package\
      \ lemmaabsence."
    visibility: public
    models:
    - name: KnowledgeTitleCandidate
      type: record
      fields:
      - name: title
        type: String
        description: "Nuevo titulo propuesto por el agente. Vocabulario del agente\
          \ (`title`); el deriver lo mapea explicitamente a KnowledgeEntity.label\
          \ al construir el snapshot despues (F-KTLR-R005, R006)."
      - name: instructions
        type: String
        description: Nuevas instructions propuestas por el agente (F-KTLR-R004). Ambos
          campos presentes y no vacios por candidato (F-KTLR-R004).
    - name: KnowledgeTitleGeneratorResponse
      type: record
      fields:
      - name: title
        type: String
        description: Titulo crudo devuelto por el generador (agente).
      - name: instructions
        type: String
        description: Instructions crudas devueltas por el generador (agente).
    interfaces:
    - name: KnowledgeTitleCandidateGenerator
      stereotype: port
      sealed: false
      exposes:
      - signature: "generate(KnowledgeTitleCorrectionContext context): KnowledgeTitleGeneratorResponse"
      visibility: public
    implementations:
    - name: KnowledgeTitleAgentStrategy
      requiresInject:
      - name: generator
        type: KnowledgeTitleCandidateGenerator
        description: Generador de candidatos al que delega la estrategia; el composition
          root supple el agente (default) o un generador canned (F-KTLR-R003).
      - name: providerId
        type: String
        description: Identificador de proveedor estampado en cada StrategyId que emite
          la estrategia (analogo a LemmaAbsenceMvpStrategy).
      visibility: public
      implements:
      - KnowledgeTitleProposalStrategy
  - name: preservation
    description: "Contrato publico de la garantia de preservacion (FEAT-RPRES). Aloja\
      \ la declaracion de alcance por tipo de correccion (CorrectionScope: la respuesta\
      \ a DOUBT-ALCANCE-DECLARADO), el verificador por complemento que corre antes\
      \ de persistir un apply (PreservationCheck), el reparador retroactivo del contenido\
      \ ya degradado (PreservationRepair) y sus carriers (ScopedField, PreservationViolation,\
      \ AttributeState, RepairReport). Solo puertos y carriers: el motor vive en el\
      \ package hermano interno 'preservationengine'. Es publico porque el comando\
      \ repair del CLI consume PreservationRepair; el resto de los consumidores estan\
      \ dentro de revision-domain."
    visibility: public
    models:
    - name: AttributeState
      type: enum
      fields:
      - name: VALUE_PRESENT
        description: El atributo esta presente y tiene un valor propio distinto del
          vacio.
      - name: EMPTY_PRESENT
        description: "El atributo esta presente y su valor es legitimamente vacio\
          \ (cadena vacia, lista vacia). Es una decision de contenido, no una perdida."
      - name: ABSENT
        description: "El atributo no esta: null, o el valor por defecto del tipo primitivo\
          \ alli donde el contenido tenia un valor propio."
    - name: PreservationViolation
      type: record
      fields:
      - name: elementId
        type: String
        description: Id del elemento del curso (quiz o knowledge) donde se observo
          la diferencia.
      - name: path
        type: String
        description: "Ruta concreta e instanciada donde se observo la diferencia (p.ej.\
          \ 'form.sentenceParts[2].text'), no el patron declarado en ScopedField.\
          \ Se resuelve contra el alcance expandiendo cada ScopedField sobre el elemento\
          \ real."
      - name: beforeState
        type: AttributeState
        description: Estado del atributo en el elemento original.
      - name: afterState
        type: AttributeState
        description: Estado del atributo en el elemento resultante.
      - name: beforeValue
        type: String
        description: "Representacion textual del valor original, para el mensaje de\
          \ error de R001/R002."
      - name: afterValue
        type: String
        description: Representacion textual del valor resultante.
    - name: RepairReport
      type: record
      fields:
      - name: course
        type: CourseEntity
        description: Curso resultante. En modo inspeccion es el mismo objeto de entrada.
      - name: elementsInspected
        type: int
        description: Cantidad de elementos del curso examinados.
      - name: elementsRepaired
        type: int
        description: Cantidad de elementos con al menos un atributo repuesto.
      - name: restored
        type: List<PreservationViolation>
        description: "Detalle atributo por atributo de lo repuesto (o de lo que se\
          \ repondria, en modo inspeccion)."
      - name: unrepairable
        type: List<String>
        description: "Ids de elementos degradados sin contraparte integra disponible\
          \ en los artifacts de revision. Se informan, nunca se inventa un valor por\
          \ defecto (F-RPRES-R002)."
    - name: ScopedField
      type: record
      fields:
      - name: path
        type: String
        description: "Ruta al leaf dentro del elemento. '[]' marca el paso por una\
          \ lista. Una ruta que termina en '[]' denota la estructura de la lista (longitud,\
          \ orden y la clase declarada de cada elemento), no sus leaves: p.ej. 'form.sentenceParts[]'\
          \ autoriza reordenar/agregar/quitar partes pero no cambiar ningun atributo\
          \ de una parte. Ejemplos de leaf: 'translation', 'form.incidence', 'quizTemplates[].title',\
          \ 'form.sentenceParts[].text'."
      - name: elementKind
        type: String
        description: "Nombre de la constante de clase que selecciona los elementos\
          \ de la lista a los que aplica la entrada; null significa 'todos los elementos'.\
          \ Es el unico refinamiento admitido sobre la ruta, y solo puede nombrar\
          \ una clase que el dominio ya declara como enum (p.ej. SentencePartKind.TEXT).\
          \ Existe porque la correccion lexica cambia el texto de las partes TEXT\
          \ pero no el de las partes CLOZE, y sin el discriminador ambas quedan bajo\
          \ la misma ruta 'form.sentenceParts[].text'."
    interfaces:
    - name: CorrectionScope
      stereotype: port
      sealed: false
      exposes:
      - signature: "changeableFields(DiagnosisKind kind, AuditTarget target): Set<ScopedField>"
      visibility: public
    - name: PreservationCheck
      stereotype: port
      sealed: false
      exposes:
      - signature: "verify(CourseEntity courseBefore, CourseEntity courseAfter, CourseElementSnapshot\
          \ revised, DiagnosisKind kind): List<PreservationViolation>"
      visibility: public
    - name: PreservationRepair
      stereotype: port
      sealed: false
      exposes:
      - signature: "inspect(CourseEntity course): RepairReport"
      - signature: "repair(CourseEntity course): RepairReport"
      visibility: public
  - name: preservationengine
    description: "Motor interno de la garantia de preservacion. Aloja la tabla de\
      \ alcances por tipo de correccion (DefaultCorrectionScope), el comparador por\
      \ complemento que recorre el elemento revisado y verifica el radio de impacto\
      \ sobre el resto del curso (DefaultPreservationCheck) y el reparador que reconstruye\
      \ desde los artifacts (DefaultPreservationRepair), todos package-private. Solo\
      \ DefaultPreservationFactory es publica: es la unica costura por la que el composition\
      \ root y el resto de revision-domain arman las dos capacidades. Empaquetado\
      \ aparte de 'preservation' por la misma razon que fielddiff lo esta de consolidatedview:\
      \ el contrato es estable y el motor no."
    visibility: internal
    implementations:
    - name: DefaultCorrectionScope
      handwrittenTests:
      - name: "should declare nothing changeable for a diagnosis kind with no declared\
          \ scope, so every attribute stays preserved by default"
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R001
      - name: "should declare a knowledge label correction as changing the label,\
          \ the instructions and the title of its quizzes"
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R004
      - name: "should declare a lexical correction of a quiz as changing only the\
          \ plain sentence, the composition of the statement and the translation"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R013
      - name: "should leave the quiz title, the form kind, the incidence, the presentation\
          \ labels and the empty text of each blank outside the scope of a lexical\
          \ correction"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R013
      implements:
      - CorrectionScope
    - name: DefaultPreservationCheck
      requiresInject:
      - name: scope
        type: CorrectionScope
        description: Declaracion de alcance contra la que se contrasta el diff observado.
      handwrittenTests:
      - name: should report no violation when the revised quiz differs from the original
          only in the attributes the correction declares changeable
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R001
      - name: should report a violation when the revised quiz loses the form kind
          that the correction does not propose to change
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R001
      - name: should report a violation when an attribute that was present and empty
          becomes absent
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R002
      - name: should report a violation when an attribute holding its own value is
          replaced by the default value of its type
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R002
      - name: should report a violation when an attribute absent in the original is
          materialized with a default value
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R002
      - name: should report a violation when a quiz correction replaces the quiz title
          with the corrected sentence
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R004
      - name: should report no violation for the quizzes whose title was aligned to
          the corrected label of their knowledge
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R004
      - name: should report a violation when a quiz other than the revised one changed
          its content
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R003
      - name: "should report a violation when the course gains, loses or reorders\
          \ elements around the revised one"
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R003
      implements:
      - PreservationCheck
    - name: DefaultPreservationRepair
      requiresInject:
      - name: artifactStore
        type: RevisionArtifactStore
        description: "Fuente de las contrapartes integras: el elementBefore de los\
          \ artifacts APPROVED. Se toma el artifact mas antiguo por nodeId, porque\
          \ el de una segunda revision ya trae el elemento degradado."
      - name: scope
        type: CorrectionScope
        description: "Delimita que atributos repone la reparacion: exactamente los\
          \ que quedan fuera del alcance de la correccion que el artifact aplico,\
          \ de modo que reparar nunca revierte la correccion."
      handwrittenTests:
      - name: should restore the degraded attributes of a quiz from the intact counterpart
          recorded before the revision that degraded it
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R005
      - name: "should repair a quiz revised twice, whose most recent record already\
          \ carries the degradation"
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R005
      - name: should keep the correction that the revision had applied when restoring
          the lost attributes
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R005
      - name: should leave every element that was never degraded exactly as it was
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R005
      - name: should report the degraded elements found in a full walk of the course
          without modifying it when only inspecting
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R005
      - name: should report as unrepairable a degraded element with no intact counterpart
          instead of filling it with the default value of its type
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R002
      implements:
      - PreservationRepair
    - name: DefaultPreservationFactory
      visibility: public
      implements:
      - PreservationFactory
- name: revision-infrastructure
  description: "Infrastructure adapter for the revision phase. Provides the LLM-backed\
    \ implementation of LemmaAbsenceQuizCandidateGenerator (revision-domain.lemmaabsence\
    \ port) using LangChain4j against any OpenAI-compatible HTTP endpoint (LM Studio,\
    \ vLLM, OpenAI cloud, Ollama via openai compat, etc.). Exposes a single Factory\
    \ Seam (LemmaAbsenceLlmGeneratorFactory + LagenConfig carrier + LlmGenerationFailureCategory\
    \ enum) so the composition root wires the adapter with one call. The factory is\
    \ the only piece that consumes LagenConfig: it reads the knobs, builds a ChatLanguageModel\
    \ via the LangChain4j OpenAI builder, and passes that model directly into LemmaAbsenceLlmGenerator.\
    \ The generator therefore depends on a chat-model abstraction (not on the LagenConfig\
    \ record), keeping the inner adapter agnostic of how the model was configured.\
    \ The adapter uses LangChain4j's legacy chat-message API flavor, generate(List<ChatMessage>),\
    \ because F-LAGEN needs explicit system/user messages and a simple text response\
    \ without exposing ChatRequest/ChatResponse in the architectural surface. The\
    \ adapter, prompt builder, response parser and error classifier all live in an\
    \ internal package; only the factory class is public. allowedClients=[audit-cli]\
    \ enforces that this module is an implementation detail of the CLI composition\
    \ root only (P8 Qualified Export)."
  dependsOn:
  - revision-domain
  - refiner-domain
  - agent-runtime-infrastructure
  allowedClients:
  - audit-cli
  patterns:
  - type: Factory
    implementations:
    - DefaultKnowledgeTitleAgentGeneratorFactory
    suppressed: false
    interface: KnowledgeTitleAgentGeneratorFactory
  uses:
  - langchain4j-openai
  - langchain4j-core
  - sentinel-agents
  packages:
  - name: lagen
    description: "Public contract of the agent-backed candidate generator. Exposes\
      \ the factory port (LemmaAbsenceAgentGeneratorFactory) + the LagenConfig carrier\
      \ (knobs from F-LAGEN-R008 y maxEvalRetries de F-LASAG-R011) + the LlmGenerationFailureCategory\
      \ enum (categories surfaced through the adapter, F-LAGEN-R006 / F-LASAG-R005).\
      \ Implementations of the factory and all collaborators live in the sibling 'lemmaabsenceagent'\
      \ internal package."
    visibility: public
    models:
    - name: LagenConfig
      type: record
      fields:
      - name: providerName
        type: String
        description: "Short, stable identifier of the provider family (e.g. 'lmstudio',\
          \ 'openai', 'anthropic-via-openai'). Used as the prefix of the providerId\
          \ emitted into StrategyId.providerId (F-LAGEN-R009, DOUBT-PROVIDER-ID-FORMAT\
          \ -> Option B). Required."
      - name: modelId
        type: String
        description: "Model identifier within the provider, e.g. 'gemma-3-4b-it',\
          \ 'gpt-4o-mini'. Joined with providerName as 'provider:model' to form StrategyId.providerId\
          \ (F-LAGEN-R009). Required."
      - name: endpoint
        type: String
        description: "OpenAI-compatible chat/completions base URL, e.g. 'http://localhost:1234/v1'\
          \ for the LM Studio default. Required."
      - name: apiKey
        type: String
        description: "Bearer credential. Nullable: when absent, the adapter sends\
          \ no Authorization header (covers local providers without auth — see Assumption\
          \ 3). When the provider rejects the request because of auth, the adapter\
          \ raises ProposalStrategyFailedException with reason prefixed LLM_AUTH_FAILED\
          \ (F-LAGEN-R006)."
      - name: temperature
        type: Double
        description: "Sampling temperature; controls output variability (F-LAGEN-R008).\
          \ Nullable: when null the factory applies a non-zero default (Assumption\
          \ 4)."
      - name: maxTokens
        type: Integer
        description: "Upper bound on response token count (F-LAGEN-R008). Nullable:\
          \ when null the factory applies a sensible default."
      - name: timeout
        type: Duration
        description: "Per-request budget; once exceeded the adapter raises ProposalStrategyFailedException\
          \ with reason prefixed LLM_TIMEOUT (F-LAGEN-R006). Nullable: when null the\
          \ factory applies a default budget."
      - name: maxSuggestedLemmaRequests
        type: Integer
        description: "Presupuesto de solicitudes de suggested lemmas que el modelo\
          \ puede hacer en una generacion interactiva (F-LAGAG-R004). Perilla configurable\
          \ en linea con F-LAGEN-R008, resuelta del env var CONTENT_AUDIT_LAGEN_MAX_LEMMA_REQUESTS.\
          \ Nullable/0 = sentinel; la factory sustituye con LagenDefaults (default\
          \ 5). Ignorada por los modos LLM single-shot y CANNED."
      - name: maxEvalRetries
        type: Integer
        description: "Tope de reintentos de generacion disparados por veredictos bloqueantes\
          \ de eval en una resolucion (F-LASAG-R008, R011). Resuelto del env var por\
          \ LagenConfigResolver; sin env-var explicita = 3. Nullable/0 = sentinel;\
          \ la factory sustituye con el default. Ignorada por el modo CANNED (R011)\
          \ y por cualquier flujo no-agente."
      visibility: public
    - name: LlmGenerationFailureCategory
      type: enum
      fields:
      - name: LLM_UNREACHABLE
        description: "Communication with the provider could not be established (connection\
          \ refused, host unreachable, DNS error, misconfigured endpoint). F-LAGEN-R006."
      - name: LLM_TIMEOUT
        description: "The query exceeded the configured time budget without returning\
          \ a response. F-LAGEN-R006, F-LAGEN-R008."
      - name: LLM_AUTH_FAILED
        description: The provider rejected the request because credentials were invalid
          or absent. F-LAGEN-R006.
      - name: LLM_RESPONSE_EMPTY
        description: "The query completed successfully but the model returned no content\
          \ (empty string, no text). F-LAGEN-R006."
      - name: LLM_RESPONSE_MALFORMED
        description: "The model returned content that does not satisfy F-LAGEN-R005\
          \ (not parseable JSON, missing quizSentence/translation, or either field\
          \ empty/non-string). F-LAGEN-R006."
      - name: LLM_OTHER
        description: Any other generation-time failure not covered by the categories
          above. F-LAGEN-R006.
      - name: LLM_LEMMA_REQUEST_BUDGET_EXHAUSTED
        description: El modelo agoto el presupuesto de solicitudes de suggested lemmas
          (LagenConfig.maxSuggestedLemmaRequests) sin entregar un candidato. F-LAGAG-R004.
          Solo aplica al modo interactivo.
      - name: LLM_TOOL_CALLING_UNSUPPORTED
        description: "El proveedor activo no es capaz de sostener el intercambio interactivo\
          \ (no soporta tool-calling / function-calling), por lo que el modelo no\
          \ puede emitir solicitudes de suggested lemmas. F-LAGAG-R005. Solo aplica\
          \ al modo interactivo. Falla observable, no cuelgue silencioso."
      visibility: public
    - name: LagenDefaults
      type: record
      fields:
      - name: temperature
        type: double
        description: "Default temperature applied by the factory when LagenConfig.temperature\
          \ is null. Pinned to 0.7 (Asuncion 4: non-zero / non-deterministic)."
      - name: maxTokens
        type: int
        description: Default maxTokens applied by the factory when LagenConfig.maxTokens
          is null. Pinned to 2048 (sized for one cloze quizSentence + translation
          pair).
      - name: timeout
        type: Duration
        description: Default timeout applied by the factory when LagenConfig.timeout
          is null. Pinned to Duration.ofSeconds(30) (alineado con el ejemplo LLM_TIMEOUT
          en REQUIREMENT.md R006).
      visibility: public
    - name: InvalidProviderIdException
      type: exception
      fields:
      - name: providerName
        type: String
      - name: modelId
        type: String
      message: "providerName and modelId must not contain ':' (got providerName='%s',\
        \ modelId='%s'). The ':' is reserved as the providerId separator (provider:model)."
      visibility: public
      extends: RuntimeException
    interfaces:
    - name: LemmaAbsenceAgentGeneratorFactory
      stereotype: factory
      sealed: false
      exposes:
      - signature: "create(LagenConfig config, SuggestedLemmaQuerySessionFactory sessionFactory):\
          \ LemmaAbsenceQuizCandidateGenerator"
      - signature: "providerIdFor(LagenConfig config): String"
      visibility: public
  - name: lemmaabsenceagent
    description: "Motor del adaptador de lemma-absence sobre el runtime de sentinel-agent.\
      \ Reemplaza a los paquetes lagenopenai (single-shot) y lageninteractive (interactivo):\
      \ unifica ambas rutas LLM en un unico backend agentico. Solo DefaultLemmaAbsenceAgentGeneratorFactory\
      \ es publica (el seam, instanciada una vez por audit-cli.bootstrap); el resto\
      \ es package-private. El adaptador (LemmaAbsenceAgentGenerator) implementa el\
      \ puerto revision-domain.lemmaabsence.LemmaAbsenceQuizCandidateGenerator sin\
      \ cambiar su firma (FEAT-LAPS R001-R003) y delega el lanzamiento del agente\
      \ declarativo en el port AgentRuntimeLauncher (fino sobre AgentRun/AgentRegistry/ExecutionContext),\
      \ que es el unico punto que conoce los tipos del runtime de sentinel-agent.\
      \ El nombre del agente declarativo (bajo .sentinel/agents/) es una constante\
      \ interna del adaptador, no una perilla de LagenConfig. La unica tool del agente,\
      \ SuggestedLemmaAgentTool, es un objeto Java in-process que delega en SuggestedLemmaQuerySession\
      \ (semantica F-CSLATDC) sin duplicar la consulta ni invocar el verbo CLI. AgentRuntimeErrorClassifier\
      \ mapea fallas de runtime (timeout/auth/transporte/otro) a LlmGenerationFailureCategory\
      \ y de ahi a ProposalStrategyFailedException con categoria preservada (R005/R012).\
      \ El grafo del agente (react, catalogo de evals R007, lazo de reintentos por\
      \ veredicto R008-R009, carry-forward R010) es declarativo y NO se modela aqui."
    visibility: internal
    interfaces:
    - name: AgentRuntimeLauncher
      sealed: false
      exposes:
      - signature: "launch(String agentName, Map<String,String> inputs, ChatModel\
          \ chatModel, Map<String,Object> tools): RunState"
      visibility: internal
    - name: SuggestedLemmaAgentTool
      sealed: false
      exposes:
      - signature: "fetchSuggestedLemmas(SuggestedLemmaQueryCriteria criteria): SuggestedLemmaQueryResult"
      visibility: internal
    - name: AgentRuntimeErrorClassifier
      sealed: false
      exposes:
      - signature: "classify(RunState runState): LlmGenerationFailureCategory"
      - signature: "classify(Throwable cause): LlmGenerationFailureCategory"
      visibility: internal
    - name: AgentCandidateParser
      sealed: false
      exposes:
      - signature: "parse(RunState runState, String taskId, String strategyName):\
          \ LemmaAbsenceGeneratorResponse"
      visibility: internal
    implementations:
    - name: DefaultLemmaAbsenceAgentGeneratorFactory
      types:
      - Component
      visibility: public
      implements:
      - LemmaAbsenceAgentGeneratorFactory
    - name: LemmaAbsenceAgentGenerator
      requiresInject:
      - name: config
        type: LagenConfig
      - name: agentRuntimeLauncher
        type: AgentRuntimeLauncher
      - name: sessionFactory
        type: SuggestedLemmaQuerySessionFactory
      - name: errorClassifier
        type: AgentRuntimeErrorClassifier
      - name: candidateParser
        type: AgentCandidateParser
      - name: chatModel
        type: ChatModel
      - name: strategyName
        type: String
      types:
      - Component
      handwrittenTests:
      - name: should pass only the suggested-lemmas tool to the agent runtime and
          no other CLI command tool during generation
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R002
      - name: should return exactly one QuizCandidate with non-null quizSentence and
          translation for a valid LEMMA_ABSENCE correction context
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R003
      - name: should emit a QuizCandidate without exception when the tool budget is
          exhausted during the run
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R004
      - name: should throw ProposalStrategyFailedException with the preserved category
          instead of an empty or null candidate when the runtime fails during generation
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R005
      - name: should launch the agent runtime exactly once and propagate the exception
          when generation hits a runtime failure
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R006
      - name: should include the out-of-catalog words formatted with lemma and known-frequency-rank
          indication in the generation inputs
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R013
      - name: should render the out-of-catalog generation input item as none when
          the context has no out-of-catalog words
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R013
      - name: should emit exactly one QuizCandidate without exception when misplacedLemmas
          is empty but outOfCatalogWords is non-empty
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R015
      implements:
      - LemmaAbsenceQuizCandidateGenerator
    - name: DefaultSuggestedLemmaAgentTool
      requiresInject:
      - name: session
        type: SuggestedLemmaQuerySession
      handwrittenTests:
      - name: should query the suggested-lemmas session with the given criteria and
          return its result when the agent refines suggestedWords
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R001
      implements:
      - SuggestedLemmaAgentTool
    - name: DefaultAgentRuntimeErrorClassifier
      handwrittenTests:
      - name: should map a runtime timeout to LLM_TIMEOUT preserving the failure category
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R005
      - name: should preserve the runtime failure category when classifying a throwable
          raised during any phase
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R012
      implements:
      - AgentRuntimeErrorClassifier
    - name: DefaultAgentCandidateParser
      implements:
      - AgentCandidateParser
    - name: SharedRuntimeAgentLauncher
      requiresInject:
      - name: agentGraphRunner
        type: AgentGraphRunner
      implements:
      - AgentRuntimeLauncher
  - name: knowledgetitleagent
    description: "Adapter agente para KNOWLEDGE_TITLE_LENGTH. Espejo de lemmaabsenceagent/lagen:\
      \ expone un unico factory seam (KnowledgeTitleAgentGeneratorFactory) que construye\
      \ el generador respaldado por el agente declarativo knowledge-titles-agent sobre\
      \ el runtime de sentinel-agent. Solo la factory es publica; el generador, el\
      \ launcher del runtime, el parser de candidatos y el clasificador de errores\
      \ son package-private. El generador implementa el puerto revision-domain.knowledgetitle.KnowledgeTitleCandidateGenerator\
      \ y traduce fallas de runtime (timeout/auth/transporte/otro) en ProposalStrategyFailedException\
      \ con categoria preservada (F-KTLR-R010). El nombre del agente declarativo es\
      \ una constante interna del adapter."
    visibility: public
    interfaces:
    - name: KnowledgeTitleAgentGeneratorFactory
      stereotype: factory
      sealed: false
      exposes:
      - signature: "create(LagenConfig config): KnowledgeTitleCandidateGenerator"
      - signature: "providerIdFor(LagenConfig config): String"
      visibility: public
    - name: KnowledgeTitleAgentRuntimeLauncher
      sealed: false
      exposes:
      - signature: "launch(String agentName, Map<String,String> inputs, ChatModel\
          \ chatModel): RunState"
      visibility: internal
    - name: KnowledgeTitleAgentCandidateParser
      sealed: false
      exposes:
      - signature: "parse(RunState runState, String knowledgeId): KnowledgeTitleGeneratorResponse"
      visibility: internal
    - name: KnowledgeTitleAgentErrorClassifier
      sealed: false
      exposes:
      - signature: "classify(RunState runState): LlmGenerationFailureCategory"
      - signature: "classify(Throwable cause): LlmGenerationFailureCategory"
      visibility: internal
    implementations:
    - name: DefaultKnowledgeTitleAgentGeneratorFactory
      visibility: public
      implements:
      - KnowledgeTitleAgentGeneratorFactory
    - name: KnowledgeTitleAgentGenerator
      requiresInject:
      - name: agentRuntimeLauncher
        type: KnowledgeTitleAgentRuntimeLauncher
      - name: candidateParser
        type: KnowledgeTitleAgentCandidateParser
      - name: errorClassifier
        type: KnowledgeTitleAgentErrorClassifier
      - name: chatModel
        type: ChatModel
      - name: strategyName
        type: String
      - name: config
        type: LagenConfig
      - name: projectRoot
        type: Path
      handwrittenTests:
      - name: "Given a valid knowledge context, when generate runs, then it produces\
          \ exactly one candidate with non-empty title and non-empty instructions"
        traceability:
          feature: FEAT-KTLR
          rule: F-KTLR-R004
      implements:
      - KnowledgeTitleCandidateGenerator
    - name: DefaultKnowledgeTitleAgentCandidateParser
      implements:
      - KnowledgeTitleAgentCandidateParser
    - name: DefaultKnowledgeTitleAgentErrorClassifier
      implements:
      - KnowledgeTitleAgentErrorClassifier
    - name: SharedRuntimeKnowledgeTitleLauncher
      requiresInject:
      - name: agentGraphRunner
        type: AgentGraphRunner
      implements:
      - KnowledgeTitleAgentRuntimeLauncher
- name: evaluation-ledger-domain
  description: |
    FEAT-EVCOST. Capacidad general de resultados de evaluacion costosa reutilizables entre analisis. No sabe nada de auditoria, de cursos ni de LLMs: define la identidad de un resultado —evaluador + huella del contenido, y nada mas (F-EVCOST-R001)—, el registro append-only clave->payload opaco, y la coordinacion reanudable de una corrida (consultar lo registrado -> si falta, evaluar dentro del presupuesto -> registrar apenas se obtiene). La version del evaluador NO integra la identidad: es procedencia obligatoria que se registra junto a cada resultado y viaja con el en cada consulta, de modo que ningun cambio de version invalida, borra ni deja pendiente nada (F-EVCOST-R006, F-EVCOST-R008). Cada consumidor aporta tres cosas y nada mas: como construye el contenido (EvaluationSubject.content), como su evaluador se pronuncia (Evaluator -> EvaluationOutcome) y como interpreta su payload. La huella NO la calcula el consumidor: la deriva la sesion del propio mapa de contenido entregado al evaluador, de modo que F-EVCOST-R002 ("exactamente lo que el evaluador recibe, ni mas ni menos") queda garantizada por construccion y no por disciplina.
  models:
  - name: EvaluationKey
    type: record
    fields:
    - name: evaluatorId
      type: String
      description: "Identificador estable del evaluador. No dice quien juzga sino\
        \ QUE PREGUNTA SE HIZO: el resultado de un evaluador no es intercambiable\
        \ con el de otro sobre la misma huella (F-EVCOST-R001)."
    - name: contentFingerprint
      type: String
      description: Huella derivada del mapa de contenido entregado al evaluador (F-EVCOST-R002).
        Junto con evaluatorId agota la identidad de un resultado.
  - name: EvaluationSubject
    type: record
    fields:
    - name: subjectRef
      type: String
      description: Referencia informativa al elemento del curso (id del quiz). No
        participa de la identidad.
    - name: content
      type: "Map<String,String>"
      description: Entradas exactas del evaluador. Todo lo que esta aca se juzga y
        se fingerprintea; nada mas se juzga ni se fingerprintea.
  - name: EvaluationRecord
    type: record
    fields:
    - name: key
      type: EvaluationKey
    - name: payload
      type: String
      description: "Resultado emitido por el evaluador, serializado. Opaco."
    - name: subjectRef
      type: String
      description: "Referencia informativa al elemento evaluado, para inspeccion y\
        \ rastreo (F-EVCOST-R001)."
    - name: recordedAt
      type: Instant
      description: Momento en que se registro. Informativo; no participa de la identidad.
    - name: evaluatorVersion
      type: String
      description: "Version del evaluador que produjo este resultado. Procedencia\
        \ OBLIGATORIA (F-EVCOST-R001): no participa de la identidad y no decide vigencia,\
        \ pero un registro sin ella es un error porque es la unica señal con la que\
        \ el usuario decide cuando re-evaluar."
  - name: EvaluationEmitted
    type: record
    fields:
    - name: payload
      type: String
    implements:
    - EvaluationOutcome
  - name: EvaluationNotEmitted
    type: record
    fields:
    - name: kind
      type: EvaluationFailureKind
    - name: reason
      type: String
    implements:
    - EvaluationOutcome
  - name: EvaluationFailureKind
    type: enum
    fields:
    - name: OUTPUT_UNUSABLE
    - name: EVALUATOR_UNAVAILABLE
  - name: EvaluationResolutionKind
    type: enum
    fields:
    - name: REUSED
    - name: EVALUATED
    - name: PENDING
    - name: FAILED
  - name: EvaluationResolution
    type: record
    fields:
    - name: kind
      type: EvaluationResolutionKind
    - name: payload
      type: String
    - name: evaluatorVersion
      type: String
      description: "Version que produjo el resultado devuelto (F-EVCOST-R001, F-EVCOST-R003).\
        \ Poblada exactamente cuando kind es REUSED o EVALUATED; null cuando no hay\
        \ resultado (PENDING, FAILED)."
  - name: EvaluationCoverage
    type: record
    fields:
    - name: reached
      type: int
      description: Contenidos que la corrida debia evaluar
    - name: withResult
      type: int
      description: Contenidos con resultado en esta corrida (reused + evaluatedInRun)
    - name: evaluatedInRun
      type: int
      description: Consumieron presupuesto en esta corrida
    - name: reused
      type: int
      description: "Resueltos con un resultado ya registrado, cualquiera sea la version\
        \ que lo produjo; no consumieron presupuesto (F-EVCOST-R003, F-EVCOST-R006)."
    - name: pending
      type: int
      description: "Sin resultado registrado bajo su huella, por tope de presupuesto\
        \ o porque la sesion dejo de consultar. Cambiar la version del evaluador nunca\
        \ deja nada pendiente (F-EVCOST-R006)."
    - name: failed
      type: int
      description: El evaluador no llego a pronunciarse sobre ellos en esta corrida
  - name: EvaluationBudget
    type: record
    fields:
    - name: maxNewEvaluations
      type: int
      description: Tope de evaluaciones nuevas de la corrida. Es lo unico de la politica
        del consumidor que la sesion honra (F-EVCOST-R003); el reuso nunca lo consume.
  interfaces:
  - name: EvaluationOutcome
    stereotype: port
    sealed: false
  - name: EvaluationLedger
    stereotype: port
    sealed: false
    exposes:
    - signature: "append(EvaluationRecord record): void"
    - signature: "findLatest(EvaluationKey key): Optional<EvaluationRecord>"
    - signature: "history(EvaluationKey key): List<EvaluationRecord>"
  - name: ContentFingerprinter
    stereotype: port
    sealed: false
    exposes:
    - signature: "fingerprint(Map<String,String> content): String"
  - name: Evaluator
    stereotype: port
    sealed: false
    exposes:
    - signature: "evaluatorId(): String"
    - signature: "evaluate(EvaluationSubject subject): EvaluationOutcome"
    - signature: "evaluatorVersion(): Optional<String>"
  - name: EvaluationSession
    stereotype: port
    sealed: false
    exposes:
    - signature: "resolve(EvaluationSubject subject): EvaluationResolution"
    - signature: "resolveForced(EvaluationSubject subject): EvaluationResolution"
    - signature: "coverage(): EvaluationCoverage"
    - signature: "consultedEvaluatorVersion(): Optional<String>"
  - name: EvaluationSessionFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "open(EvaluationBudget budget,Evaluator evaluator): EvaluationSession"
  patterns:
  - type: Factory
    implementations:
    - DefaultEvaluationSessionFactory
    suppressed: false
    interface: EvaluationSessionFactory
  packages:
  - name: evaluationsession
    description: |
      Coordinacion reanudable de una corrida sobre un evaluador. La sesion se abre con un presupuesto y un evaluador y le pide una sola vez su version, que queda congelada para toda la corrida. Esa version ya NO entra en la clave —la identidad es evaluador + huella (F-EVCOST-R001)— sino que se estampa como procedencia sobre cada resultado nuevo y se declara via consultedEvaluatorVersion(). consultedEvaluatorVersion() esta vacia cuando la corrida no consulto al evaluador ni una vez: porque todo se reutilizo, porque no habia presupuesto, o porque el evaluador no pudo enunciar su version. Ese ultimo caso es el que sostiene la invariante 3 de F-QINST-R010 sin ninguna convencion de strings: un evaluador que devuelve Optional.empty() en evaluatorVersion() es, desde el primer sujeto, un evaluador NO DISPONIBLE —la sesion no lo consulta, no registra nada y deja pendiente lo que falta, igual que ante una caida de servicio (F-EVCOST-R009)—, pero el reuso sigue ocurriendo intacto, porque la ruta de reuso no mira la version (F-QINST-R010 criterio c). La sesion recibe unicamente el presupuesto: quien decide que sujeto se vuelve a evaluar es el consumidor, sujeto por sujeto, via resolveForced (F-EVCOST-R008).
    visibility: public
    implementations:
    - name: DefaultEvaluationSessionFactory
      requiresInject:
      - name: ledger
        type: EvaluationLedger
      - name: fingerprinter
        type: ContentFingerprinter
      visibility: public
      implements:
      - EvaluationSessionFactory
    - name: DefaultEvaluationSession
      requiresInject:
      - name: ledger
        type: EvaluationLedger
      - name: fingerprinter
        type: ContentFingerprinter
      - name: evaluator
        type: Evaluator
      - name: budget
        type: EvaluationBudget
      handwrittenTests:
      - name: should reuse the registered result for identical content belonging to
          a different course element
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R001
      - name: should not reuse the registered result when the element kept its identifier
          but its content changed
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R001
      - name: should derive the fingerprint from exactly the content map handed to
          the evaluator
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R002
      - name: should return the registered result without consulting the evaluator
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R003
      - name: should report the content as pending when no result is registered and
          no new evaluation can be made
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R003
      - name: should keep reusing registered results after the budget for new evaluations
          is exhausted
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R003
      - name: should record each evaluated result in the ledger before resolving the
          next content
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R004
      - name: should record an unfavourable verdict emitted by the evaluator and reuse
          it in the next run
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R005
      - name: should record nothing when the evaluator does not emit a verdict and
          leave the content pending for the next run
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R005
      - name: should leave content pending instead of reusing a result produced by
          a previous version of the evaluator
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R006
      - name: should consult the evaluator again for content with a current result
          only when re-evaluation is explicitly requested
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R008
      - name: should keep consulting the evaluator for the remaining content when
          the failure is attributable to a single content
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R009
      - name: should stop consulting the evaluator after a service failure and finish
          the run leaving the remaining content pending
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R009
      - name: should keep reusing the registered current result of the neighbouring
          content in the same run when re evaluation is requested for one content
          only
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R008
      implements:
      - EvaluationSession
  - name: contentfingerprint
    description: Derivacion de la huella. Publico porque la composition root lo inyecta
      en la factory de sesiones y porque la reproducibilidad de la huella (F-EVCOST-R002)
      necesita ser verificable de forma aislada.
    visibility: public
    implementations:
    - name: Sha256ContentFingerprinter
      visibility: public
      handwrittenTests:
      - name: should produce a different fingerprint when any part of the delivered
          content changes
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R002
      - name: should produce the same fingerprint when the same content is rebuilt
          in another run
        traceability:
          feature: FEAT-EVCOST
          rule: F-EVCOST-R002
      implements:
      - ContentFingerprinter
- name: evaluation-ledger-infrastructure
  description: |
    Adaptador filesystem del registro de evaluaciones costosas. Escribe un archivo por evaluador bajo .content-audit/evaluations/, una entrada por linea, en modo append: cada resultado queda disponible apenas se obtiene (F-EVCOST-R004) y una interrupcion abrupta a lo sumo deja una ultima linea incompleta, que la lectura descarta por no parsear —"se lee completa o no existe"—. El orden de append es la unica fuente del desempate que exige F-EVCOST-R006: con mas de una entrada para la misma clave (evaluador + huella), findLatest devuelve la ULTIMA escrita y history las devuelve todas, de la mas reciente a la mas antigua, cada una con la version que la produjo. Se desempata por posicion en el archivo y no por recordedAt a proposito: el append es monotono y es la misma propiedad sobre la que se apoya la seguridad ante dos corridas simultaneas, mientras que un reloj puede empatar o retroceder; recordedAt queda como dato informativo. Append-only tambien significa que las entradas de versiones anteriores del evaluador conviven como historia consultable y nunca se borran solas (F-EVCOST-R006), y que una re-evaluacion agrega sin destruir y pasa a ganar el desempate (F-EVCOST-R008). Vive aparte de los informes de auditoria a proposito: borrar informes no toca este registro (F-EVCOST-R007).
  dependsOn:
  - evaluation-ledger-domain
  implementations:
  - name: FileSystemEvaluationLedger
    requiresInject:
    - name: baseDir
      type: Path
      description: "Directorio raiz bajo el cual se resuelve .content-audit/evaluations/.\
        \ Lo provee la composition root, igual que los demas stores filesystem."
    types:
    - Repository
    visibility: public
    handwrittenTests:
    - name: should make every appended result readable by a ledger instance opened
        after the run was interrupted
      traceability:
        feature: FEAT-EVCOST
        rule: F-EVCOST-R004
    - name: should ignore a truncated trailing entry and report its content as never
        registered
      traceability:
        feature: FEAT-EVCOST
        rule: F-EVCOST-R004
    - name: should preserve every result when two runs append to the same evaluator
        ledger at the same time
      traceability:
        feature: FEAT-EVCOST
        rule: F-EVCOST-R004
    - name: should keep the results of previous evaluator versions readable in history
        after a new version records its own
      traceability:
        feature: FEAT-EVCOST
        rule: F-EVCOST-R006
    - name: should keep every registered result readable after the analysis reports
        under the same base directory are deleted
      traceability:
        feature: FEAT-EVCOST
        rule: F-EVCOST-R007
    - name: should keep the earlier entry consultable in history when the same key
        is recorded again
      traceability:
        feature: FEAT-EVCOST
        rule: F-EVCOST-R008
    implements:
    - EvaluationLedger
  uses:
  - jackson-databind
- name: agent-runtime-infrastructure
  description: |
    Capacidad compartida para correr un agente declarativo de sentinel-agents in-process: carga el grafo de <agentsBaseDir>/<nombre>/, lo ejecuta con AgentRun.runRecording y persiste el run. Existe porque este lanzador ya se escribio dos veces identico dentro de revision-infrastructure (lemmaabsenceagent y knowledgetitleagent) y el juez de consigna seria la tercera copia — y no puede reusar ninguna, porque revision-infrastructure declara allowedClients=[audit-cli] y cuelga de revision-domain, mientras que este consumidor nuevo cuelga de la auditoria. Deliberadamente NO incluye la clasificacion de errores: el clasificador de cada consumidor devuelve su propia taxonomia de fallas y no es compartible sin arrastrar tipos ajenos. Declarado de forma identica en el patch principal a proposito, para que este patch valide y aplique en cualquier orden.
  models:
  - name: AgentGraphRunnerConfig
    type: record
    fields:
    - name: agentsBaseDir
      type: Path
      description: "Directorio de definiciones de agentes. Null = se resuelve por\
        \ inputs[\"project_root\"] si esta presente, y en su defecto .sentinel/agents\
        \ relativo al CWD."
    - name: runsBaseDir
      type: Path
      description: "Directorio donde se persisten los runs. Null = misma cadena de\
        \ resolucion que agentsBaseDir, sobre .sentinel/runs."
  - name: AgentDefinitionFound
    type: record
    fields:
    - name: directory
      type: Path
      description: Directorio existente de la definicion del agente. Es el mismo que
        se carga para correr el grafo.
    implements:
    - AgentDefinitionLocation
  - name: AgentDefinitionUnresolved
    type: record
    fields:
    - name: agentName
      type: String
      description: Agente que se busco.
    - name: searchedIn
      type: Path
      description: "Ruta absoluta donde se busco y no hay definicion. Va en el resultado\
        \ para que el mensaje diga donde miro, no solo que fallo."
    implements:
    - AgentDefinitionLocation
  interfaces:
  - name: AgentGraphRunner
    stereotype: port
    sealed: false
    exposes:
    - signature: "run(String agentName,Map<String,String> inputs,ChatModel chatModel,Map<String,Object>\
        \ tools): RunState"
  - name: AgentGraphRunnerFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "create(AgentGraphRunnerConfig config): AgentGraphRunner"
  - name: AgentDefinitionLocation
    sealed: false
  - name: AgentDefinitionLocator
    stereotype: port
    sealed: false
    exposes:
    - signature: "locate(String agentName): AgentDefinitionLocation"
    - signature: "locateUnderProjectRoot(String projectRoot,String agentName): AgentDefinitionLocation"
  - name: AgentDefinitionLocatorFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "create(AgentGraphRunnerConfig config): AgentDefinitionLocator"
  allowedClients:
  - quiz-instruction-infrastructure
  - audit-cli
  - revision-infrastructure
  patterns:
  - type: Factory
    implementations:
    - DefaultAgentGraphRunnerFactory
    suppressed: false
    interface: AgentGraphRunnerFactory
  - type: Factory
    implementations:
    - DefaultAgentDefinitionLocatorFactory
    suppressed: false
    interface: AgentDefinitionLocatorFactory
  uses:
  - sentinel-agents
  - langchain4j-core
  packages:
  - name: graphexecution
    description: |
      Motor del runtime. Solo las factories son publicas; el runner y el locator son package-private. El locator es la unica implementacion de la cadena de resolucion del directorio de definiciones (config -> project_root -> CWD): el runner ya no la resuelve por su cuenta, de modo que el directorio que se ejecuta y el directorio sobre el que un consumidor calcula una version derivada son necesariamente el mismo. Cuando no hay definicion, el locator devuelve AgentDefinitionUnresolved en vez de una ruta inexistente: no existe un camino donde "no encontre nada" se pueda confundir con "encontre un directorio vacio".
    visibility: public
    implementations:
    - name: DefaultAgentGraphRunnerFactory
      visibility: public
      implements:
      - AgentGraphRunnerFactory
    - name: DefaultAgentGraphRunner
      requiresInject:
      - name: config
        type: AgentGraphRunnerConfig
      - name: agentDefinitionLocator
        type: AgentDefinitionLocator
      implements:
      - AgentGraphRunner
    - name: DefaultAgentDefinitionLocatorFactory
      visibility: public
      implements:
      - AgentDefinitionLocatorFactory
    - name: DefaultAgentDefinitionLocator
      requiresInject:
      - name: config
        type: AgentGraphRunnerConfig
      implements:
      - AgentDefinitionLocator
- name: quiz-instruction-infrastructure
  description: |
    Adaptador del juez de consigna: implementa el SPI Evaluator de evaluation-ledger-domain corriendo el agente declarativo quiz-instruction-validator sobre el runtime compartido. Traduce EvaluationSubject.content a las cinco entradas declaradas del agente (cefrLevel, topic, title, instructions, quiz) verbatim, sin agregar ni quitar nada — es lo que hace que la huella cubra exactamente lo juzgado (F-EVCOST-R002). Reconoce el veredicto conservador de infraestructura del juez (confianza nula y violacion JUDGE_OUTPUT_INVALID) y lo devuelve como EvaluationNotEmitted(OUTPUT_UNUSABLE), de modo que nunca llega al registro (F-QINST-R013); toda falla de servicio, timeout, autenticacion o credito se devuelve como EvaluationNotEmitted(EVALUATOR_UNAVAILABLE) en lugar de propagarse como excepcion (F-QINST-R007). Su version es procedencia, no vigencia: se deriva de la definicion del agente y del modelo, se estampa sobre cada veredicto nuevo y se declara en el informe, pero no decide que veredictos valen (F-QINST-R010). Cuando la definicion no se puede localizar el juez no enuncia version alguna —evaluatorVersion() devuelve Optional.empty()— y con eso queda tratado como no disponible por la propia sesion. Construye el ChatModel de forma perezosa: una configuracion ausente o invalida es un evaluador no disponible, no una auditoria caida. allowedClients=[audit-cli] porque es un detalle de implementacion de la composition root.
  dependsOn:
  - audit-domain
  - evaluation-ledger-domain
  - agent-runtime-infrastructure
  models:
  - name: QuizInstructionJudgeConfig
    type: record
    fields:
    - name: baseUrl
      type: String
      description: Endpoint compatible OpenAI
    - name: apiKey
      type: String
    - name: modelName
      type: String
    - name: temperature
      type: Double
    - name: timeoutSeconds
      type: Integer
    - name: agentName
      type: String
      description: Nombre del grafo bajo .sentinel/agents/. Por defecto quiz-instruction-validator.
  interfaces:
  - name: QuizInstructionJudgeFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "create(QuizInstructionJudgeConfig config,AgentGraphRunner agentGraphRunner,AgentDefinitionLocator\
        \ agentDefinitionLocator): Evaluator"
  allowedClients:
  - audit-cli
  patterns:
  - type: Factory
    implementations:
    - DefaultQuizInstructionJudgeFactory
    suppressed: false
    interface: QuizInstructionJudgeFactory
  uses:
  - jackson-databind
  - langchain4j-core
  - langchain4j-openai
  - sentinel-agents
  packages:
  - name: instructionjudge
    description: |
      Motor del adaptador del juez. Solo la factory es publica; el juez, el resolutor de version y el armado de entradas son package-private. El resolutor de version no conoce rutas: le pide la definicion al mismo AgentDefinitionLocator con el que se construye el runner, asi que el digest de los archivos del agente se calcula siempre sobre la definicion que efectivamente se ejecuta (F-QINST-R010). Cuando el locator responde AgentDefinitionUnresolved, el resolutor devuelve Optional.empty(): la ausencia de version se representa con un tipo y no con un prefijo reservado dentro del String. La convencion de prefijo anterior protegia por un efecto que ya no existe —una version fabricada no coincidia con ninguna clave registrada y por lo tanto no reutilizaba nada—; con la version fuera de la identidad (F-EVCOST-R001) nadie compara versiones, asi que un String fabricado se registraria como procedencia legitima y contaminaria los recuentos de F-QINST-R005 de forma permanente, porque nada se invalida solo. Con Optional.empty() el juez queda tratado como no disponible por la sesion: no emite ni registra veredicto nuevo, no se declara version consultada, los ejercicios sin veredicto quedan pendientes (F-QINST-R007) y los que ya tenian veredicto se siguen puntuando con su procedencia real (F-QINST-R010 criterio c).
    visibility: public
    interfaces:
    - name: QuizInstructionJudgeVersionResolver
      sealed: false
      exposes:
      - signature: "resolve(QuizInstructionJudgeConfig config): Optional<String>"
      visibility: internal
    implementations:
    - name: DefaultQuizInstructionJudgeFactory
      visibility: public
      handwrittenTests:
      - name: "should yield an evaluator that reports itself unavailable when the\
          \ judge configuration is missing or invalid, instead of failing the audit"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R007
      - name: should yield an evaluator that reports itself unavailable and emits
          no verdict when the agent definition its version derives from cannot be
          located
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R010
      implements:
      - QuizInstructionJudgeFactory
    - name: QuizInstructionAgentJudge
      requiresInject:
      - name: config
        type: QuizInstructionJudgeConfig
      - name: agentGraphRunner
        type: AgentGraphRunner
      - name: versionResolver
        type: QuizInstructionJudgeVersionResolver
      handwrittenTests:
      - name: "should report the conservative infrastructure verdict of the judge,\
          \ with null confidence and a judge output invalid violation, as an unusable\
          \ output instead of a verdict"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R013
      - name: should report a genuine non compliant verdict as an emitted result and
          not as a failure
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R013
      - name: "should report a judge service failure, timeout or exhausted credit\
          \ as an unavailable evaluator instead of throwing"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R007
      - name: should hand the judge the five declared inputs verbatim from the judged
          content
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R009
      implements:
      - Evaluator
    - name: DefaultQuizInstructionJudgeVersionResolver
      requiresInject:
      - name: agentDefinitionLocator
        type: AgentDefinitionLocator
      handwrittenTests:
      - name: should derive a different judge version when the agent definition or
          the model changes
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R010
      - name: should keep the judge version stable while the agent definition and
          the model stay the same
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R010
      - name: "should derive a different judge version when only the text of the agent\
          \ definition changes, with the agent name and the model untouched"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R010
      - name: "should derive a judge version that cannot coincide with any version\
          \ derived from a reachable agent definition when the definition cannot be\
          \ located, so that no recorded verdict is current under it"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R010
      implements:
      - QuizInstructionJudgeVersionResolver
  - name: instructionverdict
    description: "Lectura del payload del juez. Publico porque el analizador consume\
      \ veredictos REUTILIZADOS que nunca pasan por el juez: la interpretacion del\
      \ payload tiene que existir independientemente del adaptador que lo produjo."
    visibility: public
    implementations:
    - name: JacksonQuizInstructionVerdictReader
      visibility: public
      handwrittenTests:
      - name: "should read the judge payload preserving every violation with its code,\
          \ constraint, evidence and explanation and every performed check with its\
          \ state"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R003
      - name: "should read the compliance flag, the severity and the confidence of\
          \ the verdict"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R003
      implements:
      - QuizInstructionVerdictReader
