    - name: QuizInstructionDetailedFormatter
      handwrittenTests:
      - name: should render the declared coverage of the quiz instruction analysis
          next to its score
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R005
      - name: should render for each breaching quiz its violations with their evidence
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R003
      - name: should render the judge version the analysis evaluated with next to
          the coverage numbers
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R005
      - name: should render one row per originating judge version with how many of
          the scored verdicts each one contributes
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R005
      - name: should state explicitly that the run consulted no judge version when
          it made no new consultation
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R005
      implements:
      - DetailedFormatter
  - name: bootstrap
    description: "Env-var -> domain-object parsing plus composition-root helpers translating\
      \ external inputs (workdir, approval mode, proposal strategy selection, LAGEN\
      \ mode + LLM config) into typed values consumed by the engine factories."
    visibility: internal
    models:
    - name: InvalidWorkdirException
      type: exception
      fields:
      - name: path
        type: String
        description: The override value that failed validation
      message: The configured workdir override '%s' is not a writable directory
      extends: RuntimeException
    - name: InvalidApprovalModeException
      type: exception
      fields:
      - name: value
        type: String
        description: The raw env-var value that failed parsing
      message: "Invalid value for CONTENT_AUDIT_APPROVAL_MODE: '%s'. Allowed: auto,\
        \ human"
      extends: RuntimeException
    - name: InvalidProposalStrategyException
      type: exception
      fields:
      - name: value
        type: String
        description: The raw env-var value that failed parsing.
      - name: registered
        type: String
        description: Comma-separated list of registered strategy names (LemmaAbsenceProposalStrategyRegistry.listAll()).
      message: "Invalid value for CONTENT_AUDIT_LAPS_STRATEGY: '%s'. Registered: %s"
      extends: RuntimeException
    - name: InvalidLagenModeException
      type: exception
      fields:
      - name: value
        type: String
        description: The raw env-var value that failed parsing.
      message: "Invalid value for CONTENT_AUDIT_LAGEN_MODE: '%s'. Allowed: llm, canned"
      extends: RuntimeException
    - name: InvalidLagenConfigException
      type: exception
      fields:
      - name: key
        type: String
        description: Env-var name whose value was invalid (e.g. 'CONTENT_AUDIT_LAGEN_TEMPERATURE').
      - name: detail
        type: String
        description: "Why the value failed to parse (e.g. 'expected number in [0,2],\
          \ got abc')."
      message: "Invalid LAGEN configuration (%s): %s"
      extends: RuntimeException
    interfaces:
    - name: WorkdirResolver
      stereotype: port
      sealed: true
      exposes:
      - signature: "resolve(String flagValue): Path"
    - name: ApprovalModeResolver
      stereotype: port
      sealed: true
      exposes:
      - signature: "resolve(String envValue): ApprovalMode"
    - name: ProposalStrategySelector
      stereotype: port
      sealed: true
      exposes:
      - signature: "select(String envValue, LemmaAbsenceProposalStrategyRegistry registry):\
          \ String"
    - name: LagenModeResolver
      stereotype: port
      sealed: true
      exposes:
      - signature: "resolve(String envValue): LagenMode"
    - name: LagenConfigResolver
      stereotype: port
      sealed: true
      exposes:
      - signature: "resolve(Map<String,String> env): LagenConfig"
    - name: QuizInstructionJudgeConfigResolver
      sealed: false
      exposes:
      - signature: "resolve(): QuizInstructionJudgeConfig"
      visibility: internal
    implementations:
    - name: DefaultWorkdirResolver
      visibility: public
      handwrittenTests:
      - name: should return the flag value when --workdir is provided and points to
          an existing writable directory
        traceability:
          feature: FEAT-CLIRV
          rule: F-CLIRV-R017
      - name: "should ignore CONTENT_AUDIT_HOME and use the flag value when both are\
          \ set, validating flag-over-env precedence"
        traceability:
          feature: FEAT-CLIRV
          rule: F-CLIRV-R017
      - name: should fall back to user.dir when neither --workdir nor CONTENT_AUDIT_HOME
          is set
        traceability:
          feature: FEAT-CLIRV
          rule: F-CLIRV-R017
      - name: should throw InvalidWorkdirException naming the override path when --workdir
          points to a non-existent directory
        traceability:
          feature: FEAT-CLIRV
          rule: F-CLIRV-R017
      - name: should throw InvalidWorkdirException naming the override path when --workdir
          points to a regular file (not a directory)
        traceability:
          feature: FEAT-CLIRV
          rule: F-CLIRV-R017
      - name: should not validate or interfere with the course content folder path
          (workdir override is decoupled from course path)
        traceability:
          feature: FEAT-CLIRV
          rule: F-CLIRV-R018
      implements:
      - WorkdirResolver
    - name: DefaultApprovalModeResolver
      visibility: public
      handwrittenTests:
      - name: "Given a null env value, when resolve is called, then it returns AUTO"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R005
      - name: "Given an empty-string env value, when resolve is called, then it returns\
          \ AUTO"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R005
      - name: "Given env value 'auto', when resolve is called, then it returns AUTO"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R005
      - name: "Given env value 'AUTO' in any casing, when resolve is called, then\
          \ it returns AUTO (case-insensitive)"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R005
      - name: "Given env value 'human', when resolve is called, then it returns HUMAN"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R005
      - name: "Given env value 'HUMAN' in any casing, when resolve is called, then\
          \ it returns HUMAN (case-insensitive)"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R005
      - name: "Given an unrecognized env value, when resolve is called, then it throws\
          \ InvalidApprovalModeException listing the allowed values"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R005
      implements:
      - ApprovalModeResolver
    - name: DefaultProposalStrategySelector
      visibility: public
      handwrittenTests:
      - name: "Given CONTENT_AUDIT_LAPS_STRATEGY set to the name of a registered strategy,\
          \ when select is called, then it returns that exact name (picking one among\
          \ several registered)"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R004
      - name: "Given CONTENT_AUDIT_LAPS_STRATEGY set to a name that no registered\
          \ strategy reports via listAll, when select is called, then it throws InvalidProposalStrategyException\
          \ whose message lists the registered strategy names"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R004
      - name: "Given CONTENT_AUDIT_LAPS_STRATEGY unset (null or blank), when select\
          \ is called with any registry, then it returns the default strategy name\
          \ 'lemma-absence-llm'"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R004
      implements:
      - ProposalStrategySelector
    - name: DefaultLagenModeResolver
      types:
      - Component
      visibility: public
      handwrittenTests:
      - name: resolve returns LagenMode.LLM when the env value is null (default per
          R013)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R013
      - name: resolve returns LagenMode.LLM when the env value is an empty or whitespace-only
          string (default per R013)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R013
      - name: resolve returns LagenMode.LLM when the env value is 'llm' (explicit
          dynamic mode opt-in per R013)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R013
      - name: resolve returns LagenMode.CANNED when the env value is 'canned' (explicit
          fixed-mode opt-in per R013)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R013
      - name: "resolve accepts the mode value case-insensitively ('LLM', 'CANNED',\
          \ 'CaNnEd' all parse) per R013"
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R013
      - name: resolve raises InvalidLagenModeException carrying the offending value
          when the env value is not a recognised mode (fail-fast per R014)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R014
      - name: InvalidLagenModeException raised by resolve has a message that identifies
          the unrecognised mode value declared by the operator (per R014)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R014
      implements:
      - LagenModeResolver
    - name: DefaultLagenConfigResolver
      types:
      - Component
      visibility: public
      handwrittenTests:
      - name: resolve returns a LagenConfig populated from every CONTENT_AUDIT_LAGEN_*
          env entry when all required keys are present and valid
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R008
      - name: resolve returns LagenConfig with apiKey=null when the apiKey env entry
          is absent (knob nullable per R008)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R008
      - name: resolve returns LagenConfig with temperature=null when the temperature
          env entry is absent (factory will substitute LagenDefaults.temperature)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R008
      - name: resolve returns LagenConfig with maxTokens=null when the maxTokens env
          entry is absent (factory will substitute LagenDefaults.maxTokens)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R008
      - name: resolve returns LagenConfig with timeout=null when the timeout env entry
          is absent (factory will substitute LagenDefaults.timeout)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R008
      - name: resolve raises InvalidLagenConfigException identifying the temperature
          env key when its value is not a parseable number (fail-fast per R014)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R014
      - name: resolve raises InvalidLagenConfigException identifying the timeout env
          key when its value is not a positive duration (fail-fast per R014)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R014
      - name: resolve raises InvalidLagenConfigException identifying the maxTokens
          env key when its value is not a positive integer (fail-fast per R014)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R014
      - name: InvalidLagenConfigException raised by resolve carries both the offending
          env-var key and a parse-failure detail per R014
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R014
      - name: resolve raises InvalidLagenConfigException identifying the providerName
          env key when its value is missing or empty (fail-fast per R014)
        traceability:
          feature: FEAT-LAGEN
          rule: F-LAGEN-R014
      - name: should resolve maxEvalRetries to the default of 3 when no eval-retries
          env var is present
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R011
      implements:
      - LagenConfigResolver
    - name: DefaultQuizInstructionJudgeConfigResolver
      implements:
      - QuizInstructionJudgeConfigResolver
- name: nlp-infrastructure
  description: "Infrastructure module for NLP processing. Provides SpaCy-backed tokenization\
    \ behind a factory, with internal caching. Only the factory and configuration\
    \ model are public; all processing internals are package-private."
  dependsOn:
  - audit-domain
  models:
  - name: NlpTokenizerConfig
    type: record
    fields:
    - name: pythonScriptPath
      type: String
      description: Path to the SpaCy Python processing script
    - name: cocaDataPath
      type: String
      description: Path to the COCA frequency data file
    - name: timeoutSeconds
      type: int
      description: Maximum seconds to wait for SpaCy process completion
  interfaces:
  - name: NlpTokenizerFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "create(NlpTokenizerConfig config): NlpTokenizer"
  patterns:
  - type: Factory
    implementations:
    - SpacyNlpTokenizerFactory
    suppressed: false
    interface: NlpTokenizerFactory
  packages:
  - name: spacy
    description: SpaCy-backed NLP tokenization internals. Only the factory is public;
      all processing classes are package-private.
    visibility: public
    implementations:
    - name: SpacyNlpTokenizerFactory
      types:
      - Component
      visibility: public
      handwrittenTests:
      - name: should invoke the SpaCy-backed pipeline using the pythonScriptPath and
          cocaDataPath provided in NlpTokenizerConfig (not a hardcoded location) and
          propagate a clear error citing the missing path when either points to a
          non-existent or unreadable file
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R021
      - name: "Given an environment where SpaCy is not available, when the factory\
          \ creates the tokenizer and an audit runs, then basic-count analyzers complete\
          \ normally while enriched-token-requiring analyzers are reported as omitted\
          \ in the final audit report"
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R030
          journey: F-NLP-J002
      implements:
      - NlpTokenizerFactory
    - name: SpacyNlpTokenizer
      requiresInject:
      - name: processRunner
        type: SpacyProcessRunner
      - name: resultParser
        type: SpacyResultParser
      visibility: package-private
      handwrittenTests:
      - name: should produce every NlpToken with the six mandatory fields text lemma
          posTag frequencyRank isStop and isPunct populated except frequencyRank which
          may be null when COCA has no entry
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R001
      - name: should never fail when the optional NlpToken fields tag isAlpha and
          dep are absent confirming they are not required for the tokenizer contract
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R002
      - name: should populate the lemma field with the lowercased base form returned
          by SpaCy so that running yields run was yields be and children yields child
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R003
      - name: should populate the posTag field with one of the Universal Dependencies
          tags (NOUN VERB ADJ ADV PROPN NUM ADP AUX CCONJ DET INTJ PART PRON SCONJ
          PUNCT SYM SPACE X) for every token produced
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R004
      - name: should produce a List<NlpToken> from analyzeTokens replacing the legacy
          List<String> tokenize representation as the primary tokenizer output
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R005
      - name: should expose analyzeTokens(String) returning a List<NlpToken> for a
          single sentence with linguistic enrichment for every word
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R006
      - name: should still report a usable token count via the size of the analyzeTokens
          result without requiring a separate countTokens call so SentenceLengthAnalyzer
          continues to work
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R007
      - name: should not implement any analyzer interface confirming the tokenizer
          is an infrastructure service that only transforms text into enriched tokens
          without producing scores
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R009
      - name: should derive the frequencyRank from the COCA entry matched against
          the token's lemma and not the inflected form so that running running and
          ran all carry the same rank as run
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R011
      - name: should map every Universal Dependencies posTag emitted by SpaCy to its
          corresponding COCA single-character code (NOUN to n VERB to v ADJ to j ADV
          to r PRON to p DET to a ADP to i CONJ/CCONJ/SCONJ to c NUM to m PART/PRT
          to t INTJ to u SYM/PUNCT/SPACE/X to x) when looking up frequency
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R012
      - name: should apply the three-tier COCA lookup strategy resolving frequencyRank
          by exact-word match first then by lemma+pos-code match and finally by lemma-only
          match before giving up
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R013
      - name: should ignore the first 8 metadata lines and the column header line
          of lemmas_20k_words.txt and parse the TSV body so that lookups use the correct
          lemRank lemma PoS lemFreq wordFreq and word columns
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R014
      - name: should load the COCA frequency data only once during initialization
          and then resolve every subsequent token lookup against the in-memory index
          without re-reading the file
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R015
      - name: should set the token frequencyRank to the lemRank column of the matched
          COCA entry not to the wordFreq of the specific inflected form
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R016
      - name: should delegate linguistic processing to an external SpaCy-backed pipeline
          (Python process with en_core_web_sm) producing tokenization lemmatization
          POS tagging and stop-word/punctuation detection in a single pass
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R017
      - name: should perform tokenization lemmatization POS tagging and COCA frequency
          lookup all within the same SpaCy-backed processing step without splitting
          them across multiple external calls
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R019
      - name: should produce a clear runtime error indicating the missing environment
          component (Python 3.11+ SpaCy en_core_web_sm or lemmas_20k_words.txt) when
          the tokenizer is invoked without the required environment installed
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R020
      - name: should produce a valid NlpToken with frequencyRank set to null and all
          other linguistic fields populated when the three-tier COCA lookup finds
          no entry for the token
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R028
      - name: should propagate a descriptive exception (and not return partial or
          corrupt tokens) when the underlying Python process fails to start exits
          abnormally or returns invalid JSON output
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R029
      - name: should continue tokenizing the remaining sentences of a batch and emit
          a fallback NlpToken (text as-is lemma=lowercased text posTag=X frequencyRank=null
          isStop=false isPunct=heuristic) when a single token inside SpaCy fails
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R032
      implements:
      - NlpTokenizer
    - name: SpacyProcessRunner
      requiresInject:
      - name: config
        type: NlpTokenizerConfig
      visibility: package-private
      handwrittenTests:
      - name: should terminate the SpaCy python process and return no tokens with
          a timeout error citing the configured value when processing exceeds NlpTokenizerConfig.timeoutSeconds
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R031
    - name: SpacyResultParser
      visibility: package-private
    - name: CachedNlpTokenizer
      requiresInject:
      - name: delegate
        type: NlpTokenizer
      visibility: package-private
      handwrittenTests:
      - name: should serve repeated analyzeTokens calls for the same sentence text
          from an in-memory cache so that the delegate NlpTokenizer is invoked only
          on the first call
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R023
      - name: should treat two sentences differing in any single character (case spacing
          punctuation) as distinct cache entries triggering a fresh delegate invocation
          for each variant
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R024
      - name: should cache List<NlpToken> produced by analyzeTokens with the same
          decorator pattern previously used for tokenize String results so cached
          entries match the enriched signature
        traceability:
          feature: FEAT-NLP
          rule: F-NLP-R026
      implements:
      - NlpTokenizer
- name: vocabulary-infrastructure
  description: "Infrastructure module for linguistic reference catalogs (EVP vocabulary\
    \ profiles, COCA frequency data). Provides static lookup data for vocabulary analysis.\
    \ Separate from NLP processing (which handles runtime tokenization)."
  dependsOn:
  - audit-domain
  packages:
  - name: evp
    description: "EVP catalog access — expected lemmas by CEFR level, semantic categories"
    visibility: internal
    implementations:
    - name: FileSystemEvpCatalog
      visibility: public
      handwrittenTests:
      - name: should retain C1 and C2 catalog entries at load and resolve their level
          for misplacement lookup
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R033
      - name: should resolve lookupLevelByLemma to the minimum level across the pos
          entries of the lemma
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R036
      - name: should return empty from lookupLevelByLemma when the lemma has no entry
          under any pos
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R036
      - name: should return empty from exact lookupLevel when the only catalog entry
          for the pair is phrasal
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R005
      - name: should return empty from lookupLevelByLemma when the only catalog entry
          for the lemma is phrasal
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R005
      - name: should resolve the single word entry level when the lemma also has phrasal
          entries
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R005
      - name: should return empty from exact lookupLevel when the only entry for the
          pair is a derived form whose headword differs from the lemma
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R040
      - name: should ignore derived-form entry levels in the lemma fallback and resolve
          the base word entry level
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R040
      - name: should return empty from both lookups when the lemma only has derived
          and compound form entries
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R040
      - name: should match an entry under its EVP declared part of speech rather than
          the auto computed tag
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R041
      - name: should fall back to the auto computed tag when the entry declares no
          EVP part of speech
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R041
      - name: should keep the auto computed tag for single word entries whose EVP
          category is phrase
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R041
      - name: should lower the exact lookupLevel level when a lower level phrase entry
          exists for the same lemma
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R042
      - name: should lower the lookupLevelByLemma level when a lower level phrase
          entry exists for the same lemma
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R042
      - name: should lower the lemma level for a single word entry whose EVP category
          is phrase
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R042
      - name: should never invent a level from a phrase entry when the lemma has no
          reachable word entry
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R042
      - name: should lower a content pos lookupLevel when a lower level non-content
          pos entry exists for the lemma
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R043
      - name: should not lower a content pos lookupLevel when the lemma has no non-content
          pos entry
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R043
      - name: should bridge noun and adverb entries and resolve the minimum level
          for a noun lookupLevel
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R044
      - name: should bridge noun and adverb entries and resolve the minimum level
          for an adverb lookupLevel
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R044
      - name: should not bridge adjective and adverb entries when resolving an adverb
          lookupLevel
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R044
      - name: should resolve the lemma level from a regular plural variant entry differing
          from the lemma only by the plural suffix
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R040
      - name: should resolve the lemma level from an acronym variant entry differing
          from the lemma only by letter case
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R040
      - name: should exclude curated metalanguage entries from the expected lemmas
          of a level
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R046
      - name: should still resolve the level of a curated metalanguage entry for misplacement
          lookup
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R046
      - name: should keep a non-metalanguage entry in the expected lemmas of its level
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R046
      implements:
      - EvpCatalogPort
  - name: coca
    description: COCA frequency ranking lookups
    visibility: internal
- name: audit-infrastructure
  description: "Filesystem persistence adapters for audit reports, refinement plans,\
    \ revision artifacts, impact previews and the active analysis selection. Hosts\
    \ the five adapters that the CLI composition root wires into the corresponding\
    \ ports (AuditReportStore, RefinementPlanStore, RevisionArtifactStore, ImpactPreviewStore,\
    \ ActiveAnalysisSelectionStore). The active-analysis-selection adapter writes\
    \ a single dotfile under .content-audit/ so cualquier consumidor del CLI lo lee\
    \ con la misma simetria que los demas stores filesystem."
  dependsOn:
  - audit-domain
  - refiner-domain
  - revision-domain
  implementations:
  - name: FileSystemAuditReportStore
    requiresInject:
    - name: baseDir
      type: Path
      description: Directorio raiz bajo el cual se resuelve .content-audit/audits/.
        Lo provee la composition root (audit-cli.Main) tipicamente como Path.of(System.getProperty("user.dir"))
        o el path del flag --course.
    types:
    - Repository
    visibility: public
    handwrittenTests:
    - name: should save an AuditReport and load it back with identical content
      _change: delete
    implements:
    - AuditReportStore
  - name: FileSystemRefinementPlanStore
    requiresInject:
    - name: baseDir
      type: Path
      description: Directorio raiz bajo el cual se resuelve .content-audit/refinement-plans/.
        Lo provee la composition root (audit-cli.Main).
    types:
    - Repository
    visibility: public
    implements:
    - RefinementPlanStore
  - name: FileSystemRevisionArtifactStore
    requiresInject:
    - name: baseDir
      type: Path
      description: Directorio raiz bajo el cual se resuelve .content-audit/revisions/<planId>/.
        Lo provee la composition root (audit-cli.Main).
    types:
    - Repository
    visibility: public
    handwrittenTests:
    - name: "Given a RevisionArtifact, when save is called, then a file is written\
        \ under .content-audit/revisions/"
      traceability:
        feature: FEAT-REVBYP
        rule: F-REVBYP-R008
    - name: "Given an artifact for plan P1 and proposal PR1, when save is called,\
        \ then the file path is .content-audit/revisions/P1/PR1.<ext>"
      traceability:
        feature: FEAT-REVBYP
        rule: F-REVBYP-R009
    - name: "Given a persisted artifact, when load is called, then all RevisionProposal\
        \ fields plus verdict and rejectionReason are recoverable"
      traceability:
        feature: FEAT-REVBYP
        rule: F-REVBYP-R010
    - name: "Given artifacts saved under multiple plan directories, when findByProposalId(id,\
        \ Optional.empty()) is called, then it scans subdirectories and returns the\
        \ matching artifact"
      traceability:
        feature: FEAT-REVAPR
        rule: F-REVAPR-R002
    - name: "Given no artifact matches the id, when findByProposalId(id, Optional.empty())\
        \ is called, then it returns Optional.empty"
      traceability:
        feature: FEAT-REVAPR
        rule: F-REVAPR-R002
    - name: "Given an artifact saved under plan P1, when findByProposalId(id, Optional.of(P1))\
        \ is called, then it takes the direct path and returns the artifact"
      traceability:
        feature: FEAT-REVAPR
        rule: F-REVAPR-R002
    - name: "Given no artifact under plan P1 with that id, when findByProposalId(id,\
        \ Optional.of(P1)) is called, then it returns Optional.empty"
      traceability:
        feature: FEAT-REVAPR
        rule: F-REVAPR-R002
    - name: "Given a PENDING_APPROVAL artifact whose taskId matches, when hasPendingProposalForTask\
        \ is called, then it returns true"
      traceability:
        feature: FEAT-REVAPR
        rule: F-REVAPR-R009
    - name: "Given only an APPROVED artifact exists for the task, when hasPendingProposalForTask\
        \ is called, then it returns false"
      traceability:
        feature: FEAT-REVAPR
        rule: F-REVAPR-R009
    - name: "Given only a REJECTED artifact exists for the task, when hasPendingProposalForTask\
        \ is called, then it returns false"
      traceability:
        feature: FEAT-REVAPR
        rule: F-REVAPR-R009
    - name: "Given no artifact exists for the task, when hasPendingProposalForTask\
        \ is called, then it returns false"
      traceability:
        feature: FEAT-REVAPR
        rule: F-REVAPR-R009
    - name: "Given artifacts saved under multiple plan directories, when list() is\
        \ called, then it returns all of them across all plans"
      traceability:
        feature: FEAT-REVAPR
        rule: F-REVAPR-R002
    - name: "Given the revisions directory is empty or missing, when list() is called,\
        \ then it returns an empty list"
      traceability:
        feature: FEAT-REVAPR
        rule: F-REVAPR-R002
    - name: "Given the store is constructed with a non-default baseDir, when save\
        \ is called, then the artifact file lands under <baseDir>/.content-audit/revisions/<planId>/<proposalId>.*\
        \ and NOT under System.getProperty('user.dir')"
      traceability:
        feature: FEAT-REVAPR
        rule: F-REVAPR-R017
    implements:
    - RevisionArtifactStore
  - name: FileSystemImpactPreviewStore
    requiresInject:
    - name: baseDir
      type: Path
      description: Directorio raiz bajo el cual se resuelve .content-audit/revisions/<planId>/<proposalId>.preview.json.
        Lo provee la composition root (audit-cli.Main).
    types:
    - Repository
    visibility: public
    handwrittenTests:
    - name: "Dado un ImpactPreview ya persistido bajo un proposalId, cuando save se\
        \ invoca por segunda vez con otro ImpactPreview con el mismo proposalId, entonces\
        \ findByProposalId retorna el preview persistido originalmente y no el nuevo"
      traceability:
        feature: FEAT-PIPRE
        rule: F-PIPRE-R008
    - name: "Dado un ImpactPreview persistido en disco, cuando findByProposalId se\
        \ invoca con su proposalId, entonces retorna el ImpactPreview con todos sus\
        \ levelImpacts, availability y unavailability intactos"
      traceability:
        feature: FEAT-PIPRE
        rule: F-PIPRE-R008
    implements:
    - ImpactPreviewStore
  - name: FileSystemActiveAnalysisSelectionStore
    types:
    - Repository
    visibility: public
    handwrittenTests:
    - name: "Dado un ActiveAnalysisSelection escrito previamente con write, cuando\
        \ read corre, entonces retorna un Optional con esa misma seleccion (auditId\
        \ y planId)"
      traceability:
        feature: FEAT-CDIFF
        rule: F-CDIFF-R001
    - name: "Dado un store sin seleccion previa (archivo ausente), cuando read corre,\
        \ entonces retorna Optional.empty"
      traceability:
        feature: FEAT-CDIFF
        rule: F-CDIFF-R001
    - name: "Dado un store con una seleccion ya escrita, cuando write se invoca con\
        \ la misma seleccion, entonces el archivo no se reescribe (write idempotente\
        \ y no destructivo a nivel observable)"
      traceability:
        feature: FEAT-CDIFF
        rule: F-CDIFF-R002
    - name: "Dado un store con una seleccion escrita, cuando clear corre, entonces\
        \ read posterior retorna Optional.empty"
      traceability:
        feature: FEAT-CDIFF
        rule: F-CDIFF-R001
    - name: "Dado un courseRoot con AuditReports y RefinementPlans persistidos, cuando\
        \ write y clear se invocan sobre el ActiveAnalysisSelectionStore, entonces\
        \ ningun AuditReport, RefinementPlan, RevisionArtifact ni archivo del curso\
        \ se modifica"
      traceability:
        feature: FEAT-CDIFF
        rule: F-CDIFF-R002
    implements:
    - ActiveAnalysisSelectionStore
  scope: internal
- name: revision-domain
  description: "Domain module for the revision phase of the refinement pipeline. Consumes\
    \ refiner-domain (task and CorrectionContext), course-domain (course entities\
    \ and the CourseRepository port owned by the caller) and audit-domain (AuditReport\
    \ / AuditEngine / ActiveAnalysisSelectionStore for the eager what-if simulation\
    \ that powers the impact preview and the consolidated view). Exposes Reviser/RevisionValidator/RevisionArtifactStore/CourseElementLocator/ImpactPreviewStore\
    \ ports plus the RevisionEngineFactory seam, the lemmaabsence proposal-strategy\
    \ SPI, the impactpreview SPI (FEAT-PIPRE) and the consolidatedview SPI (FEAT-CDIFF)\
    \ — including the dynamic field-diff engine that powers FEAT-CDIFF v3 (recursive\
    \ walker + central role-based exclusion registry + central list-identity registry,\
    \ all inside the fielddiff package). The bypass baseline, the impact-preview internals,\
    \ the consolidated-view internals and the field-diff internals live behind their\
    \ respective internal packages; external modules only see factories, ports and\
    \ carrier records."
  dependsOn:
  - audit-domain
  - refiner-domain
  - course-domain
  models:
  - name: RevisionVerdict
    type: enum
    fields:
    - name: APPROVED
    - name: REJECTED
    - name: PENDING_APPROVAL
      description: The validator has deferred the decision to a human operator (R007).
        The artifact is persisted but the course is not written.
  - name: RevisionOutcomeKind
    type: enum
    fields:
    - name: APPROVED_APPLIED
      description: Proposal approved and course rewritten (R011)
    - name: APPROVED_APPLY_FAILED
      description: "Proposal approved, artifact persisted, course write failed (R014,\
        \ DOUBT-ATOMICITY)"
    - name: REJECTED
      description: Proposal rejected by validator; course untouched (R012)
    - name: NO_REVISER
      description: No Reviser accepts the DiagnosisKind (R005)
    - name: CONTEXT_UNAVAILABLE
      description: CorrectionContext could not be resolved from the audit report
    - name: ELEMENT_NOT_FOUND
      description: Target element (nodeTarget+nodeId) not present in the loaded course
    - name: PENDING_APPROVAL_PERSISTED
      description: Proposal persisted with PENDING_APPROVAL; course untouched (R008)
    - name: ALREADY_PENDING_DECISION
      description: revise rejected because the task already has a pending proposal
        (R010)
    - name: NO_ACTIVE_STRATEGY
      description: "A LEMMA_ABSENCE task reached the dispatcher but no LemmaAbsenceProposalStrategy\
        \ was active. No artifact, no course write, task unchanged (F-LAPS-R006, F-LAPS-J004)."
    - name: STRATEGY_FAILED
      description: "The active strategy could not produce a candidate (empty output,\
        \ provider down, uninterpretable response) or its candidate could not be derived.\
        \ No artifact, no course write, task unchanged (F-LAPS-R015, F-LAPS-R016,\
        \ F-LAPS-J003)."
    - name: OVERRIDE_INVALID
      description: "El correctionContext provisto externamente no respeta el contrato\
        \ estructural (R003) o no es coherente con la tarea persistida (sanity check\
        \ de nodeId+diagnosisKind, DOUBT-OVERRIDE-COHERENCE). No se persiste artefacto,\
        \ no se modifica curso ni tarea."
    - name: OVERRIDE_NOT_APPLICABLE
      description: La tarea revisada es de un DiagnosisKind para el cual no existe
        contrato de correctionContext (R004). El override no tiene como afectar al
        bypass; se rechaza la invocacion sin persistir artefacto.
  - name: CourseElementSnapshot
    type: record
    fields:
    - name: nodeTarget
      type: AuditTarget
      description: QUIZ/KNOWLEDGE/TOPIC/MILESTONE/COURSE
    - name: nodeId
      type: String
      description: Identifier of the targeted node
    - name: quiz
      type: QuizTemplateEntity
      description: Full quiz snapshot when nodeTarget=QUIZ; null otherwise
    - name: knowledge
      type: KnowledgeEntity
      description: "Snapshot completo del knowledge cuando nodeTarget=KNOWLEDGE; null\
        \ en otro caso. Coexiste con `quiz` (nodeTarget=QUIZ). nodeTarget es el discriminante:\
        \ el locator enruta la lectura/escritura segun su valor, preservando intacto\
        \ el camino QUIZ (F-KTLR-R006, R007, R008)."
  - name: RevisionProposal
    type: record
    fields:
    - name: proposalId
      type: String
      description: "Unique id, convention <taskId>-<timestamp> (R009)"
    - name: taskId
      type: String
      description: Originating RefinementTask id
    - name: planId
      type: String
      description: Owning RefinementPlan id
    - name: sourceAuditId
      type: String
      description: AuditReport that produced the plan
    - name: diagnosisKind
      type: DiagnosisKind
      description: Diagnosis that drove the revision
    - name: nodeTarget
      type: AuditTarget
    - name: nodeId
      type: String
    - name: elementBefore
      type: CourseElementSnapshot
      description: Element state before the revision (R001)
    - name: elementAfter
      type: CourseElementSnapshot
      description: Proposed element state; equals elementBefore in bypass (R002)
    - name: rationale
      type: String
      description: "Human-readable justification; 'bypass: identity revision' in bypass\
        \ (R004)"
    - name: reviserKind
      type: String
      description: Reviser identifier; 'bypass' in this iteration
    - name: createdAt
      type: Instant
    - name: strategyId
      type: StrategyId
      description: Identity of the strategy that produced this proposal (F-LAPS-R005);
        null when produced by the bypass reviser for non-LEMMA_ABSENCE diagnostics
        (FEAT-REVBYP).
  - name: RevisionArtifact
    type: record
    fields:
    - name: proposal
      type: RevisionProposal
    - name: verdict
      type: RevisionVerdict
      description: APPROVED/REJECTED (R006)
    - name: rejectionReason
      type: String
      description: Populated when verdict=REJECTED; null when APPROVED (R010)
    - name: outcome
      type: RevisionOutcomeKind
      description: Final flow outcome including course-write failures (R014)
    - name: decidedAt
      type: Instant
      description: Timestamp when the verdict transitioned from PENDING_APPROVAL to
        APPROVED/REJECTED; null while pending or for auto-mode artifacts that never
        passed through PENDING_APPROVAL
    - name: decisionNote
      type: String
      description: "Free-text note attached by the operator on approve/reject (R011\
        \ --note, R012 --reason); null if not provided"
    - name: contextSource
      type: CorrectionContextSource
      description: "Origen del correctionContext consumido por la estrategia (FEAT-REVCTX\
        \ R002 #3). DERIVED para artefactos pre-FEAT-REVCTX o invocaciones sin override;\
        \ OVERRIDE cuando el cliente provee el contexto via revise --correction-context(-file)."
    - name: contextOverridePayload
      type: String
      description: Snapshot crudo del JSON entregado por el cliente como override
        (DOUBT-OVERRIDE-AUDITABILITY Opcion A). Null cuando contextSource=DERIVED.
        Se persiste literal para que la auditoria del artefacto sea reconstruible
        a posteriori.
  - name: RevisionOutcome
    type: record
    fields:
    - name: kind
      type: RevisionOutcomeKind
    - name: artifact
      type: RevisionArtifact
      description: Persisted artifact; null for pre-proposal aborts
    - name: errorMessage
      type: String
      description: Human-readable message for failure outcomes
  - name: RevisionEngineConfig
    type: record
    fields:
    - name: revisers
      type: "Map<DiagnosisKind,Reviser>"
      description: Per-DiagnosisKind Revisers (R003). May be empty; factory adds IdentityReviser
        as the catch-all fallback (R004).
    - name: validator
      type: RevisionValidator
      description: Optional; factory uses AutoApproveValidator when null (R007)
    - name: artifactStore
      type: RevisionArtifactStore
      description: Required; no default (needs filesystem root)
    - name: courseRepository
      type: CourseRepository
      description: Required; caller owns course IO wiring
    - name: elementLocator
      type: CourseElementLocator
      description: Optional; factory uses DefaultCourseElementLocator when null
    - name: refinementPlanStore
      type: RefinementPlanStore
      description: Required; needed to load/save the task
    - name: auditReportStore
      type: AuditReportStore
      description: Required; needed to resolve the CorrectionContext
    - name: contextResolver
      type: CorrectionContextResolver<CorrectionContext>
      description: Required; caller owns the resolver registry
    - name: lemmaAbsenceStrategyRegistry
      type: LemmaAbsenceProposalStrategyRegistry
      description: "Registry of registered LEMMA_ABSENCE strategies. Nullable -> the\
        \ factory wires an empty registry, in which case every LEMMA_ABSENCE task\
        \ resolves to NO_ACTIVE_STRATEGY (F-LAPS-R006)."
    - name: lemmaAbsenceProposalDeriver
      type: LemmaAbsenceProposalDeriver
      description: Deterministic deriver used when a LEMMA_ABSENCE candidate must
        be converted into a CourseElementSnapshot (F-LAPS-R012). Nullable -> the factory
        wires DefaultLemmaAbsenceProposalDeriver.
    - name: courseMapper
      type: CourseMapper
      description: "FEAT-PIPRE. Pure CourseEntity -> AuditableCourse mapper used by\
        \ the impact-preview computer to map the simulated course in memory. Required\
        \ (no default): the engine cannot fabricate one because it would have to know\
        \ about NlpTokenizer / QuizSentenceConverter wiring that lives outside revision-domain.\
        \ The CLI passes the same instance it already wires for AuditRunner."
    - name: auditEngine
      type: AuditEngine
      description: "FEAT-PIPRE. Re-runs the audit on the simulated AuditableCourse\
        \ to produce the 'after' AuditReport without persisting any official report\
        \ (F-PIPRE-R002). Required (no default): like courseMapper, lives in audit-domain\
        \ whose IAuditEngine wiring is the CLI's responsibility."
    - name: impactPreviewStore
      type: ImpactPreviewStore
      description: "FEAT-PIPRE. Filesystem (or future) sidecar store for the per-proposal\
        \ preview. Required (no default): the persistence root is a CLI-level concern."
    - name: correctionContextOverrideParser
      type: CorrectionContextOverrideParser
      description: FEAT-REVCTX. Parser de overrides JSON usado por el engine cuando
        recibe la invocacion con override (revise(...) overload). Nullable -> la factory
        wirea DefaultCorrectionContextOverrideParser. La unica responsabilidad del
        parser es traducir el JSON crudo a un CorrectionContextOverride o lanzar OverrideRejectedException;
        el engine sigue siendo el que decide si invocar al parser segun el overload
        usado.
    - name: knowledgeTitleStrategyRegistry
      type: KnowledgeTitleProposalStrategyRegistry
      description: "Registry de estrategias KNOWLEDGE_TITLE_LENGTH registradas. Nullable\
        \ -> la factory wirea un registry vacio, en cuyo caso toda tarea KNOWLEDGE_TITLE_LENGTH\
        \ cae al IdentityReviser bypass (sin propuesta). Espejo de lemmaAbsenceStrategyRegistry\
        \ (F-KTLR-R003)."
    - name: knowledgeTitleProposalDeriver
      type: KnowledgeTitleProposalDeriver
      description: "Deriver determinista que convierte un KnowledgeTitleCandidate\
        \ en el elementAfter (title->label + instructions sobre copia del knowledge\
        \ before). Nullable -> la factory wirea DefaultKnowledgeTitleProposalDeriver.\
        \ Espejo de lemmaAbsenceProposalDeriver (F-KTLR-R005, R006, R007)."
  - name: ApprovalMode
    type: enum
    fields:
    - name: AUTO
      description: "Bypass validator — auto-approves every proposal (R005, inherited\
        \ from FEAT-REVBYP R007)"
    - name: HUMAN
      description: Human validator — every proposal becomes PENDING_APPROVAL (R005/R007)
  - name: ProposalDecisionOutcomeKind
    type: enum
    fields:
    - name: APPROVED_APPLIED
      description: Proposal approved and course rewritten (R011)
    - name: APPROVED_APPLY_FAILED
      description: "Proposal approved and artifact rewritten, but course write failed\
        \ (R011 step 6, DOUBT-ATOMICITY)"
    - name: REJECTED
      description: Proposal rejected; course untouched (R012)
    - name: NOT_FOUND
      description: No proposal matches the supplied id (R002/R011/R012)
    - name: ALREADY_DECIDED
      description: Proposal exists but its verdict is not PENDING_APPROVAL (R013)
    - name: PRESERVATION_VIOLATED
      description: "La revision aprobada habria cambiado atributos fuera del alcance\
        \ declarado de su tipo de correccion (F-RPRES-R001/R002/R003). Ni el artifact\
        \ pasa a APPROVED ni el curso se escribe: el apply aborta antes de persistir."
  - name: ProposalDecisionOutcome
    type: record
    fields:
    - name: kind
      type: ProposalDecisionOutcomeKind
    - name: artifact
      type: RevisionArtifact
      description: The artifact after the decision (APPROVED/REJECTED); null for NOT_FOUND
    - name: errorMessage
      type: String
      description: Human-readable message for NOT_FOUND/ALREADY_DECIDED/APPROVED_APPLY_FAILED
  - name: StrategyId
    type: record
    fields:
    - name: name
      type: String
      description: "Symbolic identifier, e.g. 'lemma-absence-mvp' (F-LAPS-R005)."
    - name: version
      type: String
      description: "Version string, e.g. '1.0.0'; distinguishes revisions of the same\
        \ name over time (F-LAPS-R005)."
    - name: providerId
      type: String
      description: "Opaque provider id for the underlying candidate generator, e.g.\
        \ 'llm:anthropic', 'fixture:golden'. Nullable when the strategy has no external\
        \ provider. Resolves DOUBT-STRATEGY-METADATA as the minimum-beyond-name+version\
        \ metadata."
  - name: LemmaAbsenceQuizCandidate
    type: record
    fields:
    - name: quizSentence
      type: String
      description: "Candidate exercise expressed in the FEAT-QSENT quizSentence DSL\
        \ (blanks '____', answer blocks '[variant1|variant2]', hints inline in parentheses).\
        \ One formal string encodes the sentence stem + blanks + correct answers +\
        \ accepted variants (F-LAPS-R009, R011, R019). Parsed by QuizSentenceConverter.parse\
        \ at derivation time (F-LAPS-R012). The strategy MAY but is not required to\
        \ reuse substrings of the context's quizSentence (FEAT-RCLAQS) — it emits\
        \ a fresh candidate."
    - name: translation
      type: String
      description: "Spanish translation of the new exercise (F-LAPS-R009). Copied\
        \ verbatim into elementAfter by the deriver (F-LAPS-R012). May differ from\
        \ elementBefore.translation when the candidate changed the sentence meaning\
        \ (F-LAPS-R013). The DSL of FEAT-QSENT does not cover translations, so this\
        \ is a sibling field, not an additional entry inside quizSentence."
  - name: ProposalStrategyFailedException
    type: exception
    fields:
    - name: strategyName
      type: String
      description: Name of the strategy that failed (F-LAPS-R015).
    - name: taskId
      type: String
      description: Id of the task the strategy was attempting.
    - name: reason
      type: String
      description: "Human-readable cause (empty generator response, provider down,\
        \ etc.)."
    message: "La estrategia de propuesta '%s' no pudo generar un candidato de quiz\
      \ para la tarea '%s': %s"
    extends: RuntimeException
  - name: ProposalDerivationException
    type: exception
    fields:
    - name: strategyName
      type: String
      description: Name of the strategy whose candidate was rejected by the deriver.
    - name: taskId
      type: String
      description: Id of the task.
    - name: reason
      type: String
      description: "Human-readable cause (invalid quizSentence grammar, empty translation,\
        \ etc.)."
    message: "No se pudo derivar elementAfter desde el candidato de la estrategia\
      \ '%s' en la tarea '%s': %s"
    extends: RuntimeException
  - name: ConsolidatedViewBuilderConfig
    type: record
    fields:
    - name: activeAnalysisSelectionStore
      type: ActiveAnalysisSelectionStore
      description: "Required. Lee/escribe el par activo. Adapter recomendado: FileSystemActiveAnalysisSelectionStore\
        \ en audit-infrastructure."
    - name: auditReportStore
      type: AuditReportStore
      description: Required. Lee el AuditReport baseline.
    - name: refinementPlanStore
      type: RefinementPlanStore
      description: Required. Lee el RefinementPlan activo.
    - name: revisionArtifactStore
      type: RevisionArtifactStore
      description: Required. listByPlan(activePlanId) para obtener aceptadas y pendientes.
    - name: courseRepository
      type: CourseRepository
      description: Required. Carga CourseEntity desde coursePath.
    - name: courseElementLocator
      type: CourseElementLocator
      description: Required. snapshot/replace de elementos del curso.
    - name: courseMapper
      type: CourseMapper
      description: Required. CourseEntity -> AuditableCourse.
    - name: auditEngine
      type: AuditEngine
      description: "Required. AuditableCourse -> AuditReport (in-memory, no persistido)."
    - name: nodeFieldDiffer
      type: NodeFieldDiffer
      description: F-CDIFF v3. Required. Motor de descubrimiento dinamico inyectado
        por la composition root via DefaultNodeFieldDifferFactory.create(). El factory
        de ConsolidatedViewBuilder lo unpackea del config y lo pasa a DefaultConsolidatedViewBuilder.
    visibility: public
  - name: CorrectionContextSource
    type: enum
    fields:
    - name: DERIVED
      description: El contexto fue derivado por el sistema desde el AuditReport y
        el plan persistente (camino historico de FEAT-REVBYP / FEAT-RCLA / FEAT-RCSL).
    - name: OVERRIDE
      description: El contexto fue provisto externamente por el cliente via revise
        --correction-context (FEAT-REVCTX R001).
  - name: CorrectionContextOverride
    type: record
    fields:
    - name: context
      type: CorrectionContext
      description: "Contexto ya parseado y validado estructuralmente (R003) y por\
        \ coherencia minima con la tarea persistida (nodeId + diagnosisKind, DOUBT-OVERRIDE-COHERENCE\
        \ Opcion B). Es el mismo tipo que produce el CorrectionContextResolver; la\
        \ estrategia activa lo consume sin saber su origen."
    - name: rawPayload
      type: String
      description: "JSON crudo entregado por el cliente, conservado verbatim para\
        \ auditabilidad (R002 #3, DOUBT-OVERRIDE-AUDITABILITY Opcion A). Viaja al\
        \ RevisionArtifact y se persiste tal cual."
  - name: OverrideRejectedException
    type: exception
    fields:
    - name: reason
      type: String
      description: "Mensaje accionable que identifica el motivo del rechazo (R003:\
        \ campo faltante, tipo invalido, valor fuera de dominio; o sanity check fallido:\
        \ nodeId/diagnosisKind no coinciden con la tarea persistida)."
    message: "correctionContext override rejected: %s"
    extends: RuntimeException
  interfaces:
  - name: Reviser
    stereotype: port
    sealed: false
    exposes:
    - signature: "propose(RefinementTask task, CorrectionContext context, CourseElementSnapshot\
        \ before): RevisionProposal"
    - signature: "handles(DiagnosisKind kind): boolean"
    - signature: "reviserKind(): String"
  - name: RevisionValidator
    stereotype: port
    sealed: false
    exposes:
    - signature: "validate(RevisionProposal proposal): RevisionValidatorResult"
  - name: RevisionValidatorResult
    sealed: false
    exposes:
    - signature: "verdict(): RevisionVerdict"
    - signature: "rejectionReason(): Optional<String>"
  - name: RevisionArtifactStore
    stereotype: port
    sealed: false
    exposes:
    - signature: "save(RevisionArtifact artifact): String"
    - signature: "load(String planId, String proposalId): Optional<RevisionArtifact>"
    - signature: "listByPlan(String planId): List<RevisionArtifact>"
    - signature: "findByProposalId(String proposalId, Optional<String> planId): Optional<RevisionArtifact>"
    - signature: "hasPendingProposalForTask(String planId, String taskId): boolean"
    - signature: "list(): List<RevisionArtifact>"
  - name: CourseElementLocator
    stereotype: port
    sealed: false
    exposes:
    - signature: "snapshot(CourseEntity course, AuditTarget target, String nodeId):\
        \ Optional<CourseElementSnapshot>"
    - signature: "replace(CourseEntity course, CourseElementSnapshot replacement):\
        \ CourseEntity"
    - signature: "alignQuizTitles(CourseEntity course, String knowledgeId): CourseEntity"
  - name: RevisionEngine
    stereotype: port
    sealed: false
    exposes:
    - signature: "revise(String planId, String taskId, Path coursePath, String overridePayload):\
        \ RevisionOutcome"
  - name: RevisionEngineFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "create(RevisionEngineConfig config): RevisionEngine"
  - name: RevisionValidatorFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "create(ApprovalMode mode): RevisionValidator"
  - name: ProposalDecisionService
    stereotype: port
    sealed: false
    exposes:
    - signature: "approve(String proposalId, Optional<String> planId, Optional<String>\
        \ note, Path coursePath): ProposalDecisionOutcome"
    - signature: "reject(String proposalId, Optional<String> planId, Optional<String>\
        \ reason): ProposalDecisionOutcome"
  - name: ProposalDecisionServiceFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "create(RevisionEngineConfig config): ProposalDecisionService"
  - name: LemmaAbsenceProposalStrategy
    stereotype: port
    sealed: false
    exposes:
    - signature: "id(): StrategyId"
    - signature: "handles(DiagnosisKind kind): boolean"
    - signature: "propose(RefinementTask task, LemmaAbsenceCorrectionContext context):\
        \ LemmaAbsenceQuizCandidate"
  - name: LemmaAbsenceProposalStrategyRegistry
    stereotype: service
    sealed: true
    exposes:
    - signature: "active(): Optional<LemmaAbsenceProposalStrategy>"
    - signature: "byName(String name): Optional<LemmaAbsenceProposalStrategy>"
    - signature: "listAll(): List<StrategyId>"
  - name: LemmaAbsenceProposalDeriver
    stereotype: service
    sealed: true
    exposes:
    - signature: "derive(CourseElementSnapshot before, LemmaAbsenceQuizCandidate candidate,\
        \ SentenceMode mode): CourseElementSnapshot"
  - name: ImpactPreviewStore
    stereotype: port
    sealed: false
    exposes:
    - signature: "save(ImpactPreview preview): void"
    - signature: "findByProposalId(String proposalId): Optional<ImpactPreview>"
    visibility: public
  - name: CorrectionContextOverrideParser
    stereotype: port
    sealed: false
    exposes:
    - signature: "parse(String rawJson, DiagnosisKind expectedDiagnosisKind, String\
        \ expectedNodeId): CorrectionContextOverride"
  - name: KnowledgeTitleProposalStrategy
    stereotype: port
    sealed: false
    exposes:
    - signature: "id(): StrategyId"
    - signature: "handles(DiagnosisKind kind): boolean"
    - signature: "propose(RefinementTask task, KnowledgeTitleCorrectionContext context):\
        \ KnowledgeTitleCandidate"
  - name: KnowledgeTitleProposalStrategyRegistry
    stereotype: service
    sealed: true
    exposes:
    - signature: "active(): Optional<KnowledgeTitleProposalStrategy>"
    - signature: "byName(String name): Optional<KnowledgeTitleProposalStrategy>"
    - signature: "listAll(): List<StrategyId>"
  - name: KnowledgeTitleProposalDeriver
    stereotype: service
    sealed: true
    exposes:
    - signature: "derive(CourseElementSnapshot before, KnowledgeTitleCandidate candidate):\
        \ CourseElementSnapshot"
  - name: PreservationFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "createCheck(): PreservationCheck"
    - signature: "createRepair(RevisionArtifactStore artifactStore): PreservationRepair"
    visibility: public
  patterns:
  - type: Strategy
    implementations:
    - LemmaAbsenceMvpStrategy
    suppressed: false
    interface: LemmaAbsenceProposalStrategy
  - type: Factory
    implementations:
    - DefaultPreservationFactory
    suppressed: false
    interface: PreservationFactory
  uses:
  - jackson-databind
  packages:
  - name: engine
    description: "Revision engine internals. Only DefaultRevisionEngineFactory, DefaultRevisionValidatorFactory,\
      \ DefaultProposalDecisionServiceFactory, DefaultLemmaAbsenceProposalStrategyRegistry,\
      \ DefaultLemmaAbsenceProposalDeriver and DefaultConsolidatedViewBuilderFactory\
      \ are public; every other class (DispatchingReviser, IdentityReviser, AutoApproveValidator,\
      \ DefaultRevisionValidatorResult, DefaultCourseElementLocator, DefaultRevisionEngine,\
      \ DefaultProposalDecisionService, HumanApprovalValidator, DefaultImpactPreviewComputer,\
      \ DefaultConsolidatedViewBuilder) is package-private. External modules wire\
      \ a RevisionEngine by calling factory.create(config); a ConsolidatedViewBuilder\
      \ by calling consolidatedViewBuilderFactory.create(config)."
    visibility: internal
    models:
    - name: LemmaAbsenceProposalStrategyRegistryConfig
      type: record
      fields:
      - name: registered
        type: List<LemmaAbsenceProposalStrategy>
        description: All strategies known to the registry (F-LAPS-R004).
      - name: activeName
        type: String
        description: Name of the active strategy; resolved via byName(). Nullable
          -> active() returns empty -> dispatcher returns NO_ACTIVE_STRATEGY for LEMMA_ABSENCE
          (F-LAPS-R006).
    - name: KnowledgeTitleProposalStrategyRegistryConfig
      type: record
      fields:
      - name: registered
        type: List<KnowledgeTitleProposalStrategy>
        description: Estrategias conocidas por el registry.
      - name: activeName
        type: String
        description: Nombre de la estrategia activa; resuelto via byName(). Nullable
          -> active() vacio -> el reviser reporta sin-estrategia (F-KTLR-R010).
    implementations:
    - name: DefaultRevisionEngineFactory
      types:
      - Component
      visibility: public
      handwrittenTests:
      - name: "Given a RevisionEngineConfig with an empty revisers map, when create\
          \ is called, then the produced engine uses IdentityReviser as fallback"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R004
      implements:
      - RevisionEngineFactory
    - name: IdentityReviser
      types:
      - Component
      handwrittenTests:
      - name: "Given a CorrectionContext, when propose is called, then it returns\
          \ a RevisionProposal with all R001 fields populated"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R001
      - name: "Given any before snapshot, when propose is called, then elementAfter\
          \ equals elementBefore"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R002
      - name: "Given any DiagnosisKind, when handles is called, then it returns true"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R004
      - name: "Given a proposal generated by IdentityReviser, then rationale equals\
          \ 'bypass: identity revision' and reviserKind equals 'bypass'"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R004
      implements:
      - Reviser
    - name: AutoApproveValidator
      types:
      - Component
      handwrittenTests:
      - name: "Given any RevisionProposal, when validate is called, then it returns\
          \ a RevisionValidatorResult with verdict APPROVED"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R007
      - name: "Given an approved result, when rejectionReason is queried, then it\
          \ returns Optional.empty"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R006
      implements:
      - RevisionValidator
    - name: DefaultRevisionValidatorResult
      requiresInject:
      - name: verdict
        type: RevisionVerdict
        description: Verdict resultante de evaluar la proposal (APPROVED / REJECTED
          / PENDING_APPROVAL).
      - name: rejectionReason
        type: Optional<String>
        description: Detalle textual cuando verdict=REJECTED; Optional.empty() cuando
          APPROVED o PENDING_APPROVAL.
      implements:
      - RevisionValidatorResult
    - name: DispatchingReviser
      requiresInject:
      - name: byKind
        type: "Map<DiagnosisKind,Reviser>"
        description: Revisers registered per DiagnosisKind (FEAT-REVBYP R003). Preserved
          for non-LEMMA_ABSENCE kinds.
      - name: fallback
        type: IdentityReviser
        description: "Bypass fallback for unmatched DiagnosisKinds OTHER THAN LEMMA_ABSENCE\
          \ (F-LAPS-R002, R006)."
      - name: strategyRegistry
        type: LemmaAbsenceProposalStrategyRegistry
        description: Resolves the active LemmaAbsenceProposalStrategy; LEMMA_ABSENCE
          tasks route here instead of to fallback (F-LAPS-R002).
      - name: deriver
        type: LemmaAbsenceProposalDeriver
        description: Derives elementAfter deterministically from a LemmaAbsenceQuizCandidate
          (F-LAPS-R012).
      types:
      - Component
      handwrittenTests:
      - name: "Given a Reviser registered for SENTENCE_LENGTH, when propose is called\
          \ with a SENTENCE_LENGTH task, then the registered Reviser handles it"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R003
      - name: "Given no Reviser registered for a DiagnosisKind, when propose is called,\
          \ then the IdentityReviser fallback handles it"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R004
      - name: "Given neither a registered Reviser nor a fallback, when handles is\
          \ queried for an unknown DiagnosisKind, then it returns false"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R005
      - name: "Given a task whose diagnosisKind is LEMMA_ABSENCE and a registry with\
          \ an active strategy, when propose is called, then the DispatchingReviser\
          \ routes to the strategy+deriver pipeline and NOT to the IdentityReviser\
          \ fallback"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R002
      - name: "Given a task whose diagnosisKind is LEMMA_ABSENCE and a registry with\
          \ no active strategy, when propose is called, then it returns an outcome\
          \ with kind NO_ACTIVE_STRATEGY (no fallback to bypass)"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R006
      - name: "Given a LEMMA_ABSENCE task and an active strategy that throws ProposalStrategyFailedException,\
          \ when propose is called, then it returns an outcome with kind STRATEGY_FAILED\
          \ and no RevisionProposal is built"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R015
      - name: "Given a LEMMA_ABSENCE task and an active strategy whose candidate fails\
          \ derivation with ProposalDerivationException, when propose is called, then\
          \ it returns an outcome with kind STRATEGY_FAILED and no RevisionProposal\
          \ is built"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R015
      - name: "Given a STRATEGY_FAILED outcome, when its RevisionArtifact is inspected,\
          \ then there is no artifact at all (the outcome carries no REJECTED verdict,\
          \ no PENDING_APPROVAL verdict, no RevisionVerdict enum value)"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R016
      - name: "Given a NO_ACTIVE_STRATEGY outcome, when its RevisionArtifact is inspected,\
          \ then there is no artifact at all (the outcome carries no REJECTED verdict,\
          \ no PENDING_APPROVAL verdict, no RevisionVerdict enum value)"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R016
      - name: "Given a LEMMA_ABSENCE task and a strategy with id (name, version, providerId),\
          \ when the pipeline produces a RevisionProposal, then the proposal's strategyId\
          \ equals the strategy's id() verbatim (name + version + providerId)"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R005
      - name: "Given a LEMMA_ABSENCE task routed to the strategy pipeline, when the\
          \ resulting RevisionProposal is inspected, then its reviserKind reflects\
          \ the strategy name (not the literal 'bypass')"
        traceability:
          feature: FEAT-LAPS
          rule: F-LAPS-R005
      implements:
      - Reviser
    - name: DefaultCourseElementLocator
      types:
      - Component
      handwrittenTests:
      - name: "Given a course whose knowledge declares a REWRITE sentenceMode, when\
          \ replace swaps a quiz inside that knowledge, then the resulting knowledge\
          \ in the returned course keeps its REWRITE sentenceMode"
        traceability:
          feature: FEAT-SMODE
          rule: F-SMODE-R006
      - name: "Given an approved KNOWLEDGE_TITLE_LENGTH snapshot for an existing knowledge,\
          \ when replace writes to the course, then re-reading the course shows that\
          \ knowledge with the proposed title and instructions"
        traceability:
          feature: FEAT-KTLR
          rule: F-KTLR-R006
      - name: "Given a quiz-target snapshot, when replace writes the corrected quiz\
          \ to the course, then the quiz is persisted exactly as before this feature\
          \ with no regression from the knowledge route"
        traceability:
          feature: FEAT-KTLR
          rule: F-KTLR-R008
      - name: "Given a KNOWLEDGE_TITLE_LENGTH snapshot whose embedded knowledge quizTemplates\
          \ differ from the course's current quizzes (the course changed after the\
          \ snapshot was taken), when replace writes the knowledge, then the resulting\
          \ course keeps the current course quizzes and only the targeted knowledge's\
          \ title and instructions change"
        traceability:
          feature: FEAT-KTLR
          rule: F-KTLR-R007
      - name: should set the title of every quiz of the knowledge to the corrected
          label
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R004
      - name: should leave every attribute other than the title of those quizzes unchanged
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R004
      - name: should leave the quizzes of every other knowledge of the course untouched
          when aligning titles
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R003
      implements:
      - CourseElementLocator
    - name: DefaultRevisionEngine
      requiresInject:
      - name: refinementPlanStore
        type: RefinementPlanStore
      - name: auditReportStore
        type: AuditReportStore
      - name: contextResolver
        type: CorrectionContextResolver<CorrectionContext>
      - name: reviser
        type: Reviser
        description: Normally a DispatchingReviser
      - name: validator
        type: RevisionValidator
      - name: artifactStore
        type: RevisionArtifactStore
      - name: courseRepository
        type: CourseRepository
      - name: elementLocator
        type: CourseElementLocator
      - name: impactPreviewComputer
        type: ImpactPreviewComputer
        description: "FEAT-PIPRE. Invoked exactly once per generated RevisionProposal,\
          \ after the proposal is constructed and before/around the artifact save\
          \ (F-PIPRE-R001). Failures of the computer are NEVER propagated up; the\
          \ engine treats the returned ImpactPreview (AVAILABLE or UNAVAILABLE) as\
          \ data and persists it as a sidecar via impactPreviewStore. F-PIPRE-R010:\
          \ a preview failure does not abort proposal persistence."
      - name: impactPreviewStore
        type: ImpactPreviewStore
        description: "FEAT-PIPRE. Persists the ImpactPreview returned by impactPreviewComputer,\
          \ indexed by proposalId. Deliberately separate from RevisionArtifactStore\
          \ so the RevisionArtifact contract stays unchanged and the preview can be\
          \ fetched/listed independently in future iterations (DOUBT-BATCH-PREVIEW)."
      - name: correctionContextOverrideParser
        type: CorrectionContextOverrideParser
      types:
      - Component
      handwrittenTests:
      - name: "Given an APPROVED proposal, when revise runs, then CourseRepository\
          \ saves the updated course"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R011
      - name: "Given a REJECTED proposal, when revise runs, then CourseRepository\
          \ is never asked to save"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R012
      - name: "Given an APPROVED proposal applied successfully, when revise finishes,\
          \ then the RefinementTask transitions to DONE"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R013
      - name: "Given revise succeeds end-to-end, then artifactStore.save is invoked\
          \ before courseRepository.save"
        traceability:
          feature: FEAT-REVBYP
          rule: F-REVBYP-R014
      - name: "Given the human validator emits PENDING_APPROVAL, when revise runs,\
          \ then the artifact is persisted with PENDING_APPROVAL and CourseRepository\
          \ is never asked to save"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R008
      - name: "Given the human validator emits PENDING_APPROVAL, when revise finishes,\
          \ then the outcome kind is PENDING_APPROVAL_PERSISTED and the RefinementTask\
          \ stays PENDING"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R009
      - name: "Given the task already has a PENDING_APPROVAL proposal, when revise\
          \ runs, then the outcome is ALREADY_PENDING_DECISION and no new artifact\
          \ is persisted"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R010
      - name: "Dada una RevisionProposal generada, cuando revise corre, entonces ImpactPreviewComputer.compute\
          \ se invoca exactamente una vez con el curso actual y la propuesta recien\
          \ construida"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R001
      - name: "Dado un ImpactPreview computado, cuando revise corre, entonces el preview\
          \ se persiste via ImpactPreviewStore.save asociado al proposalId de la propuesta\
          \ antes de que el flujo retorne"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R001
      - name: "Dado un ImpactPreview UNAVAILABLE devuelto por el computer, cuando\
          \ revise corre, entonces la RevisionArtifact se persiste igual con su veredicto\
          \ inicial y el outcome no es de error"
        traceability:
          feature: FEAT-PIPRE
          rule: F-PIPRE-R010
      - name: should bypass contextResolver and consume the override payload as the
          strategy input when overridePayload is provided
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R002
      - name: should not perform any AuditReport-derived context construction for
          the revised task when overridePayload is provided
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R002
      - name: should produce OVERRIDE_INVALID outcome without persisting an artifact
          and without modifying the course when the parser rejects the override payload
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R003
      - name: should produce OVERRIDE_NOT_APPLICABLE outcome without persisting an
          artifact and without modifying the course when the task diagnosisKind has
          no context contract
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R004
      - name: should resolve the revised task from the persisted plan identified by
          planId and pass the override to the strategy regardless of any task identity
          hint embedded in the payload
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R005
      - name: should preserve the human approval flow and emit a PENDING_APPROVAL
          artifact when human approval mode is active and an override is provided
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R006
      - name: should persist the RevisionArtifact with contextSource=OVERRIDE and
          contextOverridePayload equal to the literal raw JSON received when an override
          is provided
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R007
      - name: should persist the RevisionArtifact with contextSource=DERIVED and a
          null contextOverridePayload when no override is provided
        traceability:
          feature: FEAT-REVCTX
          rule: F-REVCTX-R007
      - name: "Given a REJECTED KNOWLEDGE_TITLE_LENGTH proposal, when revise runs,\
          \ then the course is never saved and the knowledge keeps its original title\
          \ and instructions"
        traceability:
          feature: FEAT-KTLR
          rule: F-KTLR-R009
      implements:
      - RevisionEngine
    - name: HumanApprovalValidator
      types:
      - Component
      handwrittenTests:
      - name: "Given any RevisionProposal, when validate is called, then it returns\
          \ a RevisionValidatorResult with verdict PENDING_APPROVAL"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R007
      - name: "Given a PENDING_APPROVAL result, when rejectionReason is queried, then\
          \ it returns Optional.empty"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R007
      - name: "Given any RevisionProposal, when validate is called in human mode,\
          \ then the verdict field on the returned result is literally the PENDING_APPROVAL\
          \ enum value (new vocabulary)"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R001
      implements:
      - RevisionValidator
    - name: DefaultRevisionValidatorFactory
      types:
      - Component
      visibility: public
      handwrittenTests:
      - name: "Given ApprovalMode.AUTO, when create is called, then it returns an\
          \ AutoApproveValidator instance (exactly one validator active for the invocation)"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R006
      - name: "Given ApprovalMode.HUMAN, when create is called, then it returns a\
          \ HumanApprovalValidator instance (exactly one validator active for the\
          \ invocation)"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R006
      implements:
      - RevisionValidatorFactory
    - name: DefaultProposalDecisionServiceFactory
      types:
      - Component
      visibility: public
      implements:
      - ProposalDecisionServiceFactory
    - name: DefaultProposalDecisionService
      requiresInject:
      - name: artifactStore
        type: RevisionArtifactStore
      - name: courseRepository
        type: CourseRepository
      - name: elementLocator
        type: CourseElementLocator
      - name: refinementPlanStore
        type: RefinementPlanStore
        description: Needed to clear the task back to PENDING on reject (R014) and
          close it as DONE on approve
      - name: preservationCheck
        type: PreservationCheck
        description: "Guarda de F-RPRES-R001/R002/R003. Se consulta con el curso antes\
          \ y despues de elementLocator.replace y antes de escribir: si devuelve violaciones,\
          \ approve retorna PRESERVATION_VIOLATED sin tocar el artifact ni el curso."
      types:
      - Component
      handwrittenTests:
      - name: "Given a PENDING_APPROVAL artifact, when approve is called, then the\
          \ artifact is rewritten with verdict APPROVED and decidedAt set"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R011
      - name: "Given a PENDING_APPROVAL artifact, when approve is called, then the\
          \ course is loaded and saved with elementAfter applied via CourseRepository"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R011
      - name: "Given approve succeeds and the course is applied, then the associated\
          \ RefinementTask transitions to DONE"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R014
      - name: "Given approve is called with a --note, then the persisted artifact's\
          \ decisionNote carries that note"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R011
      - name: "Given no proposal matches the supplied id, when approve is called,\
          \ then the outcome is NOT_FOUND and no artifact or course is written"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R011
      - name: "Given a proposal whose verdict is already APPROVED, when approve is\
          \ called again, then the outcome is ALREADY_DECIDED and no side effects\
          \ occur"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R013
      - name: "Given a proposal whose verdict is already REJECTED, when approve is\
          \ called, then the outcome is ALREADY_DECIDED and no side effects occur"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R013
      - name: "Given approve rewrites the artifact to APPROVED but the course write\
          \ fails, then the artifact keeps APPROVED with decidedAt and the task does\
          \ not advance to DONE"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R014
      - name: "Given a PENDING_APPROVAL artifact, when reject is called, then the\
          \ artifact is rewritten with verdict REJECTED and decisionNote carrying\
          \ the --reason"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R012
      - name: "Given a PENDING_APPROVAL artifact, when reject is called, then CourseRepository\
          \ is never asked to load or save the course"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R012
      - name: "Given reject succeeds, then the associated RefinementTask returns to\
          \ its previous state (typically PENDING)"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R014
      - name: "Given no proposal matches the supplied id, when reject is called, then\
          \ the outcome is NOT_FOUND and no artifact or course is written"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R012
