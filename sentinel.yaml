          \ formateada incluye ambos identificadores en su raiz"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R001
      - name: "Dado un ConsolidatedView con availability UNAVAILABLE producido por\
          \ el builder, cuando getConsolidated corre, entonces el comando termina\
          \ con exit code cero y la salida formateada lleva la marca consolidatedAvailability=UNAVAILABLE\
          \ con su unavailabilityReason (no rellena con valores arbitrarios)"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R013
      - name: "Dada cualquier invocacion de getConsolidated, entonces no se invoca\
          \ AuditReportStore.save, RefinementPlanStore.save ni RevisionArtifactStore.save\
          \ sobre los stores inyectados al builder"
        traceability:
          feature: FEAT-CDIFF
          rule: F-CDIFF-R015
      implements:
      - GetConsolidatedCommand
    - name: DefaultSetActiveAnalysisCommand
      requiresInject:
      - name: activeAnalysisSelectionStore
        type: ActiveAnalysisSelectionStore
        description: Puerto al store del par activo.
      types:
      - Component
      handwrittenTests:
      - name: "Dada una invocacion setActive(auditId, planId) con valores no nulos,\
