          feature: FEAT-REVAPR
          rule: F-REVAPR-R012
      - name: "Given decisionService returns NOT_FOUND, when reject is invoked, then\
          \ the CLI prints 'No proposal found with id' and exits non-zero"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R002
      - name: "Given decisionService returns ALREADY_DECIDED, when reject is invoked,\
          \ then the CLI prints the already-decided error and exits non-zero"
        traceability:
          feature: FEAT-REVAPR
          rule: F-REVAPR-R013
      externalImplements:
      - java.util.concurrent.Callable<Integer>
      implements:
      - RejectCommand
    - name: DefaultGetConsolidatedCommand
      requiresInject:
