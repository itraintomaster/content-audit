  scope: internal
- name: audit-cli
  description: CLI entry point
  dependsOn:
  - audit-application
  - audit-domain
  - course-domain
  - course-infrastructure
  - nlp-infrastructure
  - vocabulary-infrastructure
  - audit-infrastructure
  - refiner-domain
  - revision-domain
  - revision-infrastructure
  - evaluation-ledger-domain
  - evaluation-ledger-infrastructure
  - agent-runtime-infrastructure
  - quiz-instruction-infrastructure
  models:
  - name: GetTasksFilter
    type: record
    fields:
    - name: planId
      type: Optional<String>
      description: "Restrict to tasks belonging to this plan id; if empty, the most\
        \ recent plan is used (R012)"
    - name: status
      type: Optional<String>
      description: "Restrict to tasks whose status matches this value, case-insensitive\
        \ (pending/completed/skipped) — R008"
    - name: sortByPriority
      type: boolean
      description: "If true, order results by ascending task priority — R008"
    - name: limit
      type: Optional<Integer>
      description: Cap the result count after filter+sort; 0 yields empty (R009);
        negative is rejected
    - name: target
      type: Optional<AuditTarget>
      description: Restrict to tasks whose nodeTarget matches this AuditTarget enum
        value; absent = no filter (R008)
    - name: diagnosisKind
      type: Optional<DiagnosisKind>
      description: Restrict to tasks whose diagnosisKind matches this DiagnosisKind
        enum value; absent = no filter (R008)
  - name: LagenMode
    type: enum
    fields:
    - name: LLM
      description: Default. The CLI wires the LangChain4j-backed generator from revision-infrastructure
        (F-LAGEN-R013).
    - name: CANNED
      description: "Opt-in offline mode. The CLI wires CannedLemmaAbsenceQuizCandidateGenerator\
        \ from revision-domain.lemmaabsence with fixed quizSentence/translation. DOUBT-CANNED-MODE-AVAILABILITY\
        \ -> Option B (kept as opt-in, never default)."
    visibility: public
  - name: PlanStorageMode
    type: enum
    fields:
    - name: DISK
      description: "Persistent path: el plan se guarda via RefinementPlanStore en\
        \ .content-audit/refinement-plans/. Comportamiento previo a F-PLANEF, sigue\
        \ siendo el default cuando el operador no pasa --storage."
    - name: EPHEMERAL
      description: "Modo efimero (F-PLANEF-R001). El comando plan calcula el plan,\
        \ NO lo persiste, y emite la representacion JSON completa por stdout. Mensajes\
        \ informativos van a stderr."
    visibility: public
  - name: EphemeralRenderOptions
    type: record
    fields:
    - name: withCorrectionContext
      type: boolean
      description: "F-PLANEF-R002: si true, cada task del plan emitido lleva inline\
        \ su correctionContext (o correctionContext=null + correctionContextError\
        \ si no es construible). Default OFF (DOUBT-CTX-DEFAULT opcion A)."
    visibility: public
  - name: SuggestedLemmasFilter
    type: record
    fields:
    - name: limit
      type: Optional<Integer>
      description: "Cantidad máxima de SuggestedLemma a devolver (F-CSLATDC-R008).\
        \ Vacío = el adaptador decide default; cero = lista vacía válida (F-CSLATDC-R009).\
        \ El adaptador NO está limitado por el cap interno de 10 del LemmaAbsenceContextResolver:\
        \ lo que se solicite (dentro de límites razonables) se respeta (F-CSLATDC-R011)."
    - name: partOfSpeech
      type: Optional<String>
      description: "Filtro opcional por part-of-speech (F-CSLATDC-R007). Vacío = sin\
        \ filtro de POS. El record SuggestedLemmasFilter es cerrado: no es posible\
        \ pasar filtros fuera de los tres declarados (F-CSLATDC-R013)."
    - name: level
      type: Optional<CefrLevel>
      description: "CefrLevel explícito (F-CSLATDC-R006). Vacío = el adaptador intenta\
        \ inferir desde la task (F-CSLATDC-R004); si no puede inferir y no se informó\
        , la consulta es rechazada con SuggestedLemmaQueryRejectedException (F-CSLATDC-R005).\
        \ Cualquier filtro adicional fuera de los tres declarados (p. ej. isIrregular)\
        \ tampoco puede pasarse: el record cerrado lo impide estructuralmente (F-CSLATDC-R013)."
    - name: includeExposed
      type: boolean
      description: "Opcion de la consulta de suggested-lemmas expuesta por el filtro\
        \ publico del CLI (F-INCEXP-R002). false (default) = comportamiento identico\
        \ a FEAT-CSLATDC: la senal de prioridad EXCLUYE los lemas ya suficientemente\
        \ expuestos (F-INCEXP-R001). true = amplia el universo a todos los lemas del\
        \ level+partOfSpeech incluyendo los ya expuestos, que quedan al final ordenados\
        \ por COCA ascendente (F-INCEXP-R002, F-INCEXP-R003, F-INCEXP-R004). Paridad\
        \ con SuggestedLemmaQueryCriteria.includeExposed (refiner-domain): GetCmd\
        \ mapea este campo al carrier al construir la consulta."
    - name: regex
      type: Optional<String>
      description: "Patron de texto opcional para filtrar los SuggestedLemma por su\
        \ forma superficial (F-SLREGEX-R002). Vacio (default) = sin filtrado textual;\
        \ el comportamiento queda identico a FEAT-CSLATDC/FEAT-INCEXP (F-SLREGEX-R001).\
        \ Coincidencia parcial estilo grep e insensible a la caja; el cliente ancla\
        \ con ^ y $ (F-SLREGEX-R003, F-SLREGEX-R004). Espeja la optionality de partOfSpeech.\
        \ GetCmd mapea este campo al carrier SuggestedLemmaQueryCriteria.regex (refiner-domain)\
        \ al construir la consulta."
    visibility: public
  - name: AnalyzeOptions
    type: record
    fields:
    - name: format
      type: String
    - name: level
      type: String
    - name: topic
      type: String
    - name: knowledge
      type: String
    - name: analyzers
      type: List<String>
    - name: excludeAnalyzers
      type: List<String>
      description: --exclude-analyzers (F-QINST-R011)
    - name: detailed
      type: boolean
    - name: instructionBudget
      type: Integer
      description: "--instruction-budget: tope de consultas nuevas al juez en esta\
        \ corrida. Null = el defecto del analizador (F-QINST-R006)."
    - name: reevaluateInstructions
      type: String
      description: "--reevaluate-instructions[=SCOPE]: pide volver a juzgar contenido\
        \ con veredicto vigente, acotado o total (F-QINST-R012)."
  interfaces:
  - name: AnalyzeCommand
    stereotype: port
    sealed: false
    exposes:
    - signature: "analyze(String coursePath, String format, String level, String topic,\
        \ String knowledge, List<String> analyzers, boolean detailed): Integer"
    - signature: "analyze(String coursePath,AnalyzeOptions options): Integer"
  - name: GetCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "get(String resource, String name, GetTasksFilter filter): Integer"
    - signature: "get(String resource, String name, SuggestedLemmasFilter filter):\
        \ Integer"
  - name: DeleteCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "delete(String resource, String id): Integer"
  - name: PruneCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "prune(String resource, int keep): Integer"
  - name: PlanCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "plan(String auditId, PlanStorageMode storageMode, boolean withCorrectionContext):\
        \ Integer"
  - name: ReviseCommand
    stereotype: port
    sealed: false
    exposes:
    - signature: "revise(String taskId, String planId, String correctionContextJson,\
        \ String correctionContextFilePath): Integer"
  - name: ConfigAnalyzerCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "showConfig(String analyzerName): Integer"
  - name: StatsAnalyzerCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "showStats(String analyzerName, String coursePath): Integer"
  - name: ApproveCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "approve(String resource, String proposalId, String planId, String\
        \ note): Integer"
  - name: RejectCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "reject(String resource, String proposalId, String planId, String\
        \ reason): Integer"
  - name: GetConsolidatedCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "getConsolidated(String coursePath, String format): Integer"
  - name: SetActiveAnalysisCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "setActive(String auditId, String planId): Integer"
  - name: LexisCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "queryLexis(String quizSentence, String mode, String level): Integer"
  - name: RepairCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "repair(String resource, String coursePath, boolean dryRun): Integer"
    visibility: public
  patterns:
  - type: Strategy
    implementations:
    - TextReportFormatter
    - JsonReportFormatter
    - TableReportFormatter
    suppressed: false
