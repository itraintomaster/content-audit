      - name: should return the suggested lemmas of the task identified by taskId
          when invoked through the SuggestedLemmaQueryPort
        traceability:
          feature: FEAT-CSLATDC
          rule: F-CSLATDC-R001
      - name: should include only suggested lemmas whose CefrLevel matches the level
          applied to the task
        traceability:
          feature: FEAT-CSLATDC
          rule: F-CSLATDC-R003
      - name: should infer the CefrLevel from the task milestone ancestor when no
          explicit level is provided
        traceability:
          feature: FEAT-CSLATDC
          rule: F-CSLATDC-R004
      - name: should throw SuggestedLemmaQueryRejectedException when no level is provided
          and none can be inferred from the task
        traceability:
          feature: FEAT-CSLATDC
          rule: F-CSLATDC-R005
      - name: should use the explicit level provided in the filter when the task does
          not allow level inference
        traceability:
          feature: FEAT-CSLATDC
          rule: F-CSLATDC-R006
      - name: should restrict results to suggested lemmas whose partOfSpeech matches
          the requested partOfSpeech filter
        traceability:
          feature: FEAT-CSLATDC
          rule: F-CSLATDC-R007
      - name: should return at most N suggested lemmas when the limit filter equals
          N
        traceability:
          feature: FEAT-CSLATDC
          rule: F-CSLATDC-R008
      - name: should return all available suggested lemmas without error when fewer
          than the requested limit match the filters
        traceability:
          feature: FEAT-CSLATDC
          rule: F-CSLATDC-R009
      - name: should return suggested lemmas ordered by recommendation priority so
          the caller does not need to sort them
        traceability:
          feature: FEAT-CSLATDC
          rule: F-CSLATDC-R010
      - name: should return more suggested lemmas than the cap of 10 used by LemmaAbsenceContextResolver
          when the requested limit exceeds it
        traceability:
          feature: FEAT-CSLATDC
          rule: F-CSLATDC-R011
      - name: should return an empty suggested lemma list with the effective level
          when the task has no compatible base for suggesting lemmas
        traceability:
          feature: FEAT-CSLATDC
          rule: F-CSLATDC-R012
      - name: should expose each suggested lemma identifiably in the result with the
          list order representing its relative priority
        traceability:
          feature: FEAT-CSLATDC
          rule: F-CSLATDC-R014
      - name: should exclude already-exposed lemmas and recommend only lemmas still
          needing exposure when includeExposed is false
        traceability:
          feature: FEAT-INCEXP
          rule: F-INCEXP-R001
      - name: should include already-exposed lemmas of the requested level and partOfSpeech
          in the candidate universe when includeExposed is true
        traceability:
          feature: FEAT-INCEXP
          rule: F-INCEXP-R002
      - name: should place lemmas still needing exposure first and already-exposed
          lemmas last by recommendation priority when includeExposed is true
        traceability:
          feature: FEAT-INCEXP
          rule: F-INCEXP-R003
      - name: should break ties by ascending COCA frequency within both the underexposed
          block and the already-exposed block when includeExposed is true
        traceability:
          feature: FEAT-INCEXP
          rule: F-INCEXP-R004
      - name: should still restrict results to lemmas matching the applicable level
          even when includeExposed is true
        traceability:
          feature: FEAT-INCEXP
          rule: F-INCEXP-R005
      - name: should still restrict results to the requested partOfSpeech among already-exposed
          lemmas when includeExposed is true
        traceability:
          feature: FEAT-INCEXP
          rule: F-INCEXP-R006
      - name: should truncate the widened ordered universe to at most the requested
          limit dropping already-exposed lemmas first when includeExposed is true
        traceability:
          feature: FEAT-INCEXP
          rule: F-INCEXP-R007
      - name: should infer level from the task and honor explicit level the same way
          as the default query when includeExposed is true
        traceability:
          feature: FEAT-INCEXP
          rule: F-INCEXP-R008
      - name: should return an empty lemma list with a functional explanation and
          no error when no lemma of the requested level and partOfSpeech exists even
          with includeExposed true
        traceability:
          feature: FEAT-INCEXP
          rule: F-INCEXP-R009
      - name: should return all available lemmas without error when fewer than the
          requested limit match the filters with includeExposed true
        traceability:
          feature: FEAT-INCEXP
          rule: F-INCEXP-R010
      - name: should preserve the observable shape of each suggested lemma and populate
          the exposure fields for an already-exposed lemma with isUnderexposed false
          when includeExposed is true
        traceability:
          feature: FEAT-INCEXP
          rule: F-INCEXP-R011
      - name: should return the same suggested lemmas as a query without a regex when
          no regex pattern is provided
        traceability:
          feature: FEAT-SLREGEX
          rule: F-SLREGEX-R001
      - name: should match the regex pattern only against the suggested lemma text
          and never against its partOfSpeech or other result fields
        traceability:
          feature: FEAT-SLREGEX
          rule: F-SLREGEX-R002
      - name: should keep a suggested lemma when the pattern matches anywhere inside
          the lemma text since the match is partial and not anchored
        traceability:
          feature: FEAT-SLREGEX
          rule: F-SLREGEX-R003
      - name: should match the regex pattern against the lemma text case-insensitively
        traceability:
          feature: FEAT-SLREGEX
          rule: F-SLREGEX-R004
      - name: should apply the regex as an additional filter that never reintroduces
          lemmas excluded by the level partOfSpeech or exposure filters
        traceability:
          feature: FEAT-SLREGEX
          rule: F-SLREGEX-R005
      - name: should preserve the recommendation priority order among the lemmas that
          match the regex pattern
        traceability:
          feature: FEAT-SLREGEX
          rule: F-SLREGEX-R006
      - name: should apply the limit after the regex filter so it caps only lemmas
          that already matched the pattern
        traceability:
          feature: FEAT-SLREGEX
          rule: F-SLREGEX-R007
      - name: should reject the query with a clear validation when the regex pattern
          is malformed
        traceability:
          feature: FEAT-SLREGEX
          rule: F-SLREGEX-R008
      - name: should return an empty lemma list with a functional explanation and
          no error when no candidate lemma matches the regex pattern
        traceability:
          feature: FEAT-SLREGEX
          rule: F-SLREGEX-R009
      implements:
      - SuggestedLemmaQueryPort
