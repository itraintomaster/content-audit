<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estadísticas del curso</title>
<meta name="description" content="Maqueta navegable de las estadísticas de content-audit: el curso A1 entero, ejercicio por ejercicio y palabra por palabra, con los datos reales del análisis del 7/10.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────────
   Los mismos de Correcciones: Literata para lo que ve el alumno,
   Instrument Sans para la herramienta. Acá se suma una escala de gravedad
   (del carmín al gris) y una de puntaje de vocabulario (violeta). */
:root{
  --canvas:#F3F2F8; --sheet:#FFFFFF; --raise:#FAFAFD;
  --ink:#1C1934; --ink-2:#4B4866; --ink-3:#807C99; --ink-4:#A9A6BE;
  --line:#E4E2EE; --line-2:#D2CFE0;
  --violet:#4B33B8; --violet-2:#6A55D6; --violet-soft:#ECE8FC; --violet-ink:#2A1C73;
  --pencil:#EE5A1F; --pencil-soft:#FFEEE5;
  --ok:#0C7A66; --ok-bg:#DAF2EA; --warn:#9A5F00; --warn-bg:#FFF2D2;
  --high:#C42A55; --med:#C27A0E; --low:#A3A0B8; --on-accent:#FFFFFF;
  /* gravedad: bloqueante, alta, media, baja, sin errores */
  --s0:#8A1540; --s1:#DA4A70; --s2:#E7A236; --s3:#C6C1DD; --s4:#8FD1BD;
  --mk:#9C8CF0; --na:#E8E6F0; --ne:#B9B5CC;
  /* puntaje de vocabulario: 90-99, 70-89, menos de 70 */
  --v1:#C9C0F6; --v2:#8F7CE8; --v3:#4B33B8;
  --heat:#C42A55;
  --shadow:0 1px 2px rgba(28,25,52,.05),0 12px 32px -18px rgba(28,25,52,.28);
  --pop:0 2px 4px rgba(28,25,52,.06),0 24px 60px -20px rgba(28,25,52,.35);
  --sans:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --serif:"Literata",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#12102A; --sheet:#1B1937; --raise:#201E3F;
    --ink:#EDEBF9; --ink-2:#BDB9DA; --ink-3:#8C88AD; --ink-4:#605C82;
    --line:#2B2850; --line-2:#3A3666;
    --violet:#A496FF; --violet-2:#BDB2FF; --violet-soft:#29235A; --violet-ink:#D9D2FF;
    --pencil:#FF7D4A; --pencil-soft:#3A2116;
    --ok:#5BD8B9; --ok-bg:#11382F; --warn:#F5B843; --warn-bg:#3A2C0D;
    --high:#FF6F96; --med:#F2A93B; --low:#6E6A90; --on-accent:#14112E;
    --s0:#FF7AA0; --s1:#C9476F; --s2:#D9962E; --s3:#4C4778; --s4:#2D8C75;
    --mk:#7A69E0; --na:#221F42; --ne:#3F3B66;
    --v1:#4A3F94; --v2:#7B68E0; --v3:#B6AAFF;
    --heat:#FF6F96;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -20px rgba(0,0,0,.7);
    --pop:0 2px 6px rgba(0,0,0,.35),0 30px 70px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#12102A; --sheet:#1B1937; --raise:#201E3F;
  --ink:#EDEBF9; --ink-2:#BDB9DA; --ink-3:#8C88AD; --ink-4:#605C82;
  --line:#2B2850; --line-2:#3A3666;
  --violet:#A496FF; --violet-2:#BDB2FF; --violet-soft:#29235A; --violet-ink:#D9D2FF;
  --pencil:#FF7D4A; --pencil-soft:#3A2116;
  --ok:#5BD8B9; --ok-bg:#11382F; --warn:#F5B843; --warn-bg:#3A2C0D;
  --high:#FF6F96; --med:#F2A93B; --low:#6E6A90; --on-accent:#14112E;
  --s0:#FF7AA0; --s1:#C9476F; --s2:#D9962E; --s3:#4C4778; --s4:#2D8C75;
  --mk:#7A69E0; --na:#221F42; --ne:#3F3B66;
  --v1:#4A3F94; --v2:#7B68E0; --v3:#B6AAFF;
  --heat:#FF6F96;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -20px rgba(0,0,0,.7);
  --pop:0 2px 6px rgba(0,0,0,.35),0 30px 70px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.en{font-style:italic;color:var(--violet);font-weight:500}
.c{font-family:var(--serif);font-optical-sizing:auto}
kbd{font:600 11px/1 var(--sans);font-variant-numeric:tabular-nums;padding:3px 5px 2px;border-radius:5px;border:1px solid var(--line-2);border-bottom-width:2px;color:var(--ink-3);background:var(--sheet);min-width:18px;display:inline-block;text-align:center}
.gap{display:inline-block;min-width:2.6em;border-bottom:2px solid currentColor;margin:0 .1em;height:.95em;vertical-align:-.08em;opacity:.75}

/* Estados de un ejercicio, en el mapa y en todas partes */
.s0{--c:var(--s0)} .s1{--c:var(--s1)} .s2{--c:var(--s2)} .s3{--c:var(--s3)} .s4{--c:var(--s4)}
.mk{--c:var(--mk)} .na{--c:var(--na)} .ne{--c:var(--ne)} .pe{--c:var(--ne)}
.v1{--c:var(--v1)} .v2{--c:var(--v2)} .v3{--c:var(--v3)}
.w-n{--c:var(--s4)} .w-s{--c:var(--s2)} .w-o{--c:var(--v2)} .w-a{--c:var(--s1)} .w-x{--c:var(--ink-4)}

/* ── Esqueleto ─────────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:60px 284px minmax(0,1fr);grid-template-rows:60px minmax(0,1fr);height:100vh}
.rail{grid-row:1/3;grid-column:1;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;border-right:1px solid var(--line)}
.brand{width:30px;height:30px;border-radius:9px;background:var(--pencil);display:grid;place-items:center;margin-bottom:14px;color:#fff;font:700 15px/1 var(--serif);font-style:italic}
.rail a{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;color:var(--ink-3);position:relative}
.rail a:hover{background:var(--line);color:var(--ink)}
.rail a[aria-current]{background:var(--violet);color:var(--on-accent)}
.rail a:hover::after{content:attr(data-label);position:absolute;left:48px;white-space:nowrap;background:var(--ink);color:var(--sheet);font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;z-index:20;pointer-events:none}
.rail .spacer{flex:1}
.rail svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.top{grid-column:2/4;display:flex;align-items:center;gap:18px;padding:0 18px 0 22px;border-bottom:1px solid var(--line);min-width:0}
.top h1{font:650 18px/1 var(--sans);letter-spacing:-.01em;margin:0;white-space:nowrap}
.batch{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;height:32px;font-size:13px;white-space:nowrap}
.batch span{padding:0 10px;color:var(--ink-2)}
.batch span b{color:var(--ink);font-weight:650}
.batch button{height:100%;padding:0 10px;border-left:1px solid var(--line-2);display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.batch button:hover{background:var(--line)}
.modes{display:flex;gap:2px;margin:0 auto;background:var(--line);padding:3px;border-radius:11px}
.modes button{height:30px;padding:0 13px;border-radius:8px;font-weight:550;font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.modes button:hover{color:var(--ink)}
.modes button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.modes .count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.status{display:flex;align-items:center;gap:8px;white-space:nowrap}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--line);color:var(--ink)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.searchbtn{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border-radius:9px;border:1px solid var(--line-2);color:var(--ink-3);font-size:13px}
.searchbtn:hover{border-color:var(--ink-4);color:var(--ink-2)}
.searchbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.mobile-only{display:none}

/* ── Índice: qué mirar ─────────────────────────────────────────────────── */
.index{grid-column:2;grid-row:2;border-right:1px solid var(--line);overflow:auto;padding:14px 10px 60px;scrollbar-width:thin;min-height:0}
.ix-group{margin-bottom:22px}
.ix{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;width:100%;padding:8px 10px 9px;border-radius:9px;align-items:baseline;position:relative}
.ix:hover{background:var(--line)}
.ix[aria-current]{background:var(--sheet);box-shadow:var(--shadow)}
.ix .t{font-size:13.5px;font-weight:550;line-height:1.25;min-width:0}
.ix .v{font-size:12.5px;font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ix .meter{grid-column:1/3;height:3px;border-radius:2px;background:var(--line);overflow:hidden;display:block}
.ix .meter i{display:block;height:100%;background:var(--c,var(--heat));border-radius:2px}
.ix.off .t,.ix.off .v{color:var(--ink-4);font-weight:500}
.ix.lead{padding:12px 10px 12px}
.ix.lead .t{font:650 15px/1.2 var(--sans)}
.ix.lead .v{font:650 15px/1.2 var(--sans);color:var(--ink)}
.ix.lead .why{grid-column:1/3;font-size:12px;color:var(--ink-3);margin-top:-2px}
.ix-note{font-size:12px;color:var(--ink-3);padding:0 10px;margin:6px 0 0;line-height:1.45}

/* ── Escenario ─────────────────────────────────────────────────────────── */
.stage{grid-column:3;grid-row:2;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;scrollbar-width:thin}
.head{padding:22px 32px 0;max-width:1144px}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);min-height:20px}
.crumbs button{color:var(--ink-3);padding:1px 4px;border-radius:5px;margin:0 -4px}
.crumbs button:hover{color:var(--ink);background:var(--line)}
.crumbs .sep{color:var(--ink-4)}
.crumbs .here{color:var(--ink-2);font-weight:550}
.title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:6px}
.title h2{margin:0;font:650 30px/1.12 var(--sans);letter-spacing:-.02em;font-variation-settings:"wdth" 92}
.title .size{font-size:13px;color:var(--ink-3)}
.lede{margin:10px 0 0;font-size:15.5px;line-height:1.5;color:var(--ink-2);max-width:74ch}
.lede b{color:var(--ink);font-weight:650}
.tema-ins{margin:12px 0 0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.tema-ins .c{font-size:15.5px;color:var(--ink)}
.caveat{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;padding:10px 13px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px;line-height:1.45;max-width:86ch}
.caveat svg{flex:none;width:16px;height:16px;margin-top:1px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.caveat b{font-weight:650}

/* El mapa: cada ejercicio es un piso; cada tema, un edificio. */
.hero{padding:26px 32px 0;max-width:1144px;position:relative}
.sky{display:block;width:100%}
.sky .hit{fill:transparent;cursor:zoom-in}
.sky g.on .hit{fill:var(--violet-soft)}
.sky .cell{fill:var(--c);cursor:pointer;transition:opacity .12s}
.sky.dim g:not(.on) .cell{opacity:.3}
.ground{height:1.5px;background:var(--ink-3);border-radius:1px;opacity:.5}
.districts{display:grid;margin-top:0}
.district{min-width:0;padding:7px 2px 0;font-size:12px;line-height:1.25;color:var(--ink-2);position:relative;overflow:hidden}
.district::before{content:"";display:block;height:3px;border-radius:2px;background:var(--line-2);margin:0 0 7px}
.district:hover::before,.district.on::before{background:var(--violet)}
.district:hover,.district.on{color:var(--ink)}
.district .nm{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.district .nm .no{color:var(--ink-3);font-weight:600;margin-right:4px}
.district .sh{display:block;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trows{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:minmax(150px,250px) minmax(0,1fr);gap:18px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.trow:first-child{border-top:0}
.trow .tl{display:block;min-width:0;border-radius:6px}
.trow .tl .nm{font-weight:600;font-size:13.5px;display:block;line-height:1.3}
.trow .tl:hover .nm{color:var(--violet)}
.trow .tl .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tiles{display:flex;flex-wrap:wrap;gap:3px;padding-top:2px}
.tiles .cell{width:14px;height:14px;border-radius:3.5px;background:var(--c);cursor:pointer;transition:opacity .12s,transform .12s}
.tiles .cell:hover{transform:scale(1.25)}
.tiles.big{gap:5px}
.tiles.big .cell{width:26px;height:26px;border-radius:6px}
.hero[data-hl] .cell{opacity:.14}
.hero[data-hl="s0"] .s0,.hero[data-hl="s1"] .s1,.hero[data-hl="s2"] .s2,.hero[data-hl="s3"] .s3,.hero[data-hl="s4"] .s4,
.hero[data-hl="mk"] .mk,.hero[data-hl="na"] .na,.hero[data-hl="ne"] .ne,.hero[data-hl="v1"] .v1,.hero[data-hl="v2"] .v2,.hero[data-hl="v3"] .v3{opacity:1}
.hero-note{font-size:12.5px;color:var(--ink-3);margin:10px 0 0}

/* Calidad: una medida por eje; más lleno es mejor. */
.radar{position:relative;margin:0 auto;font-variant-numeric:tabular-nums}
.radar svg{position:absolute;left:0;top:0;overflow:visible}
.radar .ring,.radar .spoke,.radar .mean,.radar .poly,.radar .core-bg,.radar text{pointer-events:none}
.radar .ring{fill:none;stroke:var(--line-2);stroke-width:1}
.radar .ring.o{stroke:var(--ink-4);stroke-opacity:.55}
.radar .spoke{stroke:var(--line-2);stroke-width:1}
.radar .spoke.off{stroke-dasharray:2 4}
.radar .rng{stroke:var(--ink-4);stroke-opacity:.34;stroke-width:9;stroke-linecap:round}
.radar .rng:hover{stroke-opacity:.6}
.radar .mean{fill:none;stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:4 5}
.radar .poly{fill:var(--violet);fill-opacity:.12;stroke:var(--violet);stroke-width:2.2;stroke-linejoin:round}
.radar .vx{fill:var(--sheet);stroke:var(--violet);stroke-width:2.2}
.radar .vx.worst{fill:var(--high);stroke:var(--high)}
.radar .core-bg{fill:var(--sheet);stroke:var(--line-2)}
.radar text{font:500 10.5px var(--sans);fill:var(--ink-4)}
.radar .core{position:absolute;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.radar .core b{display:block;font:650 34px/1 var(--sans);letter-spacing:-.025em;font-variation-settings:"wdth" 92}
.radar .core span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:5px}
.radar .lab{position:absolute;padding:3px 6px;border-radius:7px;line-height:1.25;font-size:13px}
.radar .lab:hover{background:var(--line)}
.radar .lab .nm{font-weight:650}
.radar .lab .p{font-weight:650;color:var(--violet);margin-left:4px}
.radar .lab small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.radar .lab.worst .p{color:var(--high)}
.radar .lab.off .nm,.radar .lab.off .p{color:var(--ink-4);font-weight:550}
.radar.compact .lab{font-size:11px;padding:2px 3px;line-height:1.2}
.radar.compact .lab .nm{display:block;font-weight:600}
.radar.compact .lab .p{margin:0}
.radar-key{display:flex;gap:6px 20px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--ink-3);margin:6px 0 0}
.radar-key span{display:inline-flex;align-items:center;gap:7px}
.radar-key svg{flex:none;overflow:visible}
.qhow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.qhow div{background:var(--sheet);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
.qhow b{display:block;font-weight:650;font-size:13.5px;margin-bottom:3px}
.qhow p{margin:0;font-size:13px;line-height:1.45;color:var(--ink-2)}
.ix.ql{grid-template-columns:40px minmax(0,1fr) auto;column-gap:11px;align-items:center}
.ix.ql svg{grid-row:1/3;width:40px;height:40px;overflow:visible}
.ix.ql .why{grid-column:2/4}
.ix.ql .v{font-size:19px;letter-spacing:-.01em}
.mini .ring{fill:none;stroke:var(--line-2);stroke-width:.05}
.mini .poly{fill:var(--violet);fill-opacity:.18;stroke:var(--violet);stroke-width:.07;stroke-linejoin:round}

/* Leyenda: también es el reparto */
.legend{padding:18px 32px 0;max-width:1144px;display:flex;flex-direction:column;gap:9px}
.lg-bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--line)}
.lg-bar i{display:block;height:100%;background:var(--c)}
.lg-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.lg-items{display:flex;flex-wrap:wrap;gap:2px 6px;flex:1;min-width:0}
.lg-item{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);padding:4px 7px;border-radius:7px;white-space:nowrap}
.lg-item:hover,.lg-item[aria-pressed="true"]{background:var(--line);color:var(--ink)}
.lg-item i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.lg-item b{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{padding:4px 9px;border-radius:6px;font-size:12.5px;font-weight:550;color:var(--ink-3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 1px rgba(0,0,0,.06)}

/* ── Lectura ───────────────────────────────────────────────────────────── */
.reading{padding:4px 32px 100px;max-width:1144px}
.sec{margin-top:44px}
.sec > h3{font:650 17px/1.3 var(--sans);margin:0;letter-spacing:-.008em}
.sec > .sub{margin:4px 0 16px;color:var(--ink-3);font-size:13px;max-width:74ch}
.sec > .sub b{color:var(--ink-2);font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px}
.two > .sec{margin-top:44px}
.more{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:600;font-size:13px;color:var(--violet);padding:6px 2px}
.more:hover{text-decoration:underline}
.quiet{color:var(--ink-3);font-size:13px}

/* Mapa de calor: hijos × analizadores */
.heat-wrap{overflow-x:auto;margin:0 -6px;padding:0 6px 4px;scrollbar-width:thin}
.heat{border-collapse:separate;border-spacing:3px;font-size:12px}
.heat th{font-weight:500}
.heat thead th{vertical-align:bottom;padding:0 0 6px;height:126px}
.heat thead th button{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;color:var(--ink-3);font-size:12px;padding:2px 0;border-radius:4px;text-align:left}
.heat thead th button:hover,.heat thead th button.on{color:var(--violet)}
.heat thead th.tot button{color:var(--ink);font-weight:650}
.heat tbody th{text-align:left;padding:0 14px 0 0;white-space:nowrap;max-width:230px}
.heat tbody th button{display:flex;align-items:baseline;gap:7px;max-width:230px}
.heat tbody th .nm{font-weight:550;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.heat tbody th .no{color:var(--ink-4);font-weight:600;font-size:12px;min-width:14px}
.heat tbody th .n{color:var(--ink-3);font-size:11.5px;font-variant-numeric:tabular-nums}
.heat tbody th button:hover .nm{color:var(--violet)}
.heat td{width:34px;min-width:34px;height:30px;text-align:center;border-radius:5px;font-variant-numeric:tabular-nums;font-weight:600;cursor:pointer;color:var(--ink-2);background:color-mix(in oklab,var(--heat) var(--h,0%),var(--sheet))}
.heat td.hot{color:#fff}
.heat td.zero{color:var(--ink-4);font-weight:400}
.heat td.na{background:transparent;color:var(--ink-4);cursor:default;font-weight:400}
.heat td.mkd{background:color-mix(in oklab,var(--mk) var(--h,0%),var(--sheet))}
.heat td:not(.na):hover{box-shadow:0 0 0 2px var(--violet)}
.heat td.tot{background:color-mix(in oklab,var(--ink) var(--h,0%),var(--sheet));width:44px}
.heat td.tot.hot{color:var(--sheet)}
.heat-key{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.heat-key .ramp{display:inline-block;width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--sheet),var(--heat));vertical-align:-1px;margin:0 6px;box-shadow:inset 0 0 0 1px var(--line)}

/* Tarjetas de ejercicio */
.exs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ex{display:flex;flex-direction:column;gap:8px;padding:14px 16px 14px;background:var(--sheet);border-radius:13px;box-shadow:var(--shadow);min-width:0;text-align:left;position:relative;transition:transform .12s}
.ex:hover{transform:translateY(-1px)}
.ex:hover .stmt{color:var(--violet-ink)}
.ex .where{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex .stmt{font:450 17px/1.4 var(--serif);color:var(--ink)}
.ex .obs{font-size:12.5px;line-height:1.45;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.flags{display:flex;flex-wrap:wrap;gap:5px}
.flag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:550;background:var(--line);color:var(--ink-2);white-space:nowrap}
.flag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink-4))}
.flag.plain::before{display:none}

/* Barras por hijo */
.bars{display:flex;flex-direction:column;gap:2px}
.brow{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 92px;gap:12px;align-items:center;padding:5px 6px;border-radius:8px;font-size:13px;text-align:left;width:100%}
.brow:hover{background:var(--line)}
.brow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.brow .nm .no{color:var(--ink-4);font-weight:600;margin-right:6px;font-size:12px}
.brow .track{height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.brow .track i{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--heat));border-radius:4px}
.brow .track .ref{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);border-radius:1px}
.brow .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12px;white-space:nowrap}
.brow .val b{color:var(--ink);font-weight:650;font-size:13px;margin-right:4px}
.brow.na .nm,.brow.na .val{color:var(--ink-4)}
.bars.wide .brow{grid-template-columns:minmax(0,200px) minmax(0,1fr) 210px}
.bars.wide .val{white-space:normal;line-height:1.3}
.brow.peak .nm{color:var(--ink)}

/* Analizador */
.an{background:var(--sheet);border-radius:16px;box-shadow:var(--shadow);padding:24px 26px 22px;margin-top:30px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px 34px}
.an .q{font:600 21px/1.3 var(--sans);letter-spacing:-.012em;margin:0;grid-column:1/3;max-width:60ch}
.an .expl{margin:-14px 0 0;color:var(--ink-2);font-size:14px;grid-column:1/3;max-width:80ch}
.how{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 14px;margin:0;font-size:13.5px;align-content:start}
.how dt{color:var(--ink-3);font-size:12.5px;padding-top:1px}
.how dd{margin:0;color:var(--ink);line-height:1.5}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:550;background:var(--line);color:var(--ink-2);white-space:nowrap}
.pill.paid{background:var(--pencil-soft);color:var(--pencil)}
.pill.local{background:var(--violet-soft);color:var(--violet-ink)}
.pill.free{background:var(--ok-bg);color:var(--ok)}
.prov{border-left:1px solid var(--line);padding-left:26px;display:flex;flex-direction:column;gap:12px;font-size:13px;min-width:0}
.prov h4{margin:0;font:650 13px/1.3 var(--sans)}
.prov .who{font:600 15px/1.3 var(--sans)}
.prov .who span{display:block;font-weight:500;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.exam{display:flex;flex-direction:column;gap:5px}
.exam .h{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ok);font-size:12.5px}
.exam .h svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.case{display:grid;grid-template-columns:minmax(0,1fr) 64px 50px;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.case .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case .tr{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.case .tr i{display:block;height:100%;background:var(--ok)}
.case .tr i.short{background:var(--med)}
.case .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-3);white-space:nowrap}
.prov .fine{font-size:12px;color:var(--ink-3);line-height:1.45;margin:0}
.rules{display:flex;flex-direction:column;gap:2px}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 10px;border-radius:9px;text-align:left;width:100%}
.rule:hover{background:var(--line)}
.rule[aria-pressed="true"]{background:var(--violet-soft)}
.rule .d{font-size:13px;line-height:1.4;color:var(--ink)}
.rule .n{font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.rule.zero .d,.rule.zero .n{color:var(--ink-4)}
.notice{display:flex;gap:10px;align-items:center;padding:10px 13px;border-radius:10px;background:var(--line);color:var(--ink-2);font-size:13px;margin-top:30px}

/* Hallazgos */
.fds{display:flex;flex-direction:column;background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.fd{display:grid;grid-template-columns:12px minmax(0,1fr);gap:4px 12px;padding:14px 18px 14px 16px;border-top:1px solid var(--line)}
.fd:first-child{border-top:0}
.fd-group{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 18px 10px 16px;background:var(--raise);border-top:1px solid var(--line);font:600 13px/1.4 var(--sans)}
.fd-group:first-child{border-top:0}
.fd-group b{font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.fd-group + .fd{border-top:0}
.fd .dot{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:6px}
.fd .top-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.fd .top-line .sev{font-weight:650;color:var(--ink-2)}
.fd .stmt{grid-column:2;font:450 16.5px/1.4 var(--serif);color:var(--ink);text-align:left;justify-self:start}
.fd button.stmt:hover{color:var(--violet)}
.fd .obs{grid-column:2;margin:2px 0 0;font-size:13px;line-height:1.5;color:var(--ink-2);max-width:86ch}
.fd details{grid-column:2;font-size:12.5px;margin-top:2px}
.fd summary{cursor:pointer;color:var(--violet);font-weight:550;width:max-content;list-style:none}
.fd summary::-webkit-details-marker{display:none}
.fd summary::before{content:"+ ";font-weight:700}
.fd details[open] summary::before{content:"− "}
.ev{display:grid;grid-template-columns:minmax(80px,150px) minmax(0,1fr);gap:5px 12px;margin:8px 0 2px;padding:10px 12px;border-radius:9px;background:var(--raise);border:1px solid var(--line)}
.ev dt{color:var(--ink-3)}
.ev dd{margin:0;color:var(--ink);line-height:1.45;overflow-wrap:anywhere}

/* Gráficos */
.chart{display:block;width:100%;overflow:visible}
.chart text{font:500 11px var(--sans);fill:var(--ink-3)}
.chart .lbl-b{font-weight:650;fill:var(--ink-2)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .band{fill:var(--ok-bg)}
.chart .band-l{fill:var(--ok);font-weight:600}
.chart .bar{fill:var(--c);cursor:pointer}
.chart .bar:hover,.chart .bar.on{stroke:var(--ink);stroke-width:1.5}
.chart .axis{stroke:var(--ink-4);stroke-width:1}
.chart .dotw{fill:var(--c);stroke:var(--sheet);stroke-width:1;cursor:pointer}
.chart .dotw:hover{stroke:var(--ink);stroke-width:2}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:baseline;gap:7px;padding:6px 11px 6px 10px;border-radius:999px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line-2);font-size:13px}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--violet)}
.chip .lem{font:500 15px/1 var(--serif)}
.chip .pa{font:italic 400 12px/1 var(--serif);color:var(--ink-3);margin-left:-3px}
.chip small{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink-4));align-self:center}
.chip.plain::before{display:none}
.cover{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:center;margin-bottom:18px;max-width:640px}
.cover .tr{height:12px;border-radius:6px;background:var(--line);position:relative}
.cover .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--s4)}
.cover .tr .goal{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
.cover .tr .goal span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink-2);white-space:nowrap;font-weight:600}
.cover .v{font:650 15px var(--sans);font-variant-numeric:tabular-nums}
.cover .v small{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:550;color:var(--ink-3);font-size:12px;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--raise)}
.tbl .c{font-size:15px}
.lenrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,220px) 64px;gap:14px;align-items:center;padding:9px 6px;border-top:1px solid var(--line);font-size:13px;text-align:left;width:100%}
.lenrow:first-child{border-top:0}
.lenrow:hover{background:var(--raise)}
.lenrow .tx{min-width:0}
.lenrow .tx .c{font-size:15px;line-height:1.4;display:block}
.lenrow .tx small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.lenrow .track{height:8px;border-radius:4px;background:var(--line);position:relative}
.lenrow .track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c)}
.lenrow .track .lim{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2)}
.lenrow .track .lim.soft{background:var(--ink-4)}
.lenrow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.lenrow.flag-on .v{color:var(--s1)}
.sheetbox{background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);padding:6px 16px}
.quarters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.qcol{background:var(--sheet);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px 14px;min-width:0}
.qcol h5{margin:0 0 10px;font:650 12.5px var(--sans)}
.qline{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:12px;gap:2px 8px;margin-top:8px}
.qline .nm{color:var(--ink-3)}
.qline .v{font-weight:650;font-variant-numeric:tabular-nums}
.qline .tr{grid-column:1/3;height:6px;border-radius:3px;background:var(--line);position:relative}
.qline .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--violet-2)}
.qline .tr b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* ── Ficha del ejercicio ───────────────────────────────────────────────── */
.drawer{position:fixed;right:0;top:60px;bottom:0;width:480px;max-width:100vw;background:var(--canvas);box-shadow:var(--pop);border-left:1px solid var(--line);z-index:30;transform:translateX(104%);transition:transform .22s cubic-bezier(.3,.7,.3,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 20px;border-bottom:1px solid var(--line);min-height:56px}
.dpath{font-size:12.5px;color:var(--ink-3);min-width:0;flex:1;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.dpath button{color:var(--ink-2);font-weight:550}
.dpath button:hover{color:var(--violet)}
.dnav{display:flex;align-items:center;gap:2px;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.dnav span{padding:0 6px;font-variant-numeric:tabular-nums}
.dnav button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.dnav button:hover{background:var(--line);color:var(--ink)}
.dnav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dbody{overflow:auto;flex:1;padding:18px 20px 60px;scrollbar-width:thin}
.sv{background:var(--sheet);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sv .row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:0 14px;padding:13px 18px 13px 0;border-top:1px solid var(--line)}
.sv .row:first-child{border-top:0}
.sv .row > .lbl{font:550 12px/1.35 var(--sans);color:var(--ink-3);text-align:right;padding-top:3px}
.sv .row.hero-row{padding-top:22px;padding-bottom:20px}
.sv .ins{font-size:15px;line-height:1.5}
.sv .snt{font-size:26px;line-height:1.3;font-weight:450;letter-spacing:-.005em}
.sv .ans{font-size:16px;color:var(--ink-2)}
.sv .tr{font-size:15px;font-style:italic;color:var(--ink-2)}
.sv .mt{font-size:14.5px;line-height:1.6}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{display:inline-flex;align-items:center;gap:7px;font:500 15px/1 var(--serif);padding:8px 13px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--sheet)}
.opt.right{border-color:var(--ink-2)}
.opt.right::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dsec{margin-top:26px}
.dsec > h4{margin:0 0 10px;font:650 13.5px/1.3 var(--sans);display:flex;align-items:baseline;gap:8px}
.dsec > h4 span{font-weight:500;color:var(--ink-3);font-size:12px;margin-left:auto}
.res{display:flex;flex-direction:column;background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.res .fd{padding:12px 16px 13px 14px}
.res .fd .an-name{font:600 13.5px/1.3 var(--sans);color:var(--ink);flex-basis:100%;margin-bottom:1px}
.res .fd .an-name button:hover{color:var(--violet)}
.restline{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-3)}
.restline > span:first-child{margin-right:4px}
.vfacts{display:flex;flex-direction:column;gap:12px;background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.vf{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;font-size:13px;align-items:start}
.vf > span:first-child{color:var(--ink-3);font-size:12.5px;padding-top:1px}
.ruler{position:relative;height:22px;margin-top:2px}
.ruler .base{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line)}
.ruler .ok{position:absolute;top:7px;height:8px;border-radius:4px;background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok)}
.ruler .mark{position:absolute;top:3px;width:3px;height:16px;border-radius:2px;background:var(--ink);margin-left:-1.5px}
.qid{margin-top:22px;font-size:11.5px;color:var(--ink-4);font-variant-numeric:tabular-nums}

/* ── Palabras ──────────────────────────────────────────────────────────── */
.wi-head{position:sticky;top:-14px;background:var(--canvas);padding:0 2px 10px;margin:-14px -2px 0;padding-top:14px;z-index:2;display:flex;flex-direction:column;gap:10px}
.wsearch{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--sheet)}
.wsearch svg{width:15px;height:15px;fill:none;stroke:var(--ink-3);stroke-width:2;flex:none}
.wsearch input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:13.5px}
.wfilters{display:flex;flex-wrap:wrap;gap:4px}
.wfilters button{height:26px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:550;color:var(--ink-2);background:var(--line);display:inline-flex;gap:6px;align-items:center}
.wfilters button span{color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:500}
.wfilters button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.wfilters button[aria-pressed="true"] span{color:var(--sheet);opacity:.7}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto 8px;gap:10px;align-items:center;width:100%;padding:6px 10px;border-radius:8px}
.wrow:hover{background:var(--line)}
.wrow[aria-current]{background:var(--sheet);box-shadow:var(--shadow)}
.wrow .lem{font:500 15px/1.3 var(--serif);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .lem small{font:500 11.5px var(--sans);color:var(--ink-3);margin-left:6px}
.wrow .val{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.wrow i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.wi-count{font-size:12px;color:var(--ink-3);padding:4px 10px 6px}
.whead .back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;color:var(--ink-3);margin-bottom:10px}
.whead .back:hover{color:var(--ink)}
.whead .back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2}
.wtitle{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.wtitle h2{margin:0;font:500 52px/1 var(--serif);letter-spacing:-.02em}
.wtitle .meta{font-size:13.5px;color:var(--ink-3)}
.wtitle .meta b{color:var(--ink-2);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.fact{background:var(--sheet);border-radius:12px;box-shadow:var(--shadow);padding:13px 15px 14px;min-width:0}
.fact .k{font-size:12px;color:var(--ink-3)}
.fact .v{font:650 22px/1.2 var(--sans);font-variant-numeric:tabular-nums;margin-top:3px;font-variation-settings:"wdth" 88}
.fact .s{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.35}
.fact .s.bad{color:var(--s1)} .fact .s.good{color:var(--ok)}
.barcode .tick{stroke:var(--violet);stroke-width:1.6}
.barcode .tick-hit{stroke:transparent;stroke-width:10;cursor:pointer}
.barcode .ubg{fill:var(--raise)}
.barcode .ubg.alt{fill:var(--line)}
.barcode .gapb{stroke:var(--s1);stroke-width:1.5;fill:none}
.barcode .gapl{fill:var(--s1);font-weight:650}
.barcode .ulbl{font:600 10.5px var(--sans);fill:var(--ink-3)}

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════
   Datos: el análisis real de la campaña A1 (7/10, 08:15), con su digest,
   el informe completo y el catálogo de analizadores. Ver curso-a1.js.
   ════════════════════════════════════════════════════════════════════════ */
const C = window.CURSO;
const N = C.nodes, Q = C.quizzes, F = C.findings, W = C.words, A = C.analyzers;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n).toLocaleString("es-AR");
const fmt1 = n => Number(n).toLocaleString("es-AR", {maximumFractionDigits: 1});
const NB = " ";
const pct = (a, b) => { if (!b) return "—"; const p = 100 * a / b; return (p > 0 && p < 1 ? "<1" : String(Math.round(p))) + NB + "%"; };
const pts = x => x == null ? "—" : String(Math.round(100 * x));
const plain = s => String(s ?? "").replace(/\$([^$]+)\$/g, "$1");
const rich = s => esc(s).replace(/\$([^$]+)\$/g, '<span class="en">$1</span>');
const gapify = s => esc(s).replace(/_{2,}/g, '<span class="gap"></span>');
const ICON = {
  menu: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>',
  theme: '<svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5A6.5 6.5 0 0 1 12 3.5z"/></svg>',
  chev: '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
  left: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.3v.2"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
};

/* ── Analizadores ──────────────────────────────────────────────────────── */
const AN = new Map(A.map((a, i) => [a.id, Object.assign(a, {i})]));
// El catálogo trae algunas reglas con su código adelante («F-PISTA-R002: …»); acá se lee sólo la regla.
A.forEach(a => a.rules.forEach(r => { const d = r[1].replace(/^F-[A-Z]+-R\d+[a-z]?\s*:\s*/, ""); r[1] = d.charAt(0).toUpperCase() + d.slice(1); }));
const SHORT = {
  "quiz-instruction":"Consigna","multiple-choice-validity":"Opción múltiple","translation-sense":"Traducción",
  "single-answer":"Una sola respuesta","mini-theory":"Miniteoría","grammar":"Gramática","naturalness":"Naturalidad",
  "near-duplicates":"Casi repetido","answer-completeness":"Forma exigida","hint-coherence":"Pista",
  "exact-duplicates":"Repetido igual","data-coherence":"Audio y respuesta","off-level-words":"Palabra de otro nivel",
  "multiple-choice-quality":"Distractores",
  "sentence-length":"Largo de la oración","knowledge-title-length":"Largo del título","knowledge-instructions-length":"Largo de la consigna",
  "coca-buckets-distribution":"Frecuencia de las palabras","lemma-recurrence":"Cada cuánto vuelven","lemma-absence":"Vocabulario del nivel",
  "lemma-count":"Oraciones por palabra"
};
const ERR = C.err;                                   // el orden del código de estado de cada ejercicio
const ERRI = new Map(ERR.map((a, i) => [a, i]));
const RAN = new Set(Object.keys(N[0].n.ea));         // los que corrieron en este análisis
const ERR_RAN = ERR.filter(a => RAN.has(a));
const VOC = A.filter(a => a.fam === "V").map(a => a.id);
const SEVN = ["bloqueante", "alta", "media", "baja"];
const COST = {INSTANT: ["Instantáneo, sin costo", "free"], PAID_MODEL: ["Modelo pago", "paid"], LOCAL_MODEL: ["Modelo local", "local"]};
const RES = {PANEL: "Lo corrige la mesa", RULE: "Lo arregla una regla", RANK_ONLY: "Sólo ordena, no cuenta como error"};
const EVAL = {Q: "cada ejercicio", K: "cada tema", M: "el nivel", C: "el curso"};
const EFFORT = {low: "bajo", medium: "medio", high: "alto"};
const POSAB = {VERB:"v.", NOUN:"s.", ADJ:"adj.", ADV:"adv.", PRON:"pron.", DET:"det.", ADP:"prep.", CONJ:"conj.", CCONJ:"conj.", SCONJ:"conj.", NUM:"núm.", PROPN:"n. pr.", INTJ:"interj.", AUX:"aux.", PART:"part."};
// Todo se cuenta por palabra y función: «in» adverbio no es «in» preposición, así que el chip lo dice.
const lem = (l, p) => `<span class="lem">${esc(l)}</span>${p ? `<i class="pa" title="${POS[p] || p}">${POSAB[p] || esc(p.toLowerCase())}</i>` : ""}`;
const POS = {VERB:"verbo", NOUN:"sustantivo", ADJ:"adjetivo", ADV:"adverbio", PRON:"pronombre", DET:"determinante", ADP:"preposición", CONJ:"conjunción", CCONJ:"conjunción", SCONJ:"conjunción", NUM:"número", PROPN:"nombre propio", INTJ:"interjección", AUX:"auxiliar", PART:"partícula"};
const BAND = {top1k: "Entre las 1.000 más comunes", top2k: "De 1.001 a 2.000", top3k: "De 2.001 a 3.000", top4k: "Más allá de 3.000"};
const ASSESS = {OPTIMAL: "en meta", ACCEPTABLE: "aceptable", POOR: "lejos de la meta", OUT_OF_RANGE: "fuera de meta"};
const PRIO = {HIGH: "alta", MEDIUM: "media", LOW: "baja"};
const RANGE = C.lengthGoal.targetRanges.A1;

/* ── Índices ───────────────────────────────────────────────────────────── */
N.forEach((n, i) => { n.i = i; });
(function collect(n) { n.all = n.t === "K" ? n.qs.slice() : n.kids.flatMap(k => collect(N[k])); return n.all; })(N[0]);
const UNITS = N.filter(n => n.t === "T");
UNITS.forEach((u, i) => { u.num = i + 1; });
const TEMAS = N.filter(n => n.t === "K");
TEMAS.forEach(k => { k.unit = N[k.parent]; });
const fquiz = [], fnode = [];
N.forEach(n => (n.f || []).forEach(fi => { fnode[fi] = n.i; }));
Q.forEach((q, i) => {
  q.i = i; q.tema = N[q.k]; q.unit = q.tema.unit; q.j = q.tema.qs.indexOf(i);
  q.fa = new Map(); q.fsev = new Map();
  for (const fi of q.f || []) {
    fquiz[fi] = i;
    const f = F[fi], a = A[f[0]].id;
    if (!q.fa.has(a)) q.fa.set(a, []);
    q.fa.get(a).push(fi);
    q.fsev.set(a, Math.min(q.fsev.get(a) ?? 9, f[2]));
  }
  q.scm = new Map((q.sc || []).map(([ai, s]) => [A[ai].id, s]));
  q.nerr = [...q.st].filter(ch => ch === "x").length;
});
const nodesUnder = n => [n, ...n.kids.flatMap(k => nodesUnder(N[k]))];
const temasUnder = n => n.t === "K" ? [n] : n.kids.flatMap(k => temasUnder(N[k]));
const childrenOf = n => n.t === "C" ? n.kids.flatMap(k => N[k].kids).map(k => N[k]) : n.kids.map(k => N[k]);
const ancestors = n => { const out = []; let x = n; while (x) { out.unshift(x); x = x.parent != null ? N[x.parent] : null; } return out; };
const nodeName = n => n.t === "C" ? "Curso completo" : n.t === "M" ? `Nivel ${n.label}` : n.label;
const nodeOf = n => n.t === "C" ? "del curso" : n.t === "M" ? `de ${n.label}` : n.t === "T" ? `de ${plain(n.label)}` : "del tema";

// Palabras: la recurrencia trae las posiciones; la exposición, el nivel y el umbral.
const WD = new Map();
const wkey = (l, p) => l + "|" + p;
for (const r of W.rec) WD.set(wkey(r[0], r[1]), {lemma: r[0], pos: r[1], times: r[2], mean: r[3], st: r[4], gap: r[5], ps: r[6]});
for (const e of W.exp) {
  const k = wkey(e[0], e[1]); const w = WD.get(k) || {lemma: e[0], pos: e[1]};
  Object.assign(w, {level: e[2], sents: e[3], coca: e[4], band: e[5], thr: e[6], cs: e[7], temas: e[8]}); WD.set(k, w);
}
for (const a of W.absent.list) { const k = wkey(a[0], a[1]); if (!WD.has(k)) WD.set(k, {lemma: a[0], pos: a[1]}); Object.assign(WD.get(k), {absent: true, prio: a[2], coca: a[3], cat: a[4], level: "A1"}); }
WD.forEach((w, k) => { w.key = k; });
const byLemma = new Map(); WD.forEach(w => { if (!byLemma.has(w.lemma.toLowerCase())) byLemma.set(w.lemma.toLowerCase(), w); });
// Palabras de otro nivel y fuera del catálogo, juntadas desde los ejercicios.
const MIS = new Map(), OOC = new Map();
Q.forEach(q => {
  for (const [l, lvl, ty] of q.mis || []) { if (!MIS.has(l)) MIS.set(l, {lemma: l, lvl, ty, qs: []}); MIS.get(l).qs.push(q.i); }
  for (const l of q.ooc || []) { if (!OOC.has(l)) OOC.set(l, {lemma: l, qs: []}); OOC.get(l).qs.push(q.i); }
});
// Posición del curso → ejercicio
const STARTS = []; Q.forEach((q, i) => { STARTS[i] = q.pos ? q.pos[0] : (STARTS[i - 1] ?? 0); });
function quizAt(p) { let lo = 0, hi = Q.length - 1, ans = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (STARTS[m] <= p) { ans = m; lo = m + 1; } else hi = m - 1; } return ans; }
const QW = Q.map(() => []);
WD.forEach(w => { if (!w.ps) return; w.qs = []; for (const p of w.ps) { const qi = quizAt(p); if (qi >= 0 && w.qs[w.qs.length - 1] !== qi) { w.qs.push(qi); QW[qi].push(w.key); } } });
UNITS.forEach(u => { const ps = u.all.map(i => Q[i].pos).filter(Boolean); u.p0 = Math.min(...ps.map(p => p[0])); u.p1 = Math.max(...ps.map(p => p[1])); });
const wstatus = w => w.absent ? "w-a" : w.st === "s" ? "w-s" : w.st === "o" ? "w-o" : w.st === "n" ? "w-n" : "w-x";
const WSTATUS = {"w-a": "falta en el curso", "w-s": "vuelve tarde", "w-o": "vuelve demasiado seguido", "w-n": "vuelve a un intervalo sano", "w-x": "sin medir su recurrencia"};

/* ── Estado ────────────────────────────────────────────────────────────── */
const S = {mode: "mapa", node: 1, lens: "calidad", order: "sev", quiz: null, word: null, wf: "todas", wq: "", hl: null, rule: null, limit: 20, palSel: 0, palItems: []};
try { const th = localStorage.getItem("correcciones-tema"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

/* ── Qué color lleva cada ejercicio según lo que estás mirando ─────────── */
function vclass(v) { return v >= 0.999 ? "s4" : v >= 0.9 ? "v1" : v >= 0.7 ? "v2" : "v3"; }
const temaFlag = {};  // analizador de tema → set de temas marcados
for (const id of ["knowledge-title-length", "knowledge-instructions-length"]) {
  const ai = AN.get(id).i; temaFlag[id] = new Map();
  TEMAS.forEach(k => (k.f || []).forEach(fi => { if (F[fi][0] === ai) temaFlag[id].set(k.i, fi); }));
}
function cellOf(q) {
  const L = S.lens;
  if (L === "err" || L === "calidad") return q.sev < 4 ? ["s" + q.sev, q.sev, `Su error más grave es de gravedad ${SEVN[q.sev]}`] : ["s4", 4, "Sin errores"];
  if (L === "voc") return [vclass(q.vs), q.vs, `Vocabulario: ${pts(q.vs)} sobre 100`];
  if (ERRI.has(L)) {
    const ch = q.st[ERRI.get(L)];
    if (ch === "x") { const s = q.fsev.get(L) ?? 3; return ["s" + s, s, `${SHORT[L]}: error de gravedad ${SEVN[s]}`]; }
    if (ch === "m") return ["mk", 3.5, `${SHORT[L]}: marcado para revisar primero`];
    if (ch === "p" || ch === "n") return ["ne", 3.7, `${SHORT[L]}: sin evaluar del todo`];
    if (ch === "o") return ["s4", 4, `${SHORT[L]}: sin problema`];
    return ["na", 5, `${SHORT[L]}: no aplica a este ejercicio`];
  }
  if (L === "sentence-length") { const s = q.scm.get(L) ?? 1; return [vclass(s), s, `${q.tok} tokens; A1 pide de ${RANGE.minTokens} a ${RANGE.maxTokens}`]; }
  if (L === "lemma-absence") {
    const s = q.scm.get(L) ?? 1, bits = [...(q.mis || []).map(m => `${m[0]} es de ${m[1]}`), ...(q.ooc || []).map(o => `${o} no está en el catálogo`)];
    return [vclass(s), s, bits.length ? bits.join("; ") : "Todas sus palabras son del nivel"];
  }
  if (L === "lemma-recurrence") {
    const ws = QW[q.i].map(k => WD.get(k)); const late = ws.filter(w => w.st === "s"), often = ws.filter(w => w.st === "o");
    if (late.length) return [late.length > 1 ? "v2" : "v1", 1 - late.length / 10, `Vuelven tarde: ${late.map(w => w.lemma).join(", ")}`];
    if (often.length) return ["v1", .95, `Vuelven demasiado seguido: ${often.map(w => w.lemma).join(", ")}`];
    return ["s4", 1, "Sus palabras vuelven a un intervalo sano"];
  }
  if (temaFlag[L]) return temaFlag[L].has(q.k) ? ["v2", .5, `El tema tiene ${L === "knowledge-title-length" ? "el título" : "la consigna"} largo`] : ["s4", 1, "El tema está bien"];
  return ["na", 1, "Esta medida no se toma ejercicio por ejercicio"];
}
function ordered(qs) {
  if (S.order !== "sev") return qs;
  const k = new Map(qs.map(qi => [qi, cellOf(Q[qi])[1]]));
  return [...qs].sort((a, b) => k.get(a) - k.get(b) || Q[b].nerr - Q[a].nerr || a - b);

function barcode(w, W) {
  const H = 64, P = W.positions || C.words.positions, X = p => 6 + (W - 12) * (p - 1) / (P - 1);
  let s = "";
  UNITS.forEach((u, i) => { s += `<rect class="ubg ${i % 2 ? "alt" : ""}" x="${X(u.p0)}" y="0" width="${Math.max(1, X(u.p1) - X(u.p0))}" height="${H - 16}" data-tt="${esc(plain(u.label))}"/>`; if (X(u.p1) - X(u.p0) > 18) s += `<text class="ulbl" x="${(X(u.p0) + X(u.p1)) / 2}" y="${H - 3}" text-anchor="middle">${u.num}</text>`; });
  const ps = w.ps || [];
  let gi = -1, gmax = 0; for (let i = 1; i < ps.length; i++) if (ps[i] - ps[i - 1] > gmax) { gmax = ps[i] - ps[i - 1]; gi = i; }
  if (gi > 0 && X(ps[gi]) - X(ps[gi - 1]) > 40) {
    const a = X(ps[gi - 1]), b = X(ps[gi]);
    s += `<path class="gapb" d="M${a} 6v-3h${b - a}v3"/><text class="gapl" x="${(a + b) / 2}" y="${H - 22}" text-anchor="middle" style="font-size:11px">${fmt(gmax)} palabras sin verla</text>`;

}

    UNITS.slice(0, 11).forEach(u => add("Unidades", rich(u.label), `${fmt(u.all.length)} ejercicios`, () => go({mode: "mapa", node: u.i, quiz: null})));
  } else {
    [...UNITS, ...TEMAS].filter(n => plain(n.label).toLowerCase().includes(q)).slice(0, 8).forEach(n => add(n.t === "T" ? "Unidades" : "Temas", rich(n.label), n.t === "K" ? plain(n.unit.label) : `${fmt(n.all.length)} ejercicios`, () => go({mode: "mapa", node: n.i, quiz: null})));
    A.filter(a => (a.name + " " + SHORT[a.id]).toLowerCase().includes(q)).slice(0, 5).forEach(a => add("Analizadores", esc(a.name), a.fam === "E" ? "errores" : "vocabulario", () => go({mode: "mapa", lens: a.id})));
    [...WD.values()].filter(w => w.lemma.toLowerCase().startsWith(q)).slice(0, 6).forEach(w => add("Palabras", `<span class="c">${esc(w.lemma)}</span>`, POS[w.pos] || w.pos, () => go({mode: "palabras", word: w.key, quiz: null})));
    Q.filter(x => (x.s + " " + (x.ans || "") + " " + (x.tr || "")).toLowerCase().includes(q)).slice(0, 8).forEach(x => add("Ejercicios", `<span class="c">${gapify(x.s)}</span>`, plain(x.tema.label), () => go({quiz: x.i})));
  }
  S.palItems = items; S.palSel = Math.min(S.palSel, Math.max(0, items.length - 1));
  let h = "", last = "";
  items.forEach((it, i) => { if (it.group !== last) { h += `<h5>${it.group}</h5>`; last = it.group; } h += `<button class="it" data-act="palgo" data-v="${i}" aria-selected="${i === S.palSel}"><span class="t">${it.html}</span><small>${esc(it.sub || "")}</small></button>`; });
  $("#palr").innerHTML = h || `<p class="empty">Nada con «${esc(q)}». Probá con parte de una oración, el nombre de un tema o una palabra en inglés.</p>`;
}
function palGo(i) { const it = S.palItems[i]; if (!it) return; closeLayer(); it.go(); }
function closeLayer() { $("#layer").innerHTML = ""; }
function menu(anchor, html) {
  const r = anchor.getBoundingClientRect();
  $("#layer").innerHTML = `<div class="scrim" data-act="scrim" style="background:transparent;animation:none"><div class="menu" role="menu" style="top:${r.bottom + 6}px;${r.left > innerWidth / 2 ? `right:${innerWidth - r.right}px` : `left:${Math.max(8, r.left)}px`}">${html}</div></div>`;
}
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("correcciones-tema", root.dataset.theme); } catch (e) {}
}

/* ── Render, historial y eventos ───────────────────────────────────────── */
function render(keep) {
  renderTop();
  if (S.mode === "mapa") { renderIndex(); renderMap(keep); } else { renderWordIndex(); renderWords(keep); }
  renderDrawer();
}
function hashOf() {
  const p = [];
  if (S.mode === "palabras") { p.push("m=palabras"); if (S.word) p.push("w=" + encodeURIComponent(S.word)); }
  else { if (S.node !== 1) p.push("n=" + S.node); if (S.lens !== "calidad") p.push("l=" + S.lens); }
  if (S.quiz != null) p.push("q=" + S.quiz);
  return "#" + p.join("&");
}
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  S.mode = h.get("m") === "palabras" ? "palabras" : "mapa";
  S.word = h.get("w") || null;
  const n = +h.get("n"); S.node = h.has("n") && N[n] ? n : 1;
  const l = h.get("l"); S.lens = l && (l === "calidad" || l === "err" || l === "voc" || AN.has(l)) ? l : "calidad";
  const q = h.get("q"); S.quiz = q != null && Q[+q] ? +q : null;
  S.rule = null; S.limit = 20; S.hl = null;
}
function go(patch, opts = {}) {
  const scopeChange = ("node" in patch && patch.node !== S.node) || ("lens" in patch && patch.lens !== S.lens) || ("mode" in patch && patch.mode !== S.mode) || ("word" in patch && patch.word !== S.word);
  if (scopeChange) { S.rule = null; S.limit = 20; S.hl = null; }
  Object.assign(S, patch);
  $("#app").classList.remove("show-side");
  render(opts.keep);
  const h = hashOf();
  if (h !== (location.hash || "#")) history[opts.replace ? "replaceState" : "pushState"](null, "", h);
}
addEventListener("popstate", () => { readHash(); render(); });

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === "scrim") { if (e.target === el) closeLayer(); return; }
  switch (act) {
    case "node": go({node: +v, mode: "mapa", quiz: innerWidth <= 980 ? null : S.quiz}); break;
    case "lens": go({lens: v, mode: "mapa"}, {keep: true}); break;
    case "lens-from-quiz": go({lens: v, mode: "mapa", node: Q[S.quiz].tema.i}); break;
    case "cell": { const [n, a] = v.split("|"); go({node: +n, lens: a}); break; }
    case "quiz": go({quiz: +v}, {keep: true}); break;
    case "qclose": go({quiz: null}, {keep: true}); break;
    case "qstep": { const q = Q[S.quiz], qs = q.tema.qs; const j = (q.j + +v + qs.length) % qs.length; go({quiz: qs[j]}, {keep: true, replace: true}); break; }
    case "order": S.order = v; render(true); break;
    case "hl": S.hl = S.hl === v ? null : v; render(true); break;
    case "rule": S.rule = S.rule === v || !v ? null : v; S.limit = 20; render(true); break;
    case "limit": S.limit += 20; render(true); break;
    case "mode": go({mode: v, quiz: null}); break;
    case "mode-words": S.wf = v; go({mode: "palabras", word: null, quiz: null}); break;
    case "word": go({mode: "palabras", word: v || null, quiz: null}); break;
    case "wf": S.wf = v; if (S.mode !== "palabras") go({mode: "palabras", word: null}); else { renderWordIndex(); } break;
    case "side": $("#app").classList.toggle("show-side"); break;
    case "palette": palette(); break;
    case "palgo": palGo(+v); break;
    case "theme": toggleTheme(); break;
    case "audits": menu(el, `<div class="mi"><span>7 de octubre, 08:15<small>Campaña A1, versión 11: ${fmt(Q.length)} ejercicios</small></span><span class="ck">✓</span></div><p class="note">Es el último análisis de esta campaña. Para ver qué cambió entre dos análisis, usá Comparación.</p>`); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "palq") { S.palSel = 0; paletteResults(); }
  if (e.target.id === "wq") { S.wq = e.target.value; $("#wrows").innerHTML = wordRows(); }
});
// Tooltip y realce del edificio bajo el cursor
const tip = $("#tip");
let tipKey = null;
document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tq],[data-tk],[data-tt],[data-tu]");
  const sky = $("#sky");
  const g = e.target.closest("#sky g"), du = e.target.closest(".district");
  if (sky) {
    sky.classList.toggle("dim", !!(g || du));
    sky.querySelectorAll("g.on").forEach(x => x.classList.remove("on"));
    if (g) g.classList.add("on");
    if (du) { const u = N[+du.dataset.tu]; u.kids.forEach(k => sky.querySelector(`g[data-k="${k}"]`)?.classList.add("on")); }
  }
  const key = t ? (t.dataset.tq ?? "") + "|" + (t.dataset.tk ?? "") + "|" + (t.dataset.tt ?? "") + "|" + (t.dataset.tu ?? "") : null;
  if (key === tipKey) return; tipKey = key;
  if (!t || t.dataset.tu) { tip.classList.remove("on"); return; }
  let h = "";
  if (t.dataset.tq) { const q = Q[+t.dataset.tq], [c, , txt] = cellOf(q); h = `<small>${rich(q.unit.label)} / ${rich(q.tema.label)}</small><span class="c">${gapify(q.s)}</span><span class="st ${c}"><i></i>${esc(txt)}</span>`; }
  else if (t.dataset.tk) { const k = N[+t.dataset.tk], nn = k.n; h = `<small>${rich(k.unit.label)}</small><b>${rich(k.label)}</b><small style="margin-top:3px">${fmt(k.qs.length)} ejercicios, ${pct(nn.any, nn.q)} con algún error. Tocá para acercarte.</small>`; }
  else h = esc(t.dataset.tt);
  tip.innerHTML = h; tip.classList.add("on");
});
document.addEventListener("mousemove", e => {
  if (!tip.classList.contains("on")) return;
  const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 16;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
document.addEventListener("mouseleave", () => tip.classList.remove("on"));
document.addEventListener("scroll", () => tip.classList.remove("on"), true);
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return palette(); }
  if ($("#pal")) {
    if (e.key === "Escape") return closeLayer();
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); S.palSel = Math.max(0, Math.min(S.palItems.length - 1, S.palSel + (e.key === "ArrowDown" ? 1 : -1))); paletteResults(); $("#palr [aria-selected=true]")?.scrollIntoView({block: "nearest"}); }
    if (e.key === "Enter") palGo(S.palSel);
    return;
  }
  if (e.key === "Escape") { if ($("#layer").innerHTML) return closeLayer(); if ($("#app").classList.contains("show-side")) return $("#app").classList.remove("show-side"); if (S.quiz != null) return go({quiz: null}, {keep: true}); if (S.hl) { S.hl = null; return render(true); } return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.quiz != null && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); const q = Q[S.quiz], qs = q.tema.qs; return go({quiz: qs[(q.j + (e.key === "ArrowRight" ? 1 : -1) + qs.length) % qs.length]}, {keep: true, replace: true}); }
  if (e.key === "Backspace" && S.mode === "mapa" && N[S.node].parent != null && S.node !== 1) { e.preventDefault(); return go({node: N[S.node].parent}); }
  if (e.key === "/") { e.preventDefault(); return palette(); }
});
let lastW = innerWidth;
addEventListener("resize", () => { clearTimeout(S.rz); S.rz = setTimeout(() => { if (Math.abs(innerWidth - lastW) > 30) { lastW = innerWidth; render(true); } }, 160); });

readHash();
render();
document.fonts?.ready.then(() => { if (S.mode === "mapa" && S.lens === "calidad") render(true); });
</script>
</body>
</html>
