  if (M.tab === "escribir") body = `<label class="field-label" for="mt-text">Nueva miniteoría</label>
    <textarea id="mt-text" data-act="mini-text">${esc(M.text)}</textarea>
    <span class="field-label" style="margin:0">Así la ve el alumno</span><div class="preview" id="mt-prev">${plain(M.text)}</div>
    <p class="fine" style="margin:0">Marcá el inglés entre $…$ para que se vea resaltado.</p>`;
  layer(`<aside class="drawer" role="dialog" aria-label="Corregir la miniteoría" data-stop>
    <header><div><h2>Corregir la miniteoría</h2><p>${plain(t.label)}, quiz …${S.quiz.slice(-4)}</p></div><button class="iconbtn" data-act="close" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="body">
      <div><span class="field-label">Dónde aplicar</span><div class="radios" role="radiogroup">
        ${radio("quiz", "Sólo este quiz", "El que estás revisando")}${radio("sel", "Algunos quizzes del tema", M.scope === "sel" ? (M.sel.size === 1 ? "1 elegido" : `${M.sel.size} elegidos`) : "Elegís cuáles")}${radio("tema", "Todo el tema", `${t.quizzes.length} quizzes con propuesta`)}</div>${pickList}</div>
      <div class="toggle" role="switch" aria-checked="${M.inc}" data-act="mini-inc" tabindex="0"><span class="sw"></span>Incluir quizzes ya aprobados <span style="color:var(--ink-3);font-size:12.5px">(vuelven a sin revisar)</span></div>
      <div><div class="tabs" role="tablist">${tab("pedir", "Pedir una reescritura")}${tab("elegir", "Usar una existente")}${tab("escribir", "Escribirla yo")}</div><div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">${body}</div></div>
    </div>
    <footer><p class="fine">Queda como borrador en esta corrección. No se aprueba ni se publica solo.</p>
      <button class="btn ghost small" data-act="close">Cancelar</button>
      <button class="btn primary small" data-act="mini-go">${M.tab === "pedir" ? "Reescribir" : M.tab === "elegir" ? "Usar esta" : "Guardar borrador"}</button></footer></aside>`);
}
function selectiveDrawer() {
  const mcs = T.items.filter(i => i.b.kind === "MULTIPLE_CHOICE" && i.f.some(f => f[1] === "another-option-valid")).slice(0, 4);
  S.selPick = S.selPick || new Set(mcs.slice(0, 2).map(i => i.id));
  const row = (i, k) => {
    const f = i.f.find(f => f[1] === "another-option-valid"); const off = k === 3;
    return `<div class="fp ${off ? "off" : ""}" role="checkbox" aria-checked="${S.selPick.has(i.id)}" ${off ? "" : `data-act="sel-pick" data-v="${i.id}"`} tabindex="0">
      <span class="check" aria-checked="${S.selPick.has(i.id)}">${checkSvg()}</span>
      <div><div class="q">${esc(sentence(i.b.p).replace(/⟦[^⟧]*⟧/g, "___"))} <span style="color:var(--ink-3);font-size:13px">(${i.b.mc.map(x => x[0]).join(", ")})</span></div>
      <p>${off ? "Ya tiene una corrección aprobada. Incluila sólo si querés revisarla de nuevo." : esc(cleanObs(f[3])).slice(0, 180)}</p></div></div>`;
  };
  layer(`<aside class="drawer" role="dialog" aria-label="Corrección selectiva" data-stop>
    <header><div><h2>Corrección selectiva de distractores</h2><p>Juez de opción múltiple, sólo sobre esta tanda</p></div><button class="iconbtn" data-act="close" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="body">
      <div class="flow"><span>El juez mide</span>${ICON.arrow}<span class="me">Vos elegís hallazgos</span>${ICON.arrow}<span>El corrector propone</span>${ICON.arrow}<span>El juez vuelve a medir</span></div>
      <div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px"><b>18 de 20 quizzes evaluados</b><span style="color:var(--ink-3)">2 sin evaluar</span></div><div class="meter"><i style="width:90%"></i></div>
        <p class="fine">Estimado sin consultar: 2 consultas nuevas y 18 resultados que se reusan. Juez en su versión aprobada, con codex-cli.</p></div>
      <div><span class="field-label">Hallazgos para corregir</span><div class="findpick">${mcs.map(row).join("")}</div></div>
      <div class="cap"><label for="cap">Tope de consultas</label><input id="cap" type="number" min="0" value="4"><span style="color:var(--ink-3)">incluye las validaciones</span></div>
    </div>
    <footer><p class="fine">Conserva tus revisiones y los otros pendientes. No aprueba ni publica nada.</p>
      <button class="btn ghost small" data-act="close">Cancelar</button>
      <button class="btn reject small" data-act="sel-go" data-v="analizar">Analizar</button>
      <button class="btn primary small" data-act="sel-go" data-v="corregir">Corregir ${S.selPick.size}</button></footer></aside>`);
}
function palette(prefill = "") {
  layer(`<div class="palette" role="dialog" aria-label="Buscar" data-stop><input id="pal" placeholder="Buscá un tema, una oración o una acción" value="${esc(prefill)}" autocomplete="off"><div class="res" id="palres"></div></div>`, "top");
  $("#pal").focus(); S.palSel = 0; paletteResults();
}
function paletteResults() {
  const q = ($("#pal")?.value || "").toLowerCase().trim();
  const out = [];
  const acts = [["Ir a la muestra ciega", "mode:ciega"], ["Ver el cierre de la tanda", "mode:cierre"], ["Ver el informe", "mode:informe"], ["Corrección selectiva de distractores", "tool:selective"], ["Cambiar entre claro y oscuro", "tool:theme"], ["Ver los atajos de teclado", "tool:keys"]];
  const pats = patterns.filter(p => !p.adhoc && (!q || p.name.toLowerCase().includes(q))).slice(0, q ? 6 : 4).map(p => ({grp: "Revisar en grupo", label: esc(p.name), x: fmt(p.ids.length), go: "pattern:" + p.n}));
  const tops = T.topics.filter(t => !q || stripDollars(t.label).toLowerCase().includes(q)).slice(0, 6).map(t => ({grp: "Temas", label: plain(t.label), x: t.unit, go: "topic:" + t.id}));
  let qz = [];
  if (q.length > 2) for (const [qid, its] of itemsByQuiz) {
    const s = fieldsOf(views(qid).after).p, s0 = fieldsOf(its[0].b).p;
    if (s.toLowerCase().includes(q) || s0.toLowerCase().includes(q) || qid.endsWith(q)) qz.push({grp: "Quizzes", label: `<span class="c">${plain(s)}</span>`, x: stripDollars(topicById.get(its[0].k).label), go: "quiz:" + qid});
    if (qz.length >= 8) break;
  }
  const ac = acts.filter(a => !q || a[0].toLowerCase().includes(q)).map(a => ({grp: "Acciones", label: a[0], x: "", go: a[1]}));
  out.push(...qz, ...tops, ...pats, ...ac);
  S.palItems = out; S.palSel = Math.min(S.palSel, Math.max(0, out.length - 1));
  let html = "", last = "";
  out.forEach((o, n) => { if (o.grp !== last) { html += `<div class="grp">${o.grp}</div>`; last = o.grp; }
    html += `<button class="it" aria-selected="${n === S.palSel}" data-act="pal-go" data-v="${n}"><span>${o.label}</span><span class="x">${esc(o.x)}</span></button>`; });
  $("#palres").innerHTML = html || `<p class="empty" style="padding:16px">Nada con «${esc(q)}». Probá con una palabra de la oración o el final del id.</p>`;
}
function palGo(n) {
  const o = S.palItems[n]; if (!o) return; closeLayer();
  const [k, v] = o.go.split(":");
  if (k === "mode") { S.mode = v; render(); }
  else if (k === "topic") openTopic(v);
  else if (k === "pattern") openPattern(+v);
  else if (k === "quiz") openTopic(itemsByQuiz.get(v)[0].k, v);
  else if (k === "tool") ({selective: selectiveDrawer, theme: toggleTheme, keys: keysSheet})[v]();
}
function keysSheet() {
  const k = (keys, d) => `<div>${keys.map(x => `<kbd>${x}</kbd>`).join("")}</div><div>${d}</div>`;
  layer(`<div class="sheet-modal" role="dialog" aria-label="Atajos" data-stop><h2>Atajos de teclado</h2><div class="keys">
    <h5>Revisar</h5>${k(["A"], "Aprobar las correcciones del quiz")}${k(["R"], "Rechazarlas")}${k(["U"], "Deshacer la última decisión")}
    ${k(["←", "→"], "Quiz anterior y siguiente")}${k(["N"], "Siguiente sin revisar")}${k(["V"], "Cambiar la vista")}${k(["M"], "Corregir la miniteoría")}
    <h5>Revisar en grupo</h5>${k(["J", "K"], "Moverse por la lista")}${k(["Espacio"], "Elegir o soltar la fila")}
    <h5>Muestra ciega</h5>${k(["1", "2", "3", "4"], "A mejor, iguales, B mejor, las dos mal")}
    <h5>En todos lados</h5>${k(["⌘", "K"], "Buscar")}${k(["?"], "Esta ayuda")}${k(["Esc"], "Cerrar")}</div></div>`);
}
function menu(anchor, html) {
  const r = anchor.getBoundingClientRect();
  $("#layer").innerHTML = `<div class="scrim" data-act="scrim" style="background:transparent;animation:none;opacity:1"><div class="menu" role="menu" data-stop style="top:${r.bottom + 6}px;${r.left > innerWidth / 2 ? `right:${innerWidth - r.right}px` : `left:${r.left}px`}">${html}</div></div>`;
}
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("correcciones-tema", root.dataset.theme); } catch (e) {}
  closeLayer();
}
function toast(msg, withUndo) {
  clearTimeout(S.toastTimer);
  $("#toast").innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${withUndo ? `<button data-act="undo">Deshacer <kbd>U</kbd></button>` : ""}</div>`;
  S.toastTimer = setTimeout(() => $("#toast").innerHTML = "", 4200);
}
// La misma corrección de consigna repetida en varios quizzes del tema se decide una vez.
function sharedInstr(t, q) {
  const own = (itemsByQuiz.get(q) || []).find(i => i.parts.length === 1 && i.parts[0] === "INSTRUCTIONS");
  if (!own) return null;
  const key = own.b.ins + "\u0000" + own.a.ins;
  const ids = t.quizzes.flatMap(x => itemsByQuiz.get(x)).filter(i => i.parts.length === 1 && i.parts[0] === "INSTRUCTIONS" && i.b.ins + "\u0000" + i.a.ins === key).map(i => i.id);
  return ids.length > 1 ? {own, ids} : null;
}
function sharedNotice(t) {
  const sh = sharedInstr(t, S.quiz);
  if (!sh) return "";
  const pend = sh.ids.filter(id => S.dec[id] === "PENDING").length;
  return `<div class="shared"><span>La misma corrección de consigna está en <b>${sh.ids.length} quizzes</b> de este tema${pend < sh.ids.length ? `, ${fmt(pend)} sin revisar` : ""}.</span>${pend > 1 ? `<button data-act="shared">Revisarlas juntas</button>` : ""}</div>`;
}
function openShared() {
  const t = topicById.get(S.topic); const sh = sharedInstr(t, S.quiz);
  const f = sh.own; dropAdhoc();
  patterns.push({n: patterns.length, origin: f.o, rule: f.rule, parts: ["INSTRUCTIONS"], frules: f.f.map(x => x[1]),
    name: `Consigna compartida en «${stripDollars(t.label)}»`, ids: sh.ids, adhoc: true});
  openPattern(patterns.length - 1);
}
function openPattern(n) {
  // Las pendientes primero; el orden queda fijo mientras decidís.
  const p = patterns[n]; const rank = id => S.dec[id] === "PENDING" ? 0 : 1;
  p.ids = [...p.ids].sort((x, y) => rank(x) - rank(y));
  S.mode = "revisar"; S.pattern = n; S.patSel = null; S.patLimit = 60; S.patFocus = 0; render();
}

/* ── Render y eventos ──────────────────────────────────────────────────── */
function render() {
  $("#app").classList.toggle("wide", S.mode !== "revisar");
  renderTop(); renderNav(); renderStage(); renderMargin();
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "scrim" && e.target.closest("[data-stop]")) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch (a) {
    case "mode": S.mode = v; if (v === "revisar" && S.pattern != null) {} closeLayer(); render(); break;
    case "topic": openTopic(v); $("#app").classList.remove("show-nav"); break;
    case "quiz": S.quiz = v; render(); break;
    case "step": step(+v); break;
    case "view": S.view = v; renderStage(); break;
    case "decide": decideQuiz(v); break;
    case "one": { const prev = S.dec[v]; decide([v], prev === el.dataset.s ? "PENDING" : el.dataset.s, "una corrección"); render(); break; }
    case "reset-quiz": decide(itemsByQuiz.get(S.quiz).map(i => i.id), "PENDING", "volver a sin revisar"); render(); break;
    case "next-pending": nextPending(); break;
    case "undo": undo(); $("#toast").innerHTML = ""; break;
    case "only": S.only = v; renderNav(); break;
    case "pattern": openPattern(+v); $("#app").classList.remove("show-nav"); break;
    case "close-pattern": dropAdhoc(); S.pattern = null; render(); break;
    case "shared": openShared(); break;
    case "palette-patterns": palette("");  break;
    case "pat-one": if (S.patSel.has(v)) S.patSel.delete(v); else S.patSel.add(v); renderStage(); break;
    case "pat-variant": { const vs = patternVariants(patterns[S.pattern])[+v].filter(id => S.dec[id] === "PENDING"); const all = vs.every(id => S.patSel.has(id)); vs.forEach(id => all ? S.patSel.delete(id) : S.patSel.add(id)); renderStage(); break; }
    case "pat-more": S.patLimit += 60; renderStage(); break;
    case "pat-decide": patDecide(v); break;
    case "dismiss-notice": S.blindNotice = false; renderStage(); break;
    case "blind": blindAnswer(v); break;
    case "blind-reset": S.blindAns = {}; S.blindIdx = 0; render(); break;
    case "more": { const p = el.previousElementSibling; p.classList.toggle("clamp"); el.textContent = p.classList.contains("clamp") ? "Leer todo" : "Leer menos"; break; }
    case "mini": miniDrawer(); break;
    case "mini-scope": S.mini.scope = v; miniDrawer(); break;
    case "mini-tab": S.mini.tab = v; miniDrawer(); break;
    case "mini-pick": S.mini.pick = +v; miniDrawer(); break;
    case "mini-inc": S.mini.inc = !S.mini.inc; miniDrawer(); break;
    case "mini-sel": S.mini.sel.has(v) ? S.mini.sel.delete(v) : S.mini.sel.add(v); miniDrawer(); break;
    case "mini-go": closeLayer(); toast(S.mini.tab === "pedir" ? "Pedido de reescritura en cola. El borrador aparece acá cuando vuelva." : "Borrador guardado en esta corrección, sin revisar."); S.mini = null; break;
    case "tool-selective": selectiveDrawer(); break;
    case "sel-pick": S.selPick.has(v) ? S.selPick.delete(v) : S.selPick.add(v); selectiveDrawer(); break;
    case "sel-go": closeLayer(); toast(v === "analizar" ? "Análisis en curso con tope de 4 consultas. Podés seguir revisando." : `Corrigiendo ${S.selPick.size} hallazgos. Los cambios llegan como propuestas sin revisar.`); break;
    case "copy": try { navigator.clipboard.writeText(S.quiz); } catch (err) {} toast("Id copiado: " + S.quiz); break;
    case "palette": palette(); break;
    case "pal-go": palGo(+v); break;
    case "close": case "scrim": closeLayer(); break;
    case "toggle-nav": $("#app").classList.toggle("show-nav"); break;
    case "toggle-margin": $("#app").classList.toggle("show-margin"); break;
    case "queue": menu(el, `<div style="padding:8px 10px 6px;font-size:13px;max-width:280px"><b>${S.saving ? "Guardando decisiones" : "Todo guardado"}</b><p class="fine" style="margin:4px 0 0">Las decisiones se guardan en segundo plano y en orden. Cerrar la app no pierde las que están en cola.</p></div>`); break;
    case "versions": menu(el, `<button data-act="close">Corrección 1<small>Actual, cerrada, ${T.batch.analyses} mediciones</small><span class="ck">✓</span></button><button data-act="close">Corrección 0<small>Integrada en la 1</small></button>`); break;
    case "tools": menu(el, `<button data-act="tool-selective">Corrección selectiva de distractores</button><button data-act="reload">Volver a leer la tanda</button><div class="sep"></div><button data-act="theme">Cambiar entre claro y oscuro</button><button data-act="keys">Atajos de teclado<span class="ck" style="color:var(--ink-3)">?</span></button>`); break;
    case "reload": closeLayer(); toast("Tanda releída: no hubo cambios desde la última lectura."); break;
    case "theme": toggleTheme(); break;
    case "keys": keysSheet(); break;
  }
});
document.addEventListener("change", e => { if (e.target.dataset.act === "judge") { S.judge = e.target.value; if (S.topic && !topicById.get(S.topic).all.some(matchesJudge)) { const t = T.topics.find(t => t.all.some(matchesJudge)); if (t) return openTopic(t.id); } const list = visibleQuizzes(topicById.get(S.topic)); if (!list.includes(S.quiz)) S.quiz = list[0]; render(); } });
document.addEventListener("input", e => {
  if (e.target.id === "pal") { S.palSel = 0; paletteResults(); }
  if (e.target.id === "mt-text") { S.mini.text = e.target.value; $("#mt-prev").innerHTML = plain(e.target.value); }
});
document.addEventListener("mouseover", e => {
  const n = e.target.closest("[data-hover]");
  const f = n ? n.dataset.hover : null;
  if (f === S.lit) return; S.lit = f;
  document.querySelectorAll(".row.lit").forEach(r => r.classList.remove("lit"));
  if (f) document.querySelectorAll(`.row[data-field="${f}"]`).forEach(r => r.classList.add("lit"));
});
function patDecide(status) {
  const ids = [...S.patSel].filter(id => S.dec[id] === "PENDING");
  if (!ids.length) return;
  decide(ids, status, `${status === "APPROVED" ? "aprobar" : "rechazar"} ${ids.length} del grupo`);
  S.patSel = new Set();
  render();
  toast(`${status === "APPROVED" ? "Aprobaste" : "Rechazaste"} ${fmt(ids.length)} correcciones del grupo`, true);
}
function blindAnswer(v) {
  S.blindAns[S.blindIdx] = v;
  const next = T.blind.findIndex((_, n) => !S.blindAns[n] && n > S.blindIdx);
  const any = T.blind.findIndex((_, n) => !S.blindAns[n]);
  S.blindIdx = next >= 0 ? next : any >= 0 ? any : S.blindIdx;
  render();
}
document.addEventListener("keydown", e => {
  const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return palette(); }
  if (e.key === "Escape") { closeLayer(); $("#app").classList.remove("show-nav", "show-margin"); return; }
  if ($("#pal")) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); S.palSel = Math.max(0, Math.min(S.palItems.length - 1, S.palSel + (e.key === "ArrowDown" ? 1 : -1))); paletteResults(); }
    if (e.key === "Enter") palGo(S.palSel);
    return;
  }
  if (inField || $("#layer").innerHTML || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "?") return keysSheet();
  if (S.mode === "ciega") {
    const map = {"1": "A", "2": "=", "3": "B", "4": "x"};
    if (map[k] && Object.keys(S.blindAns).length < T.blind.length) return blindAnswer(map[k]);
    if (e.key === "ArrowLeft" && S.blindIdx > 0) { S.blindIdx--; render(); }
    if (e.key === "ArrowRight" && S.blindIdx < T.blind.length - 1) { S.blindIdx++; render(); }
    return;
  }
  if (S.mode !== "revisar") return;
  if (k === "u") return undo();
  if (S.pattern != null) {
    const p = patterns[S.pattern];
    if (k === "a") return patDecide("APPROVED");
    if (k === "r") return patDecide("REJECTED");
    if (k === "j" || e.key === "ArrowDown") { e.preventDefault(); S.patFocus = Math.min(S.patFocus + 1, Math.min(S.patLimit, p.ids.length) - 1); renderStage(); return $(".inst.focus")?.scrollIntoView({block: "nearest"}); }
    if (k === "k" || e.key === "ArrowUp") { e.preventDefault(); S.patFocus = Math.max(0, S.patFocus - 1); renderStage(); return $(".inst.focus")?.scrollIntoView({block: "nearest"}); }
    if (k === " ") { e.preventDefault(); const id = p.ids[S.patFocus]; if (S.dec[id] === "PENDING") { S.patSel.has(id) ? S.patSel.delete(id) : S.patSel.add(id); renderStage(); } }
    return;
  }
  const quiet = !itemsByQuiz.has(S.quiz);
  if (k === "a" && !quiet && ["pend", "part"].includes(quizState(S.quiz))) return decideQuiz("APPROVED");
  if (k === "r" && !quiet && ["pend", "part"].includes(quizState(S.quiz))) return decideQuiz("REJECTED");
  if (e.key === "ArrowRight" || k === "j") return step(1);
  if (e.key === "ArrowLeft" || k === "k") return step(-1);
  if (k === "n") return nextPending();
  if (k === "v" && !quiet) { S.view = {marcas: "lado", lado: "alumno", alumno: "marcas"}[S.view]; return renderStage(); }
  if (k === "m" && !quiet) return miniDrawer();
});

// Arranque: el tema «Contable o incontable», en un quiz que la mesa reescribió entero.
const start = T.topics.find(t => stripDollars(t.label) === "Contable o incontable") || T.topics[0];
openTopic(start.id, start.quizzes.find(q => itemsByQuiz.get(q).some(i => i.parts.includes("STATEMENT"))));
</script>
