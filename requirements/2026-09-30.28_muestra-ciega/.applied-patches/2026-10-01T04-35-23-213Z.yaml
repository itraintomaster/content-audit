code: FEAT-CIEGA
description: "FEAT-CIEGA: la muestra ciega de cada tanda y la tasa de error a ciegas.\
  \ Un servicio sortea con semilla, entre los cambios que no vuelven según FEAT-METAS,\
  \ los pares de la tanda; los muestra como los ve el alumno con el renderizador del\
  \ integrador de la ronda 1, sin decir cuál es cuál; guarda cada respuesta con quié\
  n y cuándo; al cerrar revela los lados y publica las tres proporciones con su intervalo,\
  \ la meta, la suma desde la línea base y el kappa de dos revisores. Publica su resultado\
  \ por un puerto propio que el veredicto de FEAT-METAS inyecta. Rebasado por el integrador\
  \ de la ronda 2 sobre el sentinel.yaml de ronda1/integracion (la ronda 1 aplicada\
  \ y construida) y sobre FEAT-RONDA2, que se aplica antes; orden de la cadena: FEAT-RONDA2,\
  \ B, F y E, sin cambios de estructura.; qa-tester: 37 pruebas para las 6 reglas\
  \ de FEAT-CIEGA, con los casos del REQUIREMENT: el par de las verduras como lo ve\
  \ el alumno («I ___ (love) vegetables. Me encantan las verduras.» y «I ___ a lot\
  \ of vegetables. Me gustan mucho las verduras.»), «My grandmother ___ (come) every\
  \ year.» fuera de la muestra porque vuelve, 95 · 1 · 4 de 100 con sus intervalos,\
  \ la cota de 3,0 % con 100 pares y la suma de 300 y 400 pares, José y los 30 pares\
  \ del tester, y ±4,3 puntos con 400 ejercicios. F-CIEGA-J001 va a audit-cli, paquete\
  \ commands."
modules:
- name: revision-domain
  interfaces:
  - name: BlindSampleStore
    stereotype: port
    sealed: false
    exposes:
    - signature: "savePairs(BlindSample sample): void"
    - signature: "loadPairs(String sampleId): Optional<BlindSample>"
    - signature: "listPairs(): List<BlindSample>"
    - signature: "saveErrorRate(ErrorRateSample sample): void"
    - signature: "loadErrorRate(String sampleId): Optional<ErrorRateSample>"
    _change: add
  packages:
  - name: blindsample
    description: "FEAT-CIEGA. Contrato de las dos mediciones a ciegas: la muestra\
      \ de pares de una tanda (antes y después de cada cambio, sin decir cuál es cuá\
      l) y la tasa de error a ciegas de un nivel o del curso. Lo que ve quien revisa\
      \ no trae nada que delate el lado, el motivo, la fecha ni el autor; lo guardado\
      \ sí, y se revela al cerrar."
    visibility: public
    models:
    - name: PairAnswer
      type: enum
      fields:
      - name: A_BETTER
      - name: B_BETTER
      - name: EQUAL
      - name: BOTH_WRONG
        description: Los dos tienen un error (R003).
      _change: add
    - name: BlindSide
      type: enum
      fields:
      - name: A
      - name: B
      _change: add
    - name: StudentSide
      type: record
      fields:
      - name: view
        type: QuizStudentView
        description: "El ejercicio como lo ve el alumno antes de contestar: consigna,\
          \ oración con el hueco, pista, opciones, traducción y miniteoría (renderizador\
          \ del integrador, pedido 2 de G)."
      - name: answered
        type: String
        description: "La oración terminada, como la ve después de contestar."
      _change: add
    - name: BlindPair
      type: record
      fields:
      - name: index
        type: int
      - name: proposalId
        type: String
        domainLinks:
        - term: Propuesta de revisión
          role: carries
      - name: nodeId
        type: String
      - name: sideA
        type: StudentSide
      - name: sideB
        type: StudentSide
      - name: afterSide
        type: BlindSide
        description: "De qué lado quedó el después: sorteado por par con la misma\
          \ semilla, y revelado recién al cerrar (R002)."
      _change: add
    - name: BlindPairView
      type: record
      fields:
      - name: index
        type: int
      - name: sideA
        type: StudentSide
      - name: sideB
        type: StudentSide
      _change: add
    - name: PairAnswerRecord
      type: record
      fields:
      - name: pairIndex
        type: int
      - name: answer
        type: PairAnswer
      - name: reviewer
        type: String
      - name: answeredAt
        type: Instant
      _change: add
    - name: ProportionEstimate
      type: record
      fields:
      - name: count
        type: int
      - name: total
        type: int
      - name: share
        type: double
      - name: lower95
        type: double
        description: "Intervalo de Wilson al 95 %: 95 de 100 da [88,8; 97,8] (R004)."
      - name: upper95
        type: double
      - name: upperOneSided95
        type: double
        description: "Cota exacta a una cola: 0 de 100 da 3,0 %; es la del criterio\
          \ «cota» y la de la suma de tandas."
      _change: add
    - name: ReviewerAgreement
      type: record
      fields:
      - name: responsible
        type: String
      - name: other
        type: String
      - name: commonPairs
        type: int
      - name: agreeing
        type: int
      - name: kappa
        type: double
        description: Kappa de Cohen sobre los pares en común (R005).
      _change: add
    - name: CumulativeSample
      type: record
      fields:
      - name: samples
        type: int
        description: Muestras cerradas desde la línea base.
      - name: pairs
        type: int
      - name: worse
        type: int
      - name: worseUpperBound
        type: double
      - name: belowGoal
        type: boolean
        description: "Meta de avance: menos de 2 % sumando tandas; no decide (R004)."
      _change: add
    - name: BlindSample
      type: record
      fields:
      - name: sampleId
        type: String
      - name: scopeId
        type: String
        description: El de la tanda de E; con él lee el veredicto de FEAT-METAS.
      - name: baselineAuditId
        type: String
      - name: activeAuditId
        type: String
      - name: activePlanId
        type: String
      - name: seed
        type: long
        description: "Publicada: la misma tanda con la misma semilla da los mismos\
          \ pares en el mismo orden (R001)."
      - name: drawnAt
        type: Instant
      - name: goal
        type: BlindSampleGoal
      - name: pairs
        type: List<BlindPair>
      - name: answers
        type: List<PairAnswerRecord>
      - name: closedAt
        type: Instant
        description: null mientras está abierta; cerrada no acepta respuestas ni cambios
          (R003).
      glossarySuggestions:
      - name: Muestra ciega
        technicalName: BlindSample
        kind: process-candidate
        basedOn: revision-domain/blindsample/BlindSample
        derivedFrom:
        - Propuesta de revisión
        rationale: "La única medida de una tanda que no depende de ningún analizador\
          \ ni agente: pares de antes y después sin saber cuál es cuál."
      _change: add
    - name: BlindSampleResult
      type: record
      fields:
      - name: sampleId
        type: String
      - name: scopeId
        type: String
      - name: responsible
        type: String
      - name: answered
        type: int
      - name: betterOrEqual
        type: ProportionEstimate
      - name: worse
        type: ProportionEstimate
      - name: bothWrong
        type: ProportionEstimate
      - name: meetsGoal
        type: boolean
      - name: unmetParts
        type: List<String>
      - name: agreement
        type: ReviewerAgreement
      - name: cumulative
        type: CumulativeSample
      - name: revealedPairs
        type: List<BlindPair>
      _change: add
    - name: SampleClosedException
      type: exception
      fields:
      - name: sampleId
        type: String
      message: "Sample '%s' is closed: it no longer accepts answers or changes."
      _change: add
      extends: RuntimeException
    - name: SampleOutcome
      type: record
      fields:
      - name: sampleId
        type: String
      - name: scopeId
        type: String
      - name: closed
        type: boolean
      - name: answered
        type: int
      - name: betterOrEqual
        type: int
      - name: worse
        type: int
      - name: bothWrong
        type: int
      - name: meetsGoal
        type: boolean
        description: "Con el criterio que declara la meta: lo contado o la cota (R004)."
      - name: detail
        type: String
      _change: add
    - name: ErrorRateItem
      type: record
      fields:
      - name: index
        type: int
      - name: quizNodeId
        type: String
      - name: fromBaseline
        type: boolean
        description: Versión de la línea base o de la proyección; se revela al cerrar
          (R006).
      - name: side
        type: StudentSide
      _change: add
    - name: ErrorRateItemView
      type: record
      fields:
      - name: index
        type: int
      - name: side
        type: StudentSide
      _change: add
    - name: ErrorMark
      type: record
      fields:
      - name: itemIndex
        type: int
      - name: hasError
        type: boolean
      - name: reviewer
        type: String
      - name: markedAt
        type: Instant
      _change: add
    - name: ErrorRateSample
      type: record
      fields:
      - name: sampleId
        type: String
      - name: nodeTarget
        type: AuditTarget
      - name: nodeId
        type: String
      - name: size
        type: int
      - name: seed
        type: long
      - name: drawnAt
        type: Instant
      - name: baselineAuditId
        type: String
      - name: activeAuditId
        type: String
      - name: items
        type: List<ErrorRateItem>
      - name: marks
        type: List<ErrorMark>
      - name: closedAt
        type: Instant
      _change: add
    - name: ErrorRateResult
      type: record
      fields:
      - name: sampleId
        type: String
      - name: before
        type: ProportionEstimate
      - name: after
        type: ProportionEstimate
      - name: analyzersBefore
        type: ProportionEstimate
        description: "«Algún error» de los analizadores en esos mismos ejercicios,\
          \ de la línea base."
      - name: analyzersAfter
        type: ProportionEstimate
      - name: analyzersWithinMargin
        type: boolean
        description: "Si no, los analizadores se están perdiendo errores (R006)."
      _change: add
    interfaces:
    - name: BlindSampleService
      stereotype: port
      sealed: false
      exposes:
      - signature: "draw(Path coursePath, ProjectionScope scope, Long seed): BlindSample"
      - signature: "pairs(String sampleId): List<BlindPairView>"
      - signature: "answer(String sampleId, int pairIndex, PairAnswer answer, String\
          \ reviewer): void"
        throwsExceptions:
        - SampleClosedException
      - signature: "close(String sampleId): BlindSampleResult"
      - signature: "result(String sampleId): Optional<BlindSampleResult>"
      _change: add
    - name: SampleOutcomeSource
      stereotype: port
      sealed: false
      exposes:
      - signature: "outcomeFor(String scopeId): Optional<SampleOutcome>"
      _change: add
    - name: BlindErrorRateService
      stereotype: port
      sealed: false
      exposes:
      - signature: "draw(Path coursePath, AuditTarget nodeTarget, String nodeId, int\
          \ size, Long seed): ErrorRateSample"
      - signature: "items(String sampleId): List<ErrorRateItemView>"
      - signature: "mark(String sampleId, int itemIndex, boolean hasError, String\
          \ reviewer): void"
        throwsExceptions:
        - SampleClosedException
      - signature: "close(String sampleId): ErrorRateResult"
      _change: add
    _change: add
  - name: blindsampleengine
    description: FEAT-CIEGA. El motor de las dos mediciones a ciegas y su estadística.
      Público sólo para la raíz de composición (P8).
    visibility: public
    interfaces:
    - name: SampleStatistics
      stereotype: port
      sealed: false
      exposes:
      - signature: "proportion(int count, int total): ProportionEstimate"
      - signature: "kappa(List<PairAnswer> responsible, List<PairAnswer> other): double"
      _change: add
    implementations:
    - name: DefaultSampleStatistics
      visibility: public
      handwrittenTests:
      - name: "should give 95 of 100 the share 95% with the 95% Wilson interval [88.8;\
          \ 97.8], 1 of 100 [0.2; 5.4] and 4 of 100 [1.6; 9.8]"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R004
      - name: "should give 0 of 100 a one-sided 95% upper bound of 3.0%, 2 of 300\
          \ a bound of 2.1% and 2 of 400 a bound of 1.6%"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R004
      - name: should give Cohen's kappa 1 to two reviewers who answer every common
          pair alike and 0 to two who agree only as often as chance
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R005
      - name: should give 400 exercises a 95% margin of 4.3 points at 25.7% and of
          2.1 points at 5%
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R006
      implements:
      - SampleStatistics
      _change: add
    - name: DefaultBlindSampleService
      requiresInject:
      - name: courseProjector
        type: CourseProjector
        description: Las fotos approved (antes) y projected (después) de la tanda
          (FEAT-PROYU).
      - name: batchComparator
        type: BatchComparator
        description: "Se sortea entre los cambios que no vuelven (R001, F-METAS-R003)."
      - name: goalBook
        type: GoalBook
        description: "Tamaño, criterio, responsable y meta de la suma (F-METAS-R005)."
      - name: baselineStore
        type: BaselineStore
        description: La suma de R004 cuenta las muestras cerradas desde esta línea
          base.
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
        description: "El del integrador de la ronda 1 (gancho A-01, pedido 2 de G):\
          \ F no arma otro."
      - name: store
        type: BlindSampleStore
      - name: statistics
        type: SampleStatistics
      visibility: public
      handwrittenTests:
      - name: "should draw the same 100 changes in the same order twice with the same\
          \ seed, and other changes with another seed"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R001
      - name: "should draw only among the changes the comparison does not return,\
          \ so «My grandmother ___ (come) every year.» never enters the sample of\
          \ the four proposals of «Afirmativas regulares»"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R001
      - name: should take every change when the batch has fewer than the 100 pairs
          of the goal
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R001
      - name: "should publish with the sample the seed it drew with, also when the\
          \ request gives none"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R001
      - name: "should draw from the pending proposals of the batch scope, or from\
          \ those of the active plan when no batch is open"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R001
      - name: "should show the vegetables pair as the student sees each side, «I ___\
          \ (love) vegetables. Me encantan las verduras.» and «I ___ a lot of vegetables.\
          \ Me gustan mucho las verduras.»"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R002
      - name: "should show each side with its instruction, sentence with the gap,\
          \ hint, options, translation and mini-theory before answering, and the finished\
          \ sentence after answering"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R002
      - name: "should draw with the seed the side of the after for each pair, so it\
          \ changes from one pair to another"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R002
      - name: "should hand out while the sample is open only views without the side\
          \ of the after, analyzer marks, the reason of the change, dates or authors"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R002
      - name: should reveal which side is the before only when the sample is closed
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R002
      - name: "should keep each answer, A better, B better, equal or both wrong, with\
          \ who answered and when"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R003
      - name: "should refuse an answer or a change once the sample is closed with\
          \ «Sample '<id>' is closed: it no longer accepts answers or changes.»"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R003
      - name: "should write only the sample and its answers when answering, never\
          \ the course, the proposals or the analysis history"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R003
      - name: "should publish on closing 95 better or equal, 1 worse and 4 both wrong\
          \ of 100 answered pairs, each with its 95% interval"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R004
      - name: "should count as worse an answer for the side of the before, as better\
          \ or equal an answer for the after or equal, and both wrong apart"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R004
      - name: "should meet the goal José set on 30/9, at least 90 better or equal\
          \ and at most 1 worse counted, with 95, 1 and 4 of 100"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R004
      - name: "should not meet a goal on the bound of the worse below 2% with 100\
          \ pairs, whose lowest possible bound is 3.0%, and say which part is not\
          \ met"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R004
      - name: "should add up the samples closed since the baseline, 300 pairs with\
          \ 2 worse giving a bound of 2.1% above the goal of 2% and 400 pairs with\
          \ 2 worse giving 1.6% below it"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R004
      - name: should compute the result over the answered pairs only
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R004
      - name: "should compute the result of the batch with the answers of José, the\
          \ responsible the goal names, and not with those of the tester"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R005
      - name: "should publish in how many of the first 30 pairs José and the tester\
          \ answered alike, and Cohen's kappa over them"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R005
      - name: "should keep apart the answers of two reviewers to the same pair, each\
          \ with who answered and when"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R005
      implements:
      - BlindSampleService
      _change: add
    - name: DefaultSampleOutcomeSource
      requiresInject:
      - name: store
        type: BlindSampleStore
        description: "Lee la muestra de la tanda por su id de alcance; no conoce el\
          \ comparador, así que el comparador puede inyectarla sin ciclo."
      - name: statistics
        type: SampleStatistics
        description: Para el criterio «cota» de la meta guardada en la muestra (R004).
      visibility: public
      handwrittenTests:
      - name: "should give the verdict of a batch the outcome of its closed sample\
          \ by the scope id, with its counts and whether it meets its goal"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R004
      - name: should give an open sample as not closed and a batch without a sample
          as no outcome
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R004
      implements:
      - SampleOutcomeSource
      _change: add
    - name: DefaultBlindErrorRateService
      requiresInject:
      - name: courseProjector
        type: CourseProjector
      - name: baselineStore
        type: BaselineStore
      - name: auditReportStore
        type: AuditReportStore
        description: "La línea base, con sus ejercicios y su «algún error» por ejercicio."
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      - name: store
        type: BlindSampleStore
      - name: statistics
        type: SampleStatistics
      visibility: public
      handwrittenTests:
      - name: "should draw n exercises of a level or of the course, each shown once\
          \ in its baseline or its projected version, without saying which"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R006
      - name: "should hand out while open only each exercise as the student sees it,\
          \ without whether it comes from the baseline"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R006
      - name: "should publish on closing the share with an error before and after\
          \ with its 95% margin, 4.3 points at 25.7% with 400 exercises"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R006
      - name: should publish next to it the any-error share the analyzers gave those
          same exercises and say whether it falls within the margin
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R006
      - name: should refuse a mark once the error-rate sample is closed
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R006
      implements:
      - BlindErrorRateService
      _change: add
    allowedClients:
    - audit-cli
    _change: add
  _change: modify
- name: audit-infrastructure
  implementations:
  - name: FileSystemBlindSampleStore
    requiresInject:
    - name: baseDir
      type: Path
      description: "Raíz bajo la que se escribe .content-audit/blind-samples/: só\
        lo muestras y respuestas; nada del curso, las propuestas ni el historial (R003)."
    types:
    - Repository
    visibility: public
    handwrittenTests:
    - name: should keep samples and their answers under .content-audit/blind-samples/
        and write nothing else
      traceability:
        feature: FEAT-CIEGA
        rule: F-CIEGA-R003
    implements:
    - BlindSampleStore
    _change: add
  _change: modify
- name: audit-cli
  interfaces:
  - name: BlindSampleCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "draw(String coursePath, List<String> proposalIds, Long seed, String\
        \ format): Integer"
    - signature: "show(String sampleId, String format): Integer"
    - signature: "answer(String sampleId, int pairIndex, String answer, String reviewer):\
        \ Integer"
    - signature: "close(String sampleId, String format): Integer"
    _change: add
  - name: ErrorRateCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "draw(String coursePath, String level, int size, Long seed, String\
        \ format): Integer"
    - signature: "show(String sampleId, String format): Integer"
    - signature: "mark(String sampleId, int itemIndex, boolean hasError, String reviewer):\
        \ Integer"
    - signature: "close(String sampleId, String format): Integer"
    _change: add
  packages:
  - name: commands
    implementations:
    - name: DefaultBlindSampleCommand
      requiresInject:
      - name: blindSampleService
        type: BlindSampleService
      types:
      - Component
      handwrittenTests:
      - name: should print with sample show only what can be seen while the sample
          is open
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R002
      - name: should accept only the four answers and refuse any other with a non-zero
          exit
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R003
      implements:
      - BlindSampleCommand
      _change: add
    - name: DefaultErrorRateCommand
      requiresInject:
      - name: blindErrorRateService
        type: BlindErrorRateService
      types:
      - Component
      handwrittenTests:
      - name: "should draw with error-rate draw from the level it names, as A1, or\
          \ from the whole course"
        traceability:
          feature: FEAT-CIEGA
          rule: F-CIEGA-R006
      implements:
      - ErrorRateCommand
      _change: add
    _change: modify
  _change: modify
features:
- id: FEAT-CIEGA
  code: F-CIEGA
  journeys:
  - id: F-CIEGA-J001
    validation: AUTO_VALIDATED
    testModule: audit-cli
    testPackage: com.learney.contentaudit.auditcli.commands
