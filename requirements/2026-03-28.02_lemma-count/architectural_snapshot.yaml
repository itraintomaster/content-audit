code: FEAT-LCOUNT
description: "FEAT-LCOUNT: Analisis de conteo de repeticiones de lemas content-word.\
  \ Anade el analyzer 'lemma-count' en audit-domain (paquete lemmacount), el config\
  \ sealed asociado, un resolver dedicado para la cadena CEFR (EVP -> NLP -> no asignado),\
  \ diagnoses tipados a nivel curso y nivel CEFR, una nueva firma en EvpCatalogPort\
  \ para resolver CEFR por lema, y el wiring del config default en audit-application.;\
  \ Introduce el seam de carga para LemmaCountConfig: una interface LemmaCountConfigLoader\
  \ en audit-application y su implementacion DefaultLemmaCountConfigLoader. Habilita\
  \ una superficie observable para F-LCOUNT-R007 (campo ausente -> default 4) y F-LCOUNT-R008\
  \ (campo presente e invalido -> falla al cargar). DefaultLemmaCountConfig gana un\
  \ constructor (int threshold) para permitir construir instancias con un umbral parseado\
  \ y validado; el constructor por defecto se elimina para forzar el flujo por el\
  \ loader.; Cambia la firma del port LemmaCefrLevelResolver para recibir como segundo\
  \ parametro un Optional<CefrLevel> con el nivel CEFR aportado por el procesamiento\
  \ linguistico (NLP). Habilita una superficie observable para F-LCOUNT-R010 (rama\
  \ positiva: EVP sin entrada + NLP con CEFR -> usar el CEFR del NLP), que hasta hoy\
  \ era un contrato latente porque NlpToken no expone CEFR. El modelo NlpToken queda\
  \ intacto: la condicionalidad de R010 vive en la firma del port, no en el modelo\
  \ del token. Runtime sin cambio: LemmaCountAnalyzer invoca con Optional.empty()\
  \ y R010 sigue latente en ejecucion."
modules:
- name: audit-domain
  interfaces:
  - name: EvpCatalogPort
    sealed: false
    exposes:
    - signature: "lookupLevel(LemmaAndPos lemmaAndPos): Optional<CefrLevel>"
      _change: add
    _change: modify
  - name: LemmaCountConfig
    stereotype: port
    sealed: true
    exposes:
    - signature: "getThreshold(): int"
    _change: modify
    extends:
    - SelfDescribingConfig
  - name: CourseDiagnoses
    sealed: false
    exposes:
    - signature: "getLemmaCountDiagnosis(): Optional<LemmaCountCourseDiagnosis>"
      _change: add
    _change: modify
  - name: LevelDiagnoses
    sealed: false
    exposes:
    - signature: "getLemmaCountDiagnosis(): Optional<LemmaCountLevelDiagnosis>"
      _change: add
    _change: modify
  packages:
  - name: lemmacount
    description: "Conteo de repeticiones de lemas content-word por oraciones distintas\
      \ en todo el curso. Asigna un nivel CEFR a cada lema con la cadena EVP -> NLP\
      \ -> 'no asignado', calcula score por lema (min(count/N, 1.0)), agrega por nivel\
      \ CEFR (promedio simple) y por curso (promedio simple de niveles)."
    visibility: internal
    models:
    - name: LemmaCountStats
      type: record
      fields:
      - name: lemmaAndPos
        type: LemmaAndPos
        description: Lema content-word con su POS (par identificador segun R002)
      - name: count
        type: int
        description: "Numero de oraciones distintas del curso que contienen el lema\
          \ (R004, R005)"
      - name: score
        type: double
        description: "Score del lema: min(count/N, 1.0) (R006)"
      - name: assignedLevel
        type: Optional<CefrLevel>
        description: Nivel CEFR asignado por la cadena R009 -> R010; vacio si el lema
          cae al grupo 'no asignado' (R011)
      _change: modify
    - name: LevelLemmaCountResult
      type: record
      fields:
      - name: level
        type: CefrLevel
        description: Nivel CEFR cuyo score se reporta
      - name: score
        type: double
        description: "Score del nivel: promedio simple de los scores de sus lemas\
          \ (R012)"
      - name: totalLemmas
        type: int
        description: Total de lemas evaluados asignados a este nivel (R017)
      - name: subExposedLemmas
        type: List<LemmaCountStats>
        description: Lemas del nivel con score < 1.0 (R017); ordenados por count ascendente
          para priorizar
      _change: modify
    - name: UnassignedLemmaEntry
      type: record
      fields:
      - name: lemmaAndPos
        type: LemmaAndPos
        description: Lema sin nivel CEFR asignado por ninguna fuente (R011)
      - name: count
        type: int
        description: Conteo de oraciones distintas con el lema (R018); no se calcula
          score
      _change: modify
    - name: LemmaCountResult
      type: record
      fields:
      - name: thresholdN
        type: int
        description: Umbral N usado para calcular los scores (R016)
      - name: courseScore
        type: Optional<Double>
        description: "Score global del curso: promedio simple de los scores de los\
          \ niveles CEFR (R013, R015). Vacio si ningun nivel tiene score asignable."
      - name: levels
        type: List<LevelLemmaCountResult>
        description: Detalle por nivel CEFR con score (R017). Niveles sin lemas asignados
          no aparecen (R012).
      - name: unassigned
        type: List<UnassignedLemmaEntry>
        description: "Lemas que no pudieron clasificarse en ningun nivel CEFR (R011,\
          \ R018). Informativos: no entran al score del curso (R014)."
      _change: modify
    - name: LemmaCountCourseDiagnosis
      type: record
      fields:
      - name: result
        type: LemmaCountResult
        description: "Resultado consolidado del analisis: score global, N usado, detalle\
          \ por nivel y lemas no asignados."
      _change: modify
    - name: LemmaCountLevelDiagnosis
      type: record
      fields:
      - name: levelResult
        type: LevelLemmaCountResult
        description: "Resultado de este nivel CEFR concreto (score, total de lemas,\
          \ sub-expuestos)."
      _change: modify
    interfaces:
    - name: LemmaCefrLevelResolver
      sealed: false
      exposes:
      - signature: "resolve(LemmaAndPos lemmaAndPos): Optional<CefrLevel>"
        _change: delete
      - signature: "resolve(LemmaAndPos lemmaAndPos, Optional<CefrLevel> nlpCefr):\
          \ Optional<CefrLevel>"
        _change: add
      _change: modify
    implementations:
    - name: EvpThenNlpLemmaCefrLevelResolver
      requiresInject:
      - name: evpCatalogPort
        type: EvpCatalogPort
        description: Fuente primaria de nivel CEFR (R009).
      visibility: public
      handwrittenTests:
      - name: should return EVP level when EVP catalog contains the lemma
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R009
      - name: should query EVP catalog by the lemma-and-POS pair as composite identity
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R009
      - name: should return empty when EVP catalog has no entry and no other source
          provides CEFR
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R011
      - name: should return NLP CEFR hint when EVP catalog has no entry for the lemma
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R010
      - name: should prefer EVP level over NLP CEFR hint when EVP catalog also contains
          the lemma
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R010
      implements:
      - LemmaCefrLevelResolver
      _change: modify
    - name: LemmaCountAnalyzer
      requiresInject:
      - name: contentWordFilter
        type: ContentWordFilter
        description: Aplica el filtro POS content-word del universo (R001).
      - name: lemmaCefrLevelResolver
        type: LemmaCefrLevelResolver
        description: Asigna CEFR al lema con la cadena R009 -> R010 -> R011.
      - name: lemmaCountConfig
        type: LemmaCountConfig
        description: "Provee el umbral N usado en el score (R006, R007, R008, R016)."
      visibility: public
      handwrittenTests:
      - name: should count VERB lemma when content-word filter accepts it
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R001
      - name: should exclude DET token from lemma count when content-word filter rejects
          it
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R001
      - name: should exclude PROPN token from lemma count when content-word filter
          rejects it
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R001
      - name: should count run-as-VERB and run-as-NOUN as two distinct lemmas with
          independent counts
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R002
      - name: should count ran-running-runs as three appearances of the same VERB
          lemma run after lemmatization
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R002
      - name: should not report lemmas absent from the course in the analysis result
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R003
      - name: should count a lemma once when it appears multiple times in the same
          quiz sentence
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R004
      - name: should count a lemma N times when it appears in N distinct quiz sentences
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R004
      - name: should accumulate count of an A1 lemma across quizzes from A1 A2 and
          B1 milestones
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R005
      - name: should compute lemma score as count divided by N when count is below
          N
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R006
      - name: should cap lemma score at 1.0 when count equals or exceeds N
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R006
      - name: should compute level score as simple average of its lemma scores
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R012
      - name: should omit a CEFR level from results when no assigned lemma falls into
          it
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R012
      - name: should compute course score as simple average of level scores regardless
          of lemma count per level
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R013
      - name: should compute course score using only canonical CEFR levels and ignoring
          the unassigned group
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R014
      - name: should expose course score in the lemma-count diagnosis attached to
          the course node
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R015
      - name: should expose empty course score when no canonical CEFR level has assignable
          score
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R015
      - name: should expose the threshold N used in the lemma-count result
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R016
      - name: should list per-level total of evaluated lemmas in the lemma-count result
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R017
      - name: should list sub-exposed lemmas with score below 1.0 sorted by ascending
          count for each CEFR level
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R017
      - name: should not list fully exposed lemmas with score 1.0 individually in
          the per-level detail
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R017
      - name: should list unassigned lemmas with their count in the lemma-count result
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R018
      - name: should return lemma-count as analyzer name
        traceability:
          feature: FEAT-LCOUNT
          rule: F-LCOUNT-R019
      implements:
      - ContentAnalyzer
      _change: modify
    _change: modify
  _change: modify
- name: audit-application
  interfaces:
  - name: LemmaCountConfigLoader
    stereotype: port
    sealed: false
    exposes:
    - signature: "load(String rawThreshold): LemmaCountConfig"
    visibility: public
    _change: add
  implementations:
  - name: DefaultLemmaCountConfig
    requiresInject:
    - name: threshold
      type: int
      description: Umbral N validado (entero positivo). Provisto por DefaultLemmaCountConfigLoader.
    types:
    - Component
    visibility: public
    handwrittenTests:
    - name: should return 4 as default threshold N when no override is configured
      _change: delete
    implements:
    - LemmaCountConfig
    _change: modify
  - name: DefaultLemmaCountConfigLoader
    types:
    - Component
    visibility: public
    handwrittenTests:
    - name: should return a config with threshold 4 when raw threshold is null
      traceability:
        feature: FEAT-LCOUNT
        rule: F-LCOUNT-R007
    - name: should reject zero as threshold value with IllegalArgumentException
      traceability:
        feature: FEAT-LCOUNT
        rule: F-LCOUNT-R008
    - name: should reject a negative integer as threshold value with IllegalArgumentException
      traceability:
        feature: FEAT-LCOUNT
        rule: F-LCOUNT-R008
    - name: should reject a decimal number as threshold value with IllegalArgumentException
      traceability:
        feature: FEAT-LCOUNT
        rule: F-LCOUNT-R008
    - name: should reject a non-numeric string as threshold value with IllegalArgumentException
      traceability:
        feature: FEAT-LCOUNT
        rule: F-LCOUNT-R008
    - name: should reject an empty string as threshold value with IllegalArgumentException
      traceability:
        feature: FEAT-LCOUNT
        rule: F-LCOUNT-R008
    implements:
    - LemmaCountConfigLoader
    _change: add
  _change: modify
features:
- id: FEAT-LCOUNT
  journeys:
  - id: F-LCOUNT-J001
    validation: AUTO_VALIDATED
    testModule: audit-domain
    testPackage: com.learney.contentaudit.auditdomain.lemmacount
