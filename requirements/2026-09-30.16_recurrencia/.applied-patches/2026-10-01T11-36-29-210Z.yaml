code: FEAT-RECUR
description: "orquestador como qa-tester, FEAT-RECUR, sólo nombres de pruebas: José\
  \ eligió la opción B el 1/10 (la puntuación no ocupa posición) y se juntó ronda1/recur-posiciones\
  \ en ronda2/integracion. Siete nombres declarados decían los números de la opció\
  n A y el cuerpo ya fija los de B: recurrencia 0,09 con 160 normales, 1.534 poco\
  \ vistas y 49 sobre-expuestas de 1.743; niveles A1 448/200, A2 752/203, B1 1.137/187\
  \ y B2 818/201; 1.583 hallazgos; «movie» cada 855 y normal; «suppose» 23.684; la\
  \ evidencia de «vegetable»; y el curso a 74,07 %. Cada una se borra con el nombre\
  \ viejo y se agrega con el nuevo, con la misma regla. Sin cambios de estructura."
modules:
- name: audit-domain
  implementations:
  - name: IAuditEngine
    handwrittenTests:
    - name: "should keep the course vocabulary score at 73.92% with lemma-recurrence\
        \ at 0.08 publishing its course diagnosis, on the published scores of the\
        \ analysis of 29/9"
      _change: delete
    - name: "should keep the course vocabulary score at 74.07% with lemma-recurrence\
        \ at 0.09 publishing its course diagnosis, on the published scores of the\
        \ analysis of 29/9"
      traceability:
        feature: FEAT-RECUR
        rule: F-RECUR-R001
  packages:
  - name: lrec
    implementations:
    - name: LemmaRecurrenceAnalyzer
      handwrittenTests:
      - name: "should give the course of 29/9 a lemma-recurrence score of 0.08, with\
          \ 131 normal, 1,566 under-exposed and 46 over-exposed of its 1,743 returning\
          \ lemmas"
        _change: delete
      - name: "should give the course of 29/9 a lemma-recurrence score of 0.09, with\
          \ 160 normal, 1,534 under-exposed and 49 over-exposed of its 1,743 returning\
          \ lemmas"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R001
      - name: "should publish in the course diagnosis each analysed lemma with its\
          \ count, mean interval, status, deviation, longest gap with its start and\
          \ end levels and its levels, like 'movie': 90 times, every 1,005 words,\
          \ under-exposed, longest gap 6,510 from A1 to A2"
        _change: delete
      - name: "should publish in the course diagnosis each analysed lemma with its\
          \ count, mean interval, status, deviation, longest gap with its start and\
          \ end levels and its levels, like 'movie': 90 times, every 855 words, normal,\
          \ longest gap 5,400 from A1 to A2"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R003
      - name: "should take a lemma's longest gap as the largest interval between two\
          \ consecutive occurrences, with the levels of the quizzes where it starts\
          \ and ends, like 27,379 from B1 to B2 for 'suppose'"
        _change: delete
      - name: "should take a lemma's longest gap as the largest interval between two\
          \ consecutive occurrences, with the levels of the quizzes where it starts\
          \ and ends, like 23,684 from B1 to B2 for 'suppose'"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R003
      - name: "should publish for the course of 29/9 A1 448 returning lemmas with\
          \ 176 normal (39.3%), A2 752 with 155 (20.6%), B1 1,137 with 161 (14.2%)\
          \ and B2 818 with 165 (20.2%)"
        _change: delete
      - name: "should publish for the course of 29/9 A1 448 returning lemmas with\
          \ 200 normal (44.6%), A2 752 with 203 (27.0%), B1 1,137 with 187 (16.4%)\
          \ and B2 818 with 201 (24.6%)"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R004
      - name: "should give as evidence the lemma, its times, how often it returns\
          \ against the goal and its longest gap, like 'movie: 90 times, returns every\
          \ 1,005 words (goal: more than 50 and up to 1,000); its longest gap, 6,510,\
          \ goes from A1 to A2'"
        _change: delete
      - name: "should give as evidence the lemma, its times, how often it returns\
          \ against the goal and its longest gap, like 'vegetable: 10 times, returns\
          \ every 7,765 words (goal: more than 50 and up to 1,000); its longest gap,\
          \ 23,825, is in B1'"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R005
      - name: "should leave 1,612 findings in the course of 29/9, 1,566 for under-exposed\
          \ and 46 for over-exposed lemmas"
        _change: delete
      - name: "should leave 1,583 findings in the course of 29/9, 1,534 for under-exposed\
          \ and 49 for over-exposed lemmas"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R005
