code: FEAT-RECUR
description: "FEAT-RECUR: lemma-recurrence publica lo que ya calcula. Un diagnostico\
  \ de curso con las estadisticas de cada lema (con su hueco mas largo y sus niveles)\
  \ y la recurrencia medida dentro de cada nivel como detalle, nunca como puntaje;\
  \ hallazgos de curso que solo ordenan por cada lema fuera de rango (findingsAt de\
  \ FEAT-HALL, 0.3); y un formateador para stats analyzer. Umbrales, puntaje de curso\
  \ (0,08) y plan quedan como hoy. El slot en CourseDiagnoses y la linea del formateador\
  \ en Main son enganches (ronda1/ganchos-D.md).; qa-tester: traza las 6 reglas de\
  \ FEAT-RECUR a 24 handwrittenTests nuevos (ninguno portado: los 11 de LREC siguen\
  \ trazados a sus reglas) en LemmaRecurrenceAnalyzer, LemmaRecurrenceAnalyzerProvider\
  \ (de 0.3), LemmaRecurrenceDetailedFormatter, StatsAnalyzerCmd, DefaultRefinerEngine\
  \ e IAuditEngine, y ubica F-RECUR-J001 en audit-cli, paquete commands. Las que dependen\
  \ de 0.3 o de un gancho D-xx lo dicen en el TECH_SPEC."
modules:
- name: audit-domain
  implementations:
  - name: IAuditEngine
    handwrittenTests:
    - name: "should keep the course vocabulary score at 73.92% with lemma-recurrence\
        \ at 0.08 publishing its course diagnosis, on the published scores of the\
        \ analysis of 29/9"
      traceability:
        feature: FEAT-RECUR
        rule: F-RECUR-R001
    - name: "should keep the vocabulary score of every level at 96.54, 94.16, 79.45\
        \ and 63.51 with the recurrence of each level published as detail"
      traceability:
        feature: FEAT-RECUR
        rule: F-RECUR-R004
  packages:
  - name: lrec
    visibility: internal
    models:
    - name: LemmaStats
      type: record
      fields:
      - name: longestGap
        type: int
        description: "Intervalo mas largo entre dos apariciones seguidas, en posiciones\
          \ del curso (F-RECUR-R003)."
        _change: add
      - name: longestGapFromLevel
        type: CefrLevel
        description: Nivel del ejercicio donde empieza el hueco mas largo.
        _change: add
      - name: longestGapToLevel
        type: CefrLevel
        description: Nivel del ejercicio donde termina el hueco mas largo.
        _change: add
      - name: levels
        type: List<CefrLevel>
        description: "Niveles donde aparece, de A1 a B2, sin repetir."
        _change: add
      _change: modify
    - name: LevelRecurrence
      type: record
      fields:
      - name: level
        type: CefrLevel
      - name: positions
        type: int
        description: "Posiciones del nivel: todos sus tokens, como en el curso."
      - name: returningLemmas
        type: int
        description: Lemas que vuelven al menos una vez dentro del nivel.
      - name: normalCount
        type: int
      - name: subExposedCount
        type: int
      - name: overExposedCount
        type: int
      - name: normalShare
        type: double
        description: "normalCount / returningLemmas. Detalle, no puntaje: no se escribe\
          \ en scores ni entra al vocabulario del nivel (F-RECUR-R004)."
      _change: add
    - name: LemmaRecurrenceCourseDiagnosis
      type: record
      fields:
      - name: result
        type: LemmaRecurrenceResult
        description: "Lo de todo el curso: una LemmaStats por lema analizado, de mas\
          \ a menos veces, el resumen y el puntaje publicado (F-LREC-R012, R013; F-RECUR-R003)."
      - name: levels
        type: List<LevelRecurrence>
        description: "La recurrencia dentro de cada nivel del curso, de A1 a B2, con\
          \ los mismos umbrales y el mismo tope (F-RECUR-R004)."
      _change: add
    implementations:
    - name: LemmaRecurrenceAnalyzer
      handwrittenTests:
      - name: "should give the course of 29/9 a lemma-recurrence score of 0.08, with\
          \ 134 normal, 1,570 under-exposed and 46 over-exposed of its 1,750 returning\
          \ lemmas"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R001
      - name: "should score the course as before, normal lemmas over analysed lemmas\
          \ rounded to two decimals, while it also publishes its course diagnosis"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R001
      - name: "should publish in the course diagnosis each analysed lemma with its\
          \ count, mean interval, status, deviation, longest gap with its start and\
          \ end levels and its levels, like 'movie': 90 times, every 1,005 words,\
          \ under-exposed, longest gap 6,510 from A1 to A2"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R003
      - name: "should take a lemma's longest gap as the largest interval between two\
          \ consecutive occurrences, with the levels of the quizzes where it starts\
          \ and ends, like 27,379 from B1 to B2 for 'suppose'"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R003
      - name: should list the levels where a lemma appears from A1 to B2 without repeating
          them
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R003
      - name: should publish the analysed lemmas from most to least frequent
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R003
      - name: "should publish for each level the recurrence measured only with its\
          \ quizzes and the same thresholds: returning lemmas, normal, under-exposed,\
          \ over-exposed and the normal share"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R004
      - name: "should close the sums of every level, so normal plus under-exposed\
          \ plus over-exposed lemmas equal its returning lemmas"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R004
      - name: "should publish for the course of 29/9 A1 450 returning lemmas with\
          \ 178 normal (39.6%), A2 752 with 155 (20.6%), B1 1,139 with 161 (14.1%)\
          \ and B2 819 with 165 (20.1%)"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R004
      - name: should keep the recurrence of each level as detail of the course diagnosis
          and never write a lemma-recurrence score on a milestone
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R004
      - name: "should leave in the course one finding per under-exposed or over-exposed\
          \ lemma, of rule F-RECUR-R005, low severity, only ordering and instant cost,\
          \ and none for a normal one"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R005
      - name: "should give as evidence the lemma, its times, how often it returns\
          \ against the goal and its longest gap, like 'movie: 90 times, returns every\
          \ 1,005 words (goal: more than 50 and up to 1,000); its longest gap, 6,510,\
          \ goes from A1 to A2'"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R005
      - name: should leave no finding when the course score is 1
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R005
      - name: "should leave no finding for a lemma seen only once, which lemma-recurrence\
          \ does not analyse"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R005
      - name: should identify each finding by its lemma
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R005
      - name: "should leave 1,616 findings in the course of 29/9, 1,570 for under-exposed\
          \ and 46 for over-exposed lemmas"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R005
    - name: LemmaRecurrenceAnalyzerProvider
      handwrittenTests:
      - name: "should describe lemma-recurrence in its card: whether words return\
          \ at healthy intervals, reading the sentences of the whole course in order,\
          \ vocabulary family, course target, goal of returning every more than 50\
          \ and up to 1,000 words, only ordering and instant cost"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R006
    _change: modify
  _change: modify
- name: audit-cli
  packages:
  - name: formatting
    implementations:
    - name: LemmaRecurrenceDetailedFormatter
      types:
      - Component
      visibility: public
      handwrittenTests:
      - name: "should show each lemma of the lemma-recurrence course diagnosis with\
          \ its count, interval, status, deviation, longest gap and levels, and the\
          \ recurrence of each level"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R003
      - name: "should print the values of the course diagnosis as published, without\
          \ recomputing them from positions"
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R003
      implements:
      - DetailedFormatter
      _change: add
    _change: modify
  - name: commands
    implementations:
    - name: StatsAnalyzerCmd
      handwrittenTests:
      - name: should show with stats analyzer lemma-recurrence the data of each lemma
          and each level read from the course diagnosis of the report
        traceability:
          feature: FEAT-RECUR
          rule: F-RECUR-R003
  _change: modify
- name: refiner-domain
  implementations:
  - name: DefaultRefinerEngine
    handwrittenTests:
    - name: "should keep a single LEMMA_RECURRENCE task, on the course, and 4,036\
        \ tasks in the plan of the analysis of 29/9 with the new lemma-recurrence\
        \ diagnosis and findings"
      traceability:
        feature: FEAT-RECUR
        rule: F-RECUR-R002
    - name: "should open no task for lemma-recurrence findings, only the course task\
        \ when its score is below 1"
      traceability:
        feature: FEAT-RECUR
        rule: F-RECUR-R002
features:
- id: FEAT-RECUR
  code: F-RECUR
  journeys:
  - id: F-RECUR-J001
    validation: AUTO_VALIDATED
    testModule: audit-cli
    testPackage: com.learney.contentaudit.auditcli.commands
