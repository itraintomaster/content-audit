code: FEAT-NIVFR
description: "FEAT-NIVFR, el nivel propio de la forma derivada (F-NIVFR-R002, correccion\
  \ del 1/10). El EVP trae aparte formas derivadas y compuestas de otro lema (rewarding\
  \ C1, de reward; smoking A1, de smoke; terrifying B2, de terrify) y F-LABS-R040\
  \ las deja, con razon, fuera del nivel de su lema base, asi que ningun metodo del\
  \ puerto las consulta. off-level-words las necesita para que el nivel propio de\
  \ la palabra gane a la base, la parte, el sufijo del tema, el par britanico y el\
  \ prestamo. EvpCatalogPort suma lookupDerivedFormLevel, que FileSystemEvpCatalog\
  \ resuelve con un indice aparte (lookupLevel y lookupLevelByLemma no cambian: lemma-absence,\
  \ lexis y el 73,9 % no se mueven), y el proveedor y el analizador lo reciben por\
  \ inyeccion. Medido con un prototipo sobre el curso del 29/9: rewarding (C1, en\
  \ B1) vuelve a marcar y smoking (A1, en «smoke - smoking») deja de marcar; 104 ejercicios\
  \ igual, escribir/nivel 26 de 52."
modules:
- name: audit-domain
  interfaces:
  - name: EvpCatalogPort
    sealed: false
    exposes:
    - signature: "lookupDerivedFormLevel(String word): Optional<CefrLevel>"
      _change: add
    _change: modify
  packages:
  - name: offlevelwords
    implementations:
    - name: OffLevelWordsAnalyzerProvider
      requiresInject:
      - name: evpCatalogPort
        type: EvpCatalogPort
        description: "Para el nivel propio de una forma derivada o compuesta que el\
          \ EVP trae aparte (lookupDerivedFormLevel, F-NIVFR-R002). El nivel de cada\
          \ palabra sigue siendo el del puntuador compartido (R001): el catalogo solo\
          \ decide si una lectura puede soltar lo que lexis ya marca."
        _change: add
      _change: modify
    - name: OffLevelWordsAnalyzer
      requiresInject:
      - name: evpCatalogPort
        type: EvpCatalogPort
        _change: add
      _change: modify
    _change: modify
  _change: modify
