code: FEAT-NIVFR
description: "FEAT-NIVFR, el nivel propio de la forma derivada (F-NIVFR-R002, correccion\
  \ del 1/10), con sus pruebas. El EVP trae aparte formas derivadas y compuestas de\
  \ otro lema (rewarding C1, de reward; smoking A1, de smoke; terrifying B2, de terrify)\
  \ y F-LABS-R040 las deja, con razon, fuera del nivel de su lema base, asi que ningun\
  \ metodo del puerto las consulta. off-level-words las necesita para que el nivel\
  \ propio de la palabra gane a la base, la parte, el par britanico y el prestamo;\
  \ solo le gana el sufijo que ensena el tema (decision del orquestador del 1/10).\
  \ EvpCatalogPort suma lookupDerivedFormLevel, que FileSystemEvpCatalog resuelve\
  \ con un indice aparte (lookupLevel y lookupLevelByLemma no cambian: lemma-absence,\
  \ lexis y el 73,9 % no se mueven), y el proveedor y el analizador lo reciben por\
  \ inyeccion. qa-tester: 15 pruebas de OffLevelWordsAnalyzer para las tres reglas\
  \ de la correccion (nivel propio, prestamo solo sustantivo, par americano exacto),\
  \ la otra categoria solo en listas y el sufijo del tema, y 3 de FileSystemEvpCatalog\
  \ para el metodo nuevo. Medido con un prototipo sobre el curso del 29/9: 99 ejercicios\
  \ con y sin el parche, porque rewarding y smoking las cubre el sufijo de su tema;\
  \ el parche cuida al derivado que el EVP trae alto y que la lectura de su base soltaria."
modules:
- name: audit-domain
  interfaces:
  - name: EvpCatalogPort
    sealed: false
    exposes:
    - signature: "lookupDerivedFormLevel(String word): Optional<CefrLevel>"
      _change: add
    _change: modify
  packages:
  - name: offlevelwords
    implementations:
    - name: OffLevelWordsAnalyzerProvider
      requiresInject:
      - name: evpCatalogPort
        type: EvpCatalogPort
        description: "Para el nivel propio de una forma derivada o compuesta que el\
          \ EVP trae aparte (lookupDerivedFormLevel, F-NIVFR-R002). El nivel de cada\
          \ palabra sigue siendo el del puntuador compartido (R001): el catalogo solo\
          \ decide si una lectura puede soltar lo que lexis ya marca."
        _change: add
      _change: modify
    - name: OffLevelWordsAnalyzer
      requiresInject:
      - name: evpCatalogPort
        type: EvpCatalogPort
        _change: add
      handwrittenTests:
      - name: "should not mark 'smoking' in the A1 list 'smoke - smoking' of a topic\
          \ that does not teach -ing, because the EVP lists 'smoking' as a form of\
          \ 'smoke' at A1 although the lemma 'smoking' resolves to B2"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R002
      - name: "should mark 'rewarding' in a B1 quiz of a topic that does not teach\
          \ -ing, out of the lemmas of the EVP and with its base 'reward' at B1, because\
          \ the EVP lists 'rewarding' apart at C1"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R002
      - name: "should not mark 'terrifying' in a B1 quiz when the EVP lists it as\
          \ a form of 'terrify' at B2, one level above, even with no reading of its\
          \ base"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R002
      - name: "should not mark a derivative out of the EVP that the EVP does not list\
          \ either and whose base is within reach, like 'creamy' (cream A2) in a B1\
          \ quiz"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R002
      - name: "should mark 'nicely' (B2) in an A1 quiz of a topic that does not teach\
          \ -ly, since a base never beats the level the EVP gives a word"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R002
      - name: "should mark the noun 'fine' (B1) in the A1 quiz 'He paid a fine.' although\
          \ the adjective is A1, because another category only counts in a list of\
          \ words"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R002
      - name: "should read 'run' as the verb (A1) and not mark it in the A1 list 'run\
          \ - running', where the tagger reads a noun (B1)"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R002
      - name: "should not mark 'takeout' (out of the EVP) in an A2 quiz, reading it\
          \ as its British pair 'takeaway' (B1)"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R002
      - name: "should mark 'recess' (out of the EVP) in a B1 quiz although 'break'\
          \ is A1, because recess and break do not name the same thing in common use"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R002
      - name: "should keep marking 'truck' when the EVP brings it two levels above\
          \ the A2 quiz, even though its British pair 'lorry' is A2"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R002
      - name: "should not mark 'nicely' (B2) in an A1 quiz of a topic whose title\
          \ teaches '$-ly$', because forming it from 'nice' (A1) is the exercise"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R003
      - name: "should mark 'allergic' in an A2 quiz although the translation adapts\
          \ it to Spanish, because an adjective that looks Spanish is not a loan"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R004
      - name: "should not mark 'limousine' in a B2 quiz whose translation says 'limusina',\
          \ a noun adapted to Spanish spelling"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R004
      - name: "should keep marking 'adore' when the tagger reads it as a noun after\
          \ 'They' and the translation says 'adoran', because the sentence uses it\
          \ as a verb"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R004
      - name: "should keep marking 'rehabilitation' in a B1 quiz although the translation\
          \ adapts it to Spanish, because the EVP lists it as a form of 'rehabilitate'\
          \ at C1"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R004
      _change: modify
    _change: modify
  _change: modify
- name: vocabulary-infrastructure
  packages:
  - name: evp
    implementations:
    - name: FileSystemEvpCatalog
      handwrittenTests:
      - name: "should resolve lookupDerivedFormLevel to the lowest level of the entries\
          \ that list the word as a form of another lemma, like 'rewarding' at C1\
          \ for 'reward'"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R002
      - name: "should return empty from lookupDerivedFormLevel for a word listed only\
          \ as its own lemma, as a plural of its lemma or inside a phrase"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R002
      - name: "should keep lookupLevel and lookupLevelByLemma as they were when it\
          \ indexes derived forms, so 'reward' still resolves to B1"
        traceability:
          feature: FEAT-NIVFR
          rule: F-NIVFR-R006
