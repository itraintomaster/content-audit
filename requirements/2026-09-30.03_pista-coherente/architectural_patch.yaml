code: FEAT-PISTA
description: "FEAT-PISTA: hint-coherence, el analizador de errores que compara la\
  \ pista de cada ejercicio de hueco para escribir con su primera respuesta —palabra,\
  \ sujeto y negación— y marca los que no llevan pista en un tema donde tres cuartos\
  \ o más la llevan. Declara también la tabla cerrada de formas irregulares, que usa\
  \ Respuestas completas para saber si «'s» es is o has. No toca el lematizador compartido\
  \ (DOUBT-PISTA-LEMATIZADOR). Diseñado contra el modelo que queda después de 0.2\
  \ y 0.3 (AnalyzerProvider, ContentAnalyzer.findingsAt, FindingResolution) e inyecta\
  \ el renderizador QuizStudentViewRenderer del integrador de la ronda 1."
modules:
- name: audit-domain
  interfaces:
  - name: IrregularFormsCatalog
    stereotype: port
    sealed: false
    exposes:
    - signature: "formsOf(String baseWord): Set<String>"
    - signature: "isPastParticiple(String word): boolean"
    visibility: public
    domainLinks:
    - term: Forma flexionada
      role: carries
    glossarySuggestions:
    - name: Tabla de formas irregulares
      technicalName: IrregularFormsCatalog
      kind: value-object-candidate
      basedOn: audit-domain/IrregularFormsCatalog
      rationale: "Lista cerrada de formas irregulares (drink, drank, drunk; good,\
        \ better, best, well) que usa la pista para reconocer la forma flexionada\
        \ que el lematizador compartido no resuelve (swum, hated). No lematiza el\
        \ curso: el lematizador compartido no cambia en esta ronda."
    _change: add
  packages:
  - name: hintcoherence
    description: "Analizador hint-coherence (FEAT-PISTA), familia errores, evalúa\
      \ QUIZ de hueco para escribir. Lee la pista (el paréntesis pegado al hueco;\
      \ en la respuesta que es la oración entera, el paréntesis y el enunciado con\
      \ «/»), la compara con la primera respuesta usando los tokens y lemas que el\
      \ curso ya trae (NlpToken de la oración guardada) más la forma flexionada y\
      \ la tabla de irregulares, y cuenta en onKnowledge cuántos del tema y del mismo\
      \ tipo llevan pista (umbral de tres cuartos, José 30/9). La resolución de cada\
      \ hallazgo sale de su tipo: la palabra de la pista que no está en la respuesta\
      \ va a la mesa y el resto por regla (DOUBT-PISTA-CUANDO-MESA). Públicos: el\
      \ proveedor y el diagnóstico."
    visibility: public
    models:
    - name: HintCoherenceDiagnosis
      type: record
      fields:
      - name: hint
        type: String
        description: La pista como la ve el alumno; null si el ejercicio no tiene.
      - name: firstAnswer
        type: String
        description: "La primera respuesta aceptada, la que dice el audio."
      - name: shape
        type: ExerciseShape
      - name: hintedInTopic
        type: int
        description: Ejercicios del tema y del mismo tipo que llevan pista (F-PISTA-R001).
      - name: comparableInTopic
        type: int
        description: Ejercicios del tema y del mismo tipo.
      - name: issues
        type: List<HintIssue>
        description: "Una por cosa que no coincide, en orden de regla y de palabra."
      - name: score
        type: double
        description: 1 sin hallazgos; 0 con alguno (F-PISTA-R005).
      _change: add
    - name: HintIssue
      type: record
      fields:
      - name: rule
        type: String
        description: La regla de FEAT-PISTA que no se cumple (F-PISTA-R001 a R004).
      - name: kind
        type: HintIssueKind
      - name: word
        type: String
        description: "Lo que marca: la palabra de la pista, el verbo sin anunciar\
          \ o el sujeto. Es la marca de la identidad del hallazgo."
      - name: proposedHint
        type: String
        description: "La pista que sale de la primera respuesta —verbo en forma base,\
          \ sujeto y not—: el arreglo por regla. El audio no cambia."
      - name: resolution
        type: FindingResolution
        description: RULE o PANEL según el tipo (DOUBT-PISTA-CUANDO-MESA).
      _change: add
    - name: HintIssueKind
      type: enum
      fields:
      - name: MISSING_HINT
        description: Sin pista en un tema donde tres cuartos o más la llevan (R001).
          Regla.
      - name: HINT_WORD_ABSENT
        description: "Una palabra de la pista no está en la respuesta, ni flexionada\
          \ ni por su lema (R002, invariante 1). Mesa: puede estar mal la respuesta."
      - name: VERB_NOT_ANNOUNCED
        description: "Un verbo de la respuesta que no es auxiliar no está en la pista\
          \ (R002, invariante 2). Regla."
      - name: SUBJECT_MISMATCH
        description: "El pronombre sujeto de la pista no es el de la respuesta (R003,\
          \ invariante 1). Regla."
      - name: SUBJECT_NOT_ANNOUNCED
        description: "El hueco abre la oración y nada nombra el sujeto de la respuesta\
          \ (R003, invariante 2). Regla."
      - name: NEGATION_WITHOUT_NEGATIVE
        description: La pista trae not y la respuesta no niega (R004). Regla.
      _change: add
    - name: ExerciseShape
      type: enum
      fields:
      - name: GAP_IN_SENTENCE
        description: Hueco dentro de la oración.
      - name: WHOLE_SENTENCE
        description: La respuesta es la oración entera (reescritura o transformación).
      _change: add
    - name: ExerciseHint
      type: record
      fields:
      - name: text
        type: String
        description: "El texto de la pista, sin paréntesis."
      - name: words
        type: List<String>
        description: "Las palabras que anuncia, sin el sujeto ni not."
      - name: subject
        type: String
        description: El pronombre sujeto que trae; null si no trae.
      - name: negated
        type: boolean
      - name: choice
        type: boolean
        description: "Pista de elección («(good / well)», «Our / ours»): la respuesta\
          \ es una de sus opciones y no se compara palabra por palabra."
      visibility: internal
      _change: add
    interfaces:
    - name: HintReader
      sealed: false
      exposes:
      - signature: "read(AuditableQuiz quiz,SentenceMode mode): Optional<ExerciseHint>"
      - signature: "shapeOf(AuditableQuiz quiz,SentenceMode mode): ExerciseShape"
      visibility: internal
      _change: add
    - name: HintAnswerCheck
      sealed: false
      exposes:
      - signature: "check(ExerciseHint hint,AuditableQuiz quiz): List<HintIssue>"
      visibility: internal
      _change: add
    implementations:
    - name: HintCoherenceAnalyzerProvider
      requiresInject:
      - name: irregularForms
        type: IrregularFormsCatalog
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      visibility: public
      implements:
      - AnalyzerProvider
      _change: add
    - name: HintCoherenceAnalyzer
      requiresInject:
      - name: hintReader
        type: HintReader
      - name: answerCheck
        type: HintAnswerCheck
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      implements:
      - ContentAnalyzer
      _change: add
    - name: DefaultHintReader
      implements:
      - HintReader
      _change: add
    - name: DefaultHintAnswerCheck
      requiresInject:
      - name: irregularForms
        type: IrregularFormsCatalog
      implements:
      - HintAnswerCheck
      _change: add
    _change: add
  _change: modify
- name: vocabulary-infrastructure
  packages:
  - name: irregularforms
    description: "Lee la tabla cerrada de formas irregulares (analysis/recursos-compartidos/formas-irregulares.json):\
      \ verbos irregulares con su pasado y su participio, y comparativos y superlativos\
      \ irregulares con el adverbio well. Es dato de referencia como el EVP, no un\
      \ lematizador: no toca los lemas del curso."
    visibility: internal
    implementations:
    - name: FileSystemIrregularFormsCatalog
      requiresInject:
      - name: catalogPath
        type: Path
      visibility: public
      implements:
      - IrregularFormsCatalog
      _change: add
    _change: add
  _change: modify
features:
- id: FEAT-PISTA
  code: F-PISTA
