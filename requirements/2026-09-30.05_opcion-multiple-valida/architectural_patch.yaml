code: FEAT-OMVAL
description: "FEAT-OMVAL: multiple-choice-validity, el analizador de errores que revisa\
  \ las opciones de cada ejercicio de opción múltiple —una sola correcta, todas distintas\
  \ también en la forma, la mayúscula que pide la oración y el artículo que no delata—\
  \ y por donde entran los veredictos del juez de «otra opción también vale» (FEAT-MCVALE,\
  \ paquete C): una sola fila y una sola ficha (José, 30/9). Este parche declara el\
  \ analizador y el lugar del juez; el juez mismo lo diseña C. Diseñado contra el\
  \ modelo después de 0.2 (AuditableQuiz.multipleChoice, MultipleChoiceEntity) y 0.3\
  \ (AnalyzerProvider, findingsAt, FindingSeverity); usa la comparación del corrector\
  \ del parche de FEAT-RESPC y el renderizador QuizStudentViewRenderer del integrador.;\
  \ qa-tester: traza las 5 reglas de FEAT-OMVAL a 24 handwrittenTests nuevas (no hay\
  \ tests previos que portar), cada una con un caso real del curso, y ubica F-OMVAL-J001\
  \ en audit-domain, paquete multiplechoicevalidity. Dependen del integrador y de\
  \ C: el juez (A-07), el ejercicio a medias (A-08, DOUBT-OMVAL-JUEZ-A-MEDIAS) y la\
  \ evidencia (A-01); las opciones gemelas por contraccion usan la tabla del corrector\
  \ nuevo (A-15): con la copia de hoy solo cuentan mayuscula y signos."
modules:
- name: audit-domain
  interfaces:
  - name: MultipleChoiceJudgeFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "open(EvaluationRunPolicy policy): MultipleChoiceJudgeSession"
    - signature: "judgeRule(): AnalyzerRuleCard"
    visibility: public
    _change: add
  - name: MultipleChoiceJudgeSession
    sealed: false
    exposes:
    - signature: "judge(AuditNode quizNode): MultipleChoiceJudgement"
    - signature: "coverage(): EvaluationCoverage"
    - signature: "consultedJudgeVersion(): Optional<String>"
    visibility: public
    _change: add
  packages:
  - name: multiplechoicevalidity
    description: "Analizador multiple-choice-validity (FEAT-OMVAL), familia errores,\
      \ evalúa QUIZ de opción múltiple. Corre sus cuatro reglas instantáneas sobre\
      \ las opciones como las ve el alumno y, por cada ejercicio, le pide al juez\
      \ de C su veredicto por la sesión de la corrida (MultipleChoiceJudgeSession),\
      \ abierta con la política y el tope de este analizador. Si el juez está pendiente,\
      \ falló o no está conectado, el ejercicio queda evaluado por las reglas y a\
      \ medias por el juez: sus hallazgos de regla cuentan y «algún error» se lee\
      \ como piso (gancho del contrato para el integrador). Públicos: el proveedor,\
      \ el diagnóstico, el veredicto del juez y la fábrica «sin juez», que usa la\
      \ raíz de composición hasta que C conecte el suyo."
    visibility: public
    models:
    - name: MultipleChoiceValidityDiagnosis
      type: record
      fields:
      - name: issues
        type: List<OptionIssue>
        description: "Una por cosa que no se cumple en las opciones, en orden de regla\
          \ y de opción."
      - name: judgement
        type: MultipleChoiceJudgement
        description: "Lo que dijo el juez de «otra opción también vale» en esta corrida,\
          \ con su estado."
      - name: score
        type: double
        description: "0 con algún hallazgo que cuenta, de regla o del juez; 1 si no\
          \ hay ninguno conocido (F-OMVAL-R005)."
      _change: add
    - name: OptionIssue
      type: record
      fields:
      - name: rule
        type: String
        description: La regla de FEAT-OMVAL que no se cumple (R001 a R004).
      - name: kind
        type: OptionIssueKind
      - name: option
        type: String
        description: "La opción marcada, como la ve el alumno. Es la marca de la identidad\
          \ del hallazgo."
      - name: relatedOption
        type: String
        description: "La otra opción involucrada: la gemela de R002; null si no hay."
      - name: involvesCorrect
        type: boolean
        description: "Si una de las dos opciones es la correcta: decide alta o baja\
          \ en R002."
      _change: add
    - name: OptionIssueKind
      type: enum
      fields:
      - name: NO_VALID_OPTION
        description: "R001: ninguna opción vale el puntaje entero. Bloqueante."
      - name: SEVERAL_VALID_OPTIONS
        description: "R001: valen dos o más. Bloqueante."
      - name: IDENTICAL_OPTIONS
        description: "R002: dos opciones se ven idénticas. Bloqueante si una es la\
          \ correcta; baja si no."
      - name: SAME_ANSWER_OTHER_FORM
        description: "R002: dos opciones son la misma respuesta con otra mayúscula,\
          \ signo, contracción o grafía de la lista (José, 30/9). Alta si una es la\
          \ correcta —hay dos correctas—; baja si no, sobra una. Mesa."
      - name: LOWERCASE_SENTENCE_START
        description: "R003.1: el hueco abre la oración y alguna opción empieza en\
          \ minúscula. Regla, sobre todas las opciones a la vez."
      - name: LOWERCASE_I
        description: "R003.1: el pronombre I en minúscula en una opción. Regla."
      - name: DASH_AT_SENTENCE_START
        description: "R003.2: el guion de «no poner nada» en un hueco que abre la\
          \ oración. Mesa."
      - name: ARTICLE_GIVES_AWAY
        description: "R004: el a o an de antes del hueco sólo encaja con alguna opció\
          n. Media, mesa."
      _change: add
    - name: MultipleChoiceJudgement
      type: record
      fields:
      - name: status
        type: MultipleChoiceJudgementStatus
      - name: alsoValidOptions
        type: List<AlsoValidOption>
        description: Opciones incorrectas que el juez también da por válidas en el
          contexto. Vacía si el juez no encontró ninguna o no juzgó.
      - name: judgeVersion
        type: String
        description: "Procedencia del veredicto (F-QINST-R010): no decide qué vale.\
          \ null si no hubo veredicto."
      - name: reused
        type: boolean
        description: Si el veredicto salió del libro de evaluaciones sin consultar
          (F-EVCOST-R003).
      _change: add
    - name: MultipleChoiceJudgementStatus
      type: enum
      fields:
      - name: JUDGED
        description: "Hay veredicto, nuevo o reutilizado."
      - name: PENDING
        description: "Sin veredicto: se agotó el tope de la corrida o no se pidió\
          \ pagar."
      - name: FAILED
        description: "El juez no respondió o respondió algo inusable (F-QINST-R007,\
          \ R013)."
      - name: NOT_AVAILABLE
        description: "No hay juez conectado: la fábrica «sin juez» de este paquete."
      _change: add
    - name: AlsoValidOption
      type: record
      fields:
      - name: option
        type: String
        description: "La opción incorrecta que también vale, como la ve el alumno."
      - name: explanation
        type: String
        description: "Por qué vale, en una línea en castellano: la evidencia del hallazgo\
          \ del juez."
      _change: add
    - name: MultipleChoiceJudgeCoverageDiagnosis
      type: record
      fields:
      - name: coverage
        type: EvaluationCoverage
        description: "Cuántos ejercicios de opción múltiple juzgó el juez en la corrida,\
          \ cuántos reutilizó y cuántos quedaron pendientes o fallidos."
      - name: consultedJudgeVersion
        type: String
        description: Versión del juez consultado en esta corrida; null si no se consultó.
      _change: add
    interfaces:
    - name: OptionRuleCheck
      sealed: false
      exposes:
      - signature: "check(AuditableQuiz quiz): List<OptionIssue>"
      visibility: internal
      _change: add
    implementations:
    - name: MultipleChoiceValidityAnalyzerProvider
      requiresInject:
      - name: correctorMatcher
        type: CorrectorMatcher
      - name: judgeFactory
        type: MultipleChoiceJudgeFactory
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      visibility: public
      handwrittenTests:
      - name: "should describe multiple-choice-validity with one card that asks «¿\
          Hay una sola opción correcta, y ninguna se delata por la forma?», lists\
          \ its four instant rules and the judge's rule and declares the paid model\
          \ cost, the highest"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R005
      implements:
      - AnalyzerProvider
      _change: add
    - name: MultipleChoiceValidityAnalyzer
      requiresInject:
      - name: optionRules
        type: OptionRuleCheck
      - name: judgeSession
        type: MultipleChoiceJudgeSession
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      handwrittenTests:
      - name: "should raise a blocking finding on an exercise with no valid option\
          \ or with several, as «The performance was ___ awful.» with no option scoring"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R001
      - name: "should send twin options to the panel, blocking when they look identical\
          \ and one is correct, high when only their form differs from the correct\
          \ one and low when both are incorrect, as «'ve got to» and «have got to»\
          \ in «David ___ call his mother now. (must)»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R002
      - name: "should rate the capital letter low when all options share their case\
          \ and medium when only some do, and resolve it by one rule over all the\
          \ options at once, as in «___ a child? (He)»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R003
      - name: "should send the dash at the start of a sentence to the panel, as in\
          \ «___ golf is difficult to learn.»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R003
      - name: "should send the article that gives the answer away to the panel as\
          \ medium, with the article and the options as evidence, as in «It was an\
          \ ___ wonderful experience.»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R004
      - name: "should never leave a finding of its own on a write-in exercise, as\
          \ «They ___ (not / be) from Ireland.»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R005
      - name: "should score 0 a multiple choice exercise with a finding and 1 one\
          \ with a single correct option, distinct options and nothing that gives\
          \ it away, as «The performance was ___ awful.»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R005
      - name: "should identify each finding by its rule, its exercise and the option\
          \ it marks, so two runs mark «very» in «He's an ___ amazing man.» the same"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R005
      - name: "should keep counting the findings of its rules on an exercise the judge\
          \ did not see and say that the judge did not see it, as «___ a child? (He)»\
          \ with the judge pending"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R005
      - name: "should turn an incorrect option the judge also finds valid into a finding\
          \ for the panel, with the judge's explanation as evidence, as «very» if\
          \ the judge found it valid in «The performance was ___ awful.»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R005
      implements:
      - ContentAnalyzer
      _change: add
    - name: DefaultOptionRuleCheck
      requiresInject:
      - name: correctorMatcher
        type: CorrectorMatcher
      handwrittenTests:
      - name: "should report an exercise where no option is worth the full score,\
          \ as «The performance was ___ awful.» if «absolutely» lost its score"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R001
      - name: "should report an exercise where two options score, as «The performance\
          \ was ___ awful.» if «very» also scored"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R001
      - name: "should report two incorrect options that are the same answer, as «\
          're going to» and «are going to» in «Are you busy? If so, I ___ do it for\
          \ you.» of Elegir la forma natural"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R002
      - name: "should report two options that look identical when one of them is the\
          \ correct one, as «absolutely» twice in «The performance was ___ awful.»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R002
      - name: "should report an option that is the correct one in another form, as\
          \ «will» next to the correct «'ll» in «Are you busy? If so, I ___ do it\
          \ for you.»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R002
      - name: "should report the options in lowercase when the gap opens the sentence,\
          \ as «am i · are we · are you · is he · is it · is she» in «___ a child?\
          \ (He)»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R003
      - name: "should report a lowercase «i» in an option even when the gap does not\
          \ open the sentence, as «i can't» in «A: Can you call Miss Green? B: No,\
          \ ___ .»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R003
      - name: "should take the gap after the «A:» or «B:» of a dialogue as opening\
          \ the sentence, as «everything · nothing» in «A: What did you find? B: ___\
          \ , it was empty.»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R003
      - name: "should report the dash of putting nothing in a gap that opens the sentence,\
          \ as «- · a» in «___ golf is difficult to learn.»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R003
      - name: "should not take as opening a sentence a gap whose text does not end\
          \ in a period, a question or an exclamation mark, as «___ excited man» in\
          \ A o an"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R003
      - name: "should report the option that does not fit the «a» or «an» before the\
          \ gap, as «very» after «an» in «He's an ___ amazing man.»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R004
      - name: "should find nothing when every option fits the article before the gap,\
          \ as «good · well» after «a» in «My brother is a ___ (good / well) driver.»"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R004
      implements:
      - OptionRuleCheck
      _change: add
    - name: UnavailableMultipleChoiceJudgeFactory
      visibility: public
      handwrittenTests:
      - name: "should give the card the judge's rule with the paid model cost while\
          \ no judge is connected, so multiple-choice-validity keeps a single card"
        traceability:
          feature: FEAT-OMVAL
          rule: F-OMVAL-R005
      implements:
      - MultipleChoiceJudgeFactory
      _change: add
    _change: add
  _change: modify
features:
- id: FEAT-OMVAL
  code: F-OMVAL
  journeys:
  - id: F-OMVAL-J001
    validation: AUTO_VALIDATED
    testModule: audit-domain
    testPackage: com.learney.contentaudit.auditdomain.multiplechoicevalidity
