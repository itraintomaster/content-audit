code: FEAT-DUPAR
description: "FEAT-DUPAR, paquete B de la ronda 2: el analizador near-duplicates.\
  \ Dentro de cada tema junta los pares que piden la misma respuesta como el corrector\
  \ y no son iguales tal cual, los marca por el comodín o por un parecido de 0,95\
  \ o más con nomic-embed-text en Ollama, y deja un hallazgo bajo, a la mesa, en cada\
  \ copia. Sin Ollama, los pares que el comodín no resuelve y cambian como mucho 4\
  \ de cada 10 palabras los juzga claude -p, un evaluador de los jueces de C; el comodí\
  n corre siempre y lo que falta juzgar queda a medias. Las dos rutas abren por el\
  \ runtime de los jueces (JudgeRuntime). Usa EmbeddingModel y LocalToolGate de FEAT-MLOCAL,\
  \ y CorrectorMatcher (FEAT-RESPC), QuizStudentViewRenderer (gancho A-01) y JudgeRuntime\
  \ (FEAT-JEXAM) de la ronda 1: se aplica después de FEAT-MLOCAL y de la integració\
  n de la ronda 1. Rebasado por el integrador de la ronda 2 sobre el sentinel.yaml\
  \ de ronda1/integracion (la ronda 1 aplicada y construida) y sobre FEAT-RONDA2,\
  \ que se aplica antes; orden de la cadena: FEAT-RONDA2, B, F y E, sin cambios de\
  \ estructura."
modules:
- name: audit-domain
  packages:
  - name: nearduplicates
    description: |
      El analizador near-duplicates (FEAT-DUPAR): compara cada ejercicio con los anteriores de su tema, como exact-duplicates. Un par es candidato si pide la misma respuesta comparada como el corrector y no es un duplicado exacto (R001); es casi duplicado si queda igual al tapar pronombres, demostrativos, posesivos y el tiempo del auxiliar, o si el parecido de sus vectores llega a 0,95 (R002); sin Ollama, si cambia como mucho 4 de cada 10 palabras y claude -p dice que es el mismo ejercicio (R008). Las consultas —un vector por ejercicio, o un juicio por par— van por el runtime de los jueces, que las guarda en el libro y las reusa, aplica el freno del examen, el tope y las consultas a la vez, y declara la cobertura y el costo. Familia errores, evalúa el ejercicio, costo de la ficha modelo pago: no entra en la corrida base. Sólo los registros y el proveedor son públicos.
    visibility: public
    models:
    - name: NearDuplicateCondition
      type: enum
      fields:
      - name: WILDCARD
        description: "Quedan iguales al tapar pronombres, demostrativos, posesivos\
          \ y el tiempo del auxiliar (F-DUPAR-R002 inv. 1). Regla same-but-wildcard,\
          \ instantánea."
      - name: SIMILARITY
        description: "El parecido de sus vectores llega al umbral, 0,95 (F-DUPAR-R002\
          \ inv. 2). Regla same-meaning, modelo local."
      - name: JUDGED
        description: "Sin Ollama, claude -p dice que para el alumno es el mismo ejercicio\
          \ (F-DUPAR-R008). Regla same-exercise, modelo pago."
      _change: add
    - name: NearDuplicateDiagnosis
      type: record
      fields:
      - name: keptQuizId
        type: String
        description: "El ejercicio que queda: el primero del tema con el que es casi\
          \ igual (F-DUPAR-R003). Es la marca del hallazgo."
      - name: condition
        type: NearDuplicateCondition
        description: "Si se cumplen varias, WILDCARD: es la que no depende de ningú\
          n modelo."
      - name: difference
        type: String
        description: "Qué cambia, para la evidencia: «He → She». Vacío si no es por\
          \ el comodín."
      - name: similarity
        type: double
        description: "El parecido de los dos vectores (SIMILARITY), redondeado a dos\
          \ decimales en la evidencia («parecido 0,99»). 0 si no se calculó."
      - name: wordSimilarity
        type: double
        description: "El parecido de palabras de los dos ejercicios terminados, con\
          \ el que se eligió el candidato de claude -p (JUDGED): «cambian 2 de 6 palabras»\
          ."
      - name: judgeReason
        type: String
        description: "La razón de claude -p en una línea, tal como la dio (JUDGED).\
          \ Null en las otras condiciones."
      - name: finishedExercise
        type: String
        description: "Este ejercicio terminado, el que se comparó."
      - name: keptFinishedExercise
        type: String
      - name: score
        type: double
        description: "0: tener el diagnóstico es ser una copia (F-DUPAR-R004). El\
          \ que queda no lleva diagnóstico y conserva 1."
      _change: add
    - name: SameExerciseVerdict
      type: record
      fields:
      - name: sameExercise
        type: boolean
        description: "Lo que contestó claude -p: si para el alumno es el mismo ejercicio."
      - name: reason
        type: String
      visibility: internal
      _change: add
    interfaces:
    - name: NearDuplicateRules
      sealed: false
      exposes:
      - signature: "sameRequest(AuditableQuiz first,AuditableQuiz second): boolean"
      - signature: "wildcardDifference(AuditableQuiz first,AuditableQuiz second):\
          \ Optional<String>"
      - signature: "wordSimilarity(AuditableQuiz first,AuditableQuiz second): double"
      visibility: internal
      _change: add
    - name: NearDuplicatesConfig
      sealed: false
      exposes:
      - signature: "methodId(): String"
      - signature: "inputPrefix(): String"
      - signature: "similarityThreshold(): double"
      - signature: "candidateWordSimilarity(): double"
      visibility: internal
      _change: add
      extends:
      - SelfDescribingConfig
    - name: SameExerciseQuestion
      sealed: false
      exposes:
      - signature: "subjectOf(AuditableQuiz kept,AuditableQuiz copy): EvaluationSubject"
      - signature: "read(String payload): Optional<SameExerciseVerdict>"
      visibility: internal
      _change: add
    implementations:
    - name: NearDuplicatesAnalyzerProvider
      requiresInject:
      - name: embeddingModel
        type: EmbeddingModel
      - name: alternativeJudge
        type: Evaluator
        description: "El evaluador de claude -p de la alternativa, hecho con AgentJudgeFactory\
          \ de C (agente near-duplicates-same-exercise). Sólo se usa sin el modelo\
          \ local."
      - name: judgeRuntime
        type: JudgeRuntime
      - name: correctorMatcher
        type: CorrectorMatcher
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      - name: localToolGate
        type: LocalToolGate
      visibility: public
      implements:
      - AnalyzerProvider
      _change: add
    - name: NearDuplicatesAnalyzer
      requiresInject:
      - name: opened
        type: JudgeSessions
        description: "Las sesiones que abrió el runtime de los jueces con el evaluador\
          \ de la ruta elegida: el de vectores con su política sin tope, o el de claude\
          \ -p con la de la corrida."
      - name: runtime
        type: JudgeRuntime
      - name: rules
        type: NearDuplicateRules
      - name: question
        type: SameExerciseQuestion
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      - name: config
        type: NearDuplicatesConfig
      - name: gateDecision
        type: LocalToolGateDecision
      implements:
      - ContentAnalyzer
      _change: add
    - name: SentenceEmbeddingEvaluator
      requiresInject:
      - name: embeddingModel
        type: EmbeddingModel
      - name: config
        type: NearDuplicatesConfig
      - name: examinedVersion
        type: String
      implements:
      - Evaluator
      _change: add
    - name: DefaultNearDuplicateRules
      requiresInject:
      - name: correctorMatcher
        type: CorrectorMatcher
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      implements:
      - NearDuplicateRules
      _change: add
    - name: DefaultNearDuplicatesConfig
      implements:
      - NearDuplicatesConfig
      _change: add
    - name: DefaultSameExerciseQuestion
      requiresInject:
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      implements:
      - SameExerciseQuestion
      _change: add
    _change: add
  _change: modify
features:
- id: FEAT-DUPAR
  code: F-DUPAR
