code: FEAT-DUPAR
description: "qa-tester, v3 de FEAT-DUPAR (el paso por pares): sólo handwrittenTests.\
  \ Borra las que fijan que el parecido de 0,95 marca solo, su evidencia «Dice lo\
  \ mismo que …», la regla same-meaning en la ficha y en el costo, la ruta con Ollama\
  \ «never with claude -p», el umbral 0,95 de la configuración y las del evaluador\
  \ de vectores que hablaban de «la versión examinada»; las reemplaza con nombres\
  \ de la v3 y suma R009 (candidatos desde 0,80, el parecido solo no marca, el tope\
  \ sólo para claude -p, a medias sin tope o sin respuesta, cobertura del juez solo,\
  \ los vectores siempre), R010 (la versión de tres piezas, otra versión al cambiar\
  \ una, juez sin versión, lo contestado se reusa entre rutas), el filtro del examen\
  \ de R007 en las dos versiones y PairStepEvaluator. Las dos de reutilización de\
  \ vectores trazan a F-MLOCAL-R002 inv. 2 y van en un parche aparte, en la carpeta\
  \ de FEAT-MLOCAL. F-DUPAR-J001 no se declara: ya tiene testModule y testPackage."
modules:
- name: audit-domain
  packages:
  - name: nearduplicates
    implementations:
    - name: NearDuplicatesAnalyzerProvider
      handwrittenTests:
      - name: "should open near-duplicates through the judges' runtime with the vector\
          \ evaluator and the policy without limit of the local tool decision when\
          \ nomic-embed-text is available, never with claude -p"
        _change: delete
      - name: "should describe near-duplicates as an errors analyzer that evaluates\
          \ exercises and resolves at the panel, asking «¿Dos ejercicios del mismo\
          \ tema piden casi lo mismo?», with the rules same-but-wildcard instant,\
          \ same-meaning of local model and same-exercise of paid model, and paid\
          \ model as the cost of its card"
        _change: delete
      - name: "should carry in its card two tools, nomic-embed-text in Ollama and\
          \ claude -p, each with its version and its exam"
        _change: delete
      - name: "should open near-duplicates through the judges' runtime, when nomic-embed-text\
          \ is available, with the vectors without limit even if the run asks --budget\
          \ near-duplicates=N, and the pair judge with the run's policy as it comes,\
          \ so without that request claude -p has budget 0"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R009
      - name: "should describe near-duplicates as an errors analyzer that evaluates\
          \ exercises and resolves at the panel, asking «¿Dos ejercicios del mismo\
          \ tema piden casi lo mismo?», with the rules same-but-wildcard instant,\
          \ similar-candidates of local model and same-exercise of paid model, and\
          \ paid model as the cost of its card"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R006
      - name: "should carry in its card nomic-embed-text, which proposes the pairs\
          \ with Ollama, and claude -p, which decides them, each with its version,\
          \ next to the exam of the version with Ollama and of the version without\
          \ it"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R006
      - name: "should consult neither nomic-embed-text nor claude -p, with Ollama,\
          \ when the pair judge states no version, leaving the judge's reason in view"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R010
    - name: NearDuplicatesAnalyzer
      handwrittenTests:
      - name: "should mark as near duplicates two candidates whose vectors reach 0.95,\
          \ «They prepared lunch for each other.» after «They cooked lunch for each\
          \ other.», 0.98"
        _change: delete
      - name: "should not mark a candidate whose vectors stay below 0.95 and that\
          \ the wildcard does not settle, «Have you heard about my news?» after «\
          Have you heard the news?», 0.94"
        _change: delete
      - name: "should mark the same copies in two runs of the same course, reusing\
          \ every vector without asking nomic-embed-text again"
        _change: delete
      - name: "should give each finding the cost of the rule that found it: instant\
          \ for same-but-wildcard, local model for same-meaning and paid model for\
          \ same-exercise"
        _change: delete
      - name: "should give a pair found both by the wildcard and by its vectors the\
          \ instant rule same-but-wildcard, «A: Are we ready? B: Yes, we are.» after\
          \ «A: Are they ready? B: Yes, they are.»"
        _change: delete
      - name: "should say in the evidence of a pair found by its vectors «Dice lo\
          \ mismo que …46ac: parecido 0,98»"
        _change: delete
      - name: "should leave all of near-duplicates unevaluated, the wildcard included,\
          \ while the examined version of nomic-embed-text with its prefix has no\
          \ approved exam"
        _change: delete
      - name: "should make a near duplicate of a candidate of its vectors that claude\
          \ -p calls the same exercise, «They prepared lunch for each other.» after\
          \ «They cooked lunch for each other.», 0.98, with the rule same-exercise"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R002
      - name: "should mark the same copies in two runs of the same course, reusing\
          \ every vector and every verdict of claude -p without asking either again"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R003
      - name: "should give each finding the cost of the rule that found it, instant\
          \ for same-but-wildcard and paid model for same-exercise with Ollama and\
          \ without it, and none to similar-candidates, which only proposes pairs"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R004
      - name: "should give a pair that the wildcard settles the instant rule same-but-wildcard\
          \ without asking claude -p, even when its vectors reach 0.80, «A: Are we\
          \ ready? B: Yes, we are.» after «A: Are they ready? B: Yes, they are.»"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R004
      - name: "should say in the evidence of a pair that its vectors proposed and\
          \ claude -p judged «Para claude -p es el mismo ejercicio que …355e: parecido\
          \ 0,99» and the reason claude -p gave"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R005
      - name: "should ask claude -p in an exam run with Ollama only about the candidates\
          \ whose copy is an exercise of the exam's file, even when the exercise that\
          \ stays is not in it"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R007
      - name: should ask claude -p in an exam run without Ollama only about the candidates
          whose copy is an exercise of the exam's file
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R007
      - name: "should give an exercise outside the exam's file neither score nor finding\
          \ in an exam run, nor count the pairs whose copy it is among the consultations\
          \ the exam says are missing"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R007
      - name: "should ask claude -p, with Ollama, only about the candidates that the\
          \ wildcard does not settle and whose vectors reach 0.80, as «Have you heard\
          \ about my news?» after «Have you heard the news?», 0.94, and not about\
          \ «I am hot.» after «I am sorry.», 0.71"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R009
      - name: "should not mark, with Ollama, a candidate whose vectors reach 0.97\
          \ when claude -p calls it a different exercise, «That car is his.» after\
          \ «That is his car.»"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R009
      - name: should ask nomic-embed-text for every vector and stop only claude -p
          at the budget of --budget near-duplicates=1
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R009
      - name: "should leave half evaluated, with Ollama and without --budget near-duplicates=N,\
          \ an exercise with a candidate of its vectors, consulting no claude -p,\
          \ keeping its wildcard findings and saying «falta el tope» with the pairs\
          \ left to judge"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R009
      - name: "should leave half evaluated, with Ollama, an exercise whose candidate\
          \ got no usable answer from claude -p, keeping its wildcard findings and\
          \ saying how many pairs are left to judge"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R009
      - name: "should declare as missing for near-duplicates only the pairs left for\
          \ claude -p, with their hours at the rate of the judge one at a time and\
          \ four at a time, never the vectors of nomic-embed-text"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R009
      - name: "should evaluate whole a topic outside the set that a run declares for\
          \ claude -p when its vectors stay below 0.80, «I am hot.» after «I am sorry.»\
          , since the vectors always run"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R009
      - name: "should leave all of near-duplicates unevaluated, the wildcard included,\
          \ while the version with Ollama, named by its three pieces, has no approved\
          \ exam, even if nomic-embed-text with its prefix alone approved one"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R010
      - name: "should not ask claude -p again, with Ollama, about a pair it already\
          \ judged without Ollama, «Offer: I'll wash the dishes.» after «Offer: I'll\
          \ wash the dishes for you.»"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R010
    - name: SentenceEmbeddingEvaluator
      handwrittenTests:
      - name: "should ask nomic-embed-text for the vector of the finished exercise\
          \ with the prefix «clustering: » and record it under an evaluator id that\
          \ carries the examined version"
        _change: delete
      - name: should not reuse the vectors that another examined version recorded
        _change: delete
      - name: "should ask nomic-embed-text for the vector of the finished exercise\
          \ with the prefix «clustering: », under the version of nomic-embed-text\
          \ with that prefix"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R010
    - name: DefaultNearDuplicatesConfig
      handwrittenTests:
      - name: "should hold the threshold 0.95, the prefix «clustering: » and the word\
          \ similarity 0.6 of the candidates for claude -p"
        _change: delete
      - name: "should change its methodId when the prefix changes, so the vectors\
          \ are a new examined version that takes its own exam"
        _change: delete
      - name: "should hold the similarities that only choose the candidates of the\
          \ judge, 0.80 for the vectors with the prefix «clustering: » and 0.6 for\
          \ the words"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R002
      - name: "should name the version with Ollama by the method of the vectors, the\
          \ candidate similarity and the first 12 hex of the version of the judge,\
          \ «clustering-1 · candidatos-0,80 · juez-c3a9e1f07b5d»"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R010
      - name: "should name another version with Ollama when the prefix, the candidate\
          \ similarity or the version of the judge changes, so it takes its own exam"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R010
      - name: "should name the version without Ollama by the word similarity and the\
          \ version of the judge, «palabras-0,60 · juez-c3a9e1f07b5d», and another\
          \ one when either changes"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R007
    - name: PairStepEvaluator
      handwrittenTests:
      - name: "should ask the wrapped evaluator exactly the pair it receives, under\
          \ the wrapped evaluator's own id, so what the judge answered is reused under\
          \ the version with Ollama and without it"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R010
      - name: "should state the version of its route, «nomic-embed-text@0a109f422b47\
          \ · clustering-1 · candidatos-0,80 · juez-c3a9e1f07b5d», when the wrapped\
          \ evaluator states its own"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R010
      - name: "should state no version when the wrapped evaluator states none, whatever\
          \ the version of its route"
        traceability:
          feature: FEAT-DUPAR
          rule: F-DUPAR-R010
