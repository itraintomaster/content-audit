      - name: decidedAt
        type: Instant
      _change: add
    - name: BatchAdjustmentKind
      type: enum
      fields:
      - name: TASK_FROM_TIE
      - name: ACCEPT_CANDIDATE
      - name: ACCEPT_AS_EXCEPTION
      - name: RETURN_TO_PANEL
      - name: KEEP_ORIGINAL
      - name: DROP_CHANGE
      - name: DROP_RULE
      - name: APPROVE_RULE_SAMPLE
      _change: add
    - name: BatchClosing
      type: record
      fields:
