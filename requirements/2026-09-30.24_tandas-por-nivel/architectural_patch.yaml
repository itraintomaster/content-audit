      - name: RETURN_TO_PANEL
      - name: KEEP_ORIGINAL
      - name: DROP_CHANGE
      - name: DROP_RULE
      - name: APPROVE_RULE_SAMPLE
      _change: add
    - name: BatchClosing
      type: record
      fields:
