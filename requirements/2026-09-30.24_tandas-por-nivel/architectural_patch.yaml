      - name: RESOLVED_BY_RULE
      - name: RESOLVED_BY_PANEL
      - name: NO_LONGER_HOLDS
      - name: COVERED
      - name: NO_WINNER
      - name: TIE
      - name: RETURNED_WITHOUT_ATTEMPTS
      - name: NO_DECLARED_SCOPE
      - name: NOT_ATTEMPTED
      _change: add
    - name: BatchAdjustment
      type: record
      fields:
      - name: kind
        type: BatchAdjustmentKind
      - name: quizId
        type: String
      - name: taskIds
        type: List<String>
      - name: changeId
        type: String
      - name: ruleId
        type: String
      - name: candidate
