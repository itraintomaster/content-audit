      - name: topicMeter
        type: TopicMeter
      - name: panelRunnerFactory
        type: PanelRunnerFactory
      - name: batchComparator
        type: BatchComparator
      - name: baselineStore
        type: BaselineStore
      - name: blindSampleService
        type: BlindSampleService
      - name: wordLightsQuery
        type: TopicWordLightsQuery
      - name: correctionScope
        type: CorrectionScope
      - name: preservationCheck
        type: PreservationCheck
      - name: coursePath
        type: Path
      - name: goalBook
