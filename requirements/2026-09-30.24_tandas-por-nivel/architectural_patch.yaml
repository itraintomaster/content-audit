      visibility: internal
      _change: add
    - name: BatchCloser
      sealed: false
      exposes:
      - signature: "close(CorrectionBatch batch, CourseEntity startCourse): CorrectionBatch"
      visibility: internal
      _change: add
    - name: BatchPublisher
      sealed: false
      exposes:
      - signature: "publish(CorrectionBatch batch, BatchPublishRequest request, CourseEntity\
          \ startCourse): CorrectionBatch"
      visibility: internal
      _change: add
    - name: BatchReportBuilder
      sealed: false
      exposes:
      - signature: "build(CorrectionBatch batch): BatchReport"
      visibility: internal
      _change: add
    implementations:
    - name: DefaultBatchServiceFactory
      visibility: public
      implements:
      - BatchServiceFactory
      _change: add
