  - name: commands
    visibility: internal
    implementations:
    - name: BatchCmd
      requiresInject:
      - name: batchService
        type: BatchService
      types:
      - Component
      externalImplements:
      - java.util.concurrent.Callable<Integer>
      implements:
      - BatchCommand
      _change: add
    - name: ReviseCmd
      requiresInject:
      - name: batchStore
