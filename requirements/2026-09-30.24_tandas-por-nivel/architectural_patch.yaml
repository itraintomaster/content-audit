      - name: detail
        type: String
      _change: add
    - name: BatchTaskOutcomeKind
      type: enum
      fields:
      - name: PENDING
      - name: RESOLVED_BY_RULE
      - name: RESOLVED_BY_PANEL
      - name: NO_LONGER_HOLDS
      - name: COVERED
      - name: NO_WINNER
      - name: TIE
      - name: RETURNED_WITHOUT_ATTEMPTS
      - name: NO_DECLARED_SCOPE
      - name: NOT_ATTEMPTED
      _change: add
    - name: BatchAdjustment
      type: record
