code: FEAT-TANDA
description: "FEAT-TANDA: la tanda de un nivel como un recurso con estado guardado\
  \ paso a paso. Abre sobre el último análisis publicado con la línea base fija del\
  \ paquete F y fija el par activo en su punto de partida, cotiza, aplica las reglas\
  \ de cada analizador sin modelo, corre las mesas con un tope, cierra comparando\
  \ sólo sus propias propuestas con la comparación de F, deja sacar cambios recomponiendo\
  \ cada ejercicio por partes, y publica una sola vez, mueve el par activo y no toca\
  \ producción. Rebasado por el integrador de la ronda 2 sobre el sentinel.yaml de\
  \ ronda1/integracion (la ronda 1 aplicada y construida) y sobre FEAT-RONDA2, que\
  \ se aplica antes; orden de la cadena: FEAT-RONDA2, B, F y E: RefinementTaskStatus\
  \ declara type: enum (el parche decía record, bug 03); revision-domain lleva la\
  \ lista entera de patrones, 5 (el apply reemplaza, no suma); BatchServiceConfig\
  \ y DefaultBatchService suman goalBook: GoalBook (gancho F-10); el paquete batch\
  \ suma audit-infrastructure a sus clientes: FileSystemBatchStore implementa BatchStore;\
  \ HintCoherenceRuleFix implements RuleFix en hintcoherence; AnswerCompletenessRuleFix\
  \ implements RuleFix en answercompleteness; MultipleChoiceValidityRuleFix implements\
  \ RuleFix en multiplechoicevalidity; DataCoherenceRuleFix implements RuleFix en\
  \ datacoherence; GrammarRuleFix implements RuleFix en grammar.; qa-tester: 66 handwrittenTests\
  \ trazan las 11 reglas de FEAT-TANDA (R011, abrir fija las metas, la sumó el qa-tester\
  \ como analista: F-METAS-R006 no se puede probar en METAS) con el proponente guionado,\
  \ jueces con veredictos grabados, una comparación de F armada a mano y almacenes\
  \ en memoria o en un directorio temporal, sin consultar modelos: abrir A1 sobre\
  \ la línea base, cotizar, correr sin tope, cortar y retomar, sacar la regla de mayú\
  sculas, publicar. F-TANDA-J001 va a audit-cli, paquete commands: sus pasos son batch\
  \ open, estimate, run y close, y el OK de la bandeja, y BatchCmd y TrayCmd son package-private\
  \ ahí, como F-JEXAM-J001 con exam."
modules:
- name: audit-domain
  interfaces:
  - name: RuleFix
    stereotype: port
    sealed: false
    exposes:
    - signature: "analyzerName(): String"
    - signature: "fix(RuleFixRequest request): RuleFixResult"
    glossarySuggestions:
    - name: Arreglo por regla
      technicalName: RuleFix
      kind: policy-candidate
      basedOn: audit-domain/RuleFix
      rationale: "F-TANDA-R004 y la resolución «regla» de F-HALL-R002: lo que un analizador\
        \ arregla sin modelo, como la mayúscula de las opciones o la «/» que pasa\
        \ a «|»."
    _change: add
  packages:
  - name: rulefix
    description: "Entrada y salida de un arreglo por regla (F-TANDA-R004). Público:\
      \ lo implementan los analizadores de A en sus paquetes y lo usa la tanda."
    visibility: public
    models:
    - name: RuleFixRequest
      type: record
      fields:
      - name: quiz
        type: QuizTemplateEntity
        description: El ejercicio como está en la tanda.
      - name: auditQuiz
        type: AuditableQuiz
        description: "El mismo ejercicio como lo midió el motor, con sus tokens."
      - name: sentenceMode
        type: SentenceMode
      - name: findings
        type: List<Finding>
        description: Sólo los de este analizador con resolución regla.
      _change: add
    - name: RuleFixResult
      type: record
      fields:
      - name: quiz
        type: QuizTemplateEntity
        description: El ejercicio arreglado; igual al de entrada si no arregló nada.
      - name: fixed
        type: List<FindingIdentity>
      - name: declined
        type: List<FindingIdentity>
        description: "Los que la regla no puede arreglar en el curso, como la forma\
          \ que arregla el corrector: pasan a la mesa o quedan sin intentar con su\
          \ motivo."
      - name: detail
        type: String
      _change: add
    _change: add
  - name: hintcoherence
    implementations:
    - name: HintCoherenceRuleFix
      requiresInject:
      - name: irregularForms
        type: IrregularFormsCatalog
      visibility: public
      handwrittenTests:
      - name: "should take the hint from the first answer, its base verb, its subject\
          \ and its not, as «(love)» for «I ___ a lot of vegetables.», without changing\
          \ what is heard"
        traceability:
          feature: FEAT-TANDA
          rule: F-TANDA-R004
      implements:
      - RuleFix
      _change: add
    _change: modify
  - name: answercompleteness
    implementations:
    - name: AnswerCompletenessRuleFix
      requiresInject:
      - name: correctorMatcher
        type: CorrectorMatcher
      visibility: public
      handwrittenTests:
      - name: "should decline, declared, the missing «aren't» of «They ___ (not /\
          \ be) from Ireland.», a negation of be that the new corrector accepts and\
          \ fixes, not the course"
        traceability:
          feature: FEAT-TANDA
          rule: F-TANDA-R004
      - name: "should add with «|», after the accepted ones, a missing form that the\
          \ new corrector still rejects, keeping the first answer and what is heard"
        traceability:
          feature: FEAT-TANDA
          rule: F-TANDA-R004
      implements:
      - RuleFix
      _change: add
    _change: modify
  - name: multiplechoicevalidity
    implementations:
    - name: MultipleChoiceValidityRuleFix
      visibility: public
      handwrittenTests:
      - name: "should capitalize every option of «___ a child? (He)», whose gap opens\
          \ the question, «is he» to «Is he» and «am i» to «Am I», in all the options\
          \ at once"
        traceability:
          feature: FEAT-TANDA
          rule: F-TANDA-R004
      implements:
      - RuleFix
      _change: add
    _change: modify
  - name: datacoherence
    implementations:
    - name: DataCoherenceRuleFix
      requiresInject:
      - name: quizSentenceConverter
        type: QuizSentenceConverter
      visibility: public
      handwrittenTests:
      - name: "should turn the «/» of an accepted answer into «|» and rebuild the\
          \ stored sentence with the first answer, as «has not cut/hasn't cut» in\
          \ «He ___ (not / cut) himself.»"
        traceability:
          feature: FEAT-TANDA
          rule: F-TANDA-R004
      implements:
      - RuleFix
      _change: add
    _change: modify
  - name: grammar
    implementations:
    - name: GrammarRuleFix
      visibility: public
      implements:
      - RuleFix
      _change: add
    _change: modify
  _change: modify
- name: refiner-domain
  models:
  - name: RefinementTaskStatus
    type: enum
    fields:
    - name: IN_BATCH
      description: "La tarea es de la tanda abierta (F-TANDA-R002): `nextTask` y `revise-instructions`\
        \ no la toman y `revise` la rechaza. Al publicar pasa a COMPLETED, STALE o\
        \ vuelve a PENDING."
      _change: add
    _change: modify
  implementations:
  - name: DefaultRefinerEngine
    handwrittenTests:
    - name: should never hand out a task IN_BATCH as the next task
      traceability:
        feature: FEAT-TANDA
        rule: F-TANDA-R002
  _change: modify
- name: revision-domain
  patterns:
  - type: Strategy
    implementations:
    - LemmaAbsenceMvpStrategy
    suppressed: false
    interface: LemmaAbsenceProposalStrategy
  - type: Factory
    implementations:
    - DefaultPreservationFactory
    suppressed: false
    interface: PreservationFactory
  - type: Factory
    implementations:
    - DefaultGateFactory
    suppressed: false
    interface: GateFactory
  - type: Factory
    implementations:
    - DefaultPanelRunnerFactory
    suppressed: false
    interface: PanelRunnerFactory
  - type: Factory
    implementations:
    - DefaultBatchServiceFactory
    suppressed: false
    interface: BatchServiceFactory
  packages:
  - name: batch
    description: Contrato de la tanda (FEAT-TANDA). Público sólo para audit-cli.
    visibility: public
    models:
    - name: CorrectionBatch
      type: record
      fields:
      - name: id
        type: String
      - name: level
        type: CefrLevel
      - name: status
        type: BatchStatus
      - name: baselineAuditId
        type: String
        description: "La línea base fija del paquete F (BaselineStore), leída al abrir:\
          \ la tanda no la mueve."
      - name: startAuditId
        type: String
        description: "El último análisis publicado: el de la línea base en la primera\
          \ tanda."
      - name: planId
        type: String
        description: "El plan de ese análisis, de donde salen sus tareas."
      - name: analyzers
        type: List<String>
        description: "Los analizadores que corrió el análisis de partida: con esos\
          \ se mide todo en la tanda."
      - name: settings
        type: BatchSettings
      - name: conversionOrders
        type: List<ConversionOrder>
      - name: taskIds
        type: List<String>
      - name: notTakenTaskIds
        type: List<String>
        description: Tareas del nivel con una propuesta pendiente de fuera de la tanda
          (F-TANDA-R002).
      - name: unevaluated
        type: List<NotComparedCount>
        description: "Por analizador, ejercicios del nivel sin evaluar al abrir (F-TANDA-R001)."
      - name: courseTies
        type: List<Finding>
        description: "Los desacuerdos de los jueces en el nivel, para la bandeja (F-TAREA-R005)."
      - name: changes
        type: List<BatchChange>
      - name: quizProposals
        type: List<BatchProposalRef>
        description: "La propuesta pendiente vigente de cada ejercicio de la tanda:\
          \ una por ejercicio."
      - name: outcomes
        type: List<BatchTaskOutcome>
      - name: panelDecisions
        type: List<PanelDecision>
      - name: adjustments
        type: List<BatchAdjustment>
      - name: closings
        type: List<BatchClosing>
      - name: blindSampleId
        type: String
        description: La muestra ciega que el paquete F sorteó para esta tanda cuando
          pasó su compuerta; nula hasta entonces.
      - name: queryCap
        type: Integer
        description: "Nulo si José no pidió tope: la tanda no consulta ningún modelo\
          \ (F-TANDA-R003)."
      - name: queriesSpent
        type: int
      - name: openedAt
        type: Instant
      - name: publication
        type: BatchPublication
      glossarySuggestions:
      - name: Tanda
        technicalName: CorrectionBatch
        kind: process-candidate
        basedOn: revision-domain/batch/CorrectionBatch
        derivedFrom:
        - Tarea de corrección
        - Propuesta de revisión
        - Nivel CEFR
        rationale: "La corrección de un nivel: sus tareas, sus propuestas pendientes\
          \ y nada más; se recalcula al cerrar y se publica con un solo OK."
      _change: add
    - name: BatchStatus
      type: enum
      fields:
      - name: OPEN
      - name: RUNNING
      - name: INTERRUPTED
      - name: CLOSED
      - name: PUBLISHED
      _change: add
    - name: BatchSettings
      type: record
      fields:
      - name: topicsAtOnce
        type: int
      - name: queriesAtOnce
        type: int
      - name: maxAttempts
        type: int
      _change: add
    - name: BatchOpenRequest
      type: record
      fields:
      - name: level
        type: CefrLevel
      - name: topicsAtOnce
        type: Integer
        description: "Nulo: 4 (José, 30/9)."
      - name: queriesAtOnce
        type: Integer
        description: "Nulo: 4 (José, 30/9)."
      - name: convertToMultipleChoice
        type: List<String>
        description: Temas que José encarga pasar a opción múltiple (F-MESA-R015).
      _change: add
    - name: BatchRunRequest
      type: record
      fields:
      - name: queryCap
        type: Integer
        description: "El tope explícito de consultas de esta corrida; nulo, ninguna\
          \ (F-TANDA-R003)."
      _change: add
    - name: BatchEstimate
      type: record
      fields:
      - name: batchId
        type: String
      - name: tasks
        type: List<BatchTaskCount>
      - name: quizzes
        type: int
      - name: topics
        type: int
      - name: heaviestTopicQuizzes
        type: int
      - name: conversionQuizzes
        type: int
      - name: estimatedQueries
        type: int
      - name: estimatedHours
        type: double
      - name: topicsAtOnce
        type: int
      - name: queriesAtOnce
        type: int
      _change: add
    - name: BatchTaskCount
      type: record
      fields:
      - name: analyzer
        type: String
      - name: resolution
        type: FindingResolution
      - name: tasks
        type: int
      _change: add
    - name: BatchChange
      type: record
      fields:
      - name: changeId
        type: String
      - name: origin
        type: BatchChangeOrigin
      - name: ruleId
        type: String
        description: "En un cambio por regla, el analizador cuya regla lo hizo: la\
          \ unidad que José saca entera (F-TANDA-R008)."
      - name: knowledgeId
        type: String
      - name: taskIds
        type: List<String>
      - name: steps
        type: List<BatchChangeStep>
      - name: gateVerdict
        type: ChangeGateVerdict
      - name: joseException
        type: boolean
        description: José lo aprobó sabiendo que no pasaba (F-BANDEJA-R003).
      - name: createdAt
        type: Instant
      - name: droppedReason
        type: String
        description: Nulo mientras está en la tanda.
      _change: add
    - name: BatchChangeOrigin
      type: enum
      fields:
      - name: RULE
      - name: PANEL
      - name: CONVERSION
      - name: JOSE
      _change: add
    - name: BatchChangeStep
      type: record
      fields:
