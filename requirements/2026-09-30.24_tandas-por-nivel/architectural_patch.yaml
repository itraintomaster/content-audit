  interfaces:
  - name: BatchCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "openBatch(String level, Integer topicsAtOnce, Integer queriesAtOnce,\
        \ List<String> convertToMultipleChoice): Integer"
    - signature: "estimateBatch(): Integer"
    - signature: "runBatch(Integer queryCap): Integer"
    - signature: "closeBatch(): Integer"
    - signature: "dropFromBatch(String changeId, String ruleId, String reason): Integer"
    - signature: "reportBatch(String batchId, String format): Integer"
    _change: add
  packages:
  - name: commands
    visibility: internal
    implementations:
    - name: BatchCmd
      requiresInject:
      - name: batchService
        type: BatchService
      types:
      - Component
      handwrittenTests:
      - name: "should open with 'batch open A1' the batch of A1 with the topics and\
          \ queries at once and the orders given, and print its tasks"
        traceability:
          feature: FEAT-TANDA
          rule: F-TANDA-R001
      - name: should print with 'batch estimate' the cost of the open batch without
          making any query
        traceability:
          feature: FEAT-TANDA
          rule: F-TANDA-R003
      - name: "should run with 'batch run' and no cap only the rules, and say that\
          \ the panel tasks stayed not attempted"
        traceability:
          feature: FEAT-TANDA
          rule: F-TANDA-R003
      - name: "should drop with 'batch drop' one change naming the change, and all\
          \ the changes of a rule naming the rule"
        traceability:
          feature: FEAT-TANDA
          rule: F-TANDA-R008
      - name: should print with 'batch report' the report of a batch
        traceability:
          feature: FEAT-TANDA
          rule: F-TANDA-R010
      externalImplements:
      - java.util.concurrent.Callable<Integer>
      implements:
      - BatchCommand
      _change: add
