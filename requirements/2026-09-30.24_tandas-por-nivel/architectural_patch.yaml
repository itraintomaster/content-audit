        description: "Las partes que tocó este paso: con ellas se recompone el ejercicio\
          \ si sale un paso anterior (F-TANDA-R008)."
      - name: after
        type: CourseElementSnapshot
      _change: add
    - name: BatchProposalRef
      type: record
      fields:
      - name: quizId
        type: String
      - name: proposalId
        type: String
      _change: add
    - name: BatchTaskOutcome
      type: record
      fields:
      - name: taskId
        type: String
      - name: kind
        type: BatchTaskOutcomeKind
      - name: changeId
        type: String
      - name: attempts
