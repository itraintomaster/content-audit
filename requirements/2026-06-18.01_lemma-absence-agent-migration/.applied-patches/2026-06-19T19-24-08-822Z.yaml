code: FEAT-LASAG
modules:
- name: revision-infrastructure
  packages:
  - name: lemmaabsenceagent
    implementations:
    - name: DefaultSuggestedLemmaAgentTool
      handwrittenTests:
      - name: should query the suggested-lemmas session with the given criteria and
          return its result when the agent refines suggestedWords
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R001
    - name: LemmaAbsenceAgentGenerator
      handwrittenTests:
      - name: should pass only the suggested-lemmas tool to the agent runtime and
          no other CLI command tool during generation
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R002
      - name: should return exactly one QuizCandidate with non-null quizSentence and
          translation for a valid LEMMA_ABSENCE correction context
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R003
      - name: should emit a QuizCandidate without exception when the tool budget is
          exhausted during the run
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R004
      - name: should throw ProposalStrategyFailedException with the preserved category
          instead of an empty or null candidate when the runtime fails during generation
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R005
      - name: should launch the agent runtime exactly once and propagate the exception
          when generation hits a runtime failure
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R006
    - name: DefaultAgentRuntimeErrorClassifier
      handwrittenTests:
      - name: should map a runtime timeout to LLM_TIMEOUT preserving the failure category
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R005
      - name: should preserve the runtime failure category when classifying a throwable
          raised during any phase
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R012
- name: audit-cli
  packages:
  - name: bootstrap
    implementations:
    - name: DefaultLagenConfigResolver
      handwrittenTests:
      - name: should resolve maxEvalRetries to the default of 3 when no eval-retries
          env var is present
        traceability:
          feature: FEAT-LASAG
          rule: F-LASAG-R011
features:
- id: FEAT-LASAG
  journeys:
  - id: F-LASAG-J001
    validation: AUTO_VALIDATED
    testModule: revision-infrastructure
    testPackage: com.learney.contentaudit.revisioninfrastructure.lemmaabsenceagent
  - id: F-LASAG-J002
    validation: AUTO_VALIDATED
    testModule: revision-infrastructure
    testPackage: com.learney.contentaudit.revisioninfrastructure.lemmaabsenceagent
