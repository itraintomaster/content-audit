        type: RevisionEngine
      - name: refinementPlanStore
        type: RefinementPlanStore
      - name: runStore
        type: QuizInstructionCorrectionRunStore
      - name: config
        type: QuizInstructionCorrectionConfig
      implements:
      - QuizInstructionCorrectionRunner
      _change: add
    - name: DefaultQuizInstructionCorrectionRunnerFactory
      visibility: public
      implements:
      - QuizInstructionCorrectionRunnerFactory
      _change: add
    - name: DefaultQuizInstructionCandidateAssessor
      requiresInject:
      - name: assessor
        type: CandidateAssessor
        description: El catalogo neutro. Este objeto no juzga; arma el pedido de evaluacion
          desde el contexto de correccion y delega.
      - name: deriver
        type: LemmaAbsenceProposalDeriver
        description: El MISMO deriver con el que el reviser construye elementAfter.
          Deriva el snapshot del candidato a partir de quizSentence y translation
          para que lo medido sea exactamente lo que se propondria.
      implements:
      - QuizInstructionCandidateAssessor
      _change: add
    - name: DefaultQuizInstructionCandidateAssessorFactory
      visibility: public
      implements:
      - QuizInstructionCandidateAssessorFactory
      _change: add
    _change: modify
