        \ coursePath): Integer"
    _change: add
  - name: AssessCandidateCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "assessCandidate(String planId, String taskId, String candidateQuizSentence,\
        \ String candidateTranslation, String coursePath, String format): Integer"
    _change: add
