        type: RefinementPlanStore
      - name: runFormatter
        type: QuizInstructionCorrectionRunFormatter
      types:
      - Component
      externalImplements:
      - java.util.concurrent.Callable<Integer>
      implements:
      - ReviseInstructionsCommand
      _change: add
    - name: AssessCandidateCmd
      requiresInject:
      - name: refinementPlanStore
        type: RefinementPlanStore
        description: Resuelve la tarea dentro del plan nombrado.
      - name: auditReportStore
        type: AuditReportStore
        description: Trae el analisis del que salio la tarea; entrada del resolver
          de contexto.
      - name: correctionContextResolver
        type: CorrectionContextResolver
        description: "El MISMO resolver que usa el motor de revision, para que el\
          \ contexto consultado sea el contexto con el que se corrige (F-QICOR-R002)."
      - name: courseRepository
        type: CourseRepository
        description: Carga el curso para poder tomar el ejercicio ORIGINAL tal como
          esta hoy.
      - name: elementLocator
        type: CourseElementLocator
        description: "Toma el snapshot real del ejercicio original. No se reconstruye\
          \ desde el DSL: eso perderia las partes vacias del enunciado y la comparacion\
          \ de edicion acotada mediria otra cosa (F-QICOR-R010)."
      - name: candidateAssessor
        type: QuizInstructionCandidateAssessor
        description: "El unico punto donde se arma el pedido de evaluacion. El comando\
          \ NO mide nada por su cuenta: si lo hiciera, el catalogo volveria a existir\
          \ dos veces, que es exactamente lo que F-QICOR-R015 viene a impedir."
      types:
      - Component
      externalImplements:
      - java.util.concurrent.Callable<Integer>
      implements:
