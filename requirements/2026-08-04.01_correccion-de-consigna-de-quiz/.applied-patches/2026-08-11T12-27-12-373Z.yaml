      _change: add
    - name: QuizInstructionCandidateAssessorFactory
      stereotype: factory
      sealed: false
      exposes:
      - signature: "create(CandidateAssessor assessor, LemmaAbsenceProposalDeriver\
          \ deriver): QuizInstructionCandidateAssessor"
      visibility: public
      _change: add
    implementations:
    - name: QuizInstructionAgentStrategy
      requiresInject:
      - name: generator
        type: QuizInstructionCandidateGenerator
      - name: providerId
        type: String
      visibility: public
      implements:
      - QuizInstructionProposalStrategy
      _change: add
    _change: modify
  - name: engine
    visibility: internal
    models:
    - name: QuizInstructionProposalStrategyRegistryConfig
      type: record
      fields:
      - name: strategies
        type: List<QuizInstructionProposalStrategy>
      - name: activeStrategyName
        type: String
      visibility: public
      _change: add
    implementations:
    - name: QuizInstructionReviser
      requiresInject:
      - name: strategyRegistry
        type: QuizInstructionProposalStrategyRegistry
      - name: assessor
        _change: delete
      - name: candidateAssessor
        type: QuizInstructionCandidateAssessor
        description: "Reemplaza la inyeccion directa del catalogo neutro. El reviser\
          \ ya no conduce el lazo ni arma el pedido de evaluacion: emite UNA solicitud\
          \ de correccion (F-QICOR-R012), y sobre el candidato que le devuelven pide\
          \ UNA evaluacion por el mismo objeto que responde la consulta de F-QICOR-R015.\
          \ Que sea el mismo objeto es lo que vuelve estructural —y no disciplina—\
          \ que lo declarado en la propuesta coincida con lo que la consulta devuelve\
          \ (F-QICOR-R015 (c))."
        _change: add
      - name: deriver
        type: LemmaAbsenceProposalDeriver
      - name: complianceChecker
        type: QuizInstructionComplianceChecker
        description: Sigue siendo del sistema la revalidacion del ORIGINAL antes de
          gastar (F-QICOR-R009).
      - name: subjectViewFactory
        type: QuizInstructionSubjectViewFactory
      - name: config
        type: QuizInstructionCorrectionConfig
      implements:
      - Reviser
      _change: modify
    - name: DefaultQuizInstructionProposalStrategyRegistry
      requiresInject:
      - name: config
        type: QuizInstructionProposalStrategyRegistryConfig
      visibility: public
      implements:
      - QuizInstructionProposalStrategyRegistry
      _change: add
    - name: DefaultQuizInstructionCorrectionRunner
      requiresInject:
