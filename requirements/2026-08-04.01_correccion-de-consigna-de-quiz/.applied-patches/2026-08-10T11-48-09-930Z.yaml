code: FEAT-QICOR
modules:
- name: revision-domain
  packages:
  - name: candidatecriteriaengine
    implementations:
    - name: ScopedEditCriterion
      handwrittenTests:
      - name: should pass a candidate that came back without the empty part the original
          had and changed only the accepted answer a violation signalled
        traceability:
          feature: FEAT-QICOR
          rule: F-QICOR-R010
      - name: should fail a candidate that came back without the empty part the original
          had and also rewrote a part no violation signalled
        traceability:
          feature: FEAT-QICOR
          rule: F-QICOR-R010
      - name: should fail a candidate that came back without the empty part the original
          had and rewrote the Spanish translation while every part with text stayed
          identical
        traceability:
          feature: FEAT-QICOR
          rule: F-QICOR-R010
