- name: revision-infrastructure
  dependsOn:
  - audit-domain
  - course-domain
  packages:
  - name: quizinstructionagent
    description: |
      Adapter agente de la correccion de consigna. Espejo de knowledgetitleagent, con un unico factory seam que construye el generador respaldado por un grafo declarativo sobre el runtime compartido. El prompt de la correccion —edicion minima dirigida por la evidencia— vive en la definicion del agente y no aca; el adapter solo traduce el contexto a entradas, parsea el candidato y clasifica fallas de runtime preservando la categoria.
    visibility: public
    interfaces:
    - name: QuizInstructionAgentGeneratorFactory
      stereotype: factory
      sealed: false
      exposes:
      - signature: "create(LagenConfig config): QuizInstructionCandidateGenerator"
      - signature: "providerIdFor(LagenConfig config): String"
      visibility: public
      _change: add
    - name: QuizInstructionAgentRuntimeLauncher
      sealed: false
      exposes:
      - signature: "launch(String agentName, Map<String,String> inputs, ChatModel\
          \ chatModel): RunState"
      visibility: internal
      _change: add
    - name: QuizInstructionAgentCandidateParser
      sealed: false
      exposes:
      - signature: "parse(RunState runState, String quizId): QuizInstructionGeneratorResponse"
      visibility: internal
      _change: add
    - name: QuizInstructionAgentErrorClassifier
      sealed: false
      exposes:
      - signature: "classify(RunState runState): LlmGenerationFailureCategory"
      - signature: "classify(Throwable cause): LlmGenerationFailureCategory"
      visibility: internal
      _change: add
    implementations:
    - name: DefaultQuizInstructionAgentGeneratorFactory
      visibility: public
      implements:
      - QuizInstructionAgentGeneratorFactory
      _change: add
    - name: QuizInstructionAgentGenerator
      requiresInject:
      - name: agentRuntimeLauncher
        type: QuizInstructionAgentRuntimeLauncher
      - name: candidateParser
        type: QuizInstructionAgentCandidateParser
      - name: errorClassifier
        type: QuizInstructionAgentErrorClassifier
      - name: chatModel
        type: ChatModel
      - name: config
        type: LagenConfig
      - name: projectRoot
        type: Path
      implements:
      - QuizInstructionCandidateGenerator
      _change: add
    - name: DefaultQuizInstructionAgentCandidateParser
      implements:
      - QuizInstructionAgentCandidateParser
      _change: add
    - name: DefaultQuizInstructionAgentErrorClassifier
      implements:
      - QuizInstructionAgentErrorClassifier
      _change: add
    - name: SharedRuntimeQuizInstructionLauncher
      requiresInject:
      - name: agentGraphRunner
        type: AgentGraphRunner
      implements:
      - QuizInstructionAgentRuntimeLauncher
      _change: add
    _change: add
  - name: candidatejudgment
    description: |
      Evaluadores de los criterios de juicio (traduccion fiel, resolubilidad) respaldados por un grafo declarativo independiente del generador, para que el que juzga no sea el que genero y el candidato no se corrija a si mismo. La factory se indexa por CorrectionCriterion, que es un tipo neutro, de modo que este adapter sirve a cualquier correccion de ejercicio y no solo a la de consigna.
    visibility: public
    interfaces:
    - name: CandidateJudgmentEvaluatorFactory
      stereotype: factory
      sealed: false
      exposes:
      - signature: "create(LagenConfig config, CorrectionCriterion criterion): CandidateCriterionEvaluator"
      visibility: public
      _change: add
    - name: CandidateJudgmentRuntimeLauncher
      sealed: false
      exposes:
      - signature: "launch(String agentName, Map<String,String> inputs, ChatModel\
          \ chatModel): RunState"
      visibility: internal
      _change: add
    - name: CandidateJudgmentVerdictParser
      sealed: false
      exposes:
      - signature: "parse(RunState runState, CorrectionCriterion criterion): CriterionVerdict"
      visibility: internal
      _change: add
    implementations:
    - name: DefaultCandidateJudgmentEvaluatorFactory
      visibility: public
      implements:
      - CandidateJudgmentEvaluatorFactory
      _change: add
    - name: AgentCandidateJudgmentEvaluator
      requiresInject:
      - name: criterion
        type: CorrectionCriterion
      - name: agentRuntimeLauncher
        type: CandidateJudgmentRuntimeLauncher
      - name: verdictParser
        type: CandidateJudgmentVerdictParser
      - name: chatModel
        type: ChatModel
      - name: config
        type: LagenConfig
      implements:
      - CandidateCriterionEvaluator
      _change: add
    - name: DefaultCandidateJudgmentVerdictParser
      implements:
      - CandidateJudgmentVerdictParser
      _change: add
    - name: SharedRuntimeCandidateJudgmentLauncher
      requiresInject:
      - name: agentGraphRunner
        type: AgentGraphRunner
      implements:
      - CandidateJudgmentRuntimeLauncher
      _change: add
    _change: add
  _change: modify
