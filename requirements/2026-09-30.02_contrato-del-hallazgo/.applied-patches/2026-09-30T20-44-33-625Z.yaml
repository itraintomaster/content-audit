  - name: findingengine
    description: "Motor del contrato: arma el catálogo validando cada ficha, recoge\
      \ y estampa los hallazgos de cada analizador, y calcula los números por contexto.\
      \ Sus puertos (AnalyzerCatalog, FindingCollector, ContextNumbersCalculator)\
      \ viven en la raíz del módulo; acá sólo las implementaciones, que construye\
      \ únicamente la raíz de composición."
    visibility: public
    implementations:
    - name: DefaultAnalyzerCatalog
      requiresInject:
      - name: providers
        type: List<AnalyzerProvider>
        description: "En el orden de registro, que es el orden del catálogo, de la\
          \ corrida y de los hallazgos dentro de un nodo. Se valida al construir (InvalidAnalyzerCardException)."
      visibility: public
      handwrittenTests:
      - name: "should build from the eight real providers eight cards with every field\
          \ filled: name, question, what it reads, rules, goal, family, evaluated\
          \ nodes, resolutions and cost"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R006
      - name: "should refuse at startup a card with an empty field, naming the analyzer\
          \ and the field"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R006
      - name: should refuse at startup a card whose cost is not the highest cost of
          its rules
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R006
      - name: "should refuse at startup two providers with the same name, or a card\
          \ whose name differs from the one its provider publishes"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R005
      - name: "should add the card of a new analyzer, like pista coherente, and leave\
          \ the eight existing cards unchanged"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R006
      - name: "should put the seven classic analyzers in the vocabulary family and\
          \ quiz-instruction in the errors family, each card in a single family"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R007
      implements:
      - AnalyzerCatalog
      _change: add
    - name: DefaultFindingCollector
      visibility: public
      handwrittenTests:
      - name: "should stamp one finding with its eight fields filled, analyzer, rule,\
          \ node, severity, evidence, resolution, cost and identity, on «He isn't\
          \ in the living-room.», which scores 0,8 in sentence-length with 9 tokens\
          \ against the 3 to 8 of A1"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R001
      - name: "should leave no sentence-length finding on «Where is my wallet?», whose\
          \ 5 tokens fit A1 and score 1"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R001
      - name: "should ask an analyzer for findings only on the levels its card evaluates,\
          \ leaving none on the 55 topics that coca-buckets-distribution scores below\
          \ 1 without a goal"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R001
      - name: "should stop the run with a contract violation when an analyzer leaves\
          \ a node it evaluated below 1 without a finding, or returns a finding on\
          \ a node that passes"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R001
      - name: "should stamp on each finding the cost of the card rule that produced\
          \ it, so an instant rule of a card that also has a paid-model rule gives\
          \ instant findings"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R002
      - name: should stop the run with a contract violation when a finding comes without
          a severity or without a resolution
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R002
      - name: should stop the run with a contract violation when a finding comes with
          no examined part or no observation
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R003
      - name: "should stop the run with a contract violation when an errors analyzer\
          \ leaves at 1 a quiz with a finding that counts as error, or below 1 a quiz\
          \ whose only findings rank only"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R004
      - name: should stop the run with a contract violation when a finding names a
          rule its card does not declare or a resolution its card does not list
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R006
      - name: should leave every score and typed diagnosis of the tree exactly as
          the analyzer left them
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R013
      - name: "should give each finding the identity analyzer, rule, node and marker,\
          \ the same whatever the run, the traversal order, the time or the judge\
          \ version, as lemma-absence, its rule, quiz 67fab6d599301022953425b1 and\
          \ wallet for «Where is my wallet?»"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R014
      - name: should stop the run with a contract violation when an analyzer returns
          two findings with the same identity on one node
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R014
      - name: "should order the findings of a node by the catalog order of their analyzer,\
          \ then by rule, then by what they mark, whatever order the analyzers returned\
          \ them in"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R014
      implements:
      - FindingCollector
      _change: add
    - name: DefaultContextNumbersCalculator
      visibility: public
      handwrittenTests:
      - name: "should keep out of the error counts the 950 quizzes that lemma-absence\
          \ scores below 1, because lemma-absence is a vocabulary analyzer"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R007
      - name: "should count for each errors analyzer, in every knowledge, topic, level\
          \ and the course, the quizzes it reaches, evaluates, leaves unevaluated\
          \ and finds with an error, and its error share over the evaluated ones,\
          \ with evaluated plus unevaluated adding up to reached"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R008
      - name: should count a quiz once in «algún error» however many error findings
          it has from however many errors analyzers
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R008
      - name: "should split «algún error» by the highest severity of each quiz, so\
          \ that blocking, high, medium and low add up to it"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R008
      - name: should make every count of a node the sum of the counts of its children
          and recompute its percentages from those sums instead of averaging the percentages
          of its children
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R008
      - name: "should publish apart, as marked, the findings that only rank, and count\
          \ no quiz that has only such findings as a quiz with error"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R008
      - name: "should count a finding on a knowledge in every quiz of that knowledge,\
          \ for its analyzer and for «algún error», as a finding on the mini-theory\
          \ of «In time u on time» counts in its 40 quizzes"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R008
      - name: "should declare as not fully evaluated each quiz that some errors analyzer\
          \ reached and did not evaluate, like those the judge leaves pending past\
          \ its budget of 500, so that «algún error» reads as a floor"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R008
      - name: "should publish no error counts on any node when no errors analyzer\
          \ ran, as in the 29/9 base analysis made without the judge"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R008
      - name: "should publish 73,9 % as the vocabulary score of the course of the\
          \ 29/9 base, the average of the course scores of its seven vocabulary analyzers\
          \ (86,4, 72,5, 89,3, 67,0, 8,0, 98,8 and 95,5), and not 83,4 %, the average\
          \ of its four levels"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R009
      - name: "should publish as vocabulary scores of the levels of the 29/9 base\
          \ A1 96,5 %, A2 94,2 %, B1 79,5 % and B2 63,5 %"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R009
      - name: "should leave the quiz-instruction score out of the vocabulary score\
          \ of every node, the quizzes it judged included"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R009
      - name: "should average into the vocabulary score only the vocabulary analyzers\
          \ that ran, so that sentence-length alone gives the course of the 29/9 base\
          \ 86,4 %"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R009
      - name: "should publish the four COCA quarters as sub-metrics of coca-buckets-distribution\
          \ and keep them out of every average, 73,9 % on the course of the 29/9 base\
          \ and not the 73,4 % of averaging its eleven keys"
        traceability:
          feature: FEAT-HALL
          rule: F-HALL-R010
      implements:
      - ContextNumbersCalculator
      _change: add
