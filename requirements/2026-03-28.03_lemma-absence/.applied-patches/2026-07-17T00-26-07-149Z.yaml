code: FEAT-LABS
modules:
- name: audit-domain
  packages:
  - name: labs
    implementations:
    - name: LemmaByLevelAbsenceAnalyzer
      handwrittenTests:
      - name: should consider LemmaAndPos pair for absence not just lemma string
        _change: delete
      - name: should not consider non-EVP lemma as misplaced in sentence
        _change: delete
      - name: should score 1.0 for sentence containing only non-EVP lemmas
        _change: delete
      - name: should score 0.7 for sentence with 3-level distance misplaced lemma
          which is minimum
        _change: delete
      - name: should count expected lemma as present when the level contains it under
          a different part of speech
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R039
      - name: should cover multiple expected entries of the same lemma with a single
          occurrence in the level
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R039
      - name: should classify absence as APPEARS_TOO_LATE when the lemma appears under
          another part of speech only in later levels
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R039
      - name: should flag catalog lemma expected above the sentence level as misplaced
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R017
      - name: should not penalize basic lemma from a lower level reused in a higher
          level sentence
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R017
      - name: should apply 0.3 discount for C1 lemma in A2 sentence using the extended
          level order
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R018
      - name: should floor sentence score at 0.5 when a C2 lemma appears in an A1
          sentence
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R019
      - name: should take the maximum between misplacement and out-of-catalog discounts
          in the same sentence
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R019
      - name: should score 1.0 only when every content word is justified by catalog
          level frequency band or exclusion
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R020
      - name: should not score 1.0 when the sentence contains an infrequent out-of-catalog
          content word
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R020
      - name: should penalize A1 quiz whose only advanced word is a C2 catalog lemma
          instead of scoring perfect
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R020
      - name: should treat C2 lemma as misplaced even in a B2 sentence
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R033
      - name: should penalize C1 lemma in every course level with distance-proportional
          discount
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R033
      - name: should apply strong discount 0.3 to out-of-catalog word with rank 6081
          in A1 sentence
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R034
      - name: should apply mild discount 0.1 to out-of-catalog word with rank 6081
          in B2 sentence
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R034
      - name: should not penalize out-of-catalog word with rank 900 in any course
          level
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R034
      - name: should apply strong discount to out-of-catalog word without frequency
          rank
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R034
      - name: should not penalize proper noun token even when infrequent and out of
          catalog
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R035
      - name: should not penalize non-alphabetic token in the misplacement evaluation
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R035
      - name: should not evaluate functional word against the out-of-catalog frequency
          bands
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R035
      - name: should penalize via exact lemma and pos entry even when another pos
          of the same lemma has a lower level
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R036
      - name: should fall back to the lowest level among other pos entries when the
          exact pair is missing
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R036
      - name: should treat word as out of catalog only when the lemma has no entry
          under any pos
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R036
      - name: should not report C1 or C2 catalog lemmas as absent in any level coverage
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R037
      - name: should keep expected lemma totals per level unchanged after retaining
          C1 and C2 entries
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R037
      - name: should expose observed pos and applied discount for each misplaced lemma
          in the quiz diagnosis
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R038
      - name: should expose out-of-catalog word detail with observed pos and frequency
          rank without inventing a cefr level
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R038
      - name: should register only words that generated discount in the quiz diagnosis
          detail
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R038
- name: audit-application
  implementations:
  - name: DefaultLemmaAbsenceConfig
    handwrittenTests:
    - name: should return out-of-catalog no-penalty rank bounds 1000 2000 3500 5000
        for A1 A2 B1 B2
      traceability:
        feature: FEAT-LABS
        rule: F-LABS-R034
    - name: should return out-of-catalog mild-discount rank bounds 3000 5000 8000
        10000 for A1 A2 B1 B2
      traceability:
        feature: FEAT-LABS
        rule: F-LABS-R034
    - name: should return out-of-catalog mild discount 0.1 and strong discount 0.3
      traceability:
        feature: FEAT-LABS
        rule: F-LABS-R034
    - name: should have out-of-catalog rank bounds non-decreasing from A1 to B2 within
        each band
      traceability:
        feature: FEAT-LABS
        rule: F-LABS-R034
- name: vocabulary-infrastructure
  packages:
  - name: evp
    implementations:
    - name: FileSystemEvpCatalog
      handwrittenTests:
      - name: should retain C1 and C2 catalog entries at load and resolve their level
          for misplacement lookup
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R033
      - name: should resolve lookupLevelByLemma to the minimum level across the pos
          entries of the lemma
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R036
      - name: should return empty from lookupLevelByLemma when the lemma has no entry
          under any pos
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R036
- name: refiner-domain
  implementations:
  - name: LemmaAbsenceContextResolver
    handwrittenTests:
    - name: should populate outOfCatalogWords on the lemma-absence correction context
        from the quiz diagnosis
      traceability:
        feature: FEAT-LABS
        rule: F-LABS-R038
    - name: should map the applied discount into each MisplacedLemmaContext entry
      traceability:
        feature: FEAT-LABS
        rule: F-LABS-R038
    - name: should leave outOfCatalogWords empty not null when the diagnosis has no
        out-of-catalog penalties
      traceability:
        feature: FEAT-LABS
        rule: F-LABS-R038
features:
- id: FEAT-LABS
  journeys:
  - id: F-LABS-J006
    validation: AUTO_VALIDATED
    testModule: audit-domain
    testPackage: com.learney.contentaudit.auditdomain.labs
