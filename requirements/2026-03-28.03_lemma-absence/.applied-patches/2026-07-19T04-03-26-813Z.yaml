code: FEAT-LABS
modules:
- name: vocabulary-infrastructure
  packages:
  - name: evp
    implementations:
    - name: FileSystemEvpCatalog
      handwrittenTests:
      - name: should return empty from exact lookupLevel when the only catalog entry
          for the pair is phrasal
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R005
      - name: should return empty from lookupLevelByLemma when the only catalog entry
          for the lemma is phrasal
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R005
      - name: should resolve the single word entry level when the lemma also has phrasal
          entries
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R005
- name: audit-domain
  packages:
  - name: labs
    implementations:
    - name: LemmaByLevelAbsenceAnalyzer
      handwrittenTests:
      - name: should not evaluate single letter dialogue label token against misplacement
          or frequency bands
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R035
      - name: should not evaluate token with embedded punctuation against misplacement
          or frequency bands
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R035
      - name: should not evaluate contraction token with apostrophe against misplacement
          or frequency bands
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R035
      - name: should evaluate two letter fully alphabetic token as lexical candidate
        traceability:
          feature: FEAT-LABS
          rule: F-LABS-R035
