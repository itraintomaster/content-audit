code: FEAT-CJUEZ
description: "Cierre con jueces (F-CJUEZ-R001 a R005). Al cerrar, la tanda juzga lo\
  \ que cambia, antes y después, con un paso de los jueces nuevo e interno de batchengine\
  \ (BatchJudgePass): estima sin consultar (R002) y paga sólo dentro del tope pedido\
  \ (R001, R003). El pedido de cierre (BatchCloseRequest: el tope de cada juez de\
  \ --budget y el de la tanda de --cap) va de batch close al servicio y del servicio\
  \ al cierre. La cuenta de cada juez (BatchJudgeAccount) queda en el cierre, en la\
  \ estimación y en el informe (R002, R005). Que el veredicto nombre al juez sin aprobar\
  \ (R004) es cuerpo del comparador, con lo que ya recibe: no cambia ningún contrato\
  \ de comparison ni de comparisonengine. No hay dependencias nuevas entre módulos."
modules:
- name: revision-domain
  packages:
  - name: batch
    models:
    - name: BatchCloseRequest
      type: record
      fields:
      - name: judgeBudgets
        type: "Map<String,Integer>"
        description: "El tope de cada juez que nombra --budget, por su nombre único\
          \ (F-CJUEZ-R003). Vacío o nulo: ninguno. Un nombre que no es de un juez\
          \ de la tanda, o un tope negativo, se rechaza sin consultar nada (R003 inv.\
          \ 4). Un juez local se puede nombrar, pero no tiene nada que pagar."
      - name: queryCap
        type: Integer
        description: "El tope de la tanda (--cap): lo comparten, en el orden del catá\
          logo, los jueces que judgeBudgets no nombra, y con los dos el total nunca\
          \ lo pasa (F-CJUEZ-R003). Nulo: ninguno. Sin ningún tope el cierre es un\
          \ ensayo y no le paga ninguna consulta a ningún juez (R003 inv. 1)."
      _change: add
    - name: BatchJudgeAccount
      type: record
      fields:
      - name: judge
        type: String
        description: "El nombre único del analizador juez (F-HALL-R005): el que nombra\
          \ --budget."
      - name: displayName
        type: String
        description: "Su nombre visible, el de la ficha (F-FILAS-R001); el nombre\
          \ único si la ficha no tiene."
      - name: unit
        type: AuditTarget
        description: "Lo que juzga: QUIZ, los ejercicios que la tanda cambia; KNOWLEDGE,\
          \ los temas que tienen un ejercicio que cambia, como la miniteoría (F-CJUEZ-R001)."
      - name: approved
        type: boolean
        description: "False si el juez está sin aprobar: su versión vigente reprobó\
          \ su examen o no lo rindió (F-JEXAM-R003). No consulta con ningún tope y,\
          \ si lee lo que la tanda cambió, sus pisos no se deciden y la tanda no se\
          \ publica (F-CJUEZ-R004). Una herramienta local que no está instalada no\
          \ está sin aprobar: no evaluó, y lo dice reason."
      - name: examStatus
        type: JudgeExamStatus
        description: "El examen de su versión vigente: el de su cobertura de juez\
          \ o, en una herramienta local sin cobertura, el de su corrida (F-JEXAM-R001,\
          \ F-MLOCAL-R006). Nulo si no se conoce."
      - name: reason
        type: String
        description: "Por qué no consulta, en castellano: sin examen, reprobado, rendido\
          \ sin medir o sin versión (F-JEXAM-R003), o la herramienta local que no\
          \ está (F-MLOCAL-R003). Nulo si está aprobado y consulta."
      - name: units
        type: int
        description: "Cuántos ejercicios —o temas, en un juez de temas— juzga, sumando\
          \ el antes y el después (F-CJUEZ-R001, R002)."
      - name: budget
        type: Integer
        description: "El tope que tuvo en este cierre: el suyo de --budget o lo que\
          \ le quedó del de la tanda cuando le tocó (F-CJUEZ-R003, R005). Nulo sin\
          \ tope, en la estimación y en un juez local."
      - name: queriesSpent
        type: int
        description: "Las consultas que se le pagaron en este cierre, dentro de su\
          \ tope; se suman a las consultas de la tanda (F-CJUEZ-R003 inv. 2). 0 en\
          \ la estimación y en el cierre sin tope."
      - name: queriesReused
        type: int
        description: "Las consultas que el libro ya tenía de ese juez para ese mismo\
          \ contenido al empezar: se reusan y no se pagan (F-CJUEZ-R001 inv. 2, R002,\
          \ R005)."
      - name: queriesMissing
        type: int
        description: "Las consultas que faltan para decidir sus pisos: en la estimació\
          n, antes de pagar (F-CJUEZ-R002); en el cierre, después de comparar, donde\
          \ lo que un juez local juzgó al comparar ya no falta (R003 inv. 3, R005)."
      - name: floorsDecided
        type: int
        description: "Sus pisos decididos en la última comparación del cierre: las\
          \ filas del juez con un piso cumplido o no cumplido (F-METAS-R002, F-CJUEZ-R005).\
          \ 0 en la estimación."
      - name: floorsUndecided
        type: int
        description: "Sus pisos sin decidir en la última comparación del cierre (F-METAS-R008,\
          \ F-CJUEZ-R005). 0 en la estimación."
      - name: unavailableReason
        type: String
        description: "La falla del servicio tras la cual el juez no empezó ninguna\
          \ consulta más, con la causa y cómo se resuelve (F-CJUEZ-R003 inv. 5, F-JEXAM-R011).\
          \ Nulo si no hubo."
      - name: local
        type: boolean
        description: "True si consultó su modelo o su herramienta local, como Ollama\
          \ o LanguageTool: es gratis, no gasta ningún tope y no suma al total de\
          \ consultas ni de horas; lo juzga la comparación al cerrar, sin tope (F-CJUEZ-R002,\
          \ R003, F-MLOCAL-R008, F-RONDA2-R002). Un juez que va por su alternativa\
          \ de claude -p se paga como cualquiera."
      glossarySuggestions:
      - name: Cuenta del juez
        technicalName: BatchJudgeAccount
        kind: value-object-candidate
        basedOn: revision-domain/batch/BatchJudgeAccount
        rationale: "Lo que un juez de la tanda juzga, gasta, reusa, le falta y decide\
          \ en un cierre o en una estimación (F-CJUEZ-R002, R005)."
      _change: add
    - name: BatchClosing
      type: record
      fields:
      - name: request
        type: BatchCloseRequest
        description: "El pedido con que se cerró, con sus topes (F-CJUEZ-R003). El\
          \ reajuste de José (batch drop) y el cierre de la bandeja cierran con el\
          \ pedido vacío, sin tope."
        _change: add
      - name: judges
        type: List<BatchJudgeAccount>
        description: "La cuenta de cada juez que lee lo que la tanda cambió, en el\
          \ orden del catálogo: lo gastado en este cierre, lo reusado, lo que falta,\
          \ el tope que tuvo y sus pisos (F-CJUEZ-R005)."
        _change: add
      _change: modify
    - name: BatchEstimate
      type: record
      fields:
      - name: changedQuizzes
        type: int
        description: "Los ejercicios que la tanda cambia hoy: los que tienen una propuesta\
          \ pendiente de la tanda, y todos los de un tema cuya consigna cambia (F-CJUEZ-R001,\
          \ R002). Es la misma cuenta del paso de los jueces. 0: la tanda todavía\
          \ no cambió ninguno, y los jueces se estiman después de batch run."
        _change: add
      - name: judges
        type: List<BatchJudgeAccount>
        description: "La cuenta de cada juez que lee lo que la tanda cambia hoy, en\
          \ el orden del catálogo, hecha sin consultar nada: lo que juzga, lo que\
          \ reusa del libro y lo que falta; los sin aprobar, con su motivo (F-CJUEZ-R002)."
        _change: add
      - name: judgeQueries
        type: int
        description: El total de consultas que faltan de los jueces aprobados que
          se pagan; las de un juez sin aprobar o local no suman (F-CJUEZ-R002).
        _change: add
      - name: judgeHours
        type: double
        description: "Lo que tardan esas consultas, a 19 s cada una con las consultas\
          \ a la vez de la tanda, como estimatedHours (F-CJUEZ-R002, F-TANDA-R003)."
        _change: add
      _change: modify
    - name: BatchReport
      type: record
      fields:
      - name: judges
        type: List<BatchJudgeAccount>
        description: Las cuentas por juez del último cierre de la tanda (F-CJUEZ-R005);
          vacío si todavía no se cerró.
        _change: add
      _change: modify
    - name: BatchServiceConfig
      type: record
      fields:
      - name: analyzerCatalog
        type: AnalyzerCatalog
        description: "El catálogo de analizadores para el paso de los jueces: quié\
          nes de la tanda son jueces, su orden y su nombre visible (F-CJUEZ-R002,\
          \ R003, R005). Main pasa el mismo que usa la mesa."
        _change: add
      _change: modify
    interfaces:
    - name: BatchService
      stereotype: port
      sealed: false
      exposes:
      - signature: "close(): BatchClosing"
        _change: delete
      - signature: "close(BatchCloseRequest request): BatchClosing"
        _change: add
      _change: modify
    _change: modify
  - name: batchengine
    interfaces:
    - name: BatchCloser
      sealed: false
      exposes:
      - signature: "close(CorrectionBatch batch, CourseEntity startCourse): CorrectionBatch"
        _change: delete
      - signature: "close(CorrectionBatch batch, CourseEntity startCourse, BatchCloseRequest\
          \ request): CorrectionBatch"
        _change: add
      visibility: internal
      _change: modify
    - name: BatchJudgePass
      sealed: false
      exposes:
      - signature: "estimate(CorrectionBatch batch, CourseEntity startCourse, CourseEntity\
          \ composedCourse): List<BatchJudgeAccount>"
      - signature: "judge(CorrectionBatch batch, CourseEntity startCourse, CourseEntity\
          \ composedCourse, BatchCloseRequest request): List<BatchJudgeAccount>"
      - signature: "judges(CorrectionBatch batch): List<String>"
      visibility: internal
      glossarySuggestions:
      - name: Paso de los jueces
        technicalName: BatchJudgePass
        kind: process-candidate
        basedOn: revision-domain/batchengine/BatchJudgePass
        rationale: "Al cerrar, la tanda juzga con cada juez lo que cambió, antes y\
          \ después, dentro del tope pedido; antes de pagar, dice cuánto falta (F-CJUEZ-R001\
          \ a R003)."
      _change: add
    implementations:
    - name: DefaultBatchJudgePass
      requiresInject:
      - name: auditEngine
        type: AuditEngine
        description: "Corre a cada juez sobre recortes del curso con los ancestros\
          \ reales —los ejercicios que cambian y los temas tocados, antes y despué\
          s— con AnalyzerRunSelection y EvaluationRunPolicy, como CatalogTopicMeter:\
          \ con tope 0 para estimar (F-CJUEZ-R002) y con lo que le queda a cada juez\
          \ aprobado y no local para pagar (R001, R003)."
      - name: courseMapper
        type: CourseMapper
        description: "Pasa cada recorte, el del curso de partida (antes) y el del\
          \ curso compuesto (después), a lo que lee el motor."
      - name: analyzerCatalog
        type: AnalyzerCatalog
        description: "Quiénes de los analizadores de la tanda son jueces —su ficha\
          \ o alguna regla consulta un modelo, o trae una herramienta local—, en qué\
          \ orden y con qué nombre visible (F-CJUEZ-R003, R005, F-FILAS-R001)."
      implements:
      - BatchJudgePass
      _change: add
    - name: DefaultBatchCloser
      requiresInject:
      - name: judgePass
        type: BatchJudgePass
        description: "Antes del bucle de la compuerta paga a los jueces dentro del\
          \ tope pedido y suma lo gastado a la tanda (F-CJUEZ-R001, R003); al final,\
          \ un ensayo sin consultas sobre lo que quedó dice lo que falta de cada juez,\
          \ y sus pisos salen de la última comparación (R005)."
        _change: add
      _change: modify
    - name: DefaultBatchService
      requiresInject:
      - name: judgePass
        type: BatchJudgePass
        description: "Estima por juez sin consultar, sobre lo que la tanda cambia\
          \ hoy (F-CJUEZ-R002); al cerrar, da los jueces de la tanda para rechazar\
          \ un --budget que nombra a otro, sin consultar nada (R003 inv. 4)."
        _change: add
      _change: modify
    _change: modify
  _change: modify
- name: audit-cli
  interfaces:
  - name: BatchCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "closeBatch(): Integer"
      _change: delete
    - signature: "closeBatch(Map<String,Integer> judgeBudgets, Integer queryCap):\
        \ Integer"
      _change: add
    _change: modify
  _change: modify
