code: FEAT-CJUEZ
description: "qa-tester (FEAT-CJUEZ): 54 handwrittenTests trazan las cinco reglas\
  \ del cierre con jueces (R001 9, R002 10, R003 20, R004 8, R005 7), sin consultar\
  \ a claude, a Ollama ni a la red: un motor de análisis simulado que lleva un libro\
  \ de mentira, jueces con su examen armado a mano y comparaciones de F armadas a\
  \ mano. 23 van al paso de los jueces (DefaultBatchJudgePass, prueba nueva); las\
  \ demás, a las clases que ya prueban el cierre, el servicio, la comparación, la\
  \ publicación, el informe, la bandeja y batch close/estimate/report. Los casos son\
  \ los de la tanda de A1 del 1/10: translation-sense con dos jueces por ejercicio,\
  \ mini-theory por tema, naturalness con Ollama, quiz-instruction sin examen, single-answer\
  \ reprobado, grammar como herramienta local reprobada, --budget translation-sense=1000\
  \ --cap 1200, --budget quiz-instruction=600 y --budget consigna=100. F-CJUEZ-J001\
  \ va a revision-domain, paquete batchengine, como F-NOEMP-J001: estimar, cerrar,\
  \ pagar, bloquear e informar son del servicio, el cierre, el paso de los jueces,\
  \ la publicación y el informe, package-private ahí."
modules:
- name: revision-domain
  packages:
  - name: batchengine
    implementations:
    - name: DefaultBatchJudgePass
      handwrittenTests:
      - name: "should judge each exercise the batch changes twice, as the start course\
          \ has it and as the composed course leaves it, and no other exercise of\
          \ the course"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R001
      - name: "should keep in its cuts the real level and topic of each exercise,\
          \ with their labels and the instruction of the topic, so the comparison\
          \ finds in the ledger what the closing judged"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R001
      - name: "should judge with mini-theory each topic that has a changed exercise,\
          \ whole, before and after, and no other topic of the course"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R001
      - name: should count a change of the instruction of a topic as a change of every
          exercise of that topic
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R001
      - name: "should leave out of the after side an exercise its change leaves identical,\
          \ as a rule fix that only asks to rerecord its audio, so it is judged once"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R001
      - name: "should judge only with the judges that read the kind of exercise that\
          \ changed, leaving out multiple-choice-validity in a batch that only changed\
          \ gap exercises"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R001
      - name: "should not pay a judge whose verdicts on what the batch changed are\
          \ all in the ledger, and count them as reused"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R001
      - name: "should make no query when estimating, running every judge, the local\
          \ ones included, with a cap of 0 on both sides"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R002
      - name: "should give in the estimate per judge the exercises or topics it judges\
          \ before and after, the queries the ledger already has and the ones missing,\
          \ as translation-sense with two queries per exercise and mini-theory with\
          \ one per topic"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R002
      - name: "should list in the estimate a judge without an approved exam with the\
          \ reason of its exam, as quiz-instruction that never took it and single-answer\
          \ that failed it"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R002
      - name: "should mark naturalness as local in the estimate when it asks its model\
          \ in Ollama, and not when it goes by its claude -p alternative"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R002
      - name: "should pay no judge when the request asks no budget and no cap, a dry\
          \ run as today"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should pay with --budget translation-sense=500 only translation-sense,\
          \ never more than 500 between its before and after cuts"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should share the cap of the batch among the approved judges in the\
          \ order of the catalog, each with what the previous ones left of it"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should never pass the cap with --budget translation-sense=1000 --cap\
          \ 1200, where translation-sense spends up to 1000 and mini-theory gets what\
          \ is left of the 1200"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should start no further query of a judge after a failure of its service,\
          \ not even on its after cut, and give the failure in its account"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should never pay naturalness asking its model in Ollama, even when\
          \ --budget names it, nor spend any cap on it"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: should pay naturalness like any other judge when it goes by its claude
          -p alternative because Ollama is not there
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should pay nothing when judging again with the same budget what an\
          \ earlier closing paid, and count it as reused"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should name as the judges of the batch, in the order of the catalog,\
          \ its analyzers that ask a model or bring a local tool, as translation-sense,\
          \ mini-theory and grammar, and not an analyzer of instant rules, as hint-coherence"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should not pay a judge without an approved exam with any cap, neither\
          \ quiz-instruction named with --budget quiz-instruction=600 nor single-answer,\
          \ failed, from the cap of the batch, which goes to the approved ones"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R004
      - name: "should give the accounts in the order of the catalog, each with the\
          \ visible name of the card of the judge, or its unique name when the card\
          \ has none"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R005
      - name: "should record as the budget of each judge its own --budget, what was\
          \ left of the cap of the batch when its turn came, or none"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R005
      _change: modify
    - name: DefaultBatchCloser
      handwrittenTests:
      - name: "should judge, before comparing, the exercises the batch changes on\
          \ the start course and on the course composed with its changes, with the\
          \ request of the closing"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R001
      - name: should add the queries the judges were paid at closing to the queries
          of the batch
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should give each judge of the closing the queries paid to it, the ones\
          \ the ledger had at the start of the closing and the ones still missing\
          \ after the last comparison, where what naturalness judged with Ollama when\
          \ comparing no longer counts"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R005
      - name: "should count as decided the floors of the rows of a judge in the last\
          \ comparison that are met or not met, and as undecided those that cannot\
          \ be decided"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R005
      _change: modify
    - name: DefaultBatchService
      handwrittenTests:
      - name: should count in the estimate as changed today the exercises with a pending
          proposal of the batch and every exercise of a topic whose instruction changes
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R002
      - name: "should add to the estimate the account of each judge, estimated without\
          \ any query on the start course and on the course composed with the changes\
          \ of the batch"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R002
      - name: "should total in the estimate the missing queries of the approved judges\
          \ that are paid, as 2404 of translation-sense and 60 of mini-theory, without\
          \ those of quiz-instruction without an exam or of naturalness with Ollama,\
          \ and their hours at 19 s per query with 4 at once"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R002
      - name: "should estimate no judge, with 0 changed exercises, while the batch\
          \ has not changed any exercise"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R002
      - name: "should refuse a request that budgets «consigna», which is not a judge\
          \ of the batch, naming its judges, before closing or querying anything"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should refuse a request with a negative budget or a negative cap, before\
          \ closing or querying anything"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should accept a request that budgets quiz-instruction with 600, a judge\
          \ of the batch although it cannot query, and hand it to the closing as asked"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should close again with an empty request, paying no judge, when José\
          \ drops a change of a batch closed with a budget"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should write neither the course nor any analysis of the history when\
          \ closing with a budget, keeping the closing only in the batch"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R001
      _change: modify
    - name: DefaultBatchPublisher
      handwrittenTests:
      - name: "should refuse to publish a batch whose verdict names a judge without\
          \ approval, copying «juez sin aprobar: Consigna que no se cumple» into the\
          \ refusal and writing no course"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R004
      _change: modify
    - name: DefaultBatchReportBuilder
      handwrittenTests:
      - name: "should give in the report the accounts of the judges of the last closing\
          \ of the batch, and none while it was never closed"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R005
      _change: modify
    _change: modify
  - name: comparisonengine
    implementations:
    - name: DefaultBatchComparator
      handwrittenTests:
      - name: "should leave undecided the floors of quiz-instruction, without an exam,\
          \ over the exercises the batch changed, and those of any error, although\
          \ the ledger had a verdict for them, so the verdict cannot be decided"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R004
      - name: "should end the detail of the verdict of the A1 batch, after everything\
          \ else, with «juez sin aprobar: Consigna que no se cumple, Opción múltiple\
          \ mal armada, Más de una respuesta válida, Error de gramática, Ejercicio\
          \ casi repetido», each judge once and in the order of the catalog"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R004
      - name: should keep as fails a verdict with a broken floor and still name at
          the end of its detail the judge without approval that reads what the batch
          changed
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R004
      - name: "should neither block nor name a judge without approval that reads nothing\
          \ the batch changed, as multiple-choice-validity in a batch of gap exercises\
          \ only"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R004
      - name: "should block and name grammar, a local tool whose exam failed, when\
          \ it reads an exercise the batch changed"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R004
      - name: "should block and name a judge of topics without approval, as mini-theory,\
          \ when it reads the topic of an exercise the batch changed"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R004
      _change: modify
    _change: modify
  - name: trayengine
    implementations:
    - name: DefaultTrayService
      handwrittenTests:
      - name: "should close the batch with an empty request before publishing it from\
          \ the tray, paying no judge"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      _change: modify
    _change: modify
  _change: modify
- name: audit-cli
  packages:
  - name: commands
    implementations:
    - name: BatchCmd
      handwrittenTests:
      - name: "should hand the service with 'batch close --budget translation-sense=500,mini-theory=60\
          \ --cap 600' the budget of each judge and the cap of the batch"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should exit with 2 and «El tope tiene que ser 0 o más» when 'batch\
          \ close' asks a negative budget or cap, without closing"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: should exit with 2 and the message of the service when 'batch close
          --budget consigna=100' names what is not a judge of the batch
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should print with 'batch close' a line per judge with its visible name,\
          \ its exercises or topics, its queries spent, reused and missing, its budget\
          \ and its floors decided of the total, and the reason of one without approval"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R005
      - name: should print with 'batch report' the same line per judge as the last
          closing
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R005
      - name: "should print with 'batch close' the request 'batch close --budget translation-sense=…\
          ,mini-theory=…' that completes what the approved judges still miss"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: should print with 'batch close' why a judge stopped after a failure
          of its service
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R003
      - name: "should print with 'batch estimate' the judges at closing over the exercises\
          \ the batch changes today, a line per judge with what it judges, reuses\
          \ and misses, and the total queries and hours of the approved ones"
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R002
      - name: should say with 'batch estimate' that the batch has not changed any
          exercise yet and that the judges are estimated after batch run
        traceability:
          feature: FEAT-CJUEZ
          rule: F-CJUEZ-R002
      _change: modify
    _change: modify
  _change: modify
features:
- id: FEAT-CJUEZ
  code: F-CJUEZ
  journeys:
  - id: F-CJUEZ-J001
    validation: AUTO_VALIDATED
    testModule: revision-domain
    testPackage: com.learney.contentaudit.revisiondomain.batchengine
