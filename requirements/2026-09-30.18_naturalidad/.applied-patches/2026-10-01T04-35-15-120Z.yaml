code: FEAT-NATUR
description: "FEAT-NATUR, paquete B de la ronda 2: el analizador naturalness. Le pregunta\
  \ a llama3 8B en Ollama, por cada oración terminada, si un nativo la diría, guarda\
  \ el número en el libro de evaluaciones con la versión del modelo, marca lo que\
  \ pasa el umbral fijo de su nivel con un hallazgo que sólo ordena y publica la lista\
  \ de cada nivel para los jueces. Sin Ollama le hace la misma pregunta a claude -p,\
  \ un evaluador de los jueces de C, y marca su «no». Las dos rutas abren por el runtime\
  \ de los jueces (JudgeRuntime): el modelo local sin tope ni pedido, claude -p con\
  \ el tope 0 de los jueces. Usa YesNoModel y LocalToolGate de FEAT-MLOCAL, FinishedSentenceReader\
  \ de FEAT-GRAMA y JudgeRuntime de FEAT-JEXAM: se aplica después de los tres. Rebasado\
  \ por el integrador de la ronda 2 sobre el sentinel.yaml de ronda1/integracion (la\
  \ ronda 1 aplicada y construida) y sobre FEAT-RONDA2, que se aplica antes; orden\
  \ de la cadena: FEAT-RONDA2, B, F y E, sin cambios de estructura.; qa-tester de\
  \ la ronda 2 (B): traza las 8 reglas de FEAT-NATUR a 39 handwrittenTests nuevas\
  \ (no hay pruebas previas que portar), con las probabilidades que grabó el prototipo\
  \ del analista para oraciones reales del curso del 29/9, y ubica F-NATUR-J001 en\
  \ audit-domain, paquete naturalness, como F-TRSEN-J001. Las dos rutas se prueban\
  \ con dobles de YesNoModel y del evaluador de claude -p sobre el runtime de los\
  \ jueces con libros en memoria. El umbral de A2 es 10,0 (coordinador, 1/10): medido\
  \ sin los 40 ejercicios de la lista «a / b», que se leen con la respuesta en su\
  \ lugar (F-GRAMA-R001 inv. 5)."
modules:
- name: audit-domain
  packages:
  - name: naturalness
    description: |
      El analizador naturalness (FEAT-NATUR): una consulta por oración terminada, «¿un nativo lo diría?». Con el modelo local el número es ln(P(no)/P(sí)) y marca lo que pasa el umbral de su nivel; sin Ollama, la misma pregunta va a claude -p, que contesta sí o no sin número, y marca su «no» (F-NATUR-R008). Las dos rutas abren por el runtime de los jueces, que guarda cada respuesta en el libro de evaluaciones y la reusa, aplica el freno del examen y declara la cobertura y el costo; la ruta la elige el proveedor con la decisión de LocalToolGate. Sólo ordena: nunca baja el puntaje ni cuenta como error (F-NATUR-R003). Familia errores, evalúa el ejercicio, costo de la ficha modelo pago, así que no entra en la corrida base. Sólo los registros y el proveedor son públicos.
    visibility: public
    models:
    - name: NaturalnessDiagnosis
      type: record
      fields:
      - name: sentence
        type: String
        description: "La oración terminada con la primera respuesta aceptada, la que\
          \ se le preguntó al modelo."
      - name: level
        type: String
        description: "El nivel del ejercicio, el de su umbral."
      - name: number
        type: Double
        description: "ln(P(no)/P(sí)) del modelo local: 0 es «tanto sí como no»; cuanto\
          \ más alto, más duda (F-NATUR-R002). Null si contestó claude -p, que no\
          \ da probabilidades (F-NATUR-R008)."
      - name: threshold
        type: Double
        description: El umbral fijo del nivel para esta versión del modelo local.
          Null si el nivel todavía no lo tiene —el número se publica y no se marca—
          o si contestó claude -p.
      - name: marked
        type: boolean
        description: "Con el modelo local, el número pasa el umbral; con claude -p,\
          \ contestó «no»."
      - name: reused
        type: boolean
        description: Si la respuesta salió del libro en vez de una consulta nueva.
      - name: alternative
        type: boolean
        description: True si contestó claude -p porque el modelo local no estaba (F-NATUR-R008).
      _change: add
    - name: NaturalnessLevelQueue
      type: record
      fields:
      - name: level
        type: String
        domainLinks:
        - term: Nivel CEFR
          role: carries
      - name: threshold
        type: Double
        description: Null con claude -p.
      - name: markedQuizIds
        type: List<String>
        description: "Los marcados del nivel, del más dudoso al menos dudoso y, a\
          \ igual número, en el orden del curso; con claude -p, en el orden del curso.\
          \ Escrita un id por línea es un conjunto válido para cualquier juez (F-NATUR-R005,\
          \ F-QINST-R019)."
      _change: add
    - name: NaturalnessQueueDiagnosis
      type: record
      fields:
      - name: examinedVersion
        type: String
        description: "La versión que dio las respuestas, la misma del examen: el modelo\
          \ local y la pregunta, o el juez de claude -p."
      - name: levels
        type: List<NaturalnessLevelQueue>
        description: "Una por nivel, en el orden del curso."
      - name: alternative
        type: boolean
        description: "True si la lista sale de claude -p: los «no» en el orden del\
          \ curso, sin número."
      _change: add
    interfaces:
    - name: NaturalnessScorer
      sealed: false
      exposes:
      - signature: "number(String payload): Optional<Double>"
      - signature: "nativeWouldSay(String payload): Optional<Boolean>"
      visibility: internal
      _change: add
    - name: NaturalnessConfig
      sealed: false
      exposes:
      - signature: "methodId(): String"
      - signature: "system(): String"
      - signature: "question(String sentence): String"
      - signature: "thresholdFor(String toolVersion,String level): Optional<Double>"
      visibility: internal
      _change: add
      extends:
      - SelfDescribingConfig
    implementations:
    - name: NaturalnessAnalyzerProvider
      requiresInject:
      - name: yesNoModel
        type: YesNoModel
      - name: alternativeJudge
        type: Evaluator
        description: "El evaluador de claude -p de la alternativa, hecho con AgentJudgeFactory\
          \ de C (agente naturalness-yes-no). Sólo se usa sin el modelo local."
      - name: judgeRuntime
        type: JudgeRuntime
      - name: sentenceReader
        type: FinishedSentenceReader
      - name: localToolGate
        type: LocalToolGate
      visibility: public
      handwrittenTests:
      - name: "should open naturalness through the judges' runtime with the evaluator\
          \ of llama3 and the policy without limit of the local tool decision when\
          \ llama3 is available, never with the claude -p alternative"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R008
      - name: "should open naturalness through the judges' runtime with the claude\
          \ -p alternative and the run's policy as it comes when llama3 is not available,\
          \ so without --budget naturalness=N it has budget 0"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R008
      - name: "should describe naturalness as an errors analyzer that evaluates exercises\
          \ and only ranks, asking «¿Un nativo diría así esta oración?», with the\
          \ rule unlikely-sentence of local model cost, the rule native-says-no of\
          \ paid model cost and paid model as the cost of its card"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R007
      - name: "should carry in its card two tools, llama3:8b in Ollama and claude\
          \ -p, each with its version and the result of its exam"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R007
      - name: "should declare no plan binding, so a naturalness finding never becomes\
          \ a task"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R003
      implements:
      - AnalyzerProvider
      _change: add
    - name: NaturalnessAnalyzer
      requiresInject:
      - name: opened
        type: JudgeSessions
        description: "Las sesiones que abrió el runtime de los jueces con el evaluador\
          \ de la ruta elegida: el local con su política sin tope, o el de claude\
          \ -p con la de la corrida."
      - name: runtime
        type: JudgeRuntime
      - name: sentenceReader
        type: FinishedSentenceReader
      - name: scorer
        type: NaturalnessScorer
      - name: config
        type: NaturalnessConfig
      - name: gateDecision
        type: LocalToolGateDecision
      handwrittenTests:
      - name: "should ask about the finished sentence with the first accepted answer\
          \ only, «Promise: I'll visit you tomorrow.» and not «Promise: I will visit\
          \ you tomorrow.»"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R001
      - name: "should ask no model about an exercise whose finished sentence has no\
          \ verb, as «hard work uncountable», leaving it without number nor finding"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R001
      - name: "should ask about a contracted sentence as it reads, «They don't like\
          \ people.», without expanding it"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R001
      - name: "should ask about «He did something to help.», with the answer in the\
          \ place of the «a / b» list, and never about «He did to help.»"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R001
      - name: "should reuse in a second run the answer recorded for an unchanged sentence\
          \ under the same examined version, without asking llama3 again"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R002
      - name: "should mark «They don't like people.», 9.0752 above the threshold of\
          \ A1, 9.07, and not «Are these your feet?», 9.0664"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R003
      - name: should not mark an exercise whose number equals the threshold of its
          level
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R003
      - name: "should give a marked exercise a low finding that only ranks, keeping\
          \ its score at 1 and counting it as marked, never as an error"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R003
      - name: "should keep the mark of «She is an engineer of hers.» in A2 when another\
          \ exercise of A2 changes, since the threshold of a level is fixed"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R003
      - name: "should publish the numbers of a level without threshold and mark none\
          \ of them, as B1 before its threshold is calibrated"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R003
      - name: "should give as evidence with llama3 «El modelo local duda que un nativo\
          \ diga «She is an engineer of hers.» (14,7; umbral de A2: 10,0)»"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R004
      - name: "should give as evidence with claude -p «claude -p contesta que un nativo\
          \ no diría «She is an engineer of hers.» (sin Ollama)», without a number"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R004
      - name: "should publish per level the marked exercises from the most to the\
          \ least doubtful, «She is an engineer of hers.», 14.68, first in A2"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R005
      - name: should order the marked exercises of a level that have the same number
          in the order of the course
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R005
      - name: "should publish no mark while the examined version llama3:8b@365c0bd3c000\
          \ · native-yes-no-1 has no approved exam, leaving its exercises unevaluated\
          \ with the reason"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R006
      - name: should ask in an EXAM run about every exercise of the exam file that
          reaches and about no other exercise of the photo
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R006
      - name: "should ask claude -p the system message and the question it asks llama3,\
          \ with the same finished sentence"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R008
      - name: "should mark an exercise to which claude -p answers no with a low finding\
          \ of native-says-no that only ranks, and leave none when it answers yes"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R008
      - name: should leave the diagnosis of an exercise answered by claude -p without
          number nor threshold and say that claude -p answered
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R008
      - name: should list the exercises that claude -p marks in each level in the
          order of the course
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R008
      - name: "should ask claude -p once per exercise that reaches and stop at the\
          \ budget of --budget naturalness=N, leaving the rest unevaluated"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R008
      - name: "should leave unevaluated with «falta el tope» what needs claude -p\
          \ when the run asks no budget for naturalness, declaring how many consultations\
          \ and hours it would cost, without consulting"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R008
      implements:
      - ContentAnalyzer
      _change: add
    - name: NaturalnessEvaluator
      requiresInject:
      - name: yesNoModel
        type: YesNoModel
      - name: config
        type: NaturalnessConfig
      - name: examinedVersion
        type: String
      handwrittenTests:
      - name: "should record the two probabilities llama3 gives a sentence, not its\
          \ number, under an evaluator id that carries the examined version"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R002
      - name: "should not reuse what another examined version recorded, so llama3:8b\
          \ with another digest asks again"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R002
      - name: "should state as its version the examined version, llama3:8b@365c0bd3c000\
          \ · native-yes-no-1, so the judges' runtime brakes it on the same exam as\
          \ LocalToolGate"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R006
      implements:
      - Evaluator
      _change: add
    - name: DefaultNaturalnessScorer
      handwrittenTests:
      - name: "should give as number the logarithm of P(no) over P(yes), 14.68 for\
          \ «She is an engineer of hers.»"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R002
      - name: should give 0 when the model sees yes and no equally likely
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R002
      - name: "should give no number when llama3 said neither yes nor no, both probabilities\
          \ in 0, so the exercise stays unevaluated"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R002
      - name: should read the yes or the no of claude -p and take any other answer
          as unusable
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R008
      implements:
      - NaturalnessScorer
      _change: add
    - name: DefaultNaturalnessConfig
      handwrittenTests:
      - name: should hold for llama3:8b@365c0bd3c000 with the question of the prototype
          the thresholds 9.07 for A1 and 10.0 for A2
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R003
      - name: "should hold no threshold for another examined version, so another llama3\
          \ needs thresholds of its own"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R003
      - name: "should ask whether a native speaker would say the sentence with that\
          \ meaning and those words, «Would a native English speaker naturally say\
          \ or write this exact sentence, with this meaning and these words? Sentence:\
          \ …»"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R002
      implements:
      - NaturalnessConfig
      _change: add
    _change: add
  _change: modify
- name: local-language-infrastructure
  packages:
  - name: ollama
    implementations:
    - name: OllamaYesNoModel
      handwrittenTests:
      - name: "should add up the forms of yes of the first token, «yes», «Yes», «\
          \ yes» and «y», and the same for no, out of the 20 alternatives Ollama gives"
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R002
- name: audit-cli
  packages:
  - name: bootstrap
    implementations:
    - name: DefaultReevaluationQuizSetResolver
      handwrittenTests:
      - name: should read the A2 queue of naturalness written one id per line as the
          declared set of a judge
        traceability:
          feature: FEAT-NATUR
          rule: F-NATUR-R005
features:
- id: FEAT-NATUR
  code: F-NATUR
  journeys:
  - id: F-NATUR-J001
    validation: AUTO_VALIDATED
    testModule: audit-domain
    testPackage: com.learney.contentaudit.auditdomain.naturalness
