code: FEAT-DATOS
description: "FEAT-DATOS: data-coherence, el analizador de errores que compara las\
  \ copias de cada ejercicio —sus partes con la primera respuesta, las dos oraciones\
  \ guardadas (la del árbol y la de la copia de producción) y el texto con que se\
  \ grabó su audio— y marca las que no coinciden, las barras y los audios sin texto\
  \ conocido. Declara los dos datos de entrada nuevos: el registro de grabaciones\
  \ (db/grabaciones.json, José 30/9) y la copia de producción de las oraciones guardadas\
  \ (db/quiz-templates.json, que deja el importador). Diseñado contra el modelo despué\
  s de 0.2 y 0.3; usa la comparación del corrector del parche de FEAT-RESPC y el renderizador\
  \ QuizStudentViewRenderer del integrador, que además arma la oración con la primera\
  \ respuesta reusando QuizSentenceConverter.; qa-tester: traza las 5 reglas de FEAT-DATOS\
  \ a 21 handwrittenTests nuevas (no hay tests previos que portar), cada una con un\
  \ caso real del curso, y ubica F-DATOS-J001 en audit-domain, paquete datacoherence.\
  \ Dependen del integrador: la oracion armada y la evidencia (A-01), la clave de\
  \ audio (A-02, A-03) y el registro de grabaciones instalado (A-16)."
modules:
- name: audit-domain
  interfaces:
  - name: AudioRecordingRegistry
    stereotype: port
    sealed: false
    exposes:
    - signature: "recordingOf(String audioKey): Optional<AudioRecording>"
    - signature: "version(): String"
    visibility: public
    glossarySuggestions:
    - name: Registro de grabaciones
      technicalName: AudioRecordingRegistry
      kind: value-object-candidate
      basedOn: audit-domain/AudioRecordingRegistry
      rationale: "Por cada clave de audio, el texto con que se grabó por última vez\
        \ (FEAT-DATOS). Vive en db/ de content-audit, se armó una vez desde la regrabació\
        n del 24/8 y el generador de marzo de 2025, y lo actualiza cada regrabació\
        n."
    _change: add
  - name: ProductionSentenceSource
    stereotype: port
    sealed: false
    exposes:
    - signature: "savedSentences(String quizId): Optional<List<String>>"
    visibility: public
    _change: add
  packages:
  - name: datacoherence
    description: "Analizador data-coherence (FEAT-DATOS), familia errores, evalúa\
      \ QUIZ. En onQuiz compara las dos oraciones guardadas con la armada desde las\
      \ partes (R001, sin contar espacios ni recortes de reescritura: José 30/9),\
      \ busca barras en las respuestas y en el texto grabado (R002) y compara el texto\
      \ grabado con lo que el ejercicio dice hoy (R003); junta las claves de audio\
      \ y en onCourseComplete marca las compartidas o sin texto conocido (R004) y\
      \ ajusta esos puntajes antes de la agregación. Públicos: el proveedor, el diagnó\
      stico y la grabación."
    visibility: public
    models:
    - name: AudioRecording
      type: record
      fields:
      - name: audioKey
        type: String
        description: "La clave de audio del ejercicio (answerAudioUrl), como A1.04.05.01."
      - name: recordedText
        type: String
        description: El texto con que se grabó por última vez.
      - name: source
        type: String
        description: "De dónde salió: la regrabación del 24/8, el generador de marzo\
          \ de 2025 o una regrabación posterior."
      _change: add
    - name: DataCoherenceDiagnosis
      type: record
      fields:
      - name: issues
        type: List<CopyMismatch>
        description: "Una por copia que no coincide, en orden de regla."
      - name: registryVersion
        type: String
        description: Versión del registro de grabaciones contra la que se comparó.
      - name: score
        type: double
        description: 1 sin hallazgos; 0 con alguno (F-DATOS-R005).
      _change: add
    - name: CopyMismatch
      type: record
      fields:
      - name: rule
        type: String
        description: La regla de FEAT-DATOS que no se cumple (R001 a R004).
      - name: kind
        type: CopyMismatchKind
      - name: copy
        type: ExerciseCopy
        description: Qué copia está mal o falta. Es la marca de la identidad del hallazgo.
      - name: expected
        type: String
        description: "Lo que el ejercicio dice hoy, armado desde sus partes."
      - name: found
        type: String
        description: "Lo que dice la copia: la oración guardada, la respuesta con\
          \ barra o el texto grabado."
      _change: add
    - name: CopyMismatchKind
      type: enum
      fields:
      - name: SAVED_SENTENCE_DIFFERS
        description: "R001: una oración guardada no es el ejercicio armado con su\
          \ primera respuesta. Media, regla."
      - name: SLASH_IN_ANSWER
        description: "R002.1: una respuesta aceptada lleva «/». Bloqueante, regla:\
          \ la barra pasa a «|»."
      - name: SLASH_IN_AUDIO
        description: "R002.2: el texto grabado lleva «/». Media, regla: se regraba."
      - name: AUDIO_DIFFERS
        description: "R003: el audio dice otra cosa que el ejercicio de hoy. Media,\
          \ mesa."
      - name: NO_AUDIO_KEY
        description: "R004: el ejercicio no tiene clave de audio. Baja, regla."
      - name: SHARED_AUDIO_KEY
        description: "R004: otra clave igual en otro ejercicio. Baja, regla."
      - name: UNKNOWN_RECORDING
        description: "R004: el registro no sabe con qué texto se grabó. Baja, regla."
      _change: add
    - name: ExerciseCopy
      type: enum
      fields:
      - name: TREE_SENTENCE
        description: "La oración guardada en el árbol de content-audit, la que se\
          \ mide."
      - name: PRODUCTION_SENTENCE
        description: La oración guardada en la copia de producción que deja el importador.
      - name: ACCEPTED_ANSWER
        description: Una respuesta aceptada.
      - name: AUDIO
        description: "El audio: su clave o el texto con que se grabó."
      _change: add
    interfaces:
    - name: SpokenTextBuilder
      sealed: false
      exposes:
      - signature: "spokenTexts(AuditableQuiz quiz,SentenceMode mode): List<String>"
      visibility: internal
      _change: add
    implementations:
    - name: DataCoherenceAnalyzerProvider
      requiresInject:
      - name: correctorMatcher
        type: CorrectorMatcher
      - name: recordings
        type: AudioRecordingRegistry
      - name: productionSentences
        type: ProductionSentenceSource
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      visibility: public
      handwrittenTests:
      - name: "should describe data-coherence in the catalog as an errors analyzer\
          \ that evaluates exercises, resolves by rule or at the panel and costs instant,\
          \ asking «¿Todas las copias del ejercicio dicen lo mismo?»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R005
      implements:
      - AnalyzerProvider
      _change: add
    - name: DataCoherenceAnalyzer
      requiresInject:
      - name: correctorMatcher
        type: CorrectorMatcher
      - name: recordings
        type: AudioRecordingRegistry
      - name: productionSentences
        type: ProductionSentenceSource
      - name: spokenTextBuilder
        type: SpokenTextBuilder
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      handwrittenTests:
      - name: "should report the production copy's saved sentence that is not the\
          \ exercise built with its first answer, as «The tree has not grown/hasn't\
          \ grown yet.» for «The tree ___ (not / grow) yet.»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R001
      - name: "should report a saved sentence of the tree that is not the exercise\
          \ built with its first answer, fixed by rule rebuilding it from the parts,\
          \ as «The tree has not grown/hasn't grown yet.» if the tree kept it"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R001
      - name: "should not count spaces, punctuation or a rewrite saved as its answer\
          \ alone as a difference, as «They 're late for the game.» and «Ana was teached\
          \ a lesson by my brother.»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R001
      - name: "should build the sentence of a multiple choice exercise with its correct\
          \ option in the gap, as «I saw a man.» for «I saw ___ man (the listener\
          \ doesn't know which man).»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R001
      - name: "should raise a blocking finding on an accepted answer with «/», fixed\
          \ by rule turning the slash into «|», as «has not cut/hasn't cut» for «\
          He ___ (not / cut) himself.»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R002
      - name: "should raise a medium finding on a recorded text that reads a slash,\
          \ fixed by rule recording again with today's text, as «He has not cut/hasn't\
          \ cut himself.»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R002
      - name: "should not report the slash of a statement such as «a / an» by itself,\
          \ but report it when the audio reads it, as in «Don't touch a / an ___ (asleep\
          \ / resting) dog!»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R002
      - name: "should send to the panel as medium a recorded text that says something\
          \ else than the exercise today, as «Ana was taught a lesson» against «Ana\
          \ was teached a lesson»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R003
      - name: "should accept a recording that says another accepted answer or the\
          \ long form of a contraction, as «We are very excited.» for «We ___ (be)\
          \ very excited.» answered «'re»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R003
      - name: "should accept a recording that contains what the exercise says or is\
          \ contained in it, as «If not» for «Can you hear me clearly? ___ , I can\
          \ speak louder.»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R003
      - name: "should raise a low finding on an exercise without audio key, fixed\
          \ by rule recording it with today's text, as «Are we eating soon?» in Planes\
          \ y horarios"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R004
      - name: "should report every exercise that shares its audio key with another\
          \ once the whole course has been seen and before the scores are aggregated,\
          \ as two exercises with the key A1.04.08.01"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R004
      - name: "should raise a low finding on an exercise whose recording the registry\
          \ does not know, as «Did he have dinner?» if A1.04.08.01 were not registered"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R004
      - name: "should show as evidence the two copies that do not match with their\
          \ text and name the copy in the identity, as «He ___ (not / cut) himself.\
          \ → audio: He has not cut/hasn't cut himself.; hoy: He has not cut himself.»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R005
      - name: "should score 0 an exercise with a finding and 1 an exercise whose three\
          \ copies match, as «You ___ (see) cats.»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R005
      implements:
      - ContentAnalyzer
      _change: add
    - name: DefaultSpokenTextBuilder
      handwrittenTests:
      - name: "should say only the answer of B in a dialogue, without its label, as\
          \ «No, you aren't.» for «A: Am I wrong? B: No, you ___ .»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R003
      - name: "should say only the answer of a word form prompt, as «stopping» for\
          \ «stop - ___»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R003
      implements:
      - SpokenTextBuilder
      _change: add
    _change: add
  _change: modify
- name: audit-infrastructure
  packages:
  - name: exercisecopies
    description: "Las otras copias del ejercicio, leídas de db/ en sólo lectura: el\
      \ registro de grabaciones (db/grabaciones.json, versionado con el curso) y las\
      \ oraciones guardadas de la copia de producción (db/quiz-templates.json, el\
      \ export plano que deja scripts/import_backup.py). De la copia de producció\
      n sólo se lee el _id y form.sentences de cada ejercicio: el curso se sigue leyendo\
      \ por CourseRepository."
    visibility: internal
    implementations:
    - name: FileSystemAudioRecordingRegistry
      requiresInject:
      - name: registryPath
        type: Path
      visibility: public
      handwrittenTests:
      - name: "should give for an audio key the text it was last recorded with and\
          \ where that text came from, as «He has not cut/hasn't cut himself.» for\
          \ A2.04.05.09"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R004
      - name: "should give nothing for an audio key the registry does not know, as\
          \ the empty key of «Are we eating soon?»"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R004
      implements:
      - AudioRecordingRegistry
      _change: add
    - name: FileSystemProductionSentenceSource
      requiresInject:
      - name: exportPath
        type: Path
      visibility: public
      handwrittenTests:
      - name: "should read by quiz id the saved sentences of the production copy the\
          \ importer leaves, as «The tree has not grown/hasn't grown yet.» for 67fab6d5993010229534287e"
        traceability:
          feature: FEAT-DATOS
          rule: F-DATOS-R001
      implements:
      - ProductionSentenceSource
      _change: add
    _change: add
  _change: modify
features:
- id: FEAT-DATOS
  code: F-DATOS
  journeys:
  - id: F-DATOS-J001
    validation: AUTO_VALIDATED
    testModule: audit-domain
    testPackage: com.learney.contentaudit.auditdomain.datacoherence
