code: FEAT-PROYU
description: "FEAT-PROYU: una sola proyección del curso con sus propuestas. Un proyector\
  \ aplica las pendientes siempre igual y mide cada foto con los analizadores del\
  \ análisis de partida; la vista consolidada, la proyección guardada, el impacto\
  \ por propuesta y la comparación de F la leen de ahí. La línea base se separa del\
  \ par activo y, como él, no se borra sin querer. Lo compartido (la medida en el\
  \ informe, la resolución de ids de proyección, el cableado) va en ganchos-F.md.\
  \ Rebasado por el integrador de la ronda 2 sobre el sentinel.yaml de ronda1/integracion\
  \ (la ronda 1 aplicada y construida) y sobre FEAT-RONDA2, que se aplica antes; orden\
  \ de la cadena: FEAT-RONDA2, B, F y E: DefaultConsolidatedViewBuilder.nodeFieldDiffer\
  \ conserva su descripción (el apply la perdía); GetConsolidatedCommand repite sealed:\
  \ true (el apply la abría, bug 09).; qa-tester: 47 pruebas para las 7 reglas de\
  \ FEAT-PROYU, con el caso del 29/9: las cuatro propuestas de «Afirmativas regulares»\
  \ (curso 73,92 y niveles 96,54 · 94,16 · 79,45 · 63,51 en la foto con pendientes;\
  \ «My grandmother ___ (come) every year.» de 1,0 a 0,9 y su tema de 100,0 a 99,5),\
  \ los 143 ejercicios con dos tareas, la línea base 2026-09-30T11-54-02 y R003 con\
  \ la política de analyze (lo local sin tope, claude -p con tope 0 salvo pedido).\
  \ F-PROYU-J001 va a audit-cli, paquete commands."
modules:
- name: audit-domain
  models:
  - name: Baseline
    type: record
    fields:
    - name: auditId
      type: String
      description: "Análisis del historial que José fijó como línea base (F-PROYU-R006).\
        \ Nunca una proyección guardada: no está en el historial (R004)."
    - name: fixedAt
      type: Instant
      description: "Cuándo se fijó. Correr analyze, proyectar, cambiar el par activo\
        \ o publicar una tanda no la cambian (R006)."
    glossarySuggestions:
    - name: Línea base
      technicalName: Baseline
      kind: value-object-candidate
      basedOn: audit-domain/Baseline
      rationale: "El análisis contra el que se miden todas las tandas; F la separa\
        \ del análisis activo, que avanza al publicar cada tanda (FEAT-TANDA)."
    _change: add
  interfaces:
  - name: BaselineStore
    stereotype: port
    sealed: false
    exposes:
    - signature: "read(): Optional<Baseline>"
    - signature: "write(Baseline baseline): void"
    _change: add
  _change: modify
- name: revision-domain
  interfaces:
  - name: ProjectionStore
    stereotype: port
    sealed: false
    exposes:
    - signature: "save(CourseProjection projection): SavedProjection"
    - signature: "load(String projectionId): Optional<AuditReport>"
    _change: add
  packages:
  - name: projection
    description: "FEAT-PROYU. Contrato de la proyección única: el curso del análisis\
      \ activo con lo aprobado y con lo pendiente del alcance pedido, medido como\
      \ lo mediría analyze sobre ese curso escrito (R001). Lo leen la vista consolidada,\
      \ la proyección guardada, la comparación y la muestra ciega de F y la tanda\
      \ de E. El motor vive en engine, junto al localizador de nodos que necesita;\
      \ afuera sólo se ven el puerto, su fábrica y los portadores."
    visibility: public
    models:
    - name: ProjectionScope
      type: record
      fields:
      - name: scopeId
        type: String
        description: "Identificador opaco del alcance: el de la tanda abierta de E,\
          \ o null fuera de una tanda. Sólo se copia a la salida."
      - name: proposalIds
        type: List<String>
        description: "Pendientes a proyectar. null = todas las pendientes del plan\
          \ activo (la vista consolidada de hoy); si no, sólo éstas: las de la tanda\
          \ (FEAT-TANDA). Una que no es pendiente del plan activo queda no aplicable,\
          \ con su causa (R002)."
      - name: analyzerBudgets
        type: "Map<String,Integer>"
        description: "Tope de consultas nuevas por nombre canónico, sólo para los\
          \ analizadores que el pedido nombra. El que no está mide con la política\
          \ de analyze (R003, F-RONDA2-R002): lo que consulta un modelo local, sin\
          \ tope; lo que consulta claude -p, con tope 0."
      _change: add
    - name: ProjectedChange
      type: record
      fields:
      - name: proposalId
        type: String
        description: La propuesta aplicada.
        domainLinks:
        - term: Propuesta de revisión
          role: carries
      - name: nodeTarget
        type: AuditTarget
      - name: nodeId
        type: String
      - name: pending
        type: boolean
        description: false = aprobada (foto approved); true = pendiente del alcance
          (sólo en la foto projected).
      _change: add
    - name: CourseProjection
      type: record
      fields:
      - name: activeAuditId
        type: String
      - name: activePlanId
        type: String
      - name: scopeId
        type: String
      - name: availability
        type: ConsolidatedViewAvailability
      - name: unavailability
        type: ConsolidatedViewUnavailability
        description: "Poblado sólo si no hay par activo, falta el plan o el motor\
          \ falla; las mismas causas que la vista consolidada (F-CDIFF-R013)."
      - name: original
        type: AuditReport
        description: "El análisis activo tal como está guardado: la foto original\
          \ de la vista consolidada."
      - name: approved
        type: AuditReport
        description: "El curso con lo aprobado, medido por el motor: el inicio de\
          \ la tanda (F-METAS)."
      - name: projected
        type: AuditReport
        description: El curso con lo aprobado y las pendientes aplicables del alcance.
          Es la misma instancia que approved si no se aplicó ninguna (F-CDIFF-R007
          inv. 3).
      - name: changes
        type: List<ProjectedChange>
        description: "Aprobadas y pendientes aplicadas, en orden de aplicación (fecha\
          \ de creación)."
      - name: nonApplicablePendings
        type: List<NonApplicablePending>
        description: "Las que no entraron, con su causa. Todo número proyectado declara\
          \ estas mismas listas (R002)."
      glossarySuggestions:
      - name: Proyección
        technicalName: CourseProjection
        kind: value-object-candidate
        basedOn: revision-domain/projection/CourseProjection
        derivedFrom:
        - Propuesta de revisión
        rationale: "El curso con lo aprobado y lo pendiente, medido sin escribirlo.\
          \ FEAT-PROYU la vuelve una sola cuenta para todas las pantallas."
      _change: add
    - name: SavedProjection
      type: record
      fields:
      - name: projectionId
        type: String
        description: "Id que aceptan plan --audit y la consulta de palabras sugeridas\
          \ como análisis fuente (R005). Uno por par activo: guardar otra del mismo\
          \ par la reemplaza."
      - name: activeAuditId
        type: String
      - name: activePlanId
        type: String
      - name: scopeId
        type: String
      - name: savedAt
        type: Instant
      - name: appliedProposalIds
        type: List<String>
      - name: nonApplicablePendings
        type: List<NonApplicablePending>
      _change: add
    - name: CourseProjectorConfig
      type: record
      fields:
      - name: activeAnalysisSelectionStore
        type: ActiveAnalysisSelectionStore
      - name: auditReportStore
        type: AuditReportStore
      - name: refinementPlanStore
        type: RefinementPlanStore
      - name: revisionArtifactStore
        type: RevisionArtifactStore
      - name: courseRepository
        type: CourseRepository
      - name: courseMapper
        type: CourseMapper
      - name: auditEngine
        type: AuditEngine
      _change: add
    interfaces:
    - name: CourseProjector
      stereotype: port
      sealed: false
      exposes:
      - signature: "project(Path coursePath, ProjectionScope scope): CourseProjection"
      _change: add
    - name: CourseProjectorFactory
      stereotype: factory
      sealed: false
      exposes:
      - signature: "create(CourseProjectorConfig config): CourseProjector"
      _change: add
    _change: add
  - name: consolidatedview
    interfaces:
    - name: ConsolidatedViewBuilder
      sealed: false
      exposes:
      - signature: "build(Path coursePath): ConsolidatedView"
      - signature: "build(Path coursePath, ProjectionScope scope): ConsolidatedView"
        _change: add
      _change: modify
    _change: modify
  - name: engine
    models:
    - name: AppliedProposals
      type: record
      fields:
      - name: course
        type: CourseEntity
        description: El curso con las propuestas que entraron.
      - name: applied
        type: List<RevisionProposal>
        description: "Las que entraron, por fecha de creación."
      - name: nonApplicable
        type: List<NonApplicablePending>
        description: "Las que no: nodo ausente o elementBefore que ya no coincide,\
          \ con su causa (R002)."
      visibility: internal
      _change: add
    interfaces:
    - name: PendingApplier
      stereotype: port
      sealed: false
      exposes:
      - signature: "apply(CourseEntity course, List<RevisionProposal> proposals):\
          \ AppliedProposals"
      visibility: internal
      _change: add
    - name: ProjectionMeasurer
      stereotype: port
      sealed: false
      exposes:
      - signature: "measure(CourseEntity course, AuditReport startingAnalysis, Map<String,Integer>\
          \ analyzerBudgets): AuditReport"
      visibility: internal
      _change: add
    implementations:
    - name: DefaultCourseProjectorFactory
      visibility: public
      implements:
      - CourseProjectorFactory
      _change: add
    - name: DefaultCourseProjector
      requiresInject:
      - name: activeAnalysisSelectionStore
        type: ActiveAnalysisSelectionStore
        description: "El par activo: de su análisis sale la foto original y la lista\
          \ de analizadores (R003)."
      - name: auditReportStore
        type: AuditReportStore
      - name: refinementPlanStore
        type: RefinementPlanStore
        description: Sólo para declarar ACTIVE_PLAN_UNAVAILABLE como hoy.
      - name: revisionArtifactStore
        type: RevisionArtifactStore
        description: Aprobadas y pendientes del plan activo; nada más se lee del plan.
      - name: courseRepository
        type: CourseRepository
      - name: pendingApplier
        type: PendingApplier
      - name: projectionMeasurer
        type: ProjectionMeasurer
      handwrittenTests:
      - name: "should give the photo with the four pending proposals of «Afirmativas\
          \ regulares» the numbers of analyze on the copy with them written, 73.92%\
          \ in the course and 96.54, 94.16, 79.45 and 63.51 in the levels, and not\
          \ 92.38 in A1"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R001
      - name: "should lower «My grandmother ___ (come) every year.» from 1.0 to 0.9\
          \ in lemma-absence in the photo with pending proposals, with grandmother\
          \ (A2) as an off-level word, and leave every topic as it was"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R001
      - name: "should give the photo with the approved proposals, when nothing is\
          \ approved, the numbers, findings and diagnoses of the active analysis,\
          \ the COCA tokens of the 55 topics included"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R001
      - name: "should declare in the projection the pending proposals it applied and\
          \ those not applicable with their causes, the same lists its numbers come\
          \ from"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R002
      - name: "should project only the pending proposals a batch names in its scope,\
          \ every pending proposal of the active plan when the scope names none, and\
          \ declare not applicable an id that is not a pending proposal of the active\
          \ plan"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R002
      - name: should measure the photo with the approved proposals and the photo with
          the pending ones with the same analyzers and the same budgets of the scope
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R003
      - name: "should start the projection from the active analysis and its plan,\
          \ never from the latest analysis of the history nor from the baseline"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R006
      implements:
      - CourseProjector
      _change: add
    - name: DefaultPendingApplier
      requiresInject:
      - name: courseElementLocator
        type: CourseElementLocator
        description: "snapshot y replace de siempre: una propuesta entra si su nodo\
          \ existe y su elementBefore coincide; se escribe como la escribe approve\
          \ (F-REVAPR-R011)."
      handwrittenTests:
      - name: "should write each proposal as approve writes it, replacing the node\
          \ of its elementBefore with its elementAfter"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R001
      - name: should apply a pending proposal only when its node exists and its elementBefore
          matches that node in the course with the approved proposals
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R002
      - name: "should apply the pending proposals in creation order, so of an exercise\
          \ with two tasks, SENTENCE_LENGTH and LEMMA_ABSENCE, as 143 of the plan\
          \ of 29/9, the older enters and the newer is declared not applicable"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R002
      - name: "should declare not applicable, with its cause, a pending proposal whose\
          \ node no longer exists in the course"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R002
      implements:
      - PendingApplier
      _change: add
    - name: DefaultProjectionMeasurer
      requiresInject:
      - name: courseMapper
        type: CourseMapper
      - name: auditEngine
        type: AuditEngine
        description: "runAudit(course, selection) con los analizadores que corrió\
          \ el análisis de partida, en orden del catálogo, y la política de analyze\
          \ (R003, F-RONDA2-R002): el tope de los que el pedido nombra y, para el\
          \ resto, la política vacía, que el proveedor completa según a quién consulta:\
          \ lo local sin tope y claude -p con 0. Cada corrida arma analizadores nuevos\
          \ (FEAT-HALL, FEAT-CERO)."
      handwrittenTests:
      - name: "should map and measure a course the way analyze does, so the report\
          \ of a projected course equals the one analyze gives on that course written\
          \ to disk"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R001
      - name: "should run exactly the analyzers whose measures the starting analysis\
          \ keeps at its root, in catalog order, and no other"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R003
      - name: "should fall back to the base run and declare it when the starting analysis\
          \ keeps no measures, as the base of 29/9, so quiz-instruction, which that\
          \ base did not run, is not run either"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R003
      - name: "should give budget 0 to the judges that consult claude -p unless the\
          \ request names a budget for them, so a projection pays no consultation\
          \ by default"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R003
      - name: "should run without a cap the analyzers that consult a local model,\
          \ as naturalness and near-duplicates with llama3 in Ollama, the way analyze\
          \ does"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R003
      - name: "should reuse the recorded verdicts of the exercises that did not change\
          \ and consult only the changed ones within the budget of the request, leaving\
          \ the rest declared unevaluated and never approved"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R003
      implements:
      - ProjectionMeasurer
      _change: add
    - name: DefaultConsolidatedViewBuilder
      requiresInject:
      - name: revisionArtifactStore
        type: RevisionArtifactStore
        _change: delete
      - name: activeAnalysisSelectionStore
        type: ActiveAnalysisSelectionStore
        _change: delete
      - name: auditReportStore
        type: AuditReportStore
        _change: delete
      - name: refinementPlanStore
        type: RefinementPlanStore
        _change: delete
      - name: courseRepository
        type: CourseRepository
        _change: delete
      - name: courseElementLocator
        type: CourseElementLocator
        _change: delete
      - name: courseMapper
        type: CourseMapper
        _change: delete
      - name: auditEngine
        type: AuditEngine
        _change: delete
      - name: courseProjector
        type: CourseProjector
        description: "Las tres fotos salen de acá; el constructor sólo las compara,\
          \ curso incluido (R001)."
      - name: nodeFieldDiffer
        type: NodeFieldDiffer
        description: "F-CDIFF-R019/R020/R022/R023: el motor de descubrimiento dinamico\
          \ que reemplaza la logica v2 de snapshots crudos + collectStatisticImpacts.\
          \ El builder le pasa los tres AuditNode (baseline / consolidated / pendingProjection)\
          \ por cada nodeTarget+nodeId tocado, y obtiene el mapa { fieldPath → FieldChange\
          \ } que copia tal cual a NodeImpact.fieldChanges. El builder NO interpreta\
          \ el contenido del mapa; es la frontera entre 'que campos cambiaron' (R019)\
          \ y 'que decisiones del plan los provocaron' (R011)."
      handwrittenTests:
      - name: "should compare the course node too, with the id the digest gives it,\
          \ so the course of the four pending proposals of «Afirmativas regulares»\
          \ appears with 73.92%"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R001
      - name: "should declare in the consolidated view the same pending proposals\
          \ not applicable, with their causes, as the projection it reads"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R002
      _change: modify
    - name: DefaultImpactPreviewComputer
      requiresInject:
      - name: courseMapper
        type: CourseMapper
        _change: delete
      - name: auditEngine
        type: AuditEngine
        _change: delete
      - name: elementLocator
        type: CourseElementLocator
        _change: delete
      - name: auditReportStore
        type: AuditReportStore
        description: "Carga el análisis del que salió la tarea de la propuesta (sourceAuditId),\
          \ nunca loadLatest (R006, R007)."
      - name: pendingApplier
        type: PendingApplier
        description: "Aplica la propuesta sola sobre el curso con lo aprobado, con\
          \ la misma regla que la proyección (R002)."
      - name: projectionMeasurer
        type: ProjectionMeasurer
        description: "Mide las dos puntas con la misma medida (R001, R007)."
      handwrittenTests:
      - name: "should give no impact for a proposal whose elementBefore no longer\
          \ matches its node, declaring it not applicable with its cause as the projection\
          \ does"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R002
      - name: "should measure the impact against the analysis the task of the proposal\
          \ came from, never the latest analysis of the history nor a saved projection"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R004
      - name: "should report the impact of «My grandmother ___ (come) every year.»\
          \ on its own knowledge «Afirmativas regulares», from 100.0 to 99.5 in lemma-absence,\
          \ and not on «Afirmativas con $be$», the first knowledge of the course"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R007
      - name: "should report the topic, the level and the course that contain the\
          \ node, walking up from it, so a proposal on a B2 exercise never shows level\
          \ A1"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R007
      - name: "should measure the course of that moment with the approved proposals\
          \ and that course with the proposal, both with the analyzers of the analysis\
          \ the task came from"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R007
      _change: modify
    _change: modify
  _change: modify
- name: audit-infrastructure
  implementations:
  - name: FileSystemBaselineStore
    requiresInject:
    - name: baseDir
      type: Path
      description: "Raíz bajo la que se escribe .content-audit/baseline.json, un archivo\
        \ como el del par activo. Lo provee audit-cli.Main."
    types:
    - Repository
    visibility: public
    handwrittenTests:
    - name: "should keep the baseline in its own file, .content-audit/baseline.json,\
        \ so changing the active pair or saving a new analysis does not move it"
      traceability:
        feature: FEAT-PROYU
        rule: F-PROYU-R006
    - name: should read back the fixed baseline with its analysis id and the time
        it was fixed
      traceability:
        feature: FEAT-PROYU
        rule: F-PROYU-R006
    implements:
    - BaselineStore
    _change: add
  - name: FileSystemProjectionStore
    requiresInject:
    - name: baseDir
      type: Path
      description: "Raíz bajo la que se escribe .content-audit/projections/, hermano\
        \ de audits/: list(), loadLatest() y prune no la ven (R004). Un archivo por\
        \ par activo; guardar otra del mismo par lo reemplaza (R005)."
    types:
    - Repository
    visibility: public
    handwrittenTests:
    - name: should write a saved projection under .content-audit/projections/ and
        nothing under audits/
      traceability:
        feature: FEAT-PROYU
        rule: F-PROYU-R004
    - name: "should keep one saved projection per active pair, so saving another projection\
        \ of the same pair replaces the previous one"
      traceability:
        feature: FEAT-PROYU
        rule: F-PROYU-R005
    - name: should load a saved projection by the id it returned when saving it
      traceability:
        feature: FEAT-PROYU
        rule: F-PROYU-R005
    implements:
    - ProjectionStore
    _change: add
  - name: FileSystemAuditReportStore
    handwrittenTests:
    - name: should leave a saved projection out of list and loadLatest even when it
        was saved after the last analysis
      traceability:
        feature: FEAT-PROYU
        rule: F-PROYU-R004
    - name: "should load a saved projection by its id when no analysis has that id,\
        \ so plan --audit and the suggested words query accept it as their source\
        \ analysis"
      traceability:
        feature: FEAT-PROYU
        rule: F-PROYU-R005
  _change: modify
- name: audit-cli
  interfaces:
  - name: GetConsolidatedCommand
    sealed: true
    exposes:
    - signature: "getConsolidated(String coursePath, String format): Integer"
    - signature: "getConsolidated(String coursePath, String format, Map<String,Integer>\
        \ analyzerBudgets): Integer"
      _change: add
    _change: modify
  - name: SetBaselineCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "setBaseline(String auditId): Integer"
    - signature: "showBaseline(String format): Integer"
    _change: add
  - name: SaveProjectionCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "saveProjection(String coursePath, List<String> proposalIds, Map<String,Integer>\
        \ analyzerBudgets, String format): Integer"
    _change: add
  packages:
  - name: commands
    implementations:
    - name: DefaultSetBaselineCommand
      requiresInject:
      - name: baselineStore
        type: BaselineStore
      - name: auditReportStore
        type: AuditReportStore
        description: "Para rechazar un id que no está en el historial, proyecciones\
          \ incluidas (R006)."
      types:
      - Component
      handwrittenTests:
      - name: "should fix as the baseline an analysis of the history, as 2026-09-30T11-54-02,\
          \ and show it with showBaseline"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R006
      - name: "should refuse an id that is not an analysis of the history with «Cannot\
          \ fix '<id>' as the baseline: it is not an analysis in the history.»"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R006
      - name: "should refuse to fix a saved projection as the baseline, although plan\
          \ --audit accepts its id"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R006
      - name: should leave the active pair as it was when the baseline is fixed
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R006
      implements:
      - SetBaselineCommand
      _change: add
    - name: DefaultSaveProjectionCommand
      requiresInject:
      - name: courseProjector
        type: CourseProjector
      - name: projectionStore
        type: ProjectionStore
        description: "Guarda la foto projected fuera del historial y devuelve su id\
          \ (R004, R005)."
      types:
      - Component
      handwrittenTests:
      - name: should save the photo with the pending proposals of the active pair
          and print the id that plan --audit accepts
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R005
      - name: "should print with that id the pending proposals applied and those not\
          \ applicable, each with its cause"
        traceability:
          feature: FEAT-PROYU
          rule: F-PROYU-R002
