code: FEAT-MINIT
description: "FEAT-MINIT: el analizador mini-theory. Una consulta por tema: el juez\
  \ lee el nivel, el nombre y la consigna del tema, cada miniteoría distinta con los\
  \ ejercicios que la muestran, y cada ejercicio con su enunciado, su pista y sus\
  \ respuestas u opciones; dice por cada miniteoría si es cierta y qué ejercicios\
  \ la contradicen o quedan afuera. El hallazgo va en cada ejercicio que muestra la\
  \ miniteoría con problema y cuenta ahí (José, 30/9: «sólo donde se muestra»); contar\
  \ en todo el tema es un valor de la configuración, no otro diseño. Así el contrato\
  \ 0.3 no cambia: el hallazgo de tema de F-HALL-R008 no se usa. Usa el runtime comú\
  n de FEAT-JEXAM (el tope cuenta temas) y el evaluador genérico por agente. Necesita\
  \ la miniteoría en AuditableQuiz, que va como gancho del integrador. El proveedor\
  \ se declara como clase con las cinco firmas de AnalyzerProvider (0.3); el integrador\
  \ lo pasa a implements AnalyzerProvider.; qa-tester: traza las 7 reglas de FEAT-MINIT\
  \ a handwrittenTests nuevas, con juez falso o grabado y sin modelo pago; «sólo donde\
  \ se muestra» y «en todo el tema» se prueban con la miniteoría de «enjoy» de «Contraste\
  \ inicial» (9 de 80). F-MINIT-J001 va a audit-domain, paquete minitheoryengine.\
  \ Rebasado el 30/9 sobre el sentinel.yaml real (0.2 y 0.3 aplicados) y el parche\
  \ de integración de la ronda 1 (FEAT-RONDA1), que se aplica antes: MiniTheoryAnalyzerProvider\
  \ implements AnalyzerProvider (antes stereotype class con cinco exposes)."
modules:
- name: audit-domain
  interfaces:
  - name: MiniTheoryConfig
    stereotype: port
    sealed: false
    exposes:
    - signature: "getErrorScope(): MiniTheoryErrorScope"
    - signature: "getScoreFor(FindingSeverity severity): double"
    _change: add
    extends:
    - SelfDescribingConfig
  packages:
  - name: minitheory
    description: "Contrato de mini-theory (FEAT-MINIT): el veredicto del tema, con\
      \ una evaluación por miniteoría, y el diagnóstico de cada ejercicio, que dice\
      \ qué miniteoría muestra y qué se le reprocha."
    visibility: public
    models:
    - name: MiniTheoryProblem
      type: enum
      fields:
      - name: FALSE_RULE
        description: Afirma como regla del inglés algo falso. HIGH.
      - name: OVERSTATED
        description: Un «siempre» o un «nunca» con excepciones comunes. MEDIUM.
      - name: CONTRADICTED_BY_EXERCISE
        description: Un ejercicio que la muestra la contradice. HIGH.
      - name: NOT_COVERING_EXERCISE
        description: Es cierta pero no cubre el caso del ejercicio que la muestra.
          LOW.
      _change: add
    - name: MiniTheoryErrorScope
      type: enum
      fields:
      - name: SHOWN_ONLY
        description: "Por omisión (José, 30/9): una miniteoría falsa o exagerada cuenta\
          \ en los ejercicios que la muestran."
      - name: WHOLE_TOPIC
        description: Una miniteoría falsa o exagerada cuenta en todos los ejercicios
          del tema. Las de un ejercicio que la contradice o queda afuera cuentan siempre
          sólo en ese ejercicio.
      _change: add
    - name: MiniTheoryAssessment
      type: record
      fields:
      - name: miniTheory
        type: int
        description: "Qué miniteoría (M1, M2…, desde 1), en el orden en que aparece\
          \ por primera vez en el tema."
      - name: holds
        type: boolean
      - name: problem
        type: MiniTheoryProblem
        description: Null si holds.
      - name: severity
        type: FindingSeverity
      - name: counterexample
        type: String
        description: Una oración en inglés que muestra lo que tiene de falso.
      - name: exercises
        type: List<Integer>
        description: "Los ejercicios involucrados (E1, E2…, desde 1, en el orden del\
          \ tema): los que la contradicen o quedan afuera."
      - name: explanation
        type: String
      _change: add
    - name: MiniTheoryVerdict
      type: record
      fields:
      - name: assessments
        type: List<MiniTheoryAssessment>
        description: Una por miniteoría distinta del tema.
      - name: rationale
        type: String
      _change: add
    - name: MiniTheoryDiagnosis
      type: record
      fields:
      - name: knowledgeId
        type: String
        description: El tema que se juzgó con una consulta.
      - name: miniTheory
        type: String
        description: "El texto de la miniteoría que muestra este ejercicio, tal cual."
      - name: assessments
        type: List<MiniTheoryAssessment>
        description: Lo que el veredicto del tema le reprocha a este ejercicio; vacía
          si nada.
      - name: score
        type: double
        description: "1 sin hallazgo; si no, 0,8, 0,6 o 0,3 según la gravedad más\
          \ alta."
      - name: reusedFromPreviousRun
        type: boolean
      _change: add
    interfaces:
    - name: MiniTheoryVerdictReader
      stereotype: port
      sealed: false
      exposes:
      - signature: "read(String payload): MiniTheoryVerdict"
      _change: add
    _change: add
  - name: minitheoryengine
    description: "Motor de mini-theory. Sólo el proveedor es público. La unidad de\
      \ consulta es el tema: onKnowledge arma el sujeto con el tema entero (el recorrido\
      \ llega al tema antes que a sus ejercicios) y onCourseComplete resuelve los\
      \ temas con resolveAll; el tope cuenta temas (F-MINIT-R005). El repartidor lleva\
      \ el veredicto a los ejercicios con el mismo orden con que el constructor los\
      \ numeró (miniteorías por primera aparición, ejercicios en el orden del tema),\
      \ así que E3 y M2 significan lo mismo en los dos. Puntaje, diagnóstico, hallazgos\
      \ y lo sin evaluar van en cada ejercicio; el tema, el nivel y el curso suben\
      \ por la agregación genérica."
    visibility: public
    models:
    - name: MiniTheoryQuizOutcome
      type: record
      fields:
      - name: quizId
        type: String
      - name: diagnosis
        type: MiniTheoryDiagnosis
      - name: findings
        type: List<FindingDraft>
        description: "La marca es el texto de la miniteoría: los ejercicios de una\
          \ misma miniteoría comparten identidad salvo por el nodo, y así los agrupa\
          \ la mesa (F-MINIT-R007)."
      - name: score
        type: double
      visibility: internal
      _change: add
    interfaces:
    - name: MiniTheorySubjectBuilder
      sealed: false
      exposes:
      - signature: "build(AuditNode knowledgeNode): EvaluationSubject"
      visibility: internal
      _change: add
    - name: MiniTheoryDistributor
      sealed: false
      exposes:
      - signature: "distribute(MiniTheoryVerdict verdict,AuditNode knowledgeNode,boolean\
          \ reused): List<MiniTheoryQuizOutcome>"
      visibility: internal
      _change: add
    implementations:
    - name: MiniTheoryAnalyzerProvider
      requiresInject:
      - name: runtime
        type: JudgeRuntime
      - name: judge
        type: Evaluator
        description: Agente mini-theory-judge.
      - name: verdictReader
        type: MiniTheoryVerdictReader
      - name: config
        type: MiniTheoryConfig
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      visibility: public
      handwrittenTests:
      - name: "should publish the name mini-theory and open its judge through the\
          \ judges runtime under that name, so a version without an approved exam\
          \ gets budget 0"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R005
      - name: "should publish a card with family errors, paid model cost, the quiz\
          \ as evaluated level and the rules false-rule, overstated-rule, contradicting-exercise\
          \ and uncovered-exercise"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R002
      - name: should declare in its card the panel as resolution of its four rules
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R007
      - name: should bind its scores below 1 to the plan as MINI_THEORY tasks on quizzes
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R004
      implements:
      - AnalyzerProvider
      _change: add
    - name: MiniTheoryAnalyzer
      requiresInject:
      - name: opened
        type: JudgeSessions
      - name: runtime
        type: JudgeRuntime
      - name: subjectBuilder
        type: MiniTheorySubjectBuilder
      - name: distributor
        type: MiniTheoryDistributor
      - name: verdictReader
        type: MiniTheoryVerdictReader
      handwrittenTests:
      - name: "should consult the judge once per topic, never once per exercise"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R001
      - name: "should count topics against its budget, so with budget 1 and two new\
          \ topics it judges one and leaves every exercise of the other unevaluated"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R005
      - name: should reuse the verdict of a topic whose content did not change without
          consulting and without spending budget
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R005
      - name: "should leave the exercises of an unevaluated topic without mini-theory\
          \ score and finding, marked as unevaluated by mini-theory"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R005
      - name: "should finish the run and record nothing when the judge's service fails\
          \ or its output is unusable, leaving those topics unevaluated"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R005
      - name: "should declare the topics reached, evaluated and unevaluated, and the\
          \ exercises they contain, in its coverage"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R005
      - name: "should consult the judge on no topic when the run asks no budget for\
          \ mini-theory, and declare what the pending topics cost"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R005
      - name: should judge in an EXAM run the topics of the exercises of the file
          and no other topic
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R006
      - name: "should judge a candidate that rewrites a mini-theory with the same\
          \ judge and version, and reuse its verdict once the candidate enters the\
          \ course"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R007
      implements:
      - ContentAnalyzer
      _change: add
    - name: DefaultMiniTheorySubjectBuilder
      requiresInject:
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
        description: "Las claves y su orden son la huella: cefrLevel, topic, instructions\
          \ (la del tema), miniTheories, exercises. Cualquier cambio de una miniteorí\
          a o de un ejercicio vuelve a juzgar el tema entero (F-MINIT-R001)."
      handwrittenTests:
      - name: "should build one content per topic with cefrLevel, topic, the topic's\
          \ instructions, its mini-theories and its exercises, in that order and nothing\
          \ else"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R001
      - name: "should list each distinct mini-theory once, numbered by first appearance\
          \ with the exercises that show it, as the they/them one of 16 exercises\
          \ of «Sujeto u objeto» and the she/her one of 12"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R001
      - name: "should number the exercises in topic order, each with its statement,\
          \ hint and accepted answers, or its options with the correct one marked"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R001
      - name: "should build the same content when only a translation or an audio of\
          \ the topic changes, and a different one when a mini-theory or an exercise\
          \ changes"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R001
      implements:
      - MiniTheorySubjectBuilder
      _change: add
    - name: DefaultMiniTheoryDistributor
      requiresInject:
      - name: config
        type: MiniTheoryConfig
        description: "De acá sale el alcance del error: SHOWN_ONLY o WHOLE_TOPIC."
      handwrittenTests:
      - name: should put a finding of the false «enjoy» mini-theory in the 9 exercises
          of «Contraste inicial» that show it and in none of its other 71
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R003
      - name: should put that finding in the 80 exercises of «Contraste inicial» when
          the error scope is the whole topic
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R003
      - name: "should put the finding of an exercise that contradicts its mini-theory,\
          \ or falls outside it, only on that exercise, whatever the error scope"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R003
      - name: "should give HIGH to a false or contradicted mini-theory, MEDIUM to\
          \ an overstated one and LOW to one that does not cover its exercise, and\
          \ never BLOCKING"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R004
      - name: "should score each exercise 1 without finding and 0.3, 0.6 or 0.8 by\
          \ its gravest mini-theory finding"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R004
      - name: "should put in the evidence the text of the mini-theory, what it has\
          \ false with its counterexample «Are you enjoying the party?», and the exercises\
          \ involved"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R002
      - name: "should mark every finding of one mini-theory with its text, so the\
          \ exercises that show it are resolved together with a single candidate"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R007
      - name: "should leave the verduras without mini-theory finding when the judge\
          \ holds their mini-theory «Con he, she, it el verbo lleva -s…» true"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R006
      implements:
      - MiniTheoryDistributor
      _change: add
    _change: add
  _change: modify
- name: quiz-instruction-infrastructure
  packages:
  - name: minitheoryverdict
    description: Lectura del payload del juez de miniteoría.
    visibility: public
    implementations:
    - name: JacksonMiniTheoryVerdictReader
      visibility: public
      handwrittenTests:
      - name: "should read one assessment per mini-theory with whether it holds, its\
          \ problem, severity, counterexample, exercises and explanation"
        traceability:
          feature: FEAT-MINIT
          rule: F-MINIT-R002
      implements:
      - MiniTheoryVerdictReader
      _change: add
    _change: add
  _change: modify
- name: audit-application
  implementations:
  - name: DefaultMiniTheoryConfig
    types:
    - Component
    visibility: public
    handwrittenTests:
    - name: should count a false mini-theory only where it is shown unless the whole-topic
        scope is configured
      traceability:
        feature: FEAT-MINIT
        rule: F-MINIT-R003
    - name: "should score an exercise 0.3 for a high, 0.6 for a medium and 0.8 for\
        \ a low worst severity"
      traceability:
        feature: FEAT-MINIT
        rule: F-MINIT-R004
    implements:
    - MiniTheoryConfig
    _change: add
  _change: modify
features:
- id: FEAT-MINIT
  code: F-MINIT
  journeys:
  - id: F-MINIT-J001
    validation: AUTO_VALIDATED
    testModule: audit-domain
    testPackage: com.learney.contentaudit.auditdomain.minitheoryengine
