code: FEAT-QINST
modules:
- name: audit-application
  implementations:
  - name: DefaultAuditRunner
    handwrittenTests:
    - name: "should not run the quiz instruction analysis when the run excludes it\
        \ by the very name the report publishes, while the judge behind it answers\
        \ to a different name"
      traceability:
        feature: FEAT-QINST
        rule: F-QINST-R015
    - name: "should cap the judge queries at the number requested for the name the\
        \ report publishes instead of falling back to the default cap, while the judge\
        \ behind it answers to a different name"
      traceability:
        feature: FEAT-QINST
        rule: F-QINST-R015
    - name: "should re evaluate quizzes that already had a verdict when re evaluation\
        \ is requested for the name the report publishes, while the judge behind it\
        \ answers to a different name"
      traceability:
        feature: FEAT-QINST
        rule: F-QINST-R015
- name: audit-domain
  packages:
  - name: quizinstructionengine
    implementations:
    - name: DefaultQuizInstructionAnalyzerFactory
      handwrittenTests:
      - name: should publish for selection exactly the name under which the analyzer
          it builds reports its score
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R015
    - name: QuizInstructionAnalyzer
      handwrittenTests:
      - name: should declare in the coverage the judge version the run evaluated with
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R005
      - name: "should declare a single judge version, the one in effect, for a run\
          \ that both reuses verdicts from earlier runs and evaluates new ones"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R005
- name: audit-cli
  packages:
  - name: formatting
    implementations:
    - name: QuizInstructionDetailedFormatter
      handwrittenTests:
      - name: should render the judge version the analysis evaluated with next to
          the coverage numbers
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R005
- name: quiz-instruction-infrastructure
  packages:
  - name: instructionjudge
    implementations:
    - name: DefaultQuizInstructionJudgeVersionResolver
      handwrittenTests:
      - name: "should derive a different judge version when only the text of the agent\
          \ definition changes, with the agent name and the model untouched"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R010
      - name: "should derive a judge version that cannot coincide with any version\
          \ derived from a reachable agent definition when the definition cannot be\
          \ located, so that no recorded verdict is current under it"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R010
    - name: DefaultQuizInstructionJudgeFactory
      handwrittenTests:
      - name: should yield an evaluator that reports itself unavailable and emits
          no verdict when the agent definition its version derives from cannot be
          located
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R010
