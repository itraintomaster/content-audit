code: FEAT-QINST
description: "F-QINST-R018 + F-QINST-R019: re-evaluacion acotada a un conjunto declarado,\
  \ enumerado en el pedido o leido de un origen externo que el pedido nombra"
modules:
- name: audit-domain
  models:
  - name: EvaluationRunPolicy
    type: record
    fields:
    - name: reevaluationSubjectIds
      type: Set<String>
      description: "Conjunto declarado de elementos a re-evaluar, expresado en el\
        \ vocabulario del consumidor (ids de ejercicio para quiz-instruction, F-QINST-R018).\
        \ null = no se declaro conjunto. Vacio NO significa todo el curso: significa\
        \ pedido declarado y vacio, que se rechaza (F-QINST-R019 invariante 3: un\
        \ origen legible del que no sale ningun identificador llega hasta aca como\
        \ conjunto vacio). El id SELECCIONA a quien se le vuelve a preguntar; no identifica\
        \ el veredicto, que sigue siendo la huella del contenido (F-QINST-R009). Se\
        \ coteja contra EvaluationSubject.subjectRef, igualmente informativo. Set\
        \ y no List porque un ejercicio declarado dos veces cuenta una (F-QINST-R019\
        \ invariante 1). Es excluyente con reevaluate y con reevaluationScope: un\
        \ conjunto declarado ES el pedido de re-evaluacion, asi que declarar ademas\
        \ alcance total o por area es un pedido que no se puede interpretar."
      _change: modify
    _change: modify
  - name: EmptyReevaluationSetException
    type: exception
    fields:
    - name: analyzerName
      type: String
      description: Nombre publicado del analisis cuyo pedido de corrida se rechaza;
        el mismo por el que se filtra y se presupuesta (F-QINST-R015).
    message: "El pedido de re-evaluacion para el analisis '%s' declara un conjunto\
      \ vacio de ejercicios: no se puede interpretar el alcance y la corrida no se\
      \ ejecuta"
    _change: add
    extends: IllegalArgumentException
  - name: AmbiguousReevaluationScopeException
    type: exception
    fields:
    - name: analyzerName
      type: String
      description: Nombre publicado del analisis cuyo pedido de corrida se rechaza
        (F-QINST-R015).
    - name: declaredScope
      type: String
      description: "El alcance que compite con el conjunto declarado: el id del area\
        \ del curso, o el texto que nombra el alcance total cuando se pidio re-evaluar\
        \ todo. Se nombra en el mensaje porque las dos lecturas posibles del pedido\
        \ difieren en ordenes de magnitud de gasto y el usuario tiene que ver cual\
        \ de sus dos declaraciones sacar."
    message: "El pedido de re-evaluacion para el analisis '%s' declara a la vez un\
      \ conjunto de ejercicios y otro alcance (%s): no se puede determinar el alcance"
    _change: add
    extends: IllegalArgumentException
  packages:
  - name: quizinstructionengine
    description: |
      Motor del analizador de consigna. Solo la factory es publica; el analizador, el armado del contenido juzgado, la traduccion de veredicto a puntaje y la decision de alcance de la re-evaluacion son package-private. La factory es ademas el unico punto donde un pedido de corrida que no se puede interpretar se rechaza (F-QINST-R018): se valida antes de abrir la sesion, y fuera del recorrido del arbol, donde el manejo generico de F-QINST-R007 se tragaria la excepcion en silencio. Lo que llega aca es siempre un conjunto ya resuelto: como se declaro —enumerado o desde un origen externo— es asunto del adaptador y no cambia nada de este motor (F-QINST-R019 invariante 1).
    visibility: public
    models:
    - name: QuizInstructionReevaluationDecision
      type: enum
      fields:
      - name: ORDINARY
        description: "Sin pedido explicito que alcance a este ejercicio: se reutiliza\
          \ el veredicto registrado y, si no hay, se consulta dentro del tope (F-QINST-R008/R006).\
          \ Resuelve con EvaluationSession.resolve."
      - name: AREA_REEVALUATION
        description: "Pedido explicito acotado por area del curso o total (F-QINST-R012),\
          \ comportamiento previo intacto: consulta nueva obligatoria dentro del tope.\
          \ Resuelve con EvaluationSession.resolveForced."
      - name: DECLARED_SET_REEVALUATION
        description: "El ejercicio pertenece al conjunto declarado en el pedido (F-QINST-R018):\
          \ se vuelve a juzgar tenga o no veredicto, y si el tope ya se agoto conserva\
          \ el veredicto anterior y sigue puntuando en vez de quedar pendiente. Resuelve\
          \ con EvaluationSession.resolvePreferringNew."
      - name: OUTSIDE_DECLARED_SET
        description: "Hay conjunto declarado y este ejercicio no pertenece (F-QINST-R018):\
          \ se reutiliza sin consulta y no gasta tope, tenga o no veredicto. Es lo\
          \ que hace que el tope se gaste PRIMERO en el conjunto sin ningun mecanismo\
          \ de prioridad: fuera del conjunto no hay consultas nuevas que competir.\
          \ Resuelve con EvaluationSession.resolveWithoutConsulting."
      visibility: internal
      _change: add
    interfaces:
    - name: QuizInstructionScopeMatcher
      sealed: false
      exposes:
      - signature: "decide(AuditNode quizNode,EvaluationRunPolicy policy): QuizInstructionReevaluationDecision"
        _change: add
      visibility: internal
      _change: modify
    implementations:
    - name: DefaultQuizInstructionScopeMatcher
      handwrittenTests:
      - name: should decide a new judgement for every quiz of the declared set and
          a reuse without consulting for every quiz outside it
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R018
      - name: should keep deciding by the declared course area when the request declares
          no set of quizzes
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R012
    - name: DefaultQuizInstructionAnalyzerFactory
      handwrittenTests:
      - name: "should reject the run request that declares an empty set of quizzes,\
          \ before opening the evaluation session"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R018
      - name: "should reject the run request that declares a set of quizzes together\
          \ with a course area, before opening the evaluation session"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R018
    - name: QuizInstructionAnalyzer
      handwrittenTests:
      - name: "should query the judge for every quiz of the declared set and for no\
          \ quiz outside it, whatever verdict the outsiders already have"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R018
      - name: "should keep the score and the diagnosis of a quiz of the declared set\
          \ the budget did not reach, instead of leaving it pending"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R018
      - name: should declare as unmatched every id of the declared set that no quiz
          of the course corresponded to
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R018
      - name: should keep the reached total and the coverage sums closed when the
          declared set carries ids that match no quiz of the course
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R018
    _change: modify
  - name: quizinstruction
    description: |
      FEAT-QINST + FEAT-QICOR. Contrato publico del cumplimiento de consigna: el veredicto tipado del juez, el diagnostico por ejercicio, la cobertura declarada, y —desde FEAT-QICOR— la vista del ejercicio juzgado y la verificacion de cumplimiento. Que la verificacion viva aca y no del lado de revision es lo que permite que la revalidacion del original (F-QICOR-R009) y la verificacion del corregido (F-QICOR-R005) se sometan EXACTAMENTE al mismo criterio que detecto el incumplimiento: mismo render del quiz, misma huella, mismo evaluador, mismo lector de payload. La alternativa era duplicar el criterio de juicio, que es lo que R005 y R009 existen para impedir.
    visibility: public
    models:
    - name: QuizInstructionCoverageDiagnosis
      type: record
      fields:
      - name: unmatchedReevaluationIds
        type: List<String>
        description: "Identificadores del conjunto declarado que no correspondieron\
          \ a ningun ejercicio alcanzado por la corrida (F-QINST-R018). Vive AL LADO\
          \ de coverage y no dentro: esos identificadores no son ejercicios del curso,\
          \ asi que no entran en ningun recuento de cobertura y las dos sumas de F-QINST-R005/R014\
          \ siguen cerrando sin tocarlas. Vacia cuando el pedido no declaro conjunto\
          \ o cuando todos correspondieron. Cada identificador figura una sola vez,\
          \ porque el conjunto llega ya deduplicado desde su declaracion (F-QINST-R019).\
          \ Se informa en lugar de callarse porque ignorar en silencio un identificador\
          \ viejo haria creer que se re-juzgo algo que nadie miro."
        _change: modify
      _change: modify
    _change: modify
  _change: modify
- name: evaluation-ledger-domain
  interfaces:
  - name: EvaluationSession
    stereotype: port
    sealed: false
    exposes:
    - signature: "resolvePreferringNew(EvaluationSubject subject): EvaluationResolution"
      _change: add
    - signature: "resolveWithoutConsulting(EvaluationSubject subject): EvaluationResolution"
      _change: add
    _change: modify
  packages:
  - name: evaluationsession
    implementations:
    - name: DefaultEvaluationSession
      handwrittenTests:
      - name: should reuse the registered result without consulting the evaluator
          and without spending the run budget when the content is resolved without
          consulting
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R018
      - name: should leave the content pending without consulting the evaluator when
          it is resolved without consulting and nothing is registered for it
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R018
      - name: should consult the evaluator for content that already has a registered
          result when a new evaluation is preferred for it
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R018
      - name: should keep the registered result instead of leaving the content pending
          when a new evaluation is preferred and the budget is already exhausted
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R018
  _change: modify
- name: audit-cli
  models:
  - name: AnalyzeOptions
    type: record
    fields:
    - name: reevaluateInstructionQuizIds
      type: Set<String>
      description: "Conjunto de ejercicios a re-evaluar, YA RESUELTO a identificadores\
        \ y deduplicado (F-QINST-R018/R019). null = no se declaro conjunto; vacio\
        \ = se declaro y no salio ningun identificador, y el dominio lo rechaza como\
        \ conjunto vacio. El carrier lleva UN solo campo aunque las formas de declararlo\
        \ sean dos: enumerado (--reevaluate-instruction-quizzes) y origen externo\
        \ (--reevaluate-instruction-quizzes-file) se resuelven antes, en ReevaluationQuizSetResolver,\
        \ y desde aca en adelante son indistinguibles, que es lo que exige la invariante\
        \ 1 de F-QINST-R019. Como efecto, la decision de alcance se ejercita con un\
        \ conjunto en memoria, sin archivos."
      _change: modify
    _change: modify
  packages:
  - name: commands
    description: Public CLI command tree — the only exported API of the audit-cli
      module
    visibility: internal
    implementations:
    - name: AnalyzeCmd
      requiresInject:
      - name: reevaluationQuizSetResolver
        type: ReevaluationQuizSetResolver
        _change: add
      handwrittenTests:
      - name: "should carry into the instruction run policy the set of quizzes the\
          \ user declared, as the only re evaluation scope of the run"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R018
      - name: "should not run the audit at all, and should report the origin it could\
          \ not read, when the request names an unreadable origin for the set of quizzes"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R019
      _change: modify
    _change: modify
  - name: bootstrap
    description: |
      Env-var -> domain-object parsing plus composition-root helpers translating external inputs (workdir, approval mode, proposal strategy selection, LAGEN mode + LLM config, conjunto de ejercicios a re-evaluar declarado enumerado o por origen externo) into typed values consumed by the engine factories.
    visibility: internal
    models:
    - name: UnreadableQuizSetOriginException
      type: exception
      fields:
      - name: origin
        type: String
        description: "El origen tal como lo nombro quien pidio la corrida. Se nombra\
          \ en el mensaje porque es lo que hay que corregir: F-QINST-R019 invariante\
          \ 2 exige que este rechazo no se pueda confundir con el de conjunto vacio,\
          \ y lo que separa a los dos es donde esta el arreglo (apuntar bien vs rehacer\
          \ la seleccion)."
      - name: detail
        type: String
        description: "Por que no se pudo leer. El conjunto NUNCA se conocio, asi que\
          \ cualquier lectura que siga adelante afirma algo sobre una seleccion que\
          \ el sistema no llego a ver."
      message: "No se pudo leer el origen '%s' declarado para el conjunto de ejercicios\
        \ a re-evaluar: %s"
      visibility: public
      _change: add
      extends: IllegalArgumentException
    - name: AmbiguousQuizSetDeclarationException
      type: exception
      fields:
      - name: enumeratedIds
        type: String
        description: "La enumeracion declarada en el pedido, tal como se escribio."
      - name: origin
        type: String
        description: "El origen declarado en el pedido, tal como se nombro. Se nombran\
          \ los dos porque union y 'una gana' son lecturas distintas del mismo pedido\
          \ y nada dice cual se quiso (F-QINST-R019): el usuario tiene que ver sus\
          \ dos declaraciones para sacar una."
      message: "El pedido de re-evaluacion declara a la vez los ejercicios ('%s')\
        \ y un origen del que leerlos ('%s'): no se puede determinar el conjunto"
      visibility: public
      _change: add
      extends: IllegalArgumentException
    - name: UnreadableQuizSetFileException
      type: record
      _change: delete
    interfaces:
    - name: ReevaluationQuizSetResolver
      stereotype: port
      sealed: false
      exposes:
      - signature: "resolve(String optionValue): Set<String>"
        _change: delete
      - signature: "resolve(String enumeratedIds,String origin): Set<String>"
        _change: add
      _change: modify
    implementations:
    - name: DefaultReevaluationQuizSetResolver
      visibility: public
      handwrittenTests:
      - name: should resolve the same set of quiz ids whether they are enumerated
          in the request or read from the origin the request names
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R019
      - name: should count a quiz id declared more than once as a single id of the
          set
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R019
      - name: "should discard the surplus separators, the spaces around each id and\
          \ the blank entries instead of keeping them as ids"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R019
      - name: "should reject the request naming the origin it could not read, instead\
          \ of returning an empty set"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R019
      - name: "should return an empty set when the origin it read carries no id at\
          \ all, leaving the rejection to the run request"
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R019
      - name: should reject the request that enumerates ids and names an origin to
          read them from at the same time
        traceability:
          feature: FEAT-QINST
          rule: F-QINST-R019
      implements:
      - ReevaluationQuizSetResolver
      _change: modify
    _change: modify
  _change: modify
features:
- id: FEAT-QINST
  journeys:
  - id: F-QINST-J004
    validation: AUTO_VALIDATED
    testModule: audit-application
    testPackage: com.learney.contentaudit.auditapplication
