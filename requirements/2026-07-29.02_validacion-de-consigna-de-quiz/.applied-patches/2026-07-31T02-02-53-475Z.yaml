    requiresInject:
    - name: courseRepository
      type: CourseRepository
    - name: courseToAuditableMapper
      type: CourseToAuditableMapper
    - name: auditEngine
      type: AuditEngine
    - name: allAnalyzers
      type: List<ContentAnalyzer>
    - name: scoreAggregator
      type: ScoreAggregator
    - name: evaluationAnalyzerFactories
      type: List<EvaluationAnalyzerFactory>
      description: Analizadores que se construyen por corrida porque su presupuesto
        y su cobertura son estado de la corrida. El runner no conoce ningun evaluador
        concreto.
    _change: modify
  - name: DefaultQuizInstructionConfig
    types:
    - Component
    visibility: public
    implements:
    - QuizInstructionConfig
    _change: add
  _change: modify
