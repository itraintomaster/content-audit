  - name: AuditRunRequest
    type: record
    fields:
    - name: includedAnalyzers
      type: Set<String>
      description: Subconjunto a correr. Null o vacio = todos.
    - name: excludedAnalyzers
      type: Set<String>
      description: "Analizadores excluidos explicitamente. Un analizador excluido\
        \ no aparece en el informe, en vez de aparecer con cobertura cero (F-QINST-R011)."
    - name: evaluationPolicies
      type: "Map<String,EvaluationRunPolicy>"
      description: Politica por evaluatorId. Ausente = la politica por defecto que
        declare el analizador.
    _change: add
  interfaces:
  - name: AuditRunner
    sealed: false
    exposes:
    - signature: "runAudit(Path coursePath,AuditRunRequest request): AuditReport"
      _change: add
    _change: modify
  implementations:
