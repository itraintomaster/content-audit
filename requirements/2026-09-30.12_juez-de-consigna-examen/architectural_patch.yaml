      throwsExceptions:
      - JudgeExamNotTakenException
    - signature: "history(String judgeName): List<JudgeExamRecord>"
    _change: add
  implementations:
  - name: DefaultJudgeExamService
    requiresInject:
    - name: auditRunner
      type: AuditRunner
