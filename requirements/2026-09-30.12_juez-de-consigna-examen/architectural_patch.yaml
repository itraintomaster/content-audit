code: FEAT-JEXAM
description: "FEAT-JEXAM: lo común de los cinco jueces con modelo y lo que cambia\
  \ del juez de consigna sin tocar lo que lee. El libro de evaluaciones aprende a\
  \ resolver en lote con N consultas a la vez, a decir si un contenido ya tiene resultado\
  \ sin contarlo y a nombrar por qué dejó de consultar; suma un libro de examen que\
  \ reusa sólo veredictos de la misma versión y escribe aparte. Un runtime común de\
  \ jueces abre las sesiones con el freno del examen (sin examen aprobado, tope 0),\
  \ el tope 0 por omisión y las 4 consultas a la vez; arma la cobertura con el costo\
  \ de lo pendiente y el examen de cada versión. El examen se rinde con un archivo\
  \ de ejercicios sin lo esperado, sobre la foto del 29/9, y su resultado se mide\
  \ afuera y se registra por versión. Los adaptadores de los jueces nuevos reusan\
  \ el módulo del juez de consigna, con un evaluador genérico por agente y una verificació\
  n sin costo de la sesión del proveedor. Los tipos de 0.2 y 0.3 (AnalyzerDescriptor\
  \ ampliado, AnalyzerCatalog, AnalyzerRuleCard, FindingSeverity, AuditableQuiz.multipleChoice)\
  \ se usan sin declararse acá; el render de los jueces es QuizStudentViewRenderer\
  \ (gancho A-01) y la tabla del corrector, CorrectorMatcher (paquete A).; qa-tester:\
  \ traza R001 a R011 de FEAT-JEXAM a handwrittenTests nuevas sobre las implementaciones\
  \ del parche y sobre DefaultEvaluationSession, que realiza el contrato nuevo de\
  \ EvaluationSession; todas con juez falso o grabado, ninguna consulta un modelo\
  \ pago. R012 no tiene prueba propia: la cumplen los clasificadores de FEAT-UNICA\
  \ y FEAT-MCVALE, y propose no acepta trazas a otra feature. F-JEXAM-J001 va a audit-cli,\
  \ paquete commands."
modules:
- name: evaluation-ledger-domain
  models:
  - name: EvaluationRequestMode
    type: enum
    fields:
    - name: REUSE_OR_EVALUATE
      description: "Lo de resolve: reusa lo registrado y, si falta, consulta dentro\
        \ del tope (F-EVCOST-R003)."
    - name: FORCE
      description: "Lo de resolveForced: consulta aunque haya resultado; si no hay\
        \ tope, queda pendiente (F-EVCOST-R008)."
    - name: PREFER_NEW
      description: "Lo de resolvePreferringNew: consulta si hay tope y, si no, conserva\
        \ lo registrado (F-QINST-R018)."
    - name: REUSE_ONLY
      description: "Lo de resolveWithoutConsulting: nunca consulta ni gasta tope."
    _change: add
  - name: EvaluationRequest
    type: record
    fields:
    - name: subject
      type: EvaluationSubject
    - name: mode
      type: EvaluationRequestMode
      description: Cómo se resuelve este sujeto; mapea uno a uno a los cuatro métodos
        de a uno de la sesión.
    _change: add
  interfaces:
  - name: EvaluationSession
    sealed: false
    exposes:
    - signature: "resolveAll(List<EvaluationRequest> requests,int maxConcurrent):\
        \ List<EvaluationResolution>"
      _change: add
    - signature: "recorded(EvaluationSubject subject): boolean"
      _change: add
    - signature: "unavailableReason(): Optional<String>"
      _change: add
    _change: modify
  - name: EvaluationTimeline
    stereotype: port
    sealed: false
    exposes:
    - signature: "recordedTimes(String evaluatorId): List<Instant>"
    _change: add
  packages:
  - name: evaluationsession
    visibility: public
    implementations:
    - name: ExamEvaluationSessionFactory
      requiresInject:
      - name: ledger
        type: EvaluationLedger
        description: "El mismo libro del curso. Las sesiones que abre lo leen filtrado\
          \ por versión y escriben en su espacio de examen, nunca en el del curso\
          \ (F-JEXAM-R002)."
      - name: fingerprinter
        type: ContentFingerprinter
        description: "La misma huella que el curso: un ejercicio del examen se reconoce\
          \ igual que en el curso."
      visibility: public
      handwrittenTests:
      - name: "should open exam sessions that reuse without consulting what the same\
          \ version already judged on the same content, in an earlier exam or on the\
          \ course"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R002
      - name: "should open exam sessions that consult, within the budget, a content\
          \ the taking version never judged even when another version judged it"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R002
      implements:
      - EvaluationSessionFactory
      _change: add
    - name: ExamScopedEvaluationLedger
      requiresInject:
      - name: ledger
        type: EvaluationLedger
      - name: pinnedVersion
        type: String
        description: "La versión del evaluador que rinde. findLatest sólo devuelve\
          \ registros de esta versión, primero del espacio de examen y después del\
          \ curso; append escribe sólo en el espacio de examen (evaluatorId con prefijo\
          \ exam:)."
      handwrittenTests:
      - name: "should find only records of the version taking the exam, first in its\
          \ exam space and then in the course's, and none of another version"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R002
      - name: "should append the exam verdicts only under the evaluator prefixed exam:,\
          \ leaving the course ledger as it was"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R002
      implements:
      - EvaluationLedger
      _change: add
    - name: DefaultEvaluationSession
      handwrittenTests:
      - name: "should consult with four at a time exactly the three contents it consults\
          \ one at a time when five new contents meet a budget of 3, in the order\
          \ of the requests"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R006
      - name: "should resolve a batch mixing reuse-or-evaluate, forced, prefer-new\
          \ and reuse-only requests exactly as the one-at-a-time methods resolve them\
          \ in the same order"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R006
      - name: "should start no consultation after a service failure while resolving\
          \ at a time, and record the verdict of each consultation already in flight\
          \ that the evaluator emitted"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R006
      - name: "should return the same resolution for every content with one and with\
          \ four consultations at a time, given the same ledger and the same verdicts"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R006
      - name: "should send the first consultation of a batch alone, so an evaluator\
          \ whose provider session expired is called once and not four times"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      - name: should keep as unavailable reason the cause and the remedy the evaluator
          gave on its first service failure
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
    _change: modify
  _change: modify
- name: evaluation-ledger-infrastructure
  implementations:
  - name: FileSystemEvaluationLedger
    handwrittenTests:
    - name: "should return the recorded times of an evaluator in the order they were\
        \ appended, and none of another evaluator"
      traceability:
        feature: FEAT-JEXAM
        rule: F-JEXAM-R004
    - name: "should not return to the course evaluator a verdict recorded for the\
        \ same content under its exam: evaluator"
      traceability:
        feature: FEAT-JEXAM
        rule: F-JEXAM-R002
    implements:
    - EvaluationLedger
    - EvaluationTimeline
    _change: modify
  _change: modify
- name: audit-domain
  models:
  - name: EvaluationRunPurpose
    type: enum
    fields:
    - name: COURSE
      description: "Corrida sobre un curso (el de hoy o uno candidato de la mesa):\
        \ libro del curso y freno del examen (F-JEXAM-R003)."
    - name: EXAM
      description: "Rendir el examen: libro de examen, sin freno, y sólo se piden\
        \ los ejercicios del archivo (F-JEXAM-R001, R002)."
    _change: add
  - name: EvaluationRunPolicy
    type: record
    fields:
    - name: purpose
      type: EvaluationRunPurpose
      description: "Null = COURSE. Lo lee el runtime de jueces, nunca la sesión."
      _change: add
    - name: maxConcurrentEvaluations
      type: Integer
      description: "Consultas a la vez (F-JEXAM-R006). Null = la del runtime de jueces,\
        \ 4 (José, 30/9)."
      _change: add
    _change: modify
  interfaces:
  - name: JudgeExamRegistry
    stereotype: port
    sealed: false
    exposes:
    - signature: "record(JudgeExamRecord record): void"
    - signature: "latest(String judgeName,String judgeVersion): Optional<JudgeExamRecord>"
    - signature: "history(String judgeName): List<JudgeExamRecord>"
    _change: add
  - name: JudgeRuntimeConfig
    stereotype: port
    sealed: false
    exposes:
    - signature: "getMaxConcurrentEvaluations(): int"
    - signature: "getDefaultMaxNewEvaluations(String judgeName): int"
    - signature: "getDefaultRatePerHour(String judgeName): double"
    _change: add
    extends:
    - SelfDescribingConfig
  packages:
  - name: judging
    description: "Contrato común de los jueces con modelo (FEAT-JEXAM grupos A y B):\
      \ cómo se abre una corrida de un juez (freno del examen, tope 0 por omisión,\
      \ consultas a la vez), cómo se decide qué pide cada unidad (conjunto declarado,\
      \ re-evaluación, examen), cómo se declara la cobertura con el costo de lo pendiente\
      \ y el examen de cada versión y el registro del examen por versión. El render\
      \ «como lo ve el alumno» (QuizStudentViewRenderer) y la comparación del corrector\
      \ (CorrectorMatcher) no son de acá: son los del integrador y del paquete A,\
      \ una sola vez para todos. Lo usan el juez de consigna, los tres analizadores\
      \ nuevos y el juez de opción múltiple que aloja el analizador del paquete A."
    visibility: public
    models:
    - name: JudgeExamStatus
      type: enum
      fields:
      - name: APPROVED
        description: "Medido afuera y aprobado: la versión consulta sobre el curso."
      - name: FAILED
        description: "Medido afuera y reprobado: la versión sólo reusa (F-JEXAM-R003)."
      - name: TAKEN
        description: "Rindió todos los ejercicios y todavía no se registró la medició\
          n: sólo reusa."
      - name: NOT_TAKEN
        description: "Esa versión nunca rindió: sólo reusa."
      - name: NO_VERSION
        description: "El juez no puede enunciar su versión: no disponible (F-QINST-R010)."
      _change: add
    - name: JudgeExamGroupResult
      type: record
      fields:
      - name: group
        type: String
        description: "Nombre del grupo tal como lo mide quien tiene el oro (a, b,\
          \ c o el de la práctica)."
      - name: cases
        type: int
      - name: asExpected
        type: int
      - name: notAsExpected
        type: int
      _change: add
    - name: JudgeExamRecord
      type: record
      fields:
      - name: judgeName
        type: String
        description: "Nombre canónico del analizador que aloja al juez (F-HALL-R005);\
          \ para el de opción múltiple, el del analizador del paquete A."
      - name: judgeVersion
        type: String
        description: "Versión compuesta: la de cada evaluador del juez, en orden,\
          \ unidas por «+»."
      - name: status
        type: JudgeExamStatus
      - name: casesJudged
        type: int
      - name: casesNotJudged
        type: int
      - name: groups
        type: List<JudgeExamGroupResult>
      - name: mismatchedCaseIds
        type: List<String>
        description: "Ejercicios que no dieron lo esperado, según la medición de afuera."
      - name: goalMet
        type: boolean
      - name: photo
        type: String
        description: "Qué foto del curso se leyó (ruta y huella de la carpeta), para\
          \ que un examen no se confunda con otro."
      - name: measuredBy
        type: String
        description: Qué midió el resultado (script y su versión); vacío en un registro
          TAKEN.
      - name: recordedAt
        type: Instant
      _change: add
    - name: JudgeExamStanding
      type: record
      fields:
      - name: judgeName
        type: String
      - name: judgeVersion
        type: String
      - name: status
        type: JudgeExamStatus
      - name: consultsOnCourse
        type: boolean
        description: "Sólo con APPROVED. Si es false, la corrida sobre el curso tiene\
          \ tope 0 aunque se haya pedido otro (F-JEXAM-R003)."
      - name: reason
        type: String
        description: "Por qué no consulta, en castellano, para el informe: sin examen,\
          \ reprobada, rendida sin medir o sin versión."
      _change: add
    - name: JudgeVersionStanding
      type: record
      fields:
      - name: judgeVersion
        type: String
      - name: verdictCount
        type: int
      - name: examStatus
        type: JudgeExamStatus
      _change: add
    - name: JudgeCostEstimate
      type: record
      fields:
      - name: pendingUnits
        type: int
        description: Ejercicios o temas sin veredicto para lo que el juez lee hoy
          (F-JEXAM-R004).
      - name: pendingConsultations
        type: int
        description: "Consultas que faltan: la suma de lo pendiente y fallido de cada\
          \ evaluador (el de traducción cuenta dos por ejercicio)."
      - name: ratePerHour
        type: double
      - name: rateMeasured
        type: boolean
        description: True si sale del promedio entre veredictos seguidos de sus evaluadores
          dentro de cada corrida (cortando en pausas de más de 10 minutos); false
          si es el ritmo por omisión.
      - name: hoursOneAtATime
        type: double
      - name: maxConcurrentEvaluations
        type: int
      - name: hoursConcurrent
        type: double
      _change: add
    - name: EvaluatorCoverage
      type: record
      fields:
      - name: evaluatorId
        type: String
      - name: coverage
        type: EvaluationCoverage
      - name: consultedVersion
        type: String
        description: Null si esta corrida no lo consultó (F-QINST-R005).
      _change: add
    - name: JudgeCoverageDiagnosis
      type: record
      fields:
      - name: judgeName
        type: String
      - name: unit
        type: AuditTarget
        description: "QUIZ o KNOWLEDGE: la unidad de consulta. Los hallazgos van siempre\
          \ en el ejercicio."
      - name: reached
        type: int
      - name: evaluated
        type: int
      - name: notEvaluated
        type: int
      - name: evaluators
        type: List<EvaluatorCoverage>
      - name: standing
        type: JudgeExamStanding
        description: "El examen de la versión vigente (F-JEXAM-R001 inv. 2, R003)."
      - name: versions
        type: List<JudgeVersionStanding>
        description: "Cada versión que aporta veredictos puntuados, con su examen\
          \ (F-JEXAM-R001 inv. 2)."
      - name: unavailableReason
        type: String
        description: "Por qué dejó de consultar: la causa y cómo se resuelve (F-JEXAM-R011).\
          \ Null si no pasó."
      - name: cost
        type: JudgeCostEstimate
      - name: unmatchedDeclaredIds
        type: List<String>
      _change: add
    - name: JudgeSessions
      type: record
      fields:
      - name: judgeName
        type: String
      - name: judgeVersion
        type: String
        description: Null si algún evaluador no enuncia versión.
      - name: evaluatorIds
        type: List<String>
      - name: sessions
        type: List<EvaluationSession>
        description: "Una por evaluador, en el mismo orden, abiertas con el tope efectivo."
      - name: standing
        type: JudgeExamStanding
      - name: effectivePolicy
        type: EvaluationRunPolicy
        description: "La política con la que se corre de verdad: propósito, tope (0\
          \ si el freno aplica) y consultas a la vez completados."
      _change: add
    - name: JudgeRequestPlan
      type: record
      fields:
      - name: units
        type: List<AuditNode>
        description: "Las unidades que se piden, en el orden del recorrido. En EXAM,\
          \ sólo las del archivo."
      - name: modes
        type: List<EvaluationRequestMode>
        description: Alineada con units.
      - name: unmatchedDeclaredIds
        type: List<String>
      _change: add
    - name: JudgeUnitTally
      type: record
      fields:
      - name: unit
        type: AuditTarget
      - name: reached
        type: int
      - name: evaluated
        type: int
      - name: notEvaluated
        type: int
      - name: verdictsByVersion
        type: "Map<String,Integer>"
      - name: unmatchedDeclaredIds
        type: List<String>
      _change: add
    - name: JudgeExamOutcome
      type: enum
      fields:
      - name: FAILS
        description: Tiene al menos un hallazgo que cuenta como error de las reglas
          del juez.
      - name: MARKED
        description: Sólo hallazgos que ordenan (p. ej. «los jueces no coinciden»).
      - name: PASSES
      - name: NOT_JUDGED
      _change: add
    - name: JudgeExamVerdict
      type: record
      fields:
      - name: caseId
        type: String
      - name: judgeName
        type: String
      - name: judgeVersion
        type: String
      - name: outcome
        type: JudgeExamOutcome
      - name: worstSeverity
        type: FindingSeverity
        description: Null si no hay hallazgo que cuente.
      - name: rules
        type: List<String>
      - name: detail
        type: String
        description: "La observación de cada hallazgo, en castellano, para revisar\
          \ a mano."
      _change: add
    interfaces:
    - name: JudgeRuntime
      stereotype: port
      sealed: false
      exposes:
      - signature: "open(String judgeName,List<Evaluator> evaluators,EvaluationRunPolicy\
          \ policy): JudgeSessions"
        throwsExceptions:
        - EmptyReevaluationSetException
        - AmbiguousReevaluationScopeException
      - signature: "plan(List<AuditNode> units,EvaluationRunPolicy policy): JudgeRequestPlan"
      - signature: "coverage(JudgeSessions opened,JudgeUnitTally tally): JudgeCoverageDiagnosis"
      - signature: "standing(String judgeName,String judgeVersion): JudgeExamStanding"
      _change: add
    - name: JudgeExamVerdictExporter
      stereotype: service
      sealed: false
      exposes:
      - signature: "export(AuditReport report,AnalyzerDescriptor card,Set<String>\
          \ caseIds,JudgeCoverageDiagnosis coverage): List<JudgeExamVerdict>"
      _change: add
    _change: add
  - name: judgingengine
    description: "Motor común de los jueces. Sus clases sólo las construye la raí\
      z de composición; los jueces reciben los puertos de judging por inyección. DefaultJudgeRuntime\
      \ es el único lugar que decide el freno del examen y los valores por omisió\
      n, así que ningún juez puede olvidarlos."
    visibility: public
    implementations:
    - name: DefaultJudgeRuntime
      requiresInject:
      - name: courseSessions
        type: EvaluationSessionFactory
        description: Sesiones sobre el libro del curso (propósito COURSE).
      - name: examSessions
        type: EvaluationSessionFactory
        description: "ExamEvaluationSessionFactory: sesiones del examen (propósito\
          \ EXAM)."
      - name: examRegistry
        type: JudgeExamRegistry
      - name: timeline
        type: EvaluationTimeline
        description: "Para el ritmo medido: el promedio entre veredictos seguidos\
          \ de los evaluadores del juez, dentro de cada corrida. La mediana subestima\
          \ las horas (15,5 s contra 20,4 s en el juez de consigna)."
      - name: config
        type: JudgeRuntimeConfig
      visibility: public
      handwrittenTests:
      - name: "should open on the course the sessions of a judge whose version never\
          \ took the exam with budget 0, whatever budget the run asked, giving «sin\
          \ examen» as reason"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R003
      - name: "should open with budget 0 and reason «reprobada» the sessions of a\
          \ version whose last exam record failed, even when the run asks 500"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R003
      - name: should open with budget 0 the sessions of a version that took the whole
          exam but whose measured result was not recorded yet
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R003
      - name: should open with the budget the run asked only the sessions of a version
          whose exam was approved
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R003
      - name: "should open no consulting session for a judge one of whose evaluators\
          \ states no version, and declare it not available"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R003
      - name: "should open the sessions of a judge with budget 0 when the run asks\
          \ no budget for it, even when its version passed the exam"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R010
      - name: "should open with four consultations at a time when the run says nothing,\
          \ and with the number the run asks otherwise"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R006
      - name: "should compose the version of a judge from the version of each of its\
          \ evaluators, in order, joined by «+», as for the two judges of translation-sense"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R001
      - name: "should open the sessions of an EXAM run on the exam ledger and never\
          \ on the course's, without the exam brake"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R002
      - name: "should open a run on a candidate course with the course purpose, the\
          \ same judge version and the course ledger, so the candidate's verdict is\
          \ reused once it enters the course"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R005
      - name: "should reject, for any judge, a declared empty set and a set declared\
          \ together with a course area before opening any session"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R005
      - name: "should ask for a new verdict exactly on the units of a declared set\
          \ and only reuse on every other unit, for any judge"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R005
      - name: should declare as unmatched every id of the declared set that no unit
          of the course corresponds to
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R005
      - name: should take a topic into a declared set of mini-theory when its id or
          the id of one of its exercises is declared
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R005
      - name: "should ask in an EXAM run only the units of the exam file, and neither\
          \ ask nor count any other unit of the photo"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R001
      - name: "should declare 352 pending quizzes as 352 consultations, 2 hours one\
          \ at a time at a measured 176 per hour and half an hour with four at a time,\
          \ without consulting"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R004
      - name: "should count two consultations for each quiz pending for translation-sense,\
          \ one per judge"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R004
      - name: "should measure the rate as the mean interval between consecutive verdicts\
          \ of a run, cutting at pauses longer than 10 minutes, so verdicts 20 seconds\
          \ apart around a 3-hour pause give 180 per hour"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R004
      - name: "should fall back to the configured rate, 189 per hour or 60 for mini-theory,\
          \ and say the rate is not measured, when the judge has no recorded history"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R004
      - name: "should declare next to the judge's numbers the exam of the version\
          \ it consulted and of every version that contributed verdicts, as approved,\
          \ failed or without exam"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R001
      - name: should carry into the judge's coverage the cause and the remedy of the
          first service failure of any of its sessions
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      - name: "should take the last exam record of a version as its standing, so an\
          \ approval recorded after a failure lets it consult"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R001
      implements:
      - JudgeRuntime
      _change: add
    - name: DefaultJudgeExamVerdictExporter
      visibility: public
      handwrittenTests:
      - name: "should export FAILS for an exam exercise with a finding of a paid-model\
          \ rule of the judge that counts as error, with its worst severity, its rules\
          \ and its observation"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R001
      - name: "should export MARKED for an exam exercise whose only findings of the\
          \ judge rank only, as judges-disagree"
        traceability:
          feature: FEAT-JEXAM
