    visibility: public
    implements:
    - JudgeExamRegistry
    _change: add
  _change: modify
- name: audit-application
  models:
  - name: JudgeExamRequest
    type: record
    fields:
    - name: judgeName
      type: String
      description: Nombre canónico del analizador que aloja al juez.
    - name: photoCourse
      type: Path
      description: "La foto congelada del curso del 29/9, no el curso vivo (F-JEXAM-R001)."
    - name: caseIds
      type: Set<String>
      description: Los ejercicios del archivo del examen; nunca lo esperado.
    - name: maxNewEvaluations
      type: int
      description: "0 = ensayo: reusa lo de esa versión y dice cuántas consultas faltan,\
        \ sin pagar (F-JEXAM-R010)."
    - name: maxConcurrentEvaluations
      type: Integer
    _change: add
  - name: JudgeExamTaken
    type: record
    fields:
    - name: judgeName
      type: String
    - name: judgeVersion
      type: String
    - name: verdicts
      type: List<JudgeExamVerdict>
    - name: coverage
      type: JudgeCoverageDiagnosis
    - name: recordedAsTaken
      type: boolean
      description: True si todos los ejercicios tienen veredicto y quedó el registro
        TAKEN que habilita registrar la medición.
    _change: add
  - name: JudgeExamNotTakenException
    type: exception
    fields:
