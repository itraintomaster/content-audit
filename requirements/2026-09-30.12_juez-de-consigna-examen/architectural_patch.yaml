      traceability:
        feature: FEAT-JEXAM
        rule: F-JEXAM-R002
    - name: should let a version that already took the exam take it again without
        a single consultation
      traceability:
        feature: FEAT-JEXAM
        rule: F-JEXAM-R002
    - name: "should rehearse the exam with budget 0 without consulting, reusing what\
