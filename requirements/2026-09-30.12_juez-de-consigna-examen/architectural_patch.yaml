- name: quiz-instruction-infrastructure
  description: "Adaptadores de los jueces con modelo. Nació con el del juez de consigna\
    \ (instructionjudge: agente quiz-instruction-validator, cinco entradas verbatim,\
    \ veredicto conservador como OUTPUT_UNUSABLE, fallas de servicio como EVALUATOR_UNAVAILABLE,\
    \ versión derivada de la definición, el modelo y el proveedor) y desde FEAT-JEXAM\
    \ aloja también el evaluador genérico por agente de los jueces nuevos (agentjudge)\
    \ y los lectores de sus veredictos, un paquete por juez. Todos comparten la verificació\
    n sin costo de la sesión del proveedor (F-JEXAM-R011). allowedClients=[audit-cli]:\
    \ es un detalle de la raíz de composición."
  models:
  - name: AgentJudgeSpec
    type: record
    fields:
    - name: evaluatorId
      type: String
      description: "Nombre del agente bajo .sentinel/agents/ y del evaluador en el\
        \ libro: dice qué pregunta se hizo (F-EVCOST-R001)."
    - name: verdictArtifactKey
      type: String
      description: Artifact que emite el agente con el veredicto JSON.
    - name: displayName
      type: String
      description: Cómo se lo nombra en los mensajes al operador.
    _change: add
  - name: AgentJudgeConfig
    type: record
    fields:
    - name: providerName
      type: String
      description: "claude-cli por omisión (José, 30/9)."
    - name: baseUrl
      type: String
    - name: apiKey
      type: String
    - name: modelName
      type: String
    - name: temperature
      type: Double
    - name: timeoutSeconds
      type: Integer
    _change: add
  - name: JudgeUnavailabilityCause
    type: enum
    fields:
    - name: SESSION_EXPIRED
      description: "El proveedor de sesión local no tiene sesión o venció: se renueva\
        \ con su herramienta (claude auth login)."
    - name: QUOTA_EXHAUSTED
    - name: SERVICE_UNREACHABLE
    - name: TIMEOUT
    - name: NOT_INSTALLED
    - name: UNKNOWN
    _change: add
  - name: JudgeProviderReadiness
    type: record
    fields:
    - name: ready
      type: boolean
    - name: cause
      type: JudgeUnavailabilityCause
    - name: detail
      type: String
    - name: remedy
      type: String
      description: "Cómo se resuelve, en castellano, listo para el informe."
    _change: add
  interfaces:
  - name: AgentJudgeFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "create(AgentJudgeSpec spec,AgentJudgeConfig config,AgentGraphRunner\
        \ agentGraphRunner,AgentDefinitionLocator agentDefinitionLocator): Evaluator"
    _change: add
  - name: JudgeProviderReadinessProbe
    stereotype: port
    sealed: false
    exposes:
    - signature: "probe(LlmProviderResolved provider): JudgeProviderReadiness"
    - signature: "explain(LlmProviderResolved provider,String failure): JudgeProviderReadiness"
    _change: add
  patterns:
  - type: Factory
    implementations:
    - DefaultQuizInstructionJudgeFactory
    suppressed: false
    interface: QuizInstructionJudgeFactory
  - type: Factory
    implementations:
    - DefaultAgentJudgeFactory
    suppressed: false
    interface: AgentJudgeFactory
  packages:
  - name: agentjudge
    description: "Evaluador genérico de los jueces nuevos: corre el agente de su AgentJudgeSpec\
      \ con el mapa de contenido verbatim como entradas, lee el artifact del veredicto\
      \ y lo devuelve como EvaluationEmitted; un veredicto conservador ({\"outputUnusable\"\
      : true}) es OUTPUT_UNUSABLE y toda falla de servicio EVALUATOR_UNAVAILABLE,\
      \ con la causa y el remedio que da la verificación del proveedor. Antes de su\
      \ primera consulta verifica sin costo la sesión del proveedor, una sola vez\
      \ por instancia aunque haya varias consultas a la vez. La versión es el mismo\
      \ digest que la del juez de consigna: definición del agente, modelo y proveedor\
      \ efectivo. Sólo la factory y la verificación son públicas."
    visibility: public
    interfaces:
    - name: AgentJudgeVersionResolver
      sealed: false
      exposes:
      - signature: "resolve(AgentJudgeSpec spec,AgentJudgeConfig config,LlmProviderResolved\
          \ provider): Optional<String>"
      visibility: internal
      _change: add
    - name: AgentJudgeChatModelFactory
      sealed: false
      exposes:
      - signature: "create(AgentJudgeConfig config,LlmProviderResolved provider):\
          \ ChatModel"
      visibility: internal
      _change: add
    implementations:
    - name: DefaultAgentJudgeFactory
      requiresInject:
      - name: llmProviderResolver
        type: LlmProviderResolver
        description: El mismo criterio de validez de configuración que el juez de
          consigna (F-QINST-R016).
      - name: readinessProbe
        type: JudgeProviderReadinessProbe
      visibility: public
      handwrittenTests:
      - name: should create for claude-cli an evaluator that answers unavailable without
          running its agent when `claude auth status` says the session expired
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      implements:
      - AgentJudgeFactory
      _change: add
    - name: AgentJudge
      requiresInject:
      - name: spec
        type: AgentJudgeSpec
      - name: config
        type: AgentJudgeConfig
      - name: agentGraphRunner
        type: AgentGraphRunner
      - name: versionResolver
        type: AgentJudgeVersionResolver
      - name: chatModelFactory
        type: AgentJudgeChatModelFactory
      - name: provider
        type: LlmProviderResolved
      - name: readinessProbe
        type: JudgeProviderReadinessProbe
      handwrittenTests:
      - name: "should check its provider session once, before its first consultation,\
          \ even with four consultations at a time"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      - name: "should answer EVALUATOR_UNAVAILABLE with the cause and the remedy,\
          \ without running its agent, when its provider session expired"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      - name: should answer EVALUATOR_UNAVAILABLE with the explained cause when its
          first consultation comes back for lack of session or of quota
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      implements:
      - Evaluator
      _change: add
    - name: DefaultAgentJudgeVersionResolver
      requiresInject:
      - name: agentDefinitionLocator
        type: AgentDefinitionLocator
      handwrittenTests:
      - name: "should derive a new version when the agent definition, the model or\
          \ the provider of a judge changes, and the same version otherwise, so a\
          \ changed judge takes the exam again"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R001
      - name: should derive no version when the agent definition of the judge cannot
          be located
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R003
      implements:
      - AgentJudgeVersionResolver
      _change: add
    - name: SentinelAgentsAgentJudgeChatModelFactory
      implements:
      - AgentJudgeChatModelFactory
      _change: add
    - name: DefaultJudgeProviderReadinessProbe
      visibility: public
      handwrittenTests:
      - name: should report SESSION_EXPIRED with the remedy «renovala con claude auth
          login» when a recorded `claude auth status` says nobody is logged in to
          claude-cli
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      - name: "should report claude-cli ready when a recorded `claude auth status`\
          \ says a session is logged in, without consulting any model"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      - name: "should report a remote service provider ready without running any check,\
          \ since it cannot know without consulting"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      - name: "should explain a first failure about an exhausted usage limit as QUOTA_EXHAUSTED\
          \ and one about an expired login as SESSION_EXPIRED, each with its remedy"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      - name: "should explain a refused connection or an unreachable host as SERVICE_UNREACHABLE,\
          \ with its remedy"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      implements:
      - JudgeProviderReadinessProbe
      _change: add
    _change: add
  - name: instructionjudge
    visibility: public
    implementations:
    - name: DefaultQuizInstructionJudgeFactory
      requiresInject:
      - name: readinessProbe
        type: JudgeProviderReadinessProbe
        description: La misma verificación sin costo que los jueces nuevos (F-JEXAM-R011).
          No cambia la versión ni la huella.
      handwrittenTests:
      - name: "should give the consigna judge the same session check, so an expired\
          \ claude-cli session leaves it unavailable with «renovala con claude auth\
          \ login» before any consultation"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      - name: "should derive for the consigna judge the same version it derived before\
          \ FEAT-JEXAM, so its recorded verdicts keep being reused"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R007
      _change: modify
    - name: QuizInstructionAgentJudge
      requiresInject:
      - name: readinessProbe
        type: JudgeProviderReadinessProbe
      handwrittenTests:
      - name: "should answer unavailable with the cause and the remedy, without running\
          \ its agent, when the provider session expired"
        traceability:
          feature: FEAT-JEXAM
          rule: F-JEXAM-R011
      _change: modify
    _change: modify
  _change: modify
- name: audit-infrastructure
