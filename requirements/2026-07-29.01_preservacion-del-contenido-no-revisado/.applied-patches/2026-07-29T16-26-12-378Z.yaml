code: FEAT-RPRES
description: "FEAT-RPRES: preservacion del contenido no revisado al aplicar una revision.\
  \ (1) course-domain: QuizSentenceConverter gana parseOnto(quizSentence, base) para\
  \ que el form revisado herede por defecto todo lo que el DSL no codifica. (2) revision-domain:\
  \ nuevo package publico 'preservation' (CorrectionScope declara por tipo de correccion\
  \ que puede cambiar, con granularidad de leaf y discriminador por clase de elemento\
  \ de lista; PreservationCheck verifica por complemento; PreservationRepair repone\
  \ el pasivo desde los artifacts) + motor interno 'preservationengine' + PreservationFactory;\
  \ CourseElementLocator gana alignQuizTitles para la propagacion declarada de R004;\
  \ ProposalDecisionOutcomeKind gana PRESERVATION_VIOLATED y DefaultProposalDecisionService\
  \ inyecta el check. (3) audit-cli: comando 'repair' para R005. (4) alta de FEAT-RPRES\
  \ con sus 3 journeys."
modules:
- name: revision-domain
  models:
  - name: ProposalDecisionOutcomeKind
    type: enum
    fields:
    - name: PRESERVATION_VIOLATED
      description: "La revision aprobada habria cambiado atributos fuera del alcance\
        \ declarado de su tipo de correccion (F-RPRES-R001/R002/R003). Ni el artifact\
        \ pasa a APPROVED ni el curso se escribe: el apply aborta antes de persistir."
      _change: add
    _change: modify
  interfaces:
  - name: CourseElementLocator
    sealed: false
    exposes:
    - signature: "alignQuizTitles(CourseEntity course, String knowledgeId): CourseEntity"
      _change: add
    _change: modify
  - name: PreservationFactory
    stereotype: factory
    sealed: false
    exposes:
    - signature: "createCheck(): PreservationCheck"
    - signature: "createRepair(RevisionArtifactStore artifactStore): PreservationRepair"
    visibility: public
    _change: add
  patterns:
  - type: Strategy
    implementations:
    - LemmaAbsenceMvpStrategy
    suppressed: false
    interface: LemmaAbsenceProposalStrategy
  - type: Factory
    implementations:
    - DefaultPreservationFactory
    suppressed: false
    interface: PreservationFactory
  packages:
  - name: preservationengine
    description: "Motor interno de la garantia de preservacion. Aloja la tabla de\
      \ alcances por tipo de correccion (DefaultCorrectionScope), el comparador por\
      \ complemento que recorre el elemento revisado y verifica el radio de impacto\
      \ sobre el resto del curso (DefaultPreservationCheck) y el reparador que reconstruye\
      \ desde los artifacts (DefaultPreservationRepair), todos package-private. Solo\
      \ DefaultPreservationFactory es publica: es la unica costura por la que el composition\
      \ root y el resto de revision-domain arman las dos capacidades. Empaquetado\
      \ aparte de 'preservation' por la misma razon que fielddiff lo esta de consolidatedview:\
      \ el contrato es estable y el motor no."
    visibility: internal
    implementations:
    - name: DefaultCorrectionScope
      handwrittenTests:
      - name: "should declare nothing changeable for a diagnosis kind with no declared\
          \ scope, so every attribute stays preserved by default"
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R001
      - name: "should declare a knowledge label correction as changing the label,\
          \ the instructions and the title of its quizzes"
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R004
      implements:
      - CorrectionScope
      _change: add
    - name: DefaultPreservationCheck
      requiresInject:
      - name: scope
        type: CorrectionScope
        description: Declaracion de alcance contra la que se contrasta el diff observado.
      handwrittenTests:
      - name: should report no violation when the revised quiz differs from the original
          only in the attributes the correction declares changeable
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R001
      - name: should report a violation when the revised quiz loses the form kind
          that the correction does not propose to change
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R001
      - name: should report a violation when an attribute that was present and empty
          becomes absent
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R002
      - name: should report a violation when an attribute holding its own value is
          replaced by the default value of its type
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R002
      - name: should report a violation when an attribute absent in the original is
          materialized with a default value
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R002
      - name: should report a violation when a quiz correction replaces the quiz title
          with the corrected sentence
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R004
      - name: should report no violation for the quizzes whose title was aligned to
          the corrected label of their knowledge
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R004
      - name: should report a violation when a quiz other than the revised one changed
          its content
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R003
      - name: "should report a violation when the course gains, loses or reorders\
          \ elements around the revised one"
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R003
      implements:
      - PreservationCheck
      _change: add
    - name: DefaultPreservationRepair
      requiresInject:
      - name: artifactStore
        type: RevisionArtifactStore
        description: "Fuente de las contrapartes integras: el elementBefore de los\
          \ artifacts APPROVED. Se toma el artifact mas antiguo por nodeId, porque\
          \ el de una segunda revision ya trae el elemento degradado."
      - name: scope
        type: CorrectionScope
        description: "Delimita que atributos repone la reparacion: exactamente los\
          \ que quedan fuera del alcance de la correccion que el artifact aplico,\
          \ de modo que reparar nunca revierte la correccion."
      handwrittenTests:
      - name: should restore the degraded attributes of a quiz from the intact counterpart
          recorded before the revision that degraded it
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R005
      - name: "should repair a quiz revised twice, whose most recent record already\
          \ carries the degradation"
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R005
      - name: should keep the correction that the revision had applied when restoring
          the lost attributes
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R005
      - name: should leave every element that was never degraded exactly as it was
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R005
      - name: should report the degraded elements found in a full walk of the course
          without modifying it when only inspecting
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R005
      - name: should report as unrepairable a degraded element with no intact counterpart
          instead of filling it with the default value of its type
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R002
      implements:
      - PreservationRepair
      _change: add
    - name: DefaultPreservationFactory
      visibility: public
      implements:
      - PreservationFactory
      _change: add
    _change: add
  - name: engine
    implementations:
    - name: DefaultProposalDecisionService
      requiresInject:
      - name: artifactStore
        type: RevisionArtifactStore
      - name: courseRepository
        type: CourseRepository
      - name: elementLocator
        type: CourseElementLocator
      - name: refinementPlanStore
        type: RefinementPlanStore
        description: Needed to clear the task back to PENDING on reject (R014) and
          close it as DONE on approve
      - name: preservationCheck
        type: PreservationCheck
        description: "Guarda de F-RPRES-R001/R002/R003. Se consulta con el curso antes\
          \ y despues de elementLocator.replace y antes de escribir: si devuelve violaciones,\
          \ approve retorna PRESERVATION_VIOLATED sin tocar el artifact ni el curso."
      types:
      - Component
      handwrittenTests:
      - name: should abort the approval leaving the proposal undecided and the course
          unwritten when the preservation check reports violations
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R001
      - name: should align the title of every quiz of the knowledge when approving
          a correction of its label
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R004
      - name: should leave the title of the knowledge quizzes untouched when approving
          a correction of one of those quizzes
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R004
      - name: should keep the quizzes revised after the proposal was recorded when
          approving a correction of the knowledge label
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R003
      _change: modify
    - name: DefaultCourseElementLocator
      handwrittenTests:
      - name: should set the title of every quiz of the knowledge to the corrected
          label
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R004
      - name: should leave every attribute other than the title of those quizzes unchanged
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R004
      - name: should leave the quizzes of every other knowledge of the course untouched
          when aligning titles
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R003
    _change: modify
  - name: preservation
    description: "Contrato publico de la garantia de preservacion (FEAT-RPRES). Aloja\
      \ la declaracion de alcance por tipo de correccion (CorrectionScope: la respuesta\
      \ a DOUBT-ALCANCE-DECLARADO), el verificador por complemento que corre antes\
      \ de persistir un apply (PreservationCheck), el reparador retroactivo del contenido\
      \ ya degradado (PreservationRepair) y sus carriers (ScopedField, PreservationViolation,\
      \ AttributeState, RepairReport). Solo puertos y carriers: el motor vive en el\
      \ package hermano interno 'preservationengine'. Es publico porque el comando\
      \ repair del CLI consume PreservationRepair; el resto de los consumidores estan\
      \ dentro de revision-domain."
    visibility: public
    models:
    - name: AttributeState
      type: enum
      fields:
      - name: VALUE_PRESENT
        description: El atributo esta presente y tiene un valor propio distinto del
          vacio.
      - name: EMPTY_PRESENT
        description: "El atributo esta presente y su valor es legitimamente vacio\
          \ (cadena vacia, lista vacia). Es una decision de contenido, no una perdida."
      - name: ABSENT
        description: "El atributo no esta: null, o el valor por defecto del tipo primitivo\
          \ alli donde el contenido tenia un valor propio."
      _change: add
    - name: ScopedField
      type: record
      fields:
      - name: path
        type: String
        description: "Ruta al leaf dentro del elemento. '[]' marca el paso por una\
          \ lista. Una ruta que termina en '[]' denota la estructura de la lista (longitud,\
          \ orden y la clase declarada de cada elemento), no sus leaves: p.ej. 'form.sentenceParts[]'\
          \ autoriza reordenar/agregar/quitar partes pero no cambiar ningun atributo\
          \ de una parte. Ejemplos de leaf: 'translation', 'form.incidence', 'quizTemplates[].title',\
          \ 'form.sentenceParts[].text'."
      - name: elementKind
        type: String
        description: "Nombre de la constante de clase que selecciona los elementos\
          \ de la lista a los que aplica la entrada; null significa 'todos los elementos'.\
          \ Es el unico refinamiento admitido sobre la ruta, y solo puede nombrar\
          \ una clase que el dominio ya declara como enum (p.ej. SentencePartKind.TEXT).\
          \ Existe porque la correccion lexica cambia el texto de las partes TEXT\
          \ pero no el de las partes CLOZE, y sin el discriminador ambas quedan bajo\
          \ la misma ruta 'form.sentenceParts[].text'."
      _change: add
    - name: PreservationViolation
      type: record
      fields:
      - name: elementId
        type: String
        description: Id del elemento del curso (quiz o knowledge) donde se observo
          la diferencia.
      - name: path
        type: String
        description: "Ruta concreta e instanciada donde se observo la diferencia (p.ej.\
          \ 'form.sentenceParts[2].text'), no el patron declarado en ScopedField.\
          \ Se resuelve contra el alcance expandiendo cada ScopedField sobre el elemento\
          \ real."
      - name: beforeState
        type: AttributeState
        description: Estado del atributo en el elemento original.
      - name: afterState
        type: AttributeState
        description: Estado del atributo en el elemento resultante.
      - name: beforeValue
        type: String
        description: "Representacion textual del valor original, para el mensaje de\
          \ error de R001/R002."
      - name: afterValue
        type: String
        description: Representacion textual del valor resultante.
      _change: add
    - name: RepairReport
      type: record
      fields:
      - name: course
        type: CourseEntity
        description: Curso resultante. En modo inspeccion es el mismo objeto de entrada.
      - name: elementsInspected
        type: int
        description: Cantidad de elementos del curso examinados.
      - name: elementsRepaired
        type: int
        description: Cantidad de elementos con al menos un atributo repuesto.
      - name: restored
        type: List<PreservationViolation>
        description: "Detalle atributo por atributo de lo repuesto (o de lo que se\
          \ repondria, en modo inspeccion)."
      - name: unrepairable
        type: List<String>
        description: "Ids de elementos degradados sin contraparte integra disponible\
          \ en los artifacts de revision. Se informan, nunca se inventa un valor por\
          \ defecto (F-RPRES-R002)."
      _change: add
    interfaces:
    - name: CorrectionScope
      stereotype: port
      sealed: false
      exposes:
      - signature: "changeableFields(DiagnosisKind kind, AuditTarget target): Set<ScopedField>"
      visibility: public
      _change: add
    - name: PreservationCheck
      stereotype: port
      sealed: false
      exposes:
      - signature: "verify(CourseEntity courseBefore, CourseEntity courseAfter, CourseElementSnapshot\
          \ revised, DiagnosisKind kind): List<PreservationViolation>"
      visibility: public
      _change: add
    - name: PreservationRepair
      stereotype: port
      sealed: false
      exposes:
      - signature: "inspect(CourseEntity course): RepairReport"
      - signature: "repair(CourseEntity course): RepairReport"
      visibility: public
      _change: add
    _change: add
  _change: modify
- name: audit-cli
  interfaces:
  - name: RepairCommand
    stereotype: port
    sealed: true
    exposes:
    - signature: "repair(String resource, String coursePath, boolean dryRun): Integer"
    visibility: public
    _change: add
  packages:
  - name: commands
    implementations:
    - name: RepairCmd
      requiresInject:
      - name: preservationRepair
        type: PreservationRepair
        description: Puerto de reparacion de revision-domain.
      - name: courseRepository
        type: CourseRepository
        description: Carga el curso y persiste el resultado reparado; en dry-run solo
          carga.
      types:
      - Component
      handwrittenTests:
      - name: should leave no element with degraded attributes in the course reloaded
          from the data source after repairing it
        traceability:
          feature: FEAT-RPRES
          rule: F-RPRES-R005
      externalImplements:
      - java.util.concurrent.Callable<Integer>
      implements:
      - RepairCommand
      _change: add
    _change: modify
  _change: modify
- name: course-domain
  packages:
  - name: quizsentence
    interfaces:
    - name: QuizSentenceConverter
      stereotype: service
      sealed: false
      exposes:
      - signature: "parseOnto(String quizSentence, FormEntity base): FormEntity"
        _change: add
      visibility: public
      _change: modify
    _change: modify
  _change: modify
features:
- id: FEAT-RPRES
  code: F-RPRES
  journeys:
  - id: F-RPRES-J001
    validation: AUTO_VALIDATED
    testModule: audit-cli
    testPackage: com.learney.contentaudit.journeys
  - id: F-RPRES-J002
    validation: AUTO_VALIDATED
    testModule: audit-cli
    testPackage: com.learney.contentaudit.journeys
  - id: F-RPRES-J003
    validation: VALIDATED
    testModule: audit-cli
    testPackage: com.learney.contentaudit.journeys
