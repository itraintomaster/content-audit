code: FEAT-UNICA
description: "FEAT-UNICA: el analizador single-answer. Un juez lee cada ejercicio\
  \ para escribir como lo ve el alumno antes de contestar —nombre del tema, consigna\
  \ del ejercicio, enunciado con pista y respuestas aceptadas— y lista las respuestas\
  \ que también valdrían. Lo que el corrector ya acepta (contraída o larga, grafí\
  as de la lista cerrada, until o till) se descarta con CorrectorMatcher, la comparació\
  n del corrector del paquete A, aunque el juez lo liste; una opción que ofrece la\
  \ consigna da un hallazgo que sólo ordena y se deriva a respuestas completas; una\
  \ distinta y válida es error, con su gravedad. Usa el runtime común de FEAT-JEXAM\
  \ y el evaluador genérico por agente. La opción múltiple no entra: la juzga el juez\
  \ de FEAT-MCVALE. El proveedor se declara como clase con las cinco firmas de AnalyzerProvider\
  \ (0.3); el integrador lo pasa a implements AnalyzerProvider.; qa-tester: traza\
  \ las 7 reglas de FEAT-UNICA a handwrittenTests nuevas, con juez falso o grabado\
  \ y sin modelo pago; la forma contraída y la larga («isn't» e «is not»), el criterio\
  \ de F-JEXAM-R012, se prueba bajo F-UNICA-R002. F-UNICA-J001 va a audit-domain,\
  \ paquete singleanswerengine."
modules:
- name: audit-domain
  interfaces:
  - name: SingleAnswerConfig
    stereotype: port
    sealed: false
    exposes:
    - signature: "getScoreFor(FindingSeverity severity): double"
    _change: add
    extends:
    - SelfDescribingConfig
  packages:
  - name: singleanswer
    description: "Contrato de single-answer (FEAT-UNICA): las respuestas que el juez\
      \ lista con su clase y el diagnóstico del ejercicio, que separa lo que cuenta\
      \ de lo que se descartó porque el corrector ya lo acepta."
    visibility: public
    models:
    - name: AlternativeAnswerKind
      type: enum
      fields:
      - name: OFFERED_BY_INSTRUCTION
        description: "La consigna o la pista la nombran y el corrector no la acepta:\
          \ sólo ordena y la arregla una regla de respuestas completas (F-UNICA-R003)."
      - name: DIFFERENT_VALID
        description: "Cualquier otra respuesta correcta que el corrector rechaza:\
          \ error, a la mesa (F-UNICA-R004)."
      _change: add
    - name: AlternativeAnswer
      type: record
      fields:
      - name: answer
        type: String
        description: Lo que escribiría el alumno en el hueco.
      - name: gap
        type: int
        description: "Qué hueco, desde 1, en el orden del enunciado."
      - name: kind
        type: AlternativeAnswerKind
      - name: severity
        type: FindingSeverity
        description: BLOCKING si no se puede saber cuál acepta; HIGH si rechaza otra
          igual de buena; MEDIUM si rechaza otra correcta menos esperable.
      - name: reason
        type: String
      _change: add
    - name: SingleAnswerVerdict
      type: record
      fields:
      - name: alternatives
        type: List<AlternativeAnswer>
      - name: rationale
        type: String
      _change: add
    - name: SingleAnswerDiagnosis
      type: record
      fields:
      - name: verdict
        type: SingleAnswerVerdict
        description: El veredicto tal como lo emitió el juez.
      - name: counted
        type: List<AlternativeAnswer>
        description: "Las que quedan después de descartar lo que el corrector acepta:\
          \ son las que dan hallazgo."
      - name: droppedAsAccepted
        type: List<String>
        description: "Las que el juez listó y el corrector acepta (F-JEXAM-R012):\
          \ se ven, no cuentan."
      - name: score
        type: double
        description: "1 sin errores; si no, 0,6, 0,3 o 0 según la gravedad más alta."
      - name: reusedFromPreviousRun
        type: boolean
      _change: add
    interfaces:
    - name: SingleAnswerVerdictReader
      stereotype: port
      sealed: false
      exposes:
      - signature: "read(String payload): SingleAnswerVerdict"
      _change: add
    _change: add
  - name: singleanswerengine
    description: "Motor de single-answer. Sólo el proveedor es público. Pide sólo\
      \ ejercicios para escribir (sin opciones de opción múltiple): onQuiz los junta\
      \ y onCourseComplete los resuelve con resolveAll y el tope del runtime. El clasificador\
      \ descarta con CorrectorMatcher (paquete A) lo que el corrector ya acepta antes\
      \ de contar, así que la regla de las formas no depende de que el juez la cumpla."
    visibility: public
    models:
    - name: SingleAnswerOutcome
      type: record
      fields:
      - name: diagnosis
        type: SingleAnswerDiagnosis
      - name: findings
        type: List<FindingDraft>
        description: "Uno por respuesta que cuenta, con la respuesta como marca: different-valid-answer\
          \ (mesa) u offered-alternative (sólo ordena)."
      - name: score
        type: double
      visibility: internal
      _change: add
    interfaces:
    - name: SingleAnswerSubjectBuilder
      sealed: false
      exposes:
      - signature: "build(AuditNode quizNode): EvaluationSubject"
      visibility: internal
      _change: add
    - name: SingleAnswerClassifier
      sealed: false
      exposes:
      - signature: "classify(SingleAnswerVerdict verdict,AuditableQuiz quiz,boolean\
          \ reused): SingleAnswerOutcome"
      visibility: internal
      _change: add
    implementations:
    - name: SingleAnswerAnalyzerProvider
      requiresInject:
      - name: runtime
        type: JudgeRuntime
      - name: judge
        type: Evaluator
        description: Agente single-answer-judge.
      - name: verdictReader
        type: SingleAnswerVerdictReader
      - name: config
        type: SingleAnswerConfig
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
      - name: correctorMatcher
        type: CorrectorMatcher
        description: "El imitador del corrector del paquete A: una sola tabla de equivalencias\
          \ (José, 30/9). Es el CorrectorMatcher del paquete A (FEAT-RESPC)."
      visibility: public
      handwrittenTests:
      - name: "should publish the name single-answer and open its judge through the\
          \ judges runtime under that name, so a version without an approved exam\
          \ gets budget 0"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R005
      - name: "should publish a card with family errors, paid model cost, the quiz\
          \ as evaluated level and the rules different-valid-answer and offered-alternative"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R002
      - name: "should declare in its card the panel for different-valid-answer and\
          \ rank only for offered-alternative, which the answer-completeness rule\
          \ fixes"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R007
      - name: should bind its scores below 1 to the plan as SINGLE_ANSWER tasks on
          quizzes
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R004
      stereotype: class
      exposes:
      - signature: "analyzerName(): String"
      - signature: "describe(): AnalyzerDescriptor"
      - signature: "create(EvaluationRunPolicy policy): ContentAnalyzer"
      - signature: "planBinding(): Optional<AnalyzerPlanBinding>"
      - signature: "config(): Optional<SelfDescribingConfig>"
      _change: add
    - name: SingleAnswerAnalyzer
      requiresInject:
      - name: opened
        type: JudgeSessions
      - name: runtime
        type: JudgeRuntime
      - name: subjectBuilder
        type: SingleAnswerSubjectBuilder
      - name: classifier
        type: SingleAnswerClassifier
      - name: verdictReader
        type: SingleAnswerVerdictReader
      handwrittenTests:
      - name: should neither ask the judge about a multiple choice quiz nor count
          it as reached
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R001
      - name: should reuse the recorded verdict of a quiz without consulting and without
          spending budget
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R005
      - name: "should consult no more quizzes than its budget and leave the rest unevaluated,\
          \ without score and without finding"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R005
      - name: "should finish the run and record nothing when the judge's service fails\
          \ or its output is unusable, leaving those quizzes unevaluated"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R005
      - name: "should declare the CLOZE quizzes reached, evaluated and unevaluated\
          \ in its coverage"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R005
      - name: "should consult the judge on no quiz when the run asks no budget for\
          \ single-answer, and declare what the pending quizzes cost"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R005
      - name: should judge in an EXAM run only the CLOZE exercises of the file and
          leave a multiple choice one of the file without verdict
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R006
      - name: "should judge a candidate of a marked quiz with the same judge and version,\
          \ and reuse its verdict once the candidate enters the course"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R007
      implements:
      - ContentAnalyzer
      _change: add
    - name: DefaultSingleAnswerSubjectBuilder
      requiresInject:
      - name: studentViewRenderer
        type: QuizStudentViewRenderer
        description: "Las claves y su orden son la huella: title (el nombre que muestra\
          \ la app), instructions (la del ejercicio), exercise, acceptedAnswers."
      handwrittenTests:
      - name: "should build for «He was in Italy ___ .» the content title, instructions,\
          \ exercise with its hint and acceptedAnswers per gap, in that order and\
          \ nothing else"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R001
      - name: "should take the title and the instructions the app shows above the\
          \ quiz, those of the quiz copy"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R001
      - name: "should build the same content for a quiz whose translation, mini-theory\
          \ or audio changed"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R001
      implements:
      - SingleAnswerSubjectBuilder
      _change: add
    - name: DefaultSingleAnswerClassifier
      requiresInject:
      - name: correctorMatcher
        type: CorrectorMatcher
      - name: config
        type: SingleAnswerConfig
      handwrittenTests:
      - name: "should drop «is not» listed by the judge for a quiz that accepts «\
          isn't», leaving it without single-answer finding"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R002
      - name: "should drop «traveled» listed for a quiz that accepts «travelled» and\
          \ «till» for one that accepts «until», since the corrector accepts them"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R002
      - name: "should keep in the diagnosis the answers dropped because the corrector\
          \ accepts them, visible and not counted"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R002
      - name: "should pass a quiz whose judge lists no other answer, with score 1\
          \ and no finding"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R002
      - name: "should give «from Friday until Sunday» and «from Friday till Sunday»\
          , offered by the instruction of «He was in Italy ___ .», a rank-only finding\
          \ each that names the answer and answer-completeness"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R003
      - name: "should count no error of single-answer for a quiz whose only other\
          \ answers are offered by its instruction, keeping its score at 1"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R003
      - name: "should give the verduras (…1ecd) a blocking finding and score 0 when\
          \ eat, like, buy and want fit as well as «love» and no hint picks one"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R004
      - name: should give «Does he need water? He ___ .» a high finding for «doesn't»
          and score 0.3
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R004
      - name: should give «She ___ (not / come).» a medium finding for «won't come»
          and score 0.6
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R004
      - name: "should give one finding per counted answer, marked with the answer,\
          \ and score the quiz by the gravest"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R004
      - name: "should pass a candidate such as «Yes, he ___» for «Does he need water?»\
          \ when the judge lists nothing or only answers offered by its instruction"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R007
      implements:
      - SingleAnswerClassifier
      _change: add
    _change: add
  _change: modify
- name: quiz-instruction-infrastructure
  packages:
  - name: singleanswerverdict
    description: Lectura del payload del juez de una sola respuesta.
    visibility: public
    implementations:
    - name: JacksonSingleAnswerVerdictReader
      visibility: public
      handwrittenTests:
      - name: "should read each listed answer with its gap, its kind, its severity\
          \ and its reason"
        traceability:
          feature: FEAT-UNICA
          rule: F-UNICA-R002
      implements:
      - SingleAnswerVerdictReader
      _change: add
    _change: add
  _change: modify
- name: audit-application
  implementations:
  - name: DefaultSingleAnswerConfig
    types:
    - Component
    visibility: public
    handwrittenTests:
    - name: "should score a quiz 0 for a blocking, 0.3 for a high and 0.6 for a medium\
        \ worst severity"
      traceability:
        feature: FEAT-UNICA
        rule: F-UNICA-R004
    implements:
    - SingleAnswerConfig
    _change: add
  _change: modify
features:
- id: FEAT-UNICA
  code: F-UNICA
  journeys:
  - id: F-UNICA-J001
    validation: AUTO_VALIDATED
    testModule: audit-domain
    testPackage: com.learney.contentaudit.auditdomain.singleanswerengine
