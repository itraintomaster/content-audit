name: choice-quality-judge
description: |
  Calidad pedagógica de los distractores. Independiente de choice-alternative-judge:
  no reemplaza su control de ambigüedad ni comparte su examen o presupuesto.
  Juzga sólo información visible antes de contestar; conserva NEEDS_CONTEXT
  cuando no puede identificar un objetivo. Un fallo de esquema nunca se consolida.
  Todo archivo de esta carpeta menos eval/ integra la versión efectiva del
  juez: las pruebas no corren al medir y no la cambian (F-ALDIA-R001).
kind: agent
strategy: graph
initial_node: evaluate
budgets:
  max_iterations: 10
nodes:
  - ./nodes/evaluate.md
  - ./nodes/gate_verdict.md
  - ./nodes/emit.md
goal:
  required_artifacts:
    - choiceQualityVerdict
  required_nodes_done:
    - emit
dependencies:
  - level
  - topic
  - title
  - instructions
  - exercise
  - options
