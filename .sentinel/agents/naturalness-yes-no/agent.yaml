name: naturalness-yes-no
description: |
  La alternativa de naturalness sin Ollama (FEAT-NATUR R008, FEAT-MLOCAL R007).
  Recibe la misma pregunta que llama3:8b en Ollama —el mensaje de sistema y la
  pregunta de NaturalnessConfig, ya escritos con la oración terminada del
  ejercicio— y contesta con una sola palabra: si un nativo diría así esa
  oración. Un «no» marca el ejercicio, que sólo ordena: nunca cuenta como
  error ni es tarea (F-NATUR-R003).

  Flujo:

      evaluate (llm_call: sí o no)
        ──▶ gate_verdict (gate: esquema cerrado; failed reintenta)
        ──▶ emit (script: artifact naturalnessAnswer)

  max_attempts de evaluate acota el reintento. Si agota sus intentos sin una
  respuesta válida, emit produce {"outputUnusable": true}: el evaluador lo
  devuelve como OUTPUT_UNUSABLE y el ejercicio queda sin evaluar. Una falla
  del modelo en evaluate no tiene arista: corta la corrida del agente y el
  evaluador la informa como EVALUATOR_UNAVAILABLE.

  Todo archivo de esta carpeta, eval/ incluido, entra en la versión del juez
  (definición, modelo y proveedor). Tocar la guía, un script o una fixture es
  una versión nueva, que rinde su examen antes de consultar sobre el curso
  (F-MLOCAL-R006). La salida es determinista: el JSON canónico no depende de
  la corrida ni de la hora (gancho B-22).
kind: agent
strategy: graph
initial_node: evaluate
budgets:
  # Pase limpio: 3 visitas. Con los 3 intentos de evaluate agotados son 8; el
  # resto es margen para que un reintento nunca termine en una falla de servicio.
  max_iterations: 10
nodes:
  - ./nodes/evaluate.md
  - ./nodes/gate_verdict.md
  - ./nodes/emit.md
goal:
  required_artifacts:
    - naturalnessAnswer
  required_nodes_done:
    - emit
dependencies:
  - system
  - question
