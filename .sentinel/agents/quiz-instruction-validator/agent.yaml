name: quiz-instruction-validator
description: |
  Juez standalone para UN quiz de inglés. Recibe el ejercicio como lo ve el
  alumno —el título y la consigna que muestra la app, el enunciado con sus
  huecos y pistas, las respuestas aceptadas de cada hueco y, en la opción
  múltiple, sus opciones— con el nivel y el topic como contexto. Arma todas las
  variantes aceptadas —incluidos los fragmentos opcionales entre paréntesis— y
  decide si el quiz cumple literalmente TODAS las restricciones explícitas de
  su consigna. Antes de aprobar aplica exactamente la operación pedida al cue o
  esqueleto, sin reparar preposiciones ni léxico, y comprueba que el corrector
  acepte ese resultado. No busca otras respuestas válidas, no juzga distractores
  alternativos y no audita gramática o miniteoría ajenas al cumplimiento.

  Flujo:

      evaluate (llm_call: juicio lingüístico estructurado)
        ──▶ gate_verdict (gate: esquema estricto + invariantes; failed reintenta)
        ──▶ emit (script: artifact quizInstructionVerdict)

  El presupuesto del grafo y max_attempts acotan el retry. Si el juez agota los
  intentos sin producir JSON válido, emit genera un veredicto conservador de
  infraestructura con confidence=0, sin promover una salida malformada.
kind: agent
strategy: graph
initial_node: evaluate
budgets:
  max_iterations: 8
nodes:
  - ./nodes/evaluate.md
  - ./nodes/gate_verdict.md
  - ./nodes/emit.md
goal:
  required_artifacts:
    - quizInstructionVerdict
  required_nodes_done:
    - emit
dependencies:
  - cefrLevel
  - topic
  - title
  - instructions
  - exercise
  - acceptedAnswers
  - options
