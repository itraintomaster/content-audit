name: translation-sense-from-english
description: |
  Juez de traducción y sentido (FEAT-TRSEN), el que parte del inglés. Recibe UN
  ejercicio como lo ve el alumno —nivel, consigna, enunciado con su pista, la
  oración terminada con cada respuesta aceptada y la traducción— y dice, sin
  compararlo con ningún original, si cumple cuatro condiciones: dicen lo mismo,
  un nativo lo diría así, las palabras van juntas y el registro es del nivel
  (F-TRSEN-R002). Cada falla lleva su gravedad (alta, media o baja; nunca
  bloqueante), el fragmento y una línea en castellano (F-TRSEN-R004).

  Es uno de los dos jueces de translation-sense. El otro,
  translation-sense-from-translation, lee el mismo mapa de contenido pero parte
  de la traducción. Cada uno corre en su propio contexto y se registra como un
  evaluador aparte: ninguno ve el veredicto del otro (F-TRSEN-R003).

  Flujo:

      evaluate (llm_call: el juicio)
        ──▶ gate_verdict (gate: esquema cerrado + invariantes; failed reintenta)
        ──▶ emit (script: artifact translationSenseVerdict)

  max_attempts de evaluate acota el reintento. Si el juez agota sus intentos
  sin un veredicto válido, emit produce {"outputUnusable": true}: el evaluador
  lo devuelve como OUTPUT_UNUSABLE, nunca llega al lector ni al libro y el
  ejercicio queda sin evaluar (F-TRSEN-R005). Una falla del modelo en evaluate
  no tiene arista: corta la corrida del agente y el evaluador la informa como
  EVALUATOR_UNAVAILABLE.

  Todo archivo de esta carpeta menos eval/ entra en la versión del juez: las
  pruebas no corren al medir y no la cambian (F-ALDIA-R001). Tocar la guía, el
  formato, un script o la definición es una versión nueva, que rinde su examen
  antes de consultar sobre el curso (F-JEXAM-R003).
kind: agent
strategy: graph
initial_node: evaluate
budgets:
  # Pase limpio: 3 visitas. Con los 3 intentos de evaluate agotados son 8
  # (evaluate y gate_verdict tres veces, el desvío exhausted y emit); el resto
  # es margen para que un reintento nunca termine en una falla de servicio.
  max_iterations: 10
nodes:
  - ./nodes/evaluate.md
  - ./nodes/gate_verdict.md
  - ./nodes/emit.md
goal:
  required_artifacts:
    - translationSenseVerdict
  required_nodes_done:
    - emit
dependencies:
  - cefrLevel
  - instructions
  - exercise
  - acceptedSentences
  - translation
