name: pragmatism-judge
description: |
  Juez independiente de pragmatismo comunicativo de oraciones aceptadas.
  No juzga naturalidad, gramática, traducción, vocabulario de nivel ni opciones.
  Distingue uso plausible, escenario no licenciado, contexto incierto y material
  que no es una oración comunicativa. No cambia el curso ni se aprueba a sí mismo.
  Cada archivo de esta carpeta integra la versión efectiva del juez.
kind: agent
strategy: graph
initial_node: evaluate
budgets:
  max_iterations: 6
nodes:
  - ./nodes/evaluate.md
  - ./nodes/gate_verdict.md
  - ./nodes/emit.md
goal:
  required_artifacts:
    - pragmatismVerdict
  required_nodes_done:
    - emit
dependencies:
  - level
  - topic
  - title
  - instructions
  - exercise
  - acceptedSentences
