name: change-reviewer
description: Reads a changed exercise whole, production beside the current version, and marks it good, doubtful or worse; no course edits.
kind: agent
strategy: graph
initial_node: evaluate
budgets:
  max_iterations: 3
nodes:
  - ./nodes/evaluate.md
  - ./nodes/gate_verdict.md
  - ./nodes/emit.md
goal:
  required_artifacts:
    - changeReviewVerdict
  required_nodes_done:
    - emit
dependencies:
  - inputContract
  - quizId
  - level
  - unit
  - topic
  - topicInstructions
  - sentenceMode
  - before
  - after
