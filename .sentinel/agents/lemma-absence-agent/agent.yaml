name: lemma-absence-agent
description: |
  Ruta LLM única de lemma-absence (FEAT-LASAG) sobre el framework
  sentinel-agent. Consume el CorrectionContext de FEAT-RCLA (vía inputs) y
  emite UN único QuizCandidate {quizSentence, translation} como artifact
  `quizCandidate`. Es el backend declarativo del puerto
  LemmaAbsenceQuizCandidateGenerator: el adaptador Java
  (revision-infrastructure.lemmaabsenceagent) lanza este grafo con
  AgentRun.run, le inyecta la única tool `get_suggested_lemmas` (read-only,
  semántica F-CSLATDC) y el ChatModel, y parsea el artifact de salida.

  Flujo:

      load_context (script: carga carryForward + flag curation_cached)
        ──▶ route_curate (conditional: ¿ya se curó? cached ▶ generate;
              fresh ▶ curate_lemmas) — la curación corre una vez por run
        ──▶ curate_lemmas (react: ÚNICO nodo con la tool get_suggested_lemmas;
              cura el vocabulario específico del ejercicio con filtros dirigidos
              —partOfSpeech/regex/limit/includeExposed— y emite curation_spec.json
              [artefacto curationSpec: filtros + veto, NO la lista de lemmas])
        ──▶ gate_curation (gate: verifica vía events.jsonl que curate_lemmas REALMENTE
              llamó la tool —el framework no fuerza tool-choice—; passed ▶ finalize,
              failed ▶ vuelve a curate_lemmas; al agotar curate.max_attempts el edge
              `exhausted` de curate cae a finalize, fallback a suggestedWords)
        ──▶ finalize_curation (script: valida el pool vs requiredRegex, publica
              curatedWords, escribe el pool en curated_lemmas.json [artefacto
              curatedLemmas: los lemmas resultantes, en orden]; fallback a suggestedWords)
        ──▶ generate (react: SIN tool; construye el candidato usando el
              vocabulario curado; produce candidate.json)
        ──▶ eval_length  (script: no-regresión de longitud — bloqueante,
              determinista, eval #3)
        ──▶ eval_distinct (script: distinción vs los quizzes ya existentes del
              ejercicio — bloqueante, determinista; numeración interna legacy
              "eval #7" ANTERIOR al catálogo actual de R007, no es ninguno de
              sus 7 criterios oficiales — ver eval_lexical más abajo)
        ──▶ eval_global_distinct (script: distinción vs todo el curso —
              bloqueante, determinista; misma nota de numeración legacy)
        ──▶ eval_lexical (script: no-regresión léxica — bloqueante,
              determinista, criterio #7 REAL de R007: flags(candidato) ⊆
              flags(original) vía `content-audit lexis`, FEAT-CLEX)
        ──▶ eval_quality (llm_call: evals #1 oración con sentido, #2 quiz
              resoluble, #4 pragmatismo [score, deseable], #5 traducción
              fiel — bloqueantes salvo #4)
        ──▶ gate_verdicts (gate: valida la FORMA del verdicts.json del juez;
              malformado ▶ eval_quality re-emite; al agotar su budget, el edge
              `exhausted` de eval_quality degrada a tally sin veredictos)
        ──▶ tally        (script: combina veredictos, actualiza el champion,
              escribe carry_forward en fallo)
        ──▶ route_verdict (conditional)
              │ all_blocking_pass ▶ emit
              │ needs_retry       ▶ load_context (reintento: recarga carry-forward;
                                    curation_cached=true ▶ saltea curación,
                                    reusa el pool ▶ generate)
        ──▶ emit (script: escribe el artifact `quizCandidate` — el champion)

  Contrato (R001–R012):
    - R001/R002: la única tool es get_suggested_lemmas y vive en curate_lemmas
      (generate ya no consulta, solo construye); ningún otro verbo CLI. gate_curation
      garantiza que curate la USE de verdad (no shortcut), o se cae al fallback.
    - R003: exactamente un QuizCandidate {quizSentence, translation}.
    - R004: presupuesto de tool por-run (max_tool_calls); agotarlo NO falla.
    - R005/R006/R012: las fallas de runtime las maneja el adaptador Java
      (un solo launch, categoría preservada) — NO viven en el grafo.
    - R007: catálogo fijo de 5 evals LLM (eval_quality) con veredicto propio,
      más los evals deterministas (eval_length #3, eval_lexical #7) y los
      gates de anti-duplicación (eval_distinct/eval_global_distinct, numeración
      interna legacy, fuera del catálogo numerado de R007).
    - R008: un veredicto bloqueante negativo dispara un nuevo run de
      generación, acotado por maxEvalRetries.
    - R009: al agotar reintentos, best-effort — se emite el mejor candidato
      visto (champion), sin falla.
    - R010: cada reintento recibe el contexto de fallo previo + el historial
      de filtros de la tool (carry_forward).
kind: agent
strategy: graph
initial_node: load_context
budgets:
  # Circuit breaker del grafo entero: el lazo generate ↔ eval ↔ route.
  # Pase fresco ~14 nodos (load_context, route_curate, curate_lemmas, gate_curation,
  # finalize_curation, generate, gate_candidate, eval_length, eval_distinct,
  # eval_global_distinct, eval_lexical, eval_quality, tally, route_verdict);
  # reintentos de eval saltean la curación (~12).
  # gate_curation↔curate puede sumar hasta curate.max_attempts vueltas extra. Debe ser HOLGADO
  # respecto a generate.max_attempts (=maxEvalRetries+1) para que la salida
  # best-effort (R009: generate `exhausted` → emit) se dispare ANTES que este
  # breaker. Con maxEvalRetries por defecto (3) hacen falta ~48 iteraciones; 90
  # deja margen para maxEvalRetries más altos sin halt prematuro.
  max_iterations: 90
nodes:
  - ./nodes/load_context.md
  - ./nodes/route_curate.md
  - ./nodes/curate_lemmas.md
  - ./nodes/gate_curation.md
  - ./nodes/finalize_curation.md
  - ./nodes/generate.md
  - ./nodes/gate_candidate.md
  - ./nodes/eval_length.md
  - ./nodes/eval_distinct.md
  - ./nodes/eval_global_distinct.md
  - ./nodes/eval_lexical.md
  - ./nodes/eval_quality.md
  - ./nodes/gate_verdicts.md
  - ./nodes/tally.md
  - ./nodes/route_verdict.md
  - ./nodes/emit.md
goal:
  required_artifacts:
    - quizCandidate
  required_nodes_done:
    - emit
dependencies:
  # CorrectionContext de FEAT-RCLA, aplanado por el adaptador Java
  # (LemmaAbsenceAgentGenerator.buildInputs):
  - taskId
  - cefrLevel
  - sentence          # oración original (baseline de longitud, eval #3)
  - quizSentence      # quiz original fill-in-blank (DSL); baseline de flags
                      # léxicos (eval_lexical, criterio #7 de R007)
  - translation       # traducción original al español
  - knowledgeTitle    # objetivo pedagógico del ejercicio
  - suggestedWords    # vocabulario preferido (coma-separado; puede ser "")
  - exerciseQuizzes   # quizSentence de los otros quizzes del ejercicio (uno por
                      # línea; puede ser "") — eval #7 de distinción (R013)
  # Perillas de LagenConfig (coma con default por si vienen vacías):
  - maxEvalRetries          # default efectivo 3 (R008/R011)
  - maxSuggestedLemmaRequests   # presupuesto de tool por-run (R004)
