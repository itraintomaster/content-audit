name: answer-giveaway-judge
description: Judges whether the instructions or a written direction give away the decision the topic practices; no course edits.
kind: agent
strategy: graph
initial_node: evaluate
budgets:
  max_iterations: 3
nodes:
  - ./nodes/evaluate.md
  - ./nodes/gate_verdict.md
  - ./nodes/emit.md
goal:
  required_artifacts:
    - answerGiveawayVerdict
  required_nodes_done:
    - emit
dependencies:
  - inputContract
  - quizId
  - level
  - topic
  - title
  - instructions
  - sentenceMode
  - exercise
  - visibleChoices
  - acceptedAnswers
