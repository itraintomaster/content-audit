name: single-answer-judge
description: |
  Juez de una sola respuesta (FEAT-UNICA). Recibe UN ejercicio de completar
  (CLOZE) con lo que el alumno ve antes de contestar —título del tema,
  consigna, enunciado con su pista— y las respuestas que el corrector acepta en
  cada hueco, y lista las otras respuestas correctas y naturales que el
  corrector no acepta (F-UNICA-R002). Cada una lleva su hueco, su clase —una
  opción que ofrece la consigna o una distinta y válida— y su gravedad:
  bloqueante, alta o media (F-UNICA-R004). Con la lista vacía, el ejercicio
  pasa.

  Criterio de José del 3/10: una respuesta correcta y natural cuenta como otra
  válida aunque sea menos esperable (media); el arreglo es aceptarla con «|».
  No se lista la que suena rara o forzada, la que sólo queda bien inventando
  una situación concreta, la que cambia polaridad, aspecto, modalidad,
  presuposición o condición temporal sin licencia visible, ni la misma respuesta
  en otra forma que el corrector ya acepta. La precedencia es consigna
  explícita > pista y enunciado > título; el título sólo no inventa
  restricciones. En las transformaciones manda conservar construcción y
  sentido, no copiar mecánicamente las palabras: una variante funcional,
  idiomática, formal o coloquial sigue valiendo si preserva lo fijado.

  La guía no lista lo que el corrector ya acepta —forma contraída o larga,
  grafías de la lista cerrada, until o till— (F-JEXAM-R012); el clasificador
  de Java lo descarta igual con la comparación del corrector, así que la regla
  no depende de que el modelo la cumpla.

  Flujo:

      evaluate (llm_call: el juicio)
        ──▶ gate_verdict (gate: esquema cerrado + invariantes; failed reintenta)
        ──▶ emit (script: artifact singleAnswerVerdict)

  max_attempts de evaluate acota el reintento. Si el juez agota sus intentos
  sin un veredicto válido, emit produce {"outputUnusable": true}: el evaluador
  lo devuelve como OUTPUT_UNUSABLE, nunca llega al lector ni al libro y el
  ejercicio queda sin evaluar (F-UNICA-R005). Una falla del modelo en evaluate
  no tiene arista: corta la corrida del agente y el evaluador la informa como
  EVALUATOR_UNAVAILABLE.

  Todo archivo de esta carpeta menos eval/ entra en la versión del juez: las
  pruebas no corren al medir y no la cambian (F-ALDIA-R001). Tocar la guía, el
  formato, un script o la definición es una versión nueva, que rinde su examen
  antes de consultar sobre el curso (F-JEXAM-R003).
kind: agent
strategy: graph
initial_node: evaluate
budgets:
  # Pase limpio: 3 visitas. Con los 3 intentos de evaluate agotados son 8
  # (evaluate y gate_verdict tres veces, el desvío exhausted y emit); el resto
  # es margen para que un reintento nunca termine en una falla de servicio.
  max_iterations: 10
nodes:
  - ./nodes/evaluate.md
  - ./nodes/gate_verdict.md
  - ./nodes/emit.md
goal:
  required_artifacts:
    - singleAnswerVerdict
  required_nodes_done:
    - emit
dependencies:
  - title
  - instructions
  - exercise
  - acceptedAnswers
